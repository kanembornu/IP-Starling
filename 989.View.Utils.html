<script>

/**
 * =============================================================================
 * FILE        : 989.View.Utils
 * VERSION     : 1.0.0
 * DESCRIPTION : Frontend Utility Functions
 * =============================================================================
 */

const Utils = (() => {

  //===========================================================================
  // Delay
  //===========================================================================

  function sleep(ms = 0) {

    return new Promise(resolve => {

      setTimeout(resolve, ms);

    });

  }



  //===========================================================================
  // UUID
  //===========================================================================

  function uuid() {

    return crypto.randomUUID();

  }



  //===========================================================================
  // Clone
  //===========================================================================

  function deepClone(value) {

    return JSON.parse(

        JSON.stringify(value)

    );

  }



  //===========================================================================
  // Empty
  //===========================================================================

  function isEmpty(value) {

    return (

      value === null ||

      value === undefined ||

      value === ""

    );

  }



  //===========================================================================
  // Escape HTML
  //===========================================================================

  function escapeHTML(text = "") {

    return String(text)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }



  //===========================================================================
  // Capitalize
  //===========================================================================

  function capitalize(text = "") {

    if (!text) {

      return "";

    }

    return text.charAt(0).toUpperCase()

      + text.slice(1);

  }



  //===========================================================================
  // Debounce
  //===========================================================================

  function debounce(fn, delay = 300) {

    let timer;

    return (...args) => {

      clearTimeout(timer);

      timer = setTimeout(() => {

        fn(...args);

      }, delay);

    };

  }



  //===========================================================================
  // Throttle
  //===========================================================================

  function throttle(fn, delay = 300) {

    let waiting = false;

    return (...args) => {

      if (waiting) {

        return;

      }

      waiting = true;

      fn(...args);

      setTimeout(() => {

        waiting = false;

      }, delay);

    };

  }



  //===========================================================================
  // Merge
  //===========================================================================

  function merge(defaults = {}, values = {}) {

    return {

      ...defaults,

      ...values

    };

  }



  //===========================================================================
  // Pick
  //===========================================================================

  function pick(object = {}, keys = []) {

    const result = {};

    keys.forEach(key => {

      if (key in object) {

        result[key] = object[key];

      }

    });

    return result;

  }



  //===========================================================================
  // Omit
  //===========================================================================

  function omit(object = {}, keys = []) {

    const result = {

      ...object

    };

    keys.forEach(key => {

      delete result[key];

    });

    return result;

  }



  //===========================================================================
  // Public API
  //===========================================================================

  return Object.freeze({

    sleep,

    uuid,

    deepClone,

    isEmpty,

    escapeHTML,

    capitalize,

    debounce,

    throttle,

    merge,

    pick,

    omit

  });

})();

</script>
