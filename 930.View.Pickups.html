<template id="pickups-page">
  <div class="space-y-6">
    <!-- =============================================================== -->
    <!-- Page Header -->
    <!-- =============================================================== -->

    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Pickups</h2>

        <p class="text-sm text-slate-500">
          Manage product pickup transactions.
        </p>
      </div>

      <button
        id="btn-pickup-add"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition"
      >
        <i class="fa-solid fa-plus mr-2"></i>

        Add Pickup
      </button>
    </div>

    <!-- =============================================================== -->
    <!-- Toolbar -->
    <!-- =============================================================== -->

    <div data-filter-toolbar="pickups" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="inline-flex w-full rounded-lg border border-slate-300 p-1 sm:w-auto" role="group" aria-label="Pickup status filter">
          <button
            id="btn-pickup-active"
            type="button"
            data-pickup-mode="active"
            class="flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"
          >
            <i class="fa-solid fa-circle-check mr-2"></i>
            Active
          </button>

          <button
            id="btn-pickup-trash"
            type="button"
            data-pickup-mode="trash"
            class="flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"
          >
            <i class="fa-solid fa-trash-can mr-2"></i>
            Deleted
          </button>
        </div>

        <div class="w-full min-w-0 flex-1">
          <input
            id="inp-pickup-search"
            data-module="pickups"
            type="text"
            placeholder="Search pickups..."
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="flex gap-2 sm:flex-none">
          <button type="button" data-filter-clear="pickups" class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"><i class="fa-solid fa-xmark mr-2"></i>Clear filters</button>
          <button id="btn-pickup-refresh" type="button" title="Refresh Pickups" aria-label="Refresh Pickups" class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <p data-filter-feedback="pickups" class="mt-3 text-xs text-slate-500" aria-live="polite">No filters active</p>
    </div>

    <!-- =============================================================== -->
    <!-- Table -->
    <!-- =============================================================== -->

    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"
    >
      <table id="tbl-pickups" class="min-w-full text-sm">
        <thead class="bg-slate-100">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>

            <th class="px-4 py-3 text-left">Date</th>

            <th class="px-4 py-3 text-left">Partner</th>

            <th class="px-4 py-3 text-left">Product</th>

            <th class="px-4 py-3 text-right">Qty</th>

            <th class="px-4 py-3 text-center">Status</th>

            <th class="px-4 py-3 text-center">Action</th>

            <th class="hidden px-4 py-3 text-center"></th>
          </tr>
        </thead>

        <tbody id="tbl-pickups-body"></tbody>
      </table>
    </div>

    <!-- =============================================================== -->
    <!-- Pagination -->
    <!-- =============================================================== -->

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div id="lbl-pickup-info" class="text-sm text-slate-500">Menampilkan 0–0 dari 0 Pickup</div>

      <div id="pickup-pagination" class="w-full sm:w-auto"></div>
    </div>
  </div>
</template>
