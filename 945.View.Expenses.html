<template id="expenses-page">
  <div class="space-y-6">
    <!-- =============================================================== -->
    <!-- Page Header -->
    <!-- =============================================================== -->

    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Expenses</h2>

        <p class="text-sm text-slate-500">Manage operational expenses.</p>
      </div>

      <button
        id="btn-expense-add"
        type="button"
        class="rounded-lg bg-blue-600 px-4 py-2 text-white transition hover:bg-blue-700"
      >
        <i class="fa-solid fa-plus mr-2"></i>

        Add Expense
      </button>
    </div>

    <!-- =============================================================== -->
    <!-- Toolbar -->
    <!-- =============================================================== -->

    <div data-filter-toolbar="expenses" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="inline-flex w-full rounded-lg border border-slate-300 p-1 sm:w-auto" role="group" aria-label="Expense status filter">
          <button
            id="btn-expense-active"
            type="button"
            data-expense-mode="active"
            class="flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"
          >
            <i class="fa-solid fa-circle-check mr-2"></i>
            Active
          </button>

          <button
            id="btn-expense-trash"
            type="button"
            data-expense-mode="trash"
            class="flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"
          >
            <i class="fa-solid fa-trash-can mr-2"></i>
            Deleted
          </button>
        </div>

        <div class="w-full min-w-0 flex-1">
          <input
            id="inp-expense-search"
            data-module="expenses"
            type="text"
            placeholder="Search expenses..."
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="flex gap-2 sm:flex-none">
          <button type="button" data-filter-clear="expenses" class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"><i class="fa-solid fa-xmark mr-2"></i>Clear filters</button>
          <button id="btn-expense-refresh" type="button" title="Refresh Expenses" aria-label="Refresh Expenses" class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <p data-filter-feedback="expenses" class="mt-3 text-xs text-slate-500" aria-live="polite">No filters active</p>
    </div>

    <!-- =============================================================== -->
    <!-- Table -->
    <!-- =============================================================== -->

    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"
    >
      <table id="tbl-expenses" class="min-w-full text-sm">
        <thead class="bg-slate-100">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>

            <th class="px-4 py-3 text-left">Date</th>

            <th class="px-4 py-3 text-left">Category</th>

            <th class="px-4 py-3 text-left">Description</th>

            <th class="px-4 py-3 text-right">Amount</th>

            <th class="px-4 py-3 text-center">Status</th>

            <th class="px-4 py-3 text-center">Action</th>
          </tr>
        </thead>

        <tbody id="tbl-expenses-body"></tbody>
      </table>
    </div>

    <!-- =============================================================== -->
    <!-- Pagination -->
    <!-- =============================================================== -->

    <div class="flex items-center justify-between">
      <div id="lbl-expense-info" class="text-sm text-slate-500">0 Expense</div>

      <div id="expense-pagination" class="flex gap-2"></div>
    </div>
  </div>
</template>
