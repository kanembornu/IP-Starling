<script>
  const SettingsPresenter = (() => {
    const escape = (value) => Utils.escapeHTML(String(value ?? ""));

    function renderLoading() {
      Render.mount("settings-content", Components.loading({ message: "Loading settings..." }));
    }

    function renderError(message = "Settings could not be loaded.") {
      Render.mount("settings-content", Components.empty(escape(message)));
    }

    function input(setting, busy) {
      const key = escape(setting.key);
      const disabled = busy || !setting.editable ? "disabled" : "";
      const common = `data-setting-input="${key}" ${disabled} class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm disabled:bg-slate-100 disabled:text-slate-500"`;
      if (setting.type === "BOOLEAN") {
        return `<label class="mt-3 flex items-center gap-3 text-sm"><input type="checkbox" data-setting-input="${key}" ${setting.value === true ? "checked" : ""} ${disabled} class="h-5 w-5 rounded border-slate-300"><span>${setting.value === true ? "Enabled" : "Disabled"}</span></label>`;
      }
      if (setting.type === "ENUM" || setting.options?.length) {
        const options = (setting.options || []).map((value) => `<option value="${escape(value)}" ${value === setting.value ? "selected" : ""}>${escape(value)}</option>`).join("");
        return `<select ${common}>${options}</select>`;
      }
      if (setting.type === "JSON") return `<textarea rows="5" ${common}>${escape(JSON.stringify(setting.value, null, 2))}</textarea>`;
      const type = setting.type === "DATE" ? "date" : (["NUMBER", "INTEGER"].includes(setting.type) ? "number" : "text");
      const step = setting.type === "INTEGER" ? "1" : setting.type === "NUMBER" ? "any" : "";
      const min = setting.constraints?.min != null ? `min="${escape(setting.constraints.min)}"` : "";
      const max = setting.constraints?.max != null ? `max="${escape(setting.constraints.max)}"` : "";
      return `<input type="${type}" step="${step}" ${min} ${max} value="${escape(setting.value)}" ${common}>`;
    }

    function card(setting, busyKey) {
      const busy = busyKey === setting.key;
      const constraints = [];
      if (setting.constraints?.required) constraints.push("required");
      if (setting.constraints?.min != null) constraints.push(`min ${setting.constraints.min}`);
      if (setting.constraints?.max != null) constraints.push(`max ${setting.constraints.max}`);
      if (setting.options?.length) constraints.push(`options: ${setting.options.join(", ")}`);
      return `<article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm" data-setting-card="${escape(setting.key)}">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
          <div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><h3 class="font-semibold text-slate-800">${escape(setting.label)}</h3><span class="rounded bg-slate-100 px-2 py-1 text-xs text-slate-600">${escape(setting.type)}</span><span class="rounded px-2 py-1 text-xs ${setting.source === "PERSISTED" ? "bg-blue-100 text-blue-700" : setting.source === "INVALID_PERSISTED_FALLBACK" ? "bg-red-100 text-red-700" : "bg-amber-100 text-amber-700"}">${escape(setting.source)}</span></div>
          <p class="mt-1 text-sm text-slate-500">${escape(setting.description)}</p><p class="mt-1 text-xs text-slate-400">${escape(setting.key)}${constraints.length ? ` · ${escape(constraints.join(" · "))}` : ""}</p>${setting.diagnostic ? `<p class="mt-2 text-sm text-red-600">${escape(setting.diagnostic)}</p>` : ""}${input(setting, busy)}</div>
          <div class="flex shrink-0 gap-2"><button data-settings-action="save" data-key="${escape(setting.key)}" ${busy || !setting.editable ? "disabled" : ""} class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-semibold text-white disabled:opacity-50">${busy ? "Saving..." : "Save"}</button><button data-settings-action="reset" data-key="${escape(setting.key)}" ${busy || !setting.editable ? "disabled" : ""} class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 disabled:opacity-50">Reset</button></div>
        </div></article>`;
    }

    function render(settings, busyKey = null) {
      const groups = ["Business", "Dashboard", "System", "UI"];
      const html = groups.map((group) => {
        const items = settings.filter((setting) => setting.group === group && setting.key !== "ROWS_PER_PAGE");
        return `<section><h2 class="mb-3 text-lg font-bold text-slate-800">${escape(group)}</h2><div class="grid grid-cols-1 gap-4 xl:grid-cols-2">${items.map((setting) => card(setting, busyKey)).join("")}</div></section>`;
      }).join("");
      Render.mount("settings-content", html || Components.empty("No settings available."));
    }

    return Object.freeze({ renderLoading, renderError, render });
  })();
</script>
