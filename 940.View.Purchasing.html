<template id="purchasing-page">
  <div class="space-y-6">
    <!-- =============================================================== -->
    <!-- Page Header -->
    <!-- =============================================================== -->

    <div data-purchasing-page-header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Purchasing</h2>

        <p class="text-sm text-slate-500">Manage purchasing transactions.</p>
      </div>

      <div data-purchasing-header-actions class="flex items-center gap-3">
        <button
          id="btn-purchasing-add"
          type="button"
          class="self-start px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition sm:self-auto"
        >
          <i class="fa-solid fa-plus mr-2"></i>
          Add Purchasing
        </button>
      </div>
    </div>

    <!-- =============================================================== -->
    <!-- Toolbar -->
    <!-- =============================================================== -->

    <div data-purchasing-toolbar data-filter-toolbar="purchasing" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="inline-flex w-full rounded-lg border border-slate-300 p-1 sm:w-auto" role="group" aria-label="Purchasing status filter">
          <button type="button" data-purchasing-mode="active" class="purchasing-mode flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"><i class="fa-solid fa-circle-check mr-2"></i>Active</button>
          <button type="button" data-purchasing-mode="deleted" class="purchasing-mode flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"><i class="fa-solid fa-trash-can mr-2"></i>Deleted</button>
        </div>
        <div class="w-full min-w-0 flex-1">
          <input
            id="inp-purchasing-search"
            type="text"
            placeholder="Search purchasing..."
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="flex gap-2 sm:flex-none">
          <button type="button" data-filter-clear="purchasing" class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"><i class="fa-solid fa-xmark mr-2"></i>Clear filters</button>
          <button id="btn-purchasing-refresh" type="button" title="Refresh Purchasing" aria-label="Refresh Purchasing" class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <p data-filter-feedback="purchasing" class="mt-3 text-xs text-slate-500" aria-live="polite">No filters active</p>
    </div>

    <!-- =============================================================== -->
    <!-- Table -->
    <!-- =============================================================== -->

    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"
    >
      <table id="tbl-purchasing" class="min-w-full text-sm">
        <thead id="tbl-purchasing-head" class="bg-slate-100">
          <tr>
            <th class="px-4 py-3 text-left">Purchase ID</th>

            <th class="px-4 py-3 text-left">Date</th>

            <th class="px-4 py-3 text-left">Supplier</th>

            <th class="px-4 py-3 text-left">Product</th>

            <th class="px-4 py-3 text-right">Qty</th>

            <th class="px-4 py-3 text-right">Unit Price</th>

            <th class="px-4 py-3 text-right">Total</th>

            <th class="px-4 py-3 text-center">Status</th>

            <th class="px-4 py-3 text-center">Action</th>
          </tr>
        </thead>

        <tbody id="tbl-purchasing-body"></tbody>
      </table>
    </div>

    <!-- =============================================================== -->
    <!-- Pagination -->
    <!-- =============================================================== -->

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div id="lbl-purchasing-info" class="text-sm text-slate-500">
        Menampilkan 0–0 dari 0 Purchasing
      </div>

      <div id="purchasing-pagination" class="w-full sm:w-auto"></div>
    </div>
  </div>
</template>
