<script>
  /**
   * =============================================================================
   * FILE        : 970.View.App.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      dashboard: null,

      products: [],

      partners: [],

      pickups: [],

      returns: [],

      purchasing: [],

      expenses: [],
    };

    let productsLoaded = false;

    let partnersLoaded = false;

    let productsLoading = null;

    let partnersLoading = null;

    let expensesLoading = null;

    //===========================================================================
    // Initialize
    //===========================================================================

    async function init() {
      Render.layout();

      Modal.init();

      Render.sidebar(state.page);

      Render.topbar(state.page);

      Render.page(state.page);

      Events.init();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      state.page = page;

      Render.sidebar(page);

      Render.topbar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Cached Master Data
    //===========================================================================

    function getProducts() {
      return Array.isArray(state.products)
        ? Utils.deepClone(state.products)
        : [];
    }

    function getPartners() {
      return Array.isArray(state.partners)
        ? Utils.deepClone(state.partners)
        : [];
    }

    function getExpenses() {
      return Array.isArray(state.expenses)
        ? Utils.deepClone(state.expenses)
        : [];
    }

    function ensureProductsLoaded() {
      return loadProductsCache(false);
    }

    function ensurePartnersLoaded() {
      return loadPartnersCache(false);
    }

    function loadProductsCache(forceReload) {
      if (productsLoading) {
        return productsLoading;
      }

      if (productsLoaded && !forceReload) {
        return Promise.resolve(getProducts());
      }

      productsLoading = Api.Product.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load products failed.",
            );
          }

          state.products = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          productsLoaded = true;

          return getProducts();
        })
        .catch((error) => {
          productsLoaded = false;
          Toast.error(readableLoadError(error, "Load products failed."));
          throw notifiedLoadError(error, "Load products failed.");
        })
        .finally(() => {
          productsLoading = null;
        });

      return productsLoading;
    }

    function loadPartnersCache(forceReload) {
      if (partnersLoading) {
        return partnersLoading;
      }

      if (partnersLoaded && !forceReload) {
        return Promise.resolve(getPartners());
      }

      partnersLoading = Api.Partner.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load partners failed.",
            );
          }

          state.partners = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          partnersLoaded = true;

          return getPartners();
        })
        .catch((error) => {
          partnersLoaded = false;
          Toast.error(readableLoadError(error, "Load partners failed."));
          throw notifiedLoadError(error, "Load partners failed.");
        })
        .finally(() => {
          partnersLoading = null;
        });

      return partnersLoading;
    }

    function masterDataError(message) {
      return new Error(message);
    }

    function notifiedLoadError(error, fallback) {
      const notified = new Error(readableLoadError(error, fallback));
      notified.appNotified = true;
      return notified;
    }

    function readableLoadError(error, fallback) {
      return typeof error?.message === "string" && error.message.trim()
        ? error.message
        : fallback;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;
      }
    }

    //===========================================================================
    // Dashboard
    //===========================================================================

    async function loadDashboard() {
      Render.mount(
        "dashboard-kpi",

        Components.loading({
          message: "Loading dashboard...",
        }),
      );

      const res = await Api.Dashboard.get();

      if (!res || !res.success) {
        Components.toast(res?.message || "Dashboard failed.");

        return;
      }

      state.dashboard = Utils.deepClone(res.data);

      DashboardPresenter.render(state.dashboard);
    }

    //===========================================================================
    // Products
    //===========================================================================

    async function loadProducts() {
      let products;

      try {
        products = await loadProductsCache(true);
      } catch (error) {
        return;
      }

      ProductsPresenter.render(products);
    }

    //===========================================================================
    // Product CRUD
    //===========================================================================

    function openCreateProduct() {
      ProductsActions.openCreate();
    }

    async function openEditProduct(id) {
      return ProductsActions.openEdit(id);
    }

    async function saveProduct() {
      return ProductsActions.save();
    }

    async function deleteProduct(id) {
      return ProductsActions.remove(id);
    }

    //===========================================================================
    // Partners
    //===========================================================================

    async function loadPartners() {
      let partners;

      try {
        partners = await loadPartnersCache(true);
      } catch (error) {
        return;
      }

      PartnersPresenter.render(partners);
    }

    //===========================================================================
    // Partner CRUD
    //===========================================================================
    function openCreatePartner() {
      PartnersActions.openCreate();
    }
    function openEditPartner(id) {
      return PartnersActions.openEdit(id);
    }
    function savePartner() {
      return PartnersActions.save();
    }
    function deletePartner(id) {
      return PartnersActions.remove(id);
    }

    //===========================================================================
    // Pickups
    //===========================================================================

    async function loadPickups() {
      const res = await Api.Pickup.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load pickups failed.");

        return;
      }

      state.pickups = Utils.deepClone(res.data);

      Render.pickups(state.pickups);
    }

    //===========================================================================
    // Returns
    //===========================================================================

    async function loadReturns() {
      const res = await Api.Return.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load returns failed.");

        return;
      }

      state.returns = Utils.deepClone(res.data);

      ReturnsPresenter.render(state.returns);
    }

    //===========================================================================
    // Purchasing
    //===========================================================================

    async function loadPurchasing() {
      let res;

      try {
        [, , res] = await Promise.all([
          ensureProductsLoaded(),
          ensurePartnersLoaded(),
          Api.Purchasing.list(),
        ]);
      } catch (error) {
        if (!error?.appNotified) {
          Toast.error(readableLoadError(error, "Load purchasing failed."));
        }

        return;
      }

      if (!res || !res.success) {
        Toast.error(res?.message || "Load purchasing failed.");

        return;
      }

      state.purchasing = Utils.deepClone(res.data);

      PurchasingPresenter.render(state.purchasing);
    }

    //===========================================================================
    // Expenses
    //===========================================================================

    async function loadExpenses() {
      if (expensesLoading) {
        return expensesLoading;
      }

      ExpensesPresenter.renderLoading();

      expensesLoading = (async () => {
        let res;

        try {
          res = await Api.Expense.list();
        } catch (error) {
          const message = readableLoadError(error, "Load expenses failed.");

          Toast.error(message);
          ExpensesPresenter.renderError();

          return;
        }

        if (!res || !res.success) {
          const message = res?.message || "Load expenses failed.";

          Toast.error(message);
          ExpensesPresenter.renderError();

          return;
        }

        state.expenses = Utils.deepClone(
          Array.isArray(res.data) ? res.data : [],
        );

        ExpensesPresenter.render(state.expenses);
      })();

      try {
        return await expensesLoading;
      } finally {
        expensesLoading = null;
      }
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          ExpensesPresenter.search(keyword);

          break;

        default:
          break;
      }
    }

    function searchProducts(keyword = "") {
      const value = String(keyword || "")
        .trim()

        .toLowerCase();

      if (!value) {
        ProductsPresenter.render(state.products);

        return;
      }

      const fields = ["ID", "Nama", "Kategori", "Satuan"];

      const result = state.products.filter((product) => {
        return fields.some((field) => {
          return String(product[field] || "")
            .toLowerCase()

            .includes(value);
        });
      });

      ProductsPresenter.render(result);
    }

    //===========================================================================
    // Partner Search
    //===========================================================================

    function searchPartners(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        PartnersPresenter.render(state.partners);

        return;
      }

      const fields = ["ID", "Nama", "Jenis", "Telepon", "Alamat"];

      const result = state.partners.filter((partner) => {
        return fields.some((field) => {
          return String(partner[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      PartnersPresenter.render(result);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,
      navigate,
      refresh,
      currentPage,
      search,

      getProducts,
      getPartners,
      getExpenses,

      loadProducts,
      openCreateProduct,
      openEditProduct,
      saveProduct,
      deleteProduct,

      loadPartners,
      openCreatePartner,
      openEditPartner,
      savePartner,
      deletePartner,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
