<script>
  /**
   * =============================================================================
   * FILE        : 970.View.App.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      dashboard: null,

      products: [],

      partners: [],

      pickups: [],

      returns: [],

      purchasing: [],

      expenses: [],
    };

    //===========================================================================
    // Initialize
    //===========================================================================

    async function init() {
      Render.layout();

      Modal.init();

      console.log(document.getElementById("modal-overlay"));

      Render.sidebar(state.page);

      Render.topbar(state.page);

      Render.page(state.page);

      Events.init();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      state.page = page;

      Render.sidebar(page);

      Render.topbar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;
      }
    }

    //===========================================================================
    // Dashboard
    //===========================================================================

    async function loadDashboard() {
      Render.mount(
        "dashboard-kpi",

        Components.loading({
          message: "Loading dashboard...",
        }),
      );

      const res = await Api.Dashboard.get();

      if (!res || !res.success) {
        Components.toast(res?.message || "Dashboard failed.");

        return;
      }

      state.dashboard = Utils.deepClone(res.data);

      DashboardPresenter.render(state.dashboard);
    }

    //===========================================================================
    // Products
    //===========================================================================

    async function loadProducts() {
      const res = await Api.Product.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load products failed.");

        return;
      }

      state.products = Utils.deepClone(res.data);

      ProductsPresenter.render(state.products);
    }

    //===========================================================================
    // Product CRUD
    //===========================================================================

    function openCreateProduct() {
      Modal.open({
        title: "Add Product",

        width: "md",

        body: `
          <div class="py-10 text-center text-slate-500">
            Product Form Coming Soon...
          </div>
        `,

        footer: `
          <button
            id="btn-modal-close"
            class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100"
          >
            Close
          </button>
        `,
      });

      DOM.$("btn-modal-close")?.addEventListener(
        "click",

        () => {
          Modal.close();
        },
      );
    }

    //===========================================================================
    // Partners
    //===========================================================================

    async function loadPartners() {
      const res = await Api.Partner.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load partners failed.");

        return;
      }

      state.partners = Utils.deepClone(res.data);

      PartnersPresenter.render(state.partners);
    }

    //===========================================================================
    // Pickups
    //===========================================================================

    async function loadPickups() {
      const res = await Api.Pickup.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load pickups failed.");

        return;
      }

      state.pickups = Utils.deepClone(res.data);

      Render.pickups(state.pickups);
    }

    //===========================================================================
    // Returns
    //===========================================================================

    async function loadReturns() {
      const res = await Api.Return.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load returns failed.");

        return;
      }

      state.returns = Utils.deepClone(res.data);

      ReturnsPresenter.render(state.returns);
    }

    //===========================================================================
    // Purchasing
    //===========================================================================

    async function loadPurchasing() {
      const res = await Api.Purchasing.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load purchasing failed.");

        return;
      }

      state.purchasing = Utils.deepClone(res.data);

      PurchasingPresenter.render(state.purchasing);
    }

    //===========================================================================
    // Expenses
    //===========================================================================

    async function loadExpenses() {
      const res = await Api.Expense.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load expenses failed.");

        return;
      }

      state.expenses = Utils.deepClone(res.data);

      ExpensesPresenter.render(state.expenses);
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          searchExpenses(keyword);

          break;

        default:
          break;
      }
    }

    function searchProducts(keyword = "") {
      const value = String(keyword || "")
        .trim()

        .toLowerCase();

      if (!value) {
        ProductsPresenter.render(state.products);

        return;
      }

      const fields = ["ID", "Nama", "Kategori", "Satuan"];

      const result = state.products.filter((product) => {
        return fields.some((field) => {
          return String(product[field] || "")
            .toLowerCase()

            .includes(value);
        });
      });

      ProductsPresenter.render(result);
    }

    //===========================================================================
    // Partner Search
    //===========================================================================

    function searchPartners(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        PartnersPresenter.render(state.partners);

        return;
      }

      const fields = ["ID", "Nama", "Jenis", "Telepon", "Alamat"];

      const result = state.partners.filter((partner) => {
        return fields.some((field) => {
          return String(partner[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      PartnersPresenter.render(result);
    }

    //===========================================================================
    // Expense Search
    //===========================================================================

    function searchExpenses(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        ExpensesPresenter.render(state.expenses);

        return;
      }

      const fields = ["ID", "Kategori", "Keterangan", "Nominal"];

      const result = state.expenses.filter((expense) => {
        return fields.some((field) => {
          return String(expense[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      ExpensesPresenter.render(result);
    }

    //===========================================================================
    // Product Action
    //===========================================================================

    function editProduct(id) {}

    function deleteProduct(id) {}

    function restoreProduct(id) {}

    //===========================================================================
    // Partner Action
    //===========================================================================

    function editPartner(id) {}

    function deletePartner(id) {}

    function restorePartner(id) {}

    //===========================================================================
    // Pickup Action
    //===========================================================================

    function editPickup(id) {}

    function deletePickup(id) {}

    function restorePickup(id) {}

    //===========================================================================
    // Return Action
    //===========================================================================

    function editReturn(id) {}

    function deleteReturn(id) {}

    function restoreReturn(id) {}

    //===========================================================================
    // Purchasing Action
    //===========================================================================

    function editPurchasing(id) {}

    function deletePurchasing(id) {}

    function restorePurchasing(id) {}

    //===========================================================================
    // Expense Action
    //===========================================================================

    function editExpense(id) {}

    function deleteExpense(id) {}

    function restoreExpense(id) {}

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      navigate,

      refresh,

      currentPage,

      search,

      editProduct,

      deleteProduct,

      restoreProduct,

      editPartner,

      deletePartner,

      restorePartner,

      editPickup,

      deletePickup,

      restorePickup,

      editReturn,

      deleteReturn,

      restoreReturn,

      editPurchasing,

      deletePurchasing,

      restorePurchasing,

      editExpense,

      deleteExpense,

      restoreExpense,

      openCreateProduct,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
