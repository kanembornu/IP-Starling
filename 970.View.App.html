<script>
  /**
   * =============================================================================
   * FILE        : 970.View.App.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      dashboard: null,

      dashboardRange: { preset: "", startDate: "", endDate: "" },

      settings: [],

      settingBusyKey: null,

      logsFilters: { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" },

      logsPage: 1,

      logsPageSize: 20,

      products: [],

      partners: [],

      pickups: [],

      deletedPickups: [],

      pickupMode: "active",

      pickupSearch: "",

      pickupLoading: false,

      returns: [],

      deletedReturns: [],

      returnTrashOpen: false,

      returnTrashSearch: "",

      returnTrashLoading: false,

      returnTrashError: null,

      returnRestoreBusyId: null,

      returnRestoreConfirming: false,

      purchasing: [],

      expenses: [],

      deletedExpenses: [],

      expenseMode: "active",

      expenseLoading: false,
    };

    let productsLoaded = false;

    let partnersLoaded = false;

    let productsLoading = null;

    let partnersLoading = null;

    let expenseRequest = 0;

    let pickupRequest = 0;

    let returnTrashRequest = 0;

    let dashboardRequest = 0;

    let settingsRequest = 0;

    let logsRequest = 0;

    //===========================================================================
    // Initialize
    //===========================================================================

    async function init() {
      Render.layout();

      Modal.init();

      Render.sidebar(state.page);

      Render.topbar(state.page);

      Render.page(state.page);

      Events.init();

      bindSettingsActions();

      bindLogsActions();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      if (state.page === "dashboard") DashboardPresenter.destroyCharts();

      if (state.page === "settings") settingsRequest += 1;

      if (state.page === "logs") logsRequest += 1;

      state.page = page;

      Render.sidebar(page);

      Render.topbar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Cached Master Data
    //===========================================================================

    function getProducts() {
      return Array.isArray(state.products)
        ? Utils.deepClone(state.products)
        : [];
    }

    function getPartners() {
      return Array.isArray(state.partners)
        ? Utils.deepClone(state.partners)
        : [];
    }

    function getExpenses() {
      return Array.isArray(state.expenses)
        ? Utils.deepClone(state.expenses)
        : [];
    }

    function getPickups() {
      return Array.isArray(state.pickups)
        ? Utils.deepClone(state.pickups)
        : [];
    }

    function getDeletedPickups() {
      return Array.isArray(state.deletedPickups)
        ? Utils.deepClone(state.deletedPickups)
        : [];
    }

    function getPickupMode() {
      return state.pickupMode;
    }

    function getPickupSearch() {
      return state.pickupSearch;
    }

    function getDeletedExpenses() {
      return Array.isArray(state.deletedExpenses)
        ? Utils.deepClone(state.deletedExpenses)
        : [];
    }

    function getExpenseMode() {
      return state.expenseMode;
    }

    function ensureProductsLoaded() {
      return loadProductsCache(false);
    }

    function ensurePartnersLoaded() {
      return loadPartnersCache(false);
    }

    function loadProductsCache(forceReload) {
      if (productsLoading) {
        return productsLoading;
      }

      if (productsLoaded && !forceReload) {
        return Promise.resolve(getProducts());
      }

      productsLoading = Api.Product.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load products failed.",
            );
          }

          state.products = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          productsLoaded = true;

          return getProducts();
        })
        .catch((error) => {
          productsLoaded = false;
          Toast.error(readableLoadError(error, "Load products failed."));
          throw notifiedLoadError(error, "Load products failed.");
        })
        .finally(() => {
          productsLoading = null;
        });

      return productsLoading;
    }

    function loadPartnersCache(forceReload) {
      if (partnersLoading) {
        return partnersLoading;
      }

      if (partnersLoaded && !forceReload) {
        return Promise.resolve(getPartners());
      }

      partnersLoading = Api.Partner.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load partners failed.",
            );
          }

          state.partners = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          partnersLoaded = true;

          return getPartners();
        })
        .catch((error) => {
          partnersLoaded = false;
          Toast.error(readableLoadError(error, "Load partners failed."));
          throw notifiedLoadError(error, "Load partners failed.");
        })
        .finally(() => {
          partnersLoading = null;
        });

      return partnersLoading;
    }

    function masterDataError(message) {
      return new Error(message);
    }

    function notifiedLoadError(error, fallback) {
      const notified = new Error(readableLoadError(error, fallback));
      notified.appNotified = true;
      return notified;
    }

    function readableLoadError(error, fallback) {
      return typeof error?.message === "string" && error.message.trim()
        ? error.message
        : fallback;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;

        case "settings":
          await loadSettings();

          break;

        case "logs":
          await loadLogs();

          break;
      }
    }

    //===========================================================================
    // Logs
    //===========================================================================

    function logsFilterValues() {
      const preset = DOM.$("logs-preset")?.value || "CURRENT_MONTH";
      return { preset, dateFrom: preset === "CUSTOM" ? DOM.$("logs-date-from")?.value || "" : "", dateTo: preset === "CUSTOM" ? DOM.$("logs-date-to")?.value || "" : "", level: DOM.$("logs-level")?.value || "", category: DOM.$("logs-category")?.value || "", module: DOM.$("logs-module")?.value || "", action: DOM.$("logs-action")?.value || "", status: DOM.$("logs-status")?.value || "", search: DOM.$("logs-search")?.value || "" };
    }

    function applyLogsFilterControls() {
      const preset = DOM.$("logs-preset"); if (!preset) return;
      preset.value = state.logsFilters.preset;
      ["date-from", "date-to", "level", "category", "module", "action", "status", "search"].forEach((suffix) => { const key = suffix.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); const input = DOM.$(`logs-${suffix}`); if (input) input.value = state.logsFilters[key] || ""; });
      document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", preset.value !== "CUSTOM"));
      const size = DOM.$("logs-page-size"); if (size) size.value = String(state.logsPageSize);
    }

    function resolvedLogsFilters(filters) {
      const now = new Date(); const pad = (value) => String(value).padStart(2, "0"); const ymd = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      let from = filters.dateFrom; let to = filters.dateTo; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (filters.preset === "TODAY") from = to = ymd(start);
      if (filters.preset === "LAST_7_DAYS") { const d = new Date(start); d.setDate(d.getDate() - 6); from = ymd(d); to = ymd(start); }
      if (filters.preset === "CURRENT_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth(), 1)); to = ymd(new Date(start.getFullYear(), start.getMonth() + 1, 0)); }
      if (filters.preset === "PREVIOUS_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth() - 1, 1)); to = ymd(new Date(start.getFullYear(), start.getMonth(), 0)); }
      if (filters.preset === "CURRENT_YEAR") { from = `${start.getFullYear()}-01-01`; to = `${start.getFullYear()}-12-31`; }
      return Object.assign({}, filters, { dateFrom: from, dateTo: to });
    }

    async function loadLogs() {
      applyLogsFilterControls(); const request = ++logsRequest; LogsPresenter.renderLoading();
      const filters = resolvedLogsFilters(Utils.deepClone(state.logsFilters));
      try {
        const [list, summary] = await Promise.all([Api.Logs.list(filters, { page: state.logsPage, pageSize: state.logsPageSize }), Api.Logs.summary(filters)]);
        if (request !== logsRequest || state.page !== "logs") return;
        if (!list?.success || !summary?.success) throw new Error(list?.message || summary?.message || "Logs could not be loaded.");
        LogsPresenter.render(list.data); LogsPresenter.renderSummary(summary.data); applyLogsFilterControls();
      } catch (error) { if (request !== logsRequest || state.page !== "logs") return; LogsPresenter.renderError(readableLoadError(error, "Logs could not be loaded.")); }
    }

    function bindLogsActions() {
      document.addEventListener("change", (event) => { if (event.target?.id === "logs-preset") document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", event.target.value !== "CUSTOM")); });
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-logs-action]"); if (!button || state.page !== "logs") return;
        const action = button.dataset.logsAction;
        if (action === "clear") { state.logsFilters = { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" }; state.logsPage = 1; return loadLogs(); }
        if (action === "apply") { const next = logsFilterValues(); const error = DOM.$("logs-filter-error"); const message = next.preset === "CUSTOM" && (!next.dateFrom || !next.dateTo || next.dateFrom > next.dateTo) ? "Choose a valid Custom date range." : ""; if (error) { DOM.text(error, message); error.classList.toggle("hidden", !message); } if (message) return; state.logsFilters = next; state.logsPage = 1; return loadLogs(); }
        if (action === "previous" && state.logsPage > 1) { state.logsPage -= 1; return loadLogs(); }
        if (action === "next") { state.logsPage += 1; return loadLogs(); }
      });
      document.addEventListener("change", (event) => { if (event.target?.id === "logs-page-size" && state.page === "logs") { state.logsPageSize = Number(event.target.value) || 20; state.logsPage = 1; loadLogs(); } });
    }

    //===========================================================================
    // Settings
    //===========================================================================

    async function loadSettings() {
      const request = ++settingsRequest;
      SettingsPresenter.renderLoading();
      let response;
      try {
        response = await Api.Settings.list();
      } catch (error) {
        if (request !== settingsRequest || state.page !== "settings") return;
        Toast.error(readableLoadError(error, "Settings could not be loaded."));
        SettingsPresenter.renderError();
        return;
      }
      if (request !== settingsRequest || state.page !== "settings") return;
      if (!response?.success || !Array.isArray(response.data)) {
        Toast.error(response?.message || "Settings could not be loaded.");
        SettingsPresenter.renderError(response?.message);
        return;
      }
      state.settings = Utils.deepClone(response.data);
      state.settingBusyKey = null;
      SettingsPresenter.render(state.settings);
    }

    function settingInputValue(key) {
      const input = document.querySelector(`[data-setting-input="${CSS.escape(key)}"]`);
      const setting = state.settings.find((item) => item.key === key);
      if (!input || !setting) throw new Error("Setting input is unavailable.");
      if (setting.type === "BOOLEAN") return input.checked;
      if (setting.type === "JSON") {
        try { JSON.parse(input.value); } catch (error) { throw new Error("Value must be valid JSON."); }
      }
      return input.value;
    }

    async function mutateSetting(key, reset) {
      if (state.settingBusyKey || state.page !== "settings") return false;
      const setting = state.settings.find((item) => item.key === key);
      if (!setting || !setting.editable) return false;
      let value;
      try { value = reset ? undefined : settingInputValue(key); }
      catch (error) { Toast.error(error.message); return false; }
      state.settingBusyKey = key;
      SettingsPresenter.render(state.settings, key);
      const request = ++settingsRequest;
      try {
        const response = reset ? await Api.Settings.reset(key) : await Api.Settings.update(key, value);
        if (request !== settingsRequest || state.page !== "settings") return false;
        if (!response?.success) {
          Toast.error(response?.errors?.[0]?.message || response?.message || "Setting could not be saved.");
          state.settingBusyKey = null;
          SettingsPresenter.render(state.settings);
          return false;
        }
        Toast.success(reset ? "Setting reset to default." : "Setting saved.");
        await loadSettings();
        return true;
      } catch (error) {
        if (request !== settingsRequest || state.page !== "settings") return false;
        Toast.error(readableLoadError(error, "Setting could not be saved."));
        state.settingBusyKey = null;
        SettingsPresenter.render(state.settings);
        return false;
      }
    }

    function bindSettingsActions() {
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-settings-action]");
        if (!button || state.page !== "settings") return;
        const action = button.dataset.settingsAction;
        if (action === "refresh") loadSettings();
        if (action === "save") mutateSetting(button.dataset.key, false);
        if (action === "reset") mutateSetting(button.dataset.key, true);
      });
    }

    //===========================================================================
    // Dashboard
    //===========================================================================

    async function loadDashboard() {
      DashboardPresenter.bindRangeControls(state.dashboardRange, setDashboardRange);
      const request = ++dashboardRequest;

      Render.mount(
        "dashboard-kpi",

        Components.loading({
          message: "Loading dashboard...",
        }),
      );

      let res;

      try {
        res = await Api.Dashboard.get(Utils.deepClone(state.dashboardRange));
      } catch (error) {
        if (request !== dashboardRequest || state.page !== "dashboard") return;

        Toast.error(readableLoadError(error, "Dashboard failed."));
        DashboardPresenter.renderError();
        return;
      }

      if (request !== dashboardRequest || state.page !== "dashboard") return;

      if (!res || !res.success) {
        Toast.error(res?.message || "Dashboard failed.");
        DashboardPresenter.renderRangeError(res);

        return;
      }

      state.dashboard = Utils.deepClone(res.data);

      state.dashboardRange = {
        preset: res.data.range.preset,
        startDate: res.data.range.startDate,
        endDate: res.data.range.endDate,
      };

      DashboardPresenter.render(state.dashboard);

      DashboardPresenter.bindRangeControls(state.dashboardRange, setDashboardRange);
    }

    function setDashboardRange(range) {
      state.dashboardRange = Utils.deepClone(range);
      loadDashboard();
    }

    //===========================================================================
    // Products
    //===========================================================================

    async function loadProducts() {
      let products;

      try {
        products = await loadProductsCache(true);
      } catch (error) {
        return;
      }

      ProductsPresenter.render(products);
    }

    //===========================================================================
    // Product CRUD
    //===========================================================================

    function openCreateProduct() {
      ProductsActions.openCreate();
    }

    async function openEditProduct(id) {
      return ProductsActions.openEdit(id);
    }

    async function saveProduct() {
      return ProductsActions.save();
    }

    async function deleteProduct(id) {
      return ProductsActions.remove(id);
    }

    //===========================================================================
    // Partners
    //===========================================================================

    async function loadPartners() {
      let partners;

      try {
        partners = await loadPartnersCache(true);
      } catch (error) {
        return;
      }

      PartnersPresenter.render(partners);
    }

    //===========================================================================
    // Partner CRUD
    //===========================================================================
    function openCreatePartner() {
      PartnersActions.openCreate();
    }
    function openEditPartner(id) {
      return PartnersActions.openEdit(id);
    }
    function savePartner() {
      return PartnersActions.save();
    }
    function deletePartner(id) {
      return PartnersActions.remove(id);
    }

    //===========================================================================
    // Pickups
    //===========================================================================

    async function loadPickups() {
      const mode = state.pickupMode;
      const request = ++pickupRequest;
      const fallback = mode === "trash"
        ? "Load deleted pickups failed."
        : "Load pickups failed.";

      state.pickupLoading = true;
      PickupsPresenter.renderLoading(mode);

      let res;

      try {
        res = mode === "trash"
          ? await Api.Pickup.findDeleted({})
          : await Api.Pickup.list();
      } catch (error) {
        if (request !== pickupRequest || mode !== state.pickupMode) return;

        state.pickupLoading = false;
        Toast.error(readableLoadError(error, fallback));
        PickupsPresenter.renderError(mode);
        return;
      }

      if (request !== pickupRequest || mode !== state.pickupMode) return;

      if (!res || !res.success) {
        state.pickupLoading = false;
        Toast.error(res?.message || fallback);
        PickupsPresenter.renderError(mode);

        return;
      }

      const records = Utils.deepClone(Array.isArray(res.data) ? res.data : []);
      state.pickupLoading = false;

      if (mode === "trash") {
        state.deletedPickups = records;
      } else {
        state.pickups = records;
      }

      PickupsPresenter.render(records, mode);
    }

    function setPickupMode(mode) {
      const nextMode = mode === "trash" ? "trash" : "active";

      if (state.pickupMode === nextMode) {
        return Promise.resolve();
      }

      state.pickupMode = nextMode;
      return loadPickups();
    }

    function searchPickups(keyword = "") {
      const value = String(keyword ?? "").trim();

      if (state.pickupMode === "trash") {
        if (state.pickupSearch === value) return Promise.resolve();

        state.pickupSearch = value;
        PickupsPresenter.search(value);
        return Promise.resolve();
      }

      PickupsPresenter.search(value);
      return Promise.resolve();
    }

    //===========================================================================
    // Returns
    //===========================================================================

    async function loadReturns() {
      const res = await Api.Return.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load returns failed.");

        return;
      }

      state.returns = Utils.deepClone(res.data);

      ReturnsPresenter.render(state.returns);
    }

    function refreshReturns() {
      return loadReturns();
    }

    function showReturnError(message) {
      Toast.error(message);
    }

    function showReturnSuccess(message) {
      Toast.success(message);
    }

    function showReturnWarning(message) {
      Toast.warning(message);
    }

    function returnTrashViewState() {
      return {
        search: state.returnTrashSearch,
        loading: state.returnTrashLoading,
        error: state.returnTrashError,
        restoreBusyId: state.returnRestoreBusyId,
      };
    }

    function renderReturnTrash() {
      if (!state.returnTrashOpen) {
        return;
      }

      ReturnsPresenter.openTrash(returnTrashViewState());
      ReturnsPresenter.renderTrash(state.deletedReturns, returnTrashViewState());
    }

    async function openReturnTrash() {
      if (state.returnTrashOpen) {
        return;
      }

      state.returnTrashOpen = true;
      state.returnTrashSearch = "";
      await loadReturnTrash();
    }

    function closeReturnTrash() {
      state.returnTrashOpen = false;
      state.returnTrashLoading = false;
      state.returnTrashError = null;
      returnTrashRequest += 1;
    }

    function searchReturnTrash(keyword = "") {
      state.returnTrashSearch = String(keyword ?? "");
      ReturnsPresenter.renderTrash(state.deletedReturns, returnTrashViewState());
    }

    function refreshReturnTrash() {
      return loadReturnTrash();
    }

    async function loadReturnTrash() {
      const request = ++returnTrashRequest;
      state.returnTrashLoading = true;
      state.returnTrashError = null;
      renderReturnTrash();

      let response;

      try {
        response = await Api.Return.findDeleted();
      } catch (error) {
        if (request !== returnTrashRequest || !state.returnTrashOpen) return false;
        state.returnTrashLoading = false;
        state.returnTrashError = readableLoadError(error, "Deleted Returns could not be loaded.");
        Toast.error(state.returnTrashError);
        renderReturnTrash();
        return false;
      }

      if (request !== returnTrashRequest || !state.returnTrashOpen) return false;

      if (!response?.success || !Array.isArray(response.data)) {
        state.returnTrashLoading = false;
        state.returnTrashError = response?.message || "Deleted Returns could not be loaded.";
        Toast.error(state.returnTrashError);
        renderReturnTrash();
        return false;
      }

      state.deletedReturns = Utils.deepClone(response.data);
      state.returnTrashLoading = false;
      state.returnTrashError = null;
      renderReturnTrash();
      return true;
    }

    async function restoreReturn(id) {
      const returnId = String(id || "").trim();

      if (!returnId || state.returnRestoreBusyId || state.returnRestoreConfirming) {
        return false;
      }

      const ret = state.deletedReturns.find((item) => String(item?.ID) === returnId);

      if (!ret) {
        Toast.error("This Return is no longer available for restore.");
        return false;
      }

      let restoreSucceeded = false;
      let restoreAttempted = false;
      let reloadTrash = false;

      state.returnRestoreConfirming = true;

      let confirmed = false;

      try {
        confirmed = await Dialog.confirm({
          title: "Restore Return",
          confirmText: "Restore",
          loadingText: "Restoring...",
          message: `Restore Return <strong>${Utils.escapeHTML(returnId)}</strong>?`,
          onConfirm: async () => {
            if (state.returnRestoreBusyId || restoreAttempted) {
              return false;
            }

            restoreAttempted = true;
            state.returnRestoreBusyId = returnId;

            try {
              const response = await Api.Return.restore(returnId);

              if (!response?.success) {
                reloadTrash = true;
                Toast.error(response?.message || "Return could not be restored.");
                return true;
              }

              restoreSucceeded = true;
              reloadTrash = true;
              Toast.success(response.message || "Return restored.");
              return true;
            } catch (error) {
              Toast.error(readableLoadError(error, "Return could not be restored. Please try again."));
              return true;
            } finally {
              state.returnRestoreBusyId = null;
            }
          },
        });
      } finally {
        state.returnRestoreConfirming = false;
      }

      if (!confirmed) {
        renderReturnTrash();
        return false;
      }

      if (reloadTrash) {
        await loadReturnTrash();
      }

      if (restoreSucceeded) {
        await loadReturns();
      }

      renderReturnTrash();
      return restoreSucceeded;
    }

    //===========================================================================
    // Purchasing
    //===========================================================================

    async function loadPurchasing() {
      let res;

      try {
        [, , res] = await Promise.all([
          ensureProductsLoaded(),
          ensurePartnersLoaded(),
          Api.Purchasing.list(),
        ]);
      } catch (error) {
        if (!error?.appNotified) {
          Toast.error(readableLoadError(error, "Load purchasing failed."));
        }

        return;
      }

      if (!res || !res.success) {
        Toast.error(res?.message || "Load purchasing failed.");

        return;
      }

      state.purchasing = Utils.deepClone(res.data);

      PurchasingPresenter.render(state.purchasing);
    }

    //===========================================================================
    // Expenses
    //===========================================================================

    async function loadExpenses() {
      const mode = state.expenseMode;
      const request = ++expenseRequest;
      const fallback = mode === "trash"
        ? "Load deleted expenses failed."
        : "Load expenses failed.";

      state.expenseLoading = true;
      ExpensesPresenter.renderLoading(mode);

      let res;

      try {
        res = mode === "trash"
          ? await Api.Expense.listDeleted()
          : await Api.Expense.list();
      } catch (error) {
        if (request !== expenseRequest || mode !== state.expenseMode) return;

        state.expenseLoading = false;
        Toast.error(readableLoadError(error, fallback));
        ExpensesPresenter.renderError(mode);
        return;
      }

      if (request !== expenseRequest || mode !== state.expenseMode) return;

      if (!res || !res.success) {
        state.expenseLoading = false;
        Toast.error(res?.message || fallback);
        ExpensesPresenter.renderError(mode);
        return;
      }

      const records = Utils.deepClone(Array.isArray(res.data) ? res.data : []);
      state.expenseLoading = false;

      if (mode === "trash") {
        state.deletedExpenses = records;
      } else {
        state.expenses = records;
      }

      ExpensesPresenter.render(records, mode);
    }

    function setExpenseMode(mode) {
      const nextMode = mode === "trash" ? "trash" : "active";

      if (state.expenseMode === nextMode) {
        return Promise.resolve();
      }

      state.expenseMode = nextMode;
      return loadExpenses();
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          ExpensesPresenter.search(keyword);

          break;

        case "pickups":
          searchPickups(keyword);

          break;

        default:
          break;
      }
    }

    function searchProducts(keyword = "") {
      const value = String(keyword || "")
        .trim()

        .toLowerCase();

      if (!value) {
        ProductsPresenter.render(state.products);

        return;
      }

      const fields = ["ID", "Nama", "Kategori", "Satuan"];

      const result = state.products.filter((product) => {
        return fields.some((field) => {
          return String(product[field] || "")
            .toLowerCase()

            .includes(value);
        });
      });

      ProductsPresenter.render(result);
    }

    //===========================================================================
    // Partner Search
    //===========================================================================

    function searchPartners(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        PartnersPresenter.render(state.partners);

        return;
      }

      const fields = ["ID", "Nama", "Jenis", "Telepon", "Alamat"];

      const result = state.partners.filter((partner) => {
        return fields.some((field) => {
          return String(partner[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      PartnersPresenter.render(result);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,
      navigate,
      refresh,
      currentPage,
      search,

      getProducts,
      getPartners,
      getPickups,
      getDeletedPickups,
      getPickupMode,
      getPickupSearch,
      setPickupMode,
      getExpenses,
      getDeletedExpenses,
      getExpenseMode,
      setExpenseMode,

      refreshReturns,
      showReturnError,
      showReturnSuccess,
      showReturnWarning,
      openReturnTrash,
      closeReturnTrash,
      searchReturnTrash,
      refreshReturnTrash,
      restoreReturn,

      loadProducts,
      openCreateProduct,
      openEditProduct,
      saveProduct,
      deleteProduct,

      loadPartners,
      openCreatePartner,
      openEditPartner,
      savePartner,
      deletePartner,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
