<script>
  /**
   * =============================================================================
   * FILE        : 970.View.App.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      dashboard: null,

      products: [],

      partners: [],

      pickups: [],

      returns: [],

      purchasing: [],

      expenses: [],
    };

    //===========================================================================
    // Initialize
    //===========================================================================

    async function init() {
      Render.layout();

      Modal.init();

      Render.sidebar(state.page);

      Render.topbar(state.page);

      Render.page(state.page);

      Events.init();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      state.page = page;

      Render.sidebar(page);

      Render.topbar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;
      }
    }

    //===========================================================================
    // Dashboard
    //===========================================================================

    async function loadDashboard() {
      Render.mount(
        "dashboard-kpi",

        Components.loading({
          message: "Loading dashboard...",
        }),
      );

      const res = await Api.Dashboard.get();

      if (!res || !res.success) {
        Components.toast(res?.message || "Dashboard failed.");

        return;
      }

      state.dashboard = Utils.deepClone(res.data);

      DashboardPresenter.render(state.dashboard);
    }

    //===========================================================================
    // Products
    //===========================================================================

    async function loadProducts() {
      const res = await Api.Product.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load products failed.");

        return;
      }

      state.products = Utils.deepClone(res.data);

      ProductsPresenter.render(state.products);
    }

    //===========================================================================
    // Product Template
    //===========================================================================

    function productFormTemplate() {
      return `
        <div class="space-y-4">

          <div>
            <label
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Product Name
            </label>

            <input
              id="inp-product-name"
              type="text"
              class="w-full rounded-lg border border-slate-300 px-3 py-2
                    focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Enter product name"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Category
            </label>

            <input
              id="inp-product-category"
              type="text"
              class="w-full rounded-lg border border-slate-300 px-3 py-2
                    focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Coffee, Tea, etc."
            />
          </div>

          <div class="grid grid-cols-2 gap-4">

            <div>
              <label
                class="block text-sm font-medium text-slate-700 mb-1"
              >
                Unit
              </label>

              <input
                id="inp-product-unit"
                type="text"
                class="w-full rounded-lg border border-slate-300 px-3 py-2"
                placeholder="Cup"
              />
            </div>

            <div>
              <label
                class="block text-sm font-medium text-slate-700 mb-1"
              >
                Price
              </label>

              <input
                id="inp-product-price"
                type="number"
                class="w-full rounded-lg border border-slate-300 px-3 py-2"
                placeholder="0"
              />
            </div>

          </div>

          <label class="flex items-center gap-2">

            <input
              id="inp-product-active"
              type="checkbox"
              checked
            />

            <span class="text-sm">
              Active
            </span>

          </label>

        </div>
      `;
    }

    //===========================================================================
    // Product CRUD
    //===========================================================================

    function openCreateProduct() {
      CrudState.create();

      Modal.open({
        title: "Add Product",

        width: "md",

        body: productFormTemplate(),

        footer: `
          <div class="flex justify-end gap-2">

          <button
          class="px-4 py-2 border rounded-lg"
          onclick="Modal.close()"
          >
          Cancel
          </button>

          <button
            id="btn-product-save"
            onclick="App.saveProduct()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg"
          >
            Save Product
          </button>

          </div>
        `,
      });

      DOM.$("btn-modal-close")?.addEventListener(
        "click",

        () => {
          Modal.close();
        },
      );
    }

    //===========================================================================
    // Product Form
    //===========================================================================

    function readProductForm() {
      return {
        Nama: DOM.value("inp-product-name").trim(),

        Kategori: DOM.value("inp-product-category").trim(),

        Satuan: DOM.value("inp-product-unit").trim(),

        Harga: Number(DOM.value("inp-product-price")),

        IsActive: DOM.checked("inp-product-active"),
      };
    }

    function validateProductForm(product = {}) {
      const errors = [];

      if (!product.Nama) {
        errors.push("Product Name is required.");
      }

      if (!product.Kategori) {
        errors.push("Category is required.");
      }

      if (!product.Satuan) {
        errors.push("Unit is required.");
      }

      if (Number.isNaN(product.Harga)) {
        errors.push("Price is required.");
      }

      if (product.Harga < 0) {
        errors.push("Price cannot be negative.");
      }

      return {
        valid: errors.length === 0,

        errors,
      };
    }

    async function saveProduct() {
      const product = readProductForm();

      const validation = validateProductForm(product);

      if (!validation.valid) {
        alert(validation.errors.join("\n"));

        return;
      }

      try {
        let response;

        if (CrudState.isCreate()) {
          response = await Api.Product.create(product);
        } else {
          response = await Api.Product.update(CrudState.id(), product);
        }

        if (!response.success) {
          alert(response.message);

          return;
        }

        resetProductForm();
        CrudState.reset();
        Modal.close();

        await loadProducts();

        alert(response.message);
      } catch (error) {
        console.error(error);

        alert("Failed to save product.");
      }
    }

    function resetProductForm() {
      DOM.setValue(
        "inp-product-name",

        "",
      );

      DOM.setValue(
        "inp-product-category",

        "",
      );

      DOM.setValue(
        "inp-product-unit",

        "",
      );

      DOM.setValue(
        "inp-product-price",

        "",
      );

      DOM.setChecked(
        "inp-product-active",

        true,
      );
    }

    function fillProductForm(product = {}) {
      DOM.setValue(
        "inp-product-name",

        product.Nama ?? "",
      );

      DOM.setValue(
        "inp-product-category",

        product.Kategori ?? "",
      );

      DOM.setValue(
        "inp-product-unit",

        product.Satuan ?? "",
      );

      DOM.setValue(
        "inp-product-price",

        product.Harga ?? "",
      );

      DOM.setChecked(
        "inp-product-active",

        product.IsActive,
      );
    }

    async function openEditProduct(id) {
      CrudState.update(id);

      try {
        const response = await Api.Product.get(id);

        if (!response.success) {
          alert(response.message);

          return;
        }

        Modal.open({
          title: "Edit Product",

          width: "md",

          body: productFormTemplate(),

          footer: `
          <div class="flex justify-end gap-2">

          <button
          class="px-4 py-2 border rounded-lg"
          onclick="Modal.close()"
          >
          Cancel
          </button>

          <button
            id="btn-product-save"
            onclick="App.saveProduct()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg"
          >
            Save Product
          </button>

          </div>
        `,
        });

        fillProductForm(response.data);
      } catch (error) {
        console.error(error);

        alert("Failed to load product.");
      }
    }

    async function deleteProduct(id) {
      console.log("DELETE PRODUCT()", id);
      try {
        const response = await Api.Product.remove(id);

        if (!response.success) {
          alert(response.message);

          return;
        }

        await loadProducts();

        alert(response.message);
      } catch (error) {
        console.error(error);

        alert("Failed to delete product.");
      }
    }

    //===========================================================================
    // Partners
    //===========================================================================

    async function loadPartners() {
      const res = await Api.Partner.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load partners failed.");

        return;
      }

      state.partners = Utils.deepClone(res.data);

      PartnersPresenter.render(state.partners);
    }

    //===========================================================================
    // Pickups
    //===========================================================================

    async function loadPickups() {
      const res = await Api.Pickup.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load pickups failed.");

        return;
      }

      state.pickups = Utils.deepClone(res.data);

      Render.pickups(state.pickups);
    }

    //===========================================================================
    // Returns
    //===========================================================================

    async function loadReturns() {
      const res = await Api.Return.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load returns failed.");

        return;
      }

      state.returns = Utils.deepClone(res.data);

      ReturnsPresenter.render(state.returns);
    }

    //===========================================================================
    // Purchasing
    //===========================================================================

    async function loadPurchasing() {
      const res = await Api.Purchasing.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load purchasing failed.");

        return;
      }

      state.purchasing = Utils.deepClone(res.data);

      PurchasingPresenter.render(state.purchasing);
    }

    //===========================================================================
    // Expenses
    //===========================================================================

    async function loadExpenses() {
      const res = await Api.Expense.list();

      if (!res || !res.success) {
        Components.toast(res?.message || "Load expenses failed.");

        return;
      }

      state.expenses = Utils.deepClone(res.data);

      ExpensesPresenter.render(state.expenses);
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          searchExpenses(keyword);

          break;

        default:
          break;
      }
    }

    function searchProducts(keyword = "") {
      const value = String(keyword || "")
        .trim()

        .toLowerCase();

      if (!value) {
        ProductsPresenter.render(state.products);

        return;
      }

      const fields = ["ID", "Nama", "Kategori", "Satuan"];

      const result = state.products.filter((product) => {
        return fields.some((field) => {
          return String(product[field] || "")
            .toLowerCase()

            .includes(value);
        });
      });

      ProductsPresenter.render(result);
    }

    //===========================================================================
    // Partner Search
    //===========================================================================

    function searchPartners(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        PartnersPresenter.render(state.partners);

        return;
      }

      const fields = ["ID", "Nama", "Jenis", "Telepon", "Alamat"];

      const result = state.partners.filter((partner) => {
        return fields.some((field) => {
          return String(partner[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      PartnersPresenter.render(result);
    }

    //===========================================================================
    // Expense Search
    //===========================================================================

    function searchExpenses(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        ExpensesPresenter.render(state.expenses);

        return;
      }

      const fields = ["ID", "Kategori", "Keterangan", "Nominal"];

      const result = state.expenses.filter((expense) => {
        return fields.some((field) => {
          return String(expense[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      ExpensesPresenter.render(result);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      navigate,

      refresh,

      currentPage,

      search,

      openCreateProduct,

      openEditProduct,

      saveProduct,

      deleteProduct,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
