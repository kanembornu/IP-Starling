<script>
  /**
   * =============================================================================
   * FILE        : 970.View.App.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      dashboard: null,

      dashboardRange: { preset: "", startDate: "", endDate: "" },

      settings: [],

      settingBusyKey: null,

      logsFilters: { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" },

      logsPage: 1,

      logsPageSize: 15,

      defaultPageSize: 15,

      pagination: {},

      logsPageSizeSelected: false,

      products: [],

      deletedProducts: [],

      productMode: "active",

      productRestoreBusyId: null,

      productRestoreConfirming: false,

      partners: [],

      deletedPartners: [],

      partnerMode: "active",

      partnerRestoreBusyId: null,

      partnerRestoreConfirming: false,

      pickups: [],

      deletedPickups: [],

      pickupMode: "active",

      pickupSearch: "",

      pickupLoading: false,

      pickupRestoreBusyId: null,

      pickupRestoreConfirming: false,

      returns: [],

      deletedReturns: [],

      returnMode: "active",

      returnSearch: "",

      returnLoading: false,

      returnError: "",

      returnBusyId: null,

      returnForm: null,

      returnFormKind: null,

      returnPickups: null,

      returnPickupDetails: {},

      returnSubmitting: false,

      returnRestoreBusyId: null,

      returnRestoreConfirming: false,

      purchasing: [],

      deletedPurchasing: [],

      purchasingMode: "active",

      purchasingSearch: "",

      purchasingLoading: false,

      purchasingError: "",

      purchasingBusyId: null,

      purchasingForm: null,

      purchasingFormKind: null,

      purchasingSuppliers: [],

      purchasingProducts: [],

      purchasingSubmitting: false,

      purchasingRestoreBusyId: null,

      purchasingRestoreConfirming: false,

      expenses: [],

      deletedExpenses: [],

      expenseMode: "active",

      expenseLoading: false,
    };

    let productsLoaded = false;

    let partnersLoaded = false;

    let productsLoading = null;

    let partnersLoading = null;

    let expenseRequest = 0;

    let pickupRequest = 0;

    let returnRequest = 0;

    let purchasingRequest = 0;

    let dashboardRequest = 0;

    let settingsRequest = 0;

    let settingsLoaded = false;

    let settingsLoading = null;

    let logsRequest = 0;

    let productRequest = 0;

    let partnerRequest = 0;

    //===========================================================================
    // Initialize
    //===========================================================================

    async function init() {
      Render.layout();

      Modal.init();

      Render.sidebar(state.page);

      Render.topbar(state.page);

      Render.page(state.page);

      Events.init();

      bindSettingsActions();

      bindLogsActions();

      bindProductViewActions();

      bindPartnerViewActions();

      bindPaginationActions();

      loadDefaultPageSize();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      if (state.page === "dashboard") DashboardPresenter.destroyCharts();

      if (state.page === "settings") settingsRequest += 1;

      if (state.page === "logs") logsRequest += 1;

      if (state.page === "products") productRequest += 1;

      if (state.page === "partners") partnerRequest += 1;

      if (state.page === "purchasing") purchasingRequest += 1;

      if (state.page === "returns") { returnRequest += 1; state.returnForm = null; state.returnFormKind = null; }

      state.page = page;

      Render.sidebar(page);

      Render.topbar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Cached Master Data
    //===========================================================================

    function getProducts() {
      return Array.isArray(state.products)
        ? Utils.deepClone(state.products)
        : [];
    }

    function getPartners() {
      return Array.isArray(state.partners)
        ? Utils.deepClone(state.partners)
        : [];
    }

    function getExpenses() {
      return Array.isArray(state.expenses)
        ? Utils.deepClone(state.expenses)
        : [];
    }

    function getPickups() {
      return Array.isArray(state.pickups)
        ? Utils.deepClone(state.pickups)
        : [];
    }

    function getDeletedPickups() {
      return Array.isArray(state.deletedPickups)
        ? Utils.deepClone(state.deletedPickups)
        : [];
    }

    function getPickupMode() {
      return state.pickupMode;
    }

    function getPickupSearch() {
      return state.pickupSearch;
    }

    function getPickupRestoreBusyId() { return state.pickupRestoreBusyId; }

    function getDeletedExpenses() {
      return Array.isArray(state.deletedExpenses)
        ? Utils.deepClone(state.deletedExpenses)
        : [];
    }

    function getExpenseMode() {
      return state.expenseMode;
    }

    function ensureProductsLoaded() {
      return loadProductsCache(false);
    }

    function ensurePartnersLoaded() {
      return loadPartnersCache(false);
    }

    function loadProductsCache(forceReload) {
      if (productsLoading) {
        return productsLoading;
      }

      if (productsLoaded && !forceReload) {
        return Promise.resolve(getProducts());
      }

      productsLoading = Api.Product.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load products failed.",
            );
          }

          state.products = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          productsLoaded = true;

          return getProducts();
        })
        .catch((error) => {
          productsLoaded = false;
          Toast.error(readableLoadError(error, "Load products failed."));
          throw notifiedLoadError(error, "Load products failed.");
        })
        .finally(() => {
          productsLoading = null;
        });

      return productsLoading;
    }

    function loadPartnersCache(forceReload) {
      if (partnersLoading) {
        return partnersLoading;
      }

      if (partnersLoaded && !forceReload) {
        return Promise.resolve(getPartners());
      }

      partnersLoading = Api.Partner.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load partners failed.",
            );
          }

          state.partners = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          partnersLoaded = true;

          return getPartners();
        })
        .catch((error) => {
          partnersLoaded = false;
          Toast.error(readableLoadError(error, "Load partners failed."));
          throw notifiedLoadError(error, "Load partners failed.");
        })
        .finally(() => {
          partnersLoading = null;
        });

      return partnersLoading;
    }

    function masterDataError(message) {
      return new Error(message);
    }

    function notifiedLoadError(error, fallback) {
      const notified = new Error(readableLoadError(error, fallback));
      notified.appNotified = true;
      return notified;
    }

    function readableLoadError(error, fallback) {
      return typeof error?.message === "string" && error.message.trim()
        ? error.message
        : fallback;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;

        case "settings":
          await loadSettings();

          break;

        case "logs":
          await loadLogs();

          break;
      }
    }

    //===========================================================================
    // Logs
    //===========================================================================

    function logsFilterValues() {
      const preset = DOM.$("logs-preset")?.value || "CURRENT_MONTH";
      return { preset, dateFrom: preset === "CUSTOM" ? DOM.$("logs-date-from")?.value || "" : "", dateTo: preset === "CUSTOM" ? DOM.$("logs-date-to")?.value || "" : "", level: DOM.$("logs-level")?.value || "", category: DOM.$("logs-category")?.value || "", module: DOM.$("logs-module")?.value || "", action: DOM.$("logs-action")?.value || "", status: DOM.$("logs-status")?.value || "", search: DOM.$("logs-search")?.value || "" };
    }

    function validPageSize(value) { const size = Number(value); return [10, 15, 25, 50, 100].indexOf(size) >= 0 ? size : 15; }

    const paginationRenderers = {};
    function paginationState(module, mode = "active") {
      if (!state.pagination[module]) state.pagination[module] = { pageSize: state.defaultPageSize, explicit: false, modes: {} };
      const moduleState = state.pagination[module];
      if (!moduleState.modes[mode]) moduleState.modes[mode] = { page: 1, totalRows: 0, totalPages: 1 };
      return { moduleState, modeState: moduleState.modes[mode] };
    }
    function paginateRows(module, mode, rows, containerId, infoId, label, rerender) {
      const current = paginationState(module, mode); const meta = Pagination.calculate(rows, current.modeState.page, current.moduleState.pageSize);
      Object.assign(current.modeState, { page: meta.page, totalRows: meta.totalRows, totalPages: meta.totalPages });
      if (typeof rerender === "function") paginationRenderers[`${module}:${mode}`] = rerender;
      if (infoId) Render.mount(infoId, `Menampilkan ${meta.rangeStart}–${meta.rangeEnd} dari ${meta.totalRows} ${Utils.escapeHTML(label || "data")}`);
      if (containerId) Render.mount(containerId, `<div class="flex flex-wrap items-center justify-end gap-2 text-sm"><label class="flex items-center gap-2">Baris per halaman <select data-pagination-size="${module}" data-pagination-mode="${mode}" class="rounded-lg border border-slate-300 px-2 py-1"><option value="10" ${meta.pageSize === 10 ? "selected" : ""}>10</option><option value="15" ${meta.pageSize === 15 ? "selected" : ""}>15</option><option value="25" ${meta.pageSize === 25 ? "selected" : ""}>25</option><option value="50" ${meta.pageSize === 50 ? "selected" : ""}>50</option><option value="100" ${meta.pageSize === 100 ? "selected" : ""}>100</option></select></label><span class="px-2 text-slate-500">Halaman ${meta.page} dari ${meta.totalPages}</span><button type="button" data-pagination-action="previous" data-pagination-module="${module}" data-pagination-mode="${mode}" ${meta.hasPrevious ? "" : "disabled"} class="rounded-lg border px-3 py-1 disabled:cursor-not-allowed disabled:opacity-50">Sebelumnya</button><button type="button" data-pagination-action="next" data-pagination-module="${module}" data-pagination-mode="${mode}" ${meta.hasNext ? "" : "disabled"} class="rounded-lg border px-3 py-1 disabled:cursor-not-allowed disabled:opacity-50">Berikutnya</button></div>`);
      return meta.data;
    }
    function resetPagination(module, mode) { paginationState(module, mode).modeState.page = 1; }
    function bindPaginationActions() {
      document.addEventListener("click", (event) => { const button = event.target.closest("[data-pagination-action]"); if (!button || button.disabled) return; const module = button.dataset.paginationModule; if (module === "purchasing" || module === "returns") return; const mode = button.dataset.paginationMode || "active"; const current = paginationState(module, mode); current.modeState.page += button.dataset.paginationAction === "previous" ? -1 : 1; paginationRenderers[`${module}:${mode}`]?.(); });
      document.addEventListener("change", (event) => { const select = event.target.closest("[data-pagination-size]"); if (!select) return; const module = select.dataset.paginationSize; if (module === "purchasing" || module === "returns") return; const mode = select.dataset.paginationMode || "active"; const current = paginationState(module, mode); current.moduleState.pageSize = validPageSize(select.value); current.moduleState.explicit = true; current.modeState.page = 1; paginationRenderers[`${module}:${mode}`]?.(); });
    }

    function applyDefaultPageSize(value, rerenderCurrent = false) {
      state.defaultPageSize = validPageSize(value);
      Object.keys(state.pagination).forEach((module) => {
        if (!state.pagination[module].explicit) state.pagination[module].pageSize = state.defaultPageSize;
      });
      if (!state.logsPageSizeSelected) state.logsPageSize = state.defaultPageSize;
      if (rerenderCurrent) {
        const currentMode = state.page === "products" ? state.productMode
          : state.page === "partners" ? state.partnerMode
            : state.page === "pickups" ? state.pickupMode
              : state.page === "expenses" ? state.expenseMode
                : state.page === "returns" ? state.returnMode : "active";
        paginationRenderers[`${state.page}:${currentMode}`]?.();
      }
    }

    async function loadDefaultPageSize() {
      try {
        const settings = await ensureSettingsLoaded();
        const setting = settings.find((item) => item.key === "DEFAULT_PAGE_SIZE");
        const previous = state.logsPageSize;
        applyDefaultPageSize(setting?.valid === false ? 15 : setting?.value, true);
        if (state.page === "logs" && state.logsPageSize !== previous) { state.logsPage = 1; loadLogs(); }
      } catch (error) { applyDefaultPageSize(15, true); }
    }

    function ensureSettingsLoaded(forceReload = false) {
      if (!forceReload && settingsLoaded) return Promise.resolve(Utils.deepClone(state.settings));
      if (!forceReload && settingsLoading) return settingsLoading;
      settingsLoading = Api.Settings.list().then((response) => {
        if (!response?.success || !Array.isArray(response.data)) throw new Error(response?.message || "Settings could not be loaded.");
        state.settings = Utils.deepClone(response.data);
        settingsLoaded = true;
        return Utils.deepClone(state.settings);
      }).finally(() => { settingsLoading = null; });
      return settingsLoading;
    }

    function applyLogsFilterControls() {
      const preset = DOM.$("logs-preset"); if (!preset) return;
      preset.value = state.logsFilters.preset;
      ["date-from", "date-to", "level", "category", "module", "action", "status", "search"].forEach((suffix) => { const key = suffix.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); const input = DOM.$(`logs-${suffix}`); if (input) input.value = state.logsFilters[key] || ""; });
      document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", preset.value !== "CUSTOM"));
      const size = DOM.$("logs-page-size"); if (size) size.value = String(state.logsPageSize);
    }

    function resolvedLogsFilters(filters) {
      const now = new Date(); const pad = (value) => String(value).padStart(2, "0"); const ymd = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      let from = filters.dateFrom; let to = filters.dateTo; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (filters.preset === "TODAY") from = to = ymd(start);
      if (filters.preset === "LAST_7_DAYS") { const d = new Date(start); d.setDate(d.getDate() - 6); from = ymd(d); to = ymd(start); }
      if (filters.preset === "CURRENT_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth(), 1)); to = ymd(new Date(start.getFullYear(), start.getMonth() + 1, 0)); }
      if (filters.preset === "PREVIOUS_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth() - 1, 1)); to = ymd(new Date(start.getFullYear(), start.getMonth(), 0)); }
      if (filters.preset === "CURRENT_YEAR") { from = `${start.getFullYear()}-01-01`; to = `${start.getFullYear()}-12-31`; }
      return Object.assign({}, filters, { dateFrom: from, dateTo: to });
    }

    async function loadLogs() {
      applyLogsFilterControls(); const request = ++logsRequest; LogsPresenter.renderLoading();
      const filters = resolvedLogsFilters(Utils.deepClone(state.logsFilters));
      try {
        const response = await Api.Logs.page(filters, { page: state.logsPage, pageSize: state.logsPageSize });
        if (request !== logsRequest || state.page !== "logs") return;
        if (!response?.success || !response.data?.list || !response.data?.summary) throw new Error(response?.message || "Logs could not be loaded.");
        LogsPresenter.render(response.data.list); LogsPresenter.renderSummary(response.data.summary); applyLogsFilterControls();
      } catch (error) { if (request !== logsRequest || state.page !== "logs") return; LogsPresenter.renderError(readableLoadError(error, "Logs could not be loaded.")); }
    }

    function bindLogsActions() {
      const applyFilters = () => {
        const next = logsFilterValues(); const error = DOM.$("logs-filter-error");
        const incomplete = next.preset === "CUSTOM" && (!next.dateFrom || !next.dateTo);
        const invalid = next.preset === "CUSTOM" && !incomplete && next.dateFrom > next.dateTo;
        if (error) { DOM.text(error, invalid ? "Choose a valid Custom date range." : ""); error.classList.toggle("hidden", !invalid); }
        if (incomplete || invalid) return;
        state.logsFilters = next; state.logsPage = 1; loadLogs();
      };
      const debouncedFilters = Utils.debounce(applyFilters, 300);
      document.addEventListener("change", (event) => {
        if (state.page !== "logs" || !event.target?.id?.startsWith("logs-")) return;
        if (event.target.id === "logs-page-size") return;
        if (event.target.id === "logs-preset") document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", event.target.value !== "CUSTOM"));
        applyFilters();
      });
      document.addEventListener("input", (event) => { if (state.page === "logs" && ["logs-search", "logs-module"].indexOf(event.target?.id) >= 0) debouncedFilters(); });
      document.addEventListener("keydown", (event) => { if (state.page === "logs" && event.target?.id === "logs-search" && event.key === "Enter") { event.preventDefault(); applyFilters(); } });
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-logs-action]"); if (!button || state.page !== "logs") return;
        const action = button.dataset.logsAction;
        if (action === "clear") { state.logsFilters = { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" }; state.logsPage = 1; return loadLogs(); }
        if (action === "previous" && state.logsPage > 1) { state.logsPage -= 1; return loadLogs(); }
        if (action === "next") { state.logsPage += 1; return loadLogs(); }
      });
      document.addEventListener("change", (event) => { if (event.target?.id === "logs-page-size" && state.page === "logs") { state.logsPageSize = validPageSize(event.target.value); state.logsPageSizeSelected = true; state.logsPage = 1; loadLogs(); } });
    }

    //===========================================================================
    // Settings
    //===========================================================================

    async function loadSettings() {
      const request = ++settingsRequest;
      SettingsPresenter.renderLoading();
      try {
        await ensureSettingsLoaded();
      } catch (error) {
        if (request !== settingsRequest || state.page !== "settings") return;
        Toast.error(readableLoadError(error, "Settings could not be loaded."));
        SettingsPresenter.renderError();
        return;
      }
      if (request !== settingsRequest || state.page !== "settings") return;
      state.settingBusyKey = null;
      SettingsPresenter.render(state.settings);
    }

    function settingInputValue(key) {
      const input = document.querySelector(`[data-setting-input="${CSS.escape(key)}"]`);
      const setting = state.settings.find((item) => item.key === key);
      if (!input || !setting) throw new Error("Setting input is unavailable.");
      if (setting.type === "BOOLEAN") return input.checked;
      if (setting.type === "JSON") {
        try { JSON.parse(input.value); } catch (error) { throw new Error("Value must be valid JSON."); }
      }
      return input.value;
    }

    async function mutateSetting(key, reset) {
      if (state.settingBusyKey || state.page !== "settings") return false;
      const setting = state.settings.find((item) => item.key === key);
      if (!setting || !setting.editable) return false;
      let value;
      try { value = reset ? undefined : settingInputValue(key); }
      catch (error) { Toast.error(error.message); return false; }
      state.settingBusyKey = key;
      SettingsPresenter.render(state.settings, key);
      const request = ++settingsRequest;
      try {
        const response = reset ? await Api.Settings.reset(key) : await Api.Settings.update(key, value);
        if (request !== settingsRequest || state.page !== "settings") return false;
        if (!response?.success) {
          Toast.error(response?.errors?.[0]?.message || response?.message || "Setting could not be saved.");
          state.settingBusyKey = null;
          SettingsPresenter.render(state.settings);
          return false;
        }
        Toast.success(reset ? "Setting reset to default." : "Setting saved.");
        if (key === "DEFAULT_PAGE_SIZE") applyDefaultPageSize(response.data?.value);
        state.settings = state.settings.map((item) => item.key === key ? Utils.deepClone(response.data) : item);
        settingsLoaded = true;
        state.settingBusyKey = null;
        SettingsPresenter.render(state.settings);
        return true;
      } catch (error) {
        if (request !== settingsRequest || state.page !== "settings") return false;
        Toast.error(readableLoadError(error, "Setting could not be saved."));
        state.settingBusyKey = null;
        SettingsPresenter.render(state.settings);
        return false;
      }
    }

    function bindSettingsActions() {
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-settings-action]");
        if (!button || state.page !== "settings") return;
        const action = button.dataset.settingsAction;
        if (action === "refresh") loadSettings();
        if (action === "save") mutateSetting(button.dataset.key, false);
        if (action === "reset") mutateSetting(button.dataset.key, true);
      });
    }

    //===========================================================================
    // Dashboard
    //===========================================================================

    async function loadDashboard() {
      DashboardPresenter.bindRangeControls(state.dashboardRange, setDashboardRange);
      const request = ++dashboardRequest;

      Render.mount(
        "dashboard-kpi",

        Components.loading({
          message: "Loading dashboard...",
        }),
      );

      let res;

      try {
        res = await Api.Dashboard.get(Utils.deepClone(state.dashboardRange));
      } catch (error) {
        if (request !== dashboardRequest || state.page !== "dashboard") return;

        Toast.error(readableLoadError(error, "Dashboard failed."));
        DashboardPresenter.renderError();
        return;
      }

      if (request !== dashboardRequest || state.page !== "dashboard") return;

      if (!res || !res.success) {
        Toast.error(res?.message || "Dashboard failed.");
        DashboardPresenter.renderRangeError(res);

        return;
      }

      state.dashboard = Utils.deepClone(res.data);

      state.dashboardRange = {
        preset: res.data.range.preset,
        startDate: res.data.range.startDate,
        endDate: res.data.range.endDate,
      };

      DashboardPresenter.render(state.dashboard);

      DashboardPresenter.bindRangeControls(state.dashboardRange, setDashboardRange);
    }

    function setDashboardRange(range) {
      state.dashboardRange = Utils.deepClone(range);
      loadDashboard();
    }

    //===========================================================================
    // Products
    //===========================================================================

    async function loadProducts() {
      const mode = state.productMode;
      const request = ++productRequest;
      ProductsPresenter.renderLoading(mode);
      try {
        const products = mode === "deleted"
          ? await Api.Product.listDeleted().then((response) => {
              if (!response?.success || !Array.isArray(response.data)) throw new Error(response?.message || "Load deleted products failed.");
              return response.data;
            })
          : await loadProductsCache(true);
        if (request !== productRequest || state.page !== "products" || mode !== state.productMode) return;
        if (mode === "deleted") state.deletedProducts = Utils.deepClone(products);
        ProductsPresenter.render(products, mode, state.productRestoreBusyId);
      } catch (error) {
        if (request !== productRequest || state.page !== "products" || mode !== state.productMode) return;
        if (!error?.appNotified) Toast.error(readableLoadError(error, mode === "deleted" ? "Load deleted products failed." : "Load products failed."));
        ProductsPresenter.renderError(mode);
        return;
      }
    }

    function setProductMode(mode) {
      const next = mode === "deleted" ? "deleted" : "active";
      if (state.productMode === next) return Promise.resolve();
      state.productMode = next;
      resetPagination("products", next);
      ProductsPresenter.clearSearch();
      return loadProducts();
    }

    function bindProductViewActions() {
      document.addEventListener("click", (event) => {
        if (state.page !== "products") return;
        const mode = event.target.closest("[data-product-mode]");
        if (mode) { setProductMode(mode.dataset.productMode); return; }
        if (event.target.closest("#btn-product-refresh")) { ProductsPresenter.clearSearch(); loadProducts(); }
      });
    }

    async function restoreProduct(id) {
      const productId = String(id || "").trim();
      if (!productId || state.page !== "products" || state.productMode !== "deleted" || state.productRestoreBusyId || state.productRestoreConfirming) return false;
      const product = state.deletedProducts.find((item) => String(item?.ID) === productId);
      if (!product) { Toast.error("This deleted Product is no longer available."); return false; }
      state.productRestoreConfirming = true;

    function purchasingMatches(row, query, supplierNames, productNames) {
      if (!query) return true;
      const supplierId = row?.SupplierID; const productId = row?.ProductID;
      return [row?.ID, row?.Tanggal, Format.date(row?.Tanggal), supplierId, supplierNames[String(supplierId)] || supplierId, productId, productNames[String(productId)] || productId, row?.Qty, Format.number(row?.Qty), row?.Harga, Format.currency(row?.Harga), row?.Total, Format.currency(row?.Total), row?.restoreReason, state.purchasingMode === "deleted" ? "Deleted" : "Active"]
        .some((value) => String(value ?? "").toLowerCase().includes(query));
    }

    function renderPurchasing() {
      if (state.page !== "purchasing" || state.purchasingLoading) return;
      const mode = state.purchasingMode;
      const supplierNames = purchasingNames(state.partners);
      const productNames = purchasingNames(state.products);
      const query = state.purchasingSearch.trim().toLowerCase();
      const source = purchasingSource();
      const filtered = source.filter((row) => purchasingMatches(row, query, supplierNames, productNames));
      const rows = paginateRows("purchasing", mode, filtered, "purchasing-pagination", "lbl-purchasing-info", mode === "deleted" ? "Purchasing terhapus" : "Purchasing", renderPurchasing);
      PurchasingPresenter.render({ mode, rows, supplierNames, productNames, busyId: state.purchasingRestoreBusyId || state.purchasingBusyId, emptyMessage: source.length && query ? "No purchasing matches your search." : mode === "deleted" ? "Belum ada Purchasing terhapus." : "No purchasing available." });
    }

    function getPurchasingMode() { return state.purchasingMode; }

    function setPurchasingMode(mode) {
      const next = mode === "deleted" ? "deleted" : "active";
      if (next === state.purchasingMode) return Promise.resolve();
      state.purchasingMode = next;
      resetPagination("purchasing", next);
      return loadPurchasing();
    }

    function searchPurchasing(value) {
      state.purchasingSearch = String(value ?? "");
      resetPagination("purchasing", state.purchasingMode);
      renderPurchasing();
    }

    function refreshPurchasing() {
      state.purchasingSearch = "";
      const input = DOM.$("inp-purchasing-search"); if (input) input.value = "";
      return loadPurchasing();
    }

    function changePurchasingPage(direction) {
      const current = paginationState("purchasing", state.purchasingMode);
      current.modeState.page += direction === "previous" ? -1 : 1;
      renderPurchasing();
    }

    function changePurchasingPageSize(value) {
      const current = paginationState("purchasing", state.purchasingMode);
      current.moduleState.pageSize = validPageSize(value); current.moduleState.explicit = true; current.modeState.page = 1;
      renderPurchasing();
    }

    function selectablePurchasingSuppliers() { return state.partners.filter((row) => !truthy(row?.Deleted, false) && truthy(row?.IsActive, false) && String(row?.Jenis ?? "").trim().toLowerCase() === "supplier"); }
    function selectablePurchasingProducts() { return state.products.filter((row) => !truthy(row?.Deleted, false) && truthy(row?.IsActive, false)); }
    function truthy(value, fallback) { if (value === true || value === 1 || String(value).toLowerCase() === "true") return true; if (value === false || value === 0 || String(value).toLowerCase() === "false") return false; return fallback; }
    function purchasingToday() { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`; }

    function openCreatePurchasing() {
      if (state.purchasingSubmitting || state.purchasingMode !== "active") return;
      state.purchasingFormKind = "create"; state.purchasingSuppliers = selectablePurchasingSuppliers(); state.purchasingProducts = selectablePurchasingProducts();
      state.purchasingForm = { Tanggal: purchasingToday(), SupplierID: "", ProductID: "", Qty: "", Harga: "" };
      Modal.open({ title: "Create Purchasing", width: "md", body: PurchasingPresenter.renderCreateForm(purchasingFormView()), footer: PurchasingPresenter.renderFormFooter("create", { unavailable: !state.purchasingSuppliers.length || !state.purchasingProducts.length }) });
      DOM.$("inp-purchasing-create-date")?.focus();
    }

    async function openEditPurchasing(id) {
      const normalizedId = String(id || "").trim(); if (!normalizedId || state.purchasingSubmitting || state.purchasingBusyId) return purchasingError("Purchasing ID is unavailable.");
      const request = ++purchasingRequest; state.purchasingBusyId = normalizedId; PurchasingPresenter.setRowBusy(normalizedId, true);
      Modal.open({ title: "Edit Purchasing", width: "md", body: Components.loading("Loading purchasing for editing..."), footer: PurchasingPresenter.renderFormFooter("edit", { loading: true }) });
      try {
        const response = await Api.Purchasing.findById(normalizedId);
        if (request !== purchasingRequest || state.page !== "purchasing") return;
        if (!response?.success || !response.data || String(response.data.ID || "") !== normalizedId) throw new Error(response?.message || "Purchasing could not be loaded for editing.");
        const row = response.data; state.purchasingFormKind = "edit"; state.purchasingSuppliers = selectablePurchasingSuppliers(); state.purchasingProducts = selectablePurchasingProducts();
        state.purchasingForm = { id: normalizedId, Tanggal: dateInput(row.Tanggal), SupplierID: String(row.SupplierID || ""), ProductID: String(row.ProductID || ""), Qty: String(row.Qty ?? ""), Harga: String(row.Harga ?? "") };
        Modal.body(PurchasingPresenter.renderEditForm(purchasingFormView())); Modal.footer(PurchasingPresenter.renderFormFooter("edit")); PurchasingPresenter.updateTotal("edit", purchasingTotal()); DOM.$("inp-purchasing-edit-date")?.focus();
      } catch (error) { if (request === purchasingRequest) { const message = readableLoadError(error, "Purchasing could not be loaded for editing. Please try again."); Toast.error(message); Modal.body(Components.empty(Utils.escapeHTML(message))); } }
      finally { if (request === purchasingRequest) { state.purchasingBusyId = null; PurchasingPresenter.setRowBusy(normalizedId, false); } }
    }

    async function viewPurchasing(id) {
      const normalizedId = String(id || "").trim(); if (!normalizedId || state.purchasingBusyId) return purchasingError("Purchasing ID is unavailable.");
      const request = ++purchasingRequest; state.purchasingBusyId = normalizedId; PurchasingPresenter.setRowBusy(normalizedId, true);
      Modal.open({ title: "Purchasing Detail", width: "lg", body: Components.loading("Loading purchasing detail..."), footer: PurchasingPresenter.renderDetailFooter() });
      try { const response = await Api.Purchasing.findById(normalizedId); if (request !== purchasingRequest || state.page !== "purchasing") return; if (!response?.success || !response.data) throw new Error(response?.message || "Purchasing detail is unavailable."); Modal.body(PurchasingPresenter.renderDetail(response.data, { supplierNames: purchasingNames(state.partners), productNames: purchasingNames(state.products) })); }
      catch (error) { if (request === purchasingRequest) { const message = readableLoadError(error, "Purchasing detail could not be loaded."); Toast.error(message); Modal.body(Components.empty(Utils.escapeHTML(message))); } }
      finally { if (request === purchasingRequest) { state.purchasingBusyId = null; PurchasingPresenter.setRowBusy(normalizedId, false); } }
    }

    function updatePurchasingForm(kind, field, value) {
      if (kind !== state.purchasingFormKind || !state.purchasingForm || !["Tanggal", "SupplierID", "ProductID", "Qty", "Harga"].includes(field)) return;
      state.purchasingForm[field] = value; PurchasingPresenter.clearFieldError(kind, field); if (field === "Qty" || field === "Harga") PurchasingPresenter.updateTotal(kind, purchasingTotal());
    }
    function purchasingTotal() { const qty = Number(state.purchasingForm?.Qty); const price = Number(state.purchasingForm?.Harga); return String(state.purchasingForm?.Qty ?? "") && String(state.purchasingForm?.Harga ?? "") && Number.isFinite(qty) && qty > 0 && Number.isFinite(price) && price >= 0 ? qty * price : 0; }
    function purchasingFormView() { return { form: state.purchasingForm, suppliers: state.purchasingSuppliers, products: state.purchasingProducts, total: purchasingTotal() }; }
    function dateInput(value) { const text = String(value ?? "").trim(); return /^\d{4}-\d{2}-\d{2}/.test(text) ? text.slice(0, 10) : ""; }
    function validDateInput(value) { const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value); if (!match) return false; const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])); return date.getFullYear() === Number(match[1]) && date.getMonth() === Number(match[2]) - 1 && date.getDate() === Number(match[3]); }
    function validatePurchasingForm(kind) {
      const form = state.purchasingForm || {}; const date = String(form.Tanggal || "").trim(); const supplier = String(form.SupplierID || "").trim(); const product = String(form.ProductID || "").trim(); const qtyText = String(form.Qty ?? "").trim(); const priceText = String(form.Harga ?? "").trim(); const qty = Number(qtyText); const price = Number(priceText);
      const has = (rows, id) => rows.some((row) => String(row?.ID || "") === id);
      if (!validDateInput(date)) return { field: "Tanggal", message: "Date is required." };
      if (!supplier || !has(state.purchasingSuppliers, supplier)) return { field: "SupplierID", message: kind === "create" && !state.purchasingSuppliers.length ? "No active Supplier is available for Purchasing." : "Select an active Supplier." };
      if (!product || !has(state.purchasingProducts, product)) return { field: "ProductID", message: kind === "create" && !state.purchasingProducts.length ? "No active Product is available for Purchasing." : "Select an active Product." };
      if (!qtyText || !Number.isFinite(qty) || qty <= 0) return { field: "Qty", message: "Qty must be a number greater than zero." };
      if (!priceText || !Number.isFinite(price) || price < 0) return { field: "Harga", message: "Unit Price must be a number greater than or equal to zero." };
      return { payload: { Tanggal: date, SupplierID: supplier, ProductID: product, Qty: qty, Harga: price } };
    }

    async function submitPurchasingForm(kind) {
      if (state.purchasingSubmitting || kind !== state.purchasingFormKind || !state.purchasingForm) return false;
      const validation = validatePurchasingForm(kind); if (!validation.payload) { if (!PurchasingPresenter.showFieldError(kind, validation.field, validation.message)) Toast.error(validation.message); return false; }
      purchasingRequest += 1; state.purchasingSubmitting = true; Modal.footer(PurchasingPresenter.renderFormFooter(kind, { loading: true }));
      try { const response = kind === "create" ? await Api.Purchasing.create(validation.payload) : await Api.Purchasing.update(state.purchasingForm.id, validation.payload); if (!response?.success) { Toast.error(response?.message || `Purchasing could not be ${kind === "create" ? "created" : "updated"}.`); return false; } Toast.success(response.message || `Purchasing ${kind === "create" ? "created" : "updated"}.`); closePurchasingModal(true); await loadPurchasing(); return true; }
      catch (error) { Toast.error(readableLoadError(error, `Purchasing could not be ${kind === "create" ? "created" : "updated"}. Please try again.`)); return false; }
      finally { state.purchasingSubmitting = false; if (state.purchasingFormKind === kind) Modal.footer(PurchasingPresenter.renderFormFooter(kind)); }
    }

    function closePurchasingModal(force = false) { if (state.purchasingSubmitting && !force) return; purchasingRequest += 1; state.purchasingForm = null; state.purchasingFormKind = null; state.purchasingBusyId = null; Modal.close(); }
    function purchasingError(message) { Toast.error(message); return false; }

    async function deletePurchasing(id) {
      const row = state.purchasing.find((item) => String(item?.ID || "") === String(id || "")); if (!row || state.purchasingBusyId) return purchasingError("This Purchasing record is no longer available for deletion.");
      purchasingRequest += 1; state.purchasingBusyId = String(row.ID);
      try { const confirmed = await Dialog.confirm({ title: "Delete Purchasing", confirmText: "Delete Purchasing", loadingText: "Deleting...", message: PurchasingPresenter.renderDeleteMessage(row, { supplierNames: purchasingNames(state.partners), productNames: purchasingNames(state.products) }), onConfirm: async () => { const response = await Api.Purchasing.remove(row.ID); if (!response?.success) { Toast.error(response?.message || "Purchasing could not be deleted."); return false; } Toast.success(response.message || "Purchasing deleted."); return true; } }); if (confirmed && state.page === "purchasing") await loadPurchasing(); return Boolean(confirmed); }
      catch (error) { Toast.error(readableLoadError(error, "Purchasing could not be deleted. Please try again.")); return false; }
      finally { state.purchasingBusyId = null; }
    }

    async function restorePurchasing(id) {
      const purchasingId = String(id || "").trim();
      if (!purchasingId || state.page !== "purchasing" || state.purchasingMode !== "deleted" || state.purchasingRestoreBusyId || state.purchasingRestoreConfirming) return false;

      const row = state.deletedPurchasing.find((item) => String(item?.ID) === purchasingId);
      if (!row) { Toast.error("Deleted Purchasing record is no longer available."); return false; }
      if (row.canRestore !== true) { Toast.error(row.restoreReason || "Purchasing cannot be restored."); return false; }

      let succeeded = false;
      let attempted = false;
      purchasingRequest += 1;
      state.purchasingRestoreConfirming = true;
      try {
        const confirmed = await Dialog.confirm({
          title: "Restore Purchasing",
          confirmText: "Restore",
          loadingText: "Restoring...",
          message: `Restore Purchasing <strong>${Utils.escapeHTML(purchasingId)}</strong>?`,
          onConfirm: async () => {
            if (attempted || state.purchasingRestoreBusyId || state.page !== "purchasing" || state.purchasingMode !== "deleted") return false;
            attempted = true;
            state.purchasingRestoreBusyId = purchasingId;
            renderPurchasing();
            try {
              const response = await Api.Purchasing.restore(purchasingId);
              if (!response?.success) { Toast.error(response?.message || "Purchasing could not be restored."); return true; }
              succeeded = true;
              Toast.success(response.message || "Purchasing restored.");
              return true;
            } catch (error) {
              Toast.error(readableLoadError(error, "Purchasing could not be restored. Please try again."));
              return true;
            } finally {
              state.purchasingRestoreBusyId = null;
            }
          },
        });
        if (confirmed && state.page === "purchasing" && state.purchasingMode === "deleted") await loadPurchasing();
      } finally {
        state.purchasingRestoreConfirming = false;
        if (state.page === "purchasing" && state.purchasingMode === "deleted" && !succeeded) renderPurchasing();
      }

      return succeeded;
    }

    //===========================================================================
    // Expenses
    //===========================================================================

    async function loadExpenses() {
      const mode = state.expenseMode;
      const request = ++expenseRequest;
      const fallback = mode === "trash"
        ? "Load deleted expenses failed."
        : "Load expenses failed.";

      state.expenseLoading = true;
      ExpensesPresenter.renderLoading(mode);

      let res;

      try {
        res = mode === "trash"
          ? await Api.Expense.listDeleted()
          : await Api.Expense.list();
      } catch (error) {
        if (request !== expenseRequest || mode !== state.expenseMode) return;

        state.expenseLoading = false;
        Toast.error(readableLoadError(error, fallback));
        ExpensesPresenter.renderError(mode);
        return;
      }

      if (request !== expenseRequest || mode !== state.expenseMode) return;

      if (!res || !res.success) {
        state.expenseLoading = false;
        Toast.error(res?.message || fallback);
        ExpensesPresenter.renderError(mode);
        return;
      }

      const records = Utils.deepClone(Array.isArray(res.data) ? res.data : []);
      state.expenseLoading = false;

      if (mode === "trash") {
        state.deletedExpenses = records;
      } else {
        state.expenses = records;
      }

      ExpensesPresenter.render(records, mode);
    }

    function setExpenseMode(mode) {
      const nextMode = mode === "trash" ? "trash" : "active";

      if (state.expenseMode === nextMode) {
        return Promise.resolve();
      }

      state.expenseMode = nextMode;
      resetPagination("expenses", nextMode);
      return loadExpenses();
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          ExpensesPresenter.search(keyword);

          break;

        case "pickups":
          searchPickups(keyword);

          break;

        case "returns":
          searchReturns(keyword);

          break;

        default:
          break;
      }
    }

    function searchProducts(keyword = "") {
      resetPagination("products", state.productMode);
      const value = String(keyword || "")
        .trim()

        .toLowerCase();

      if (!value) {
        ProductsPresenter.render(state.productMode === "deleted" ? state.deletedProducts : state.products, state.productMode, state.productRestoreBusyId);

        return;
      }

      const fields = ["ID", "Nama", "Kategori", "Satuan"];

      const source = state.productMode === "deleted" ? state.deletedProducts : state.products;
      const result = source.filter((product) => {
        return fields.some((field) => {
          return String(product[field] || "")
            .toLowerCase()

            .includes(value);
        });
      });

      ProductsPresenter.render(result, state.productMode, state.productRestoreBusyId);
    }

    //===========================================================================
    // Partner Search
    //===========================================================================

    function searchPartners(keyword = "") {
      resetPagination("partners", state.partnerMode);
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        PartnersPresenter.render(state.partnerMode === "deleted" ? state.deletedPartners : state.partners, state.partnerMode, state.partnerRestoreBusyId);

        return;
      }

      const fields = ["ID", "Nama", "Jenis", "Telepon", "Alamat"];

      const source = state.partnerMode === "deleted" ? state.deletedPartners : state.partners;
      const result = source.filter((partner) => {
        return fields.some((field) => {
          return String(partner[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });

      PartnersPresenter.render(result, state.partnerMode, state.partnerRestoreBusyId);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,
      navigate,
      refresh,
      currentPage,
      search,
      paginateRows,
      resetPagination,

      getProducts,
      getPartners,
      getPickups,
      getDeletedPickups,
      getPickupMode,
      getPickupSearch,
      getPickupRestoreBusyId,
      setPickupMode,
      restorePickup,
      getExpenses,
      getDeletedExpenses,
      getExpenseMode,
      setExpenseMode,

      refreshReturns,
      getReturnMode,
      setReturnMode,
      searchReturns,
      changeReturnPage,
      changeReturnPageSize,
      openCreateReturn,
      openEditReturn,
      viewReturn,
      updateReturnForm,
      submitReturnForm,
      closeReturnModal,
      deleteReturn,
      restoreReturn,

      getPurchasingMode,
      setPurchasingMode,
      searchPurchasing,
      refreshPurchasing,
      changePurchasingPage,
      changePurchasingPageSize,
      openCreatePurchasing,
      openEditPurchasing,
      viewPurchasing,
      updatePurchasingForm,
      submitPurchasingForm,
      closePurchasingModal,
      deletePurchasing,
      restorePurchasing,

      loadProducts,
      openCreateProduct,
      openEditProduct,
      saveProduct,
      deleteProduct,
      restoreProduct,

      loadPartners,
      openCreatePartner,
      openEditPartner,
      savePartner,
      deletePartner,
      restorePartner,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
