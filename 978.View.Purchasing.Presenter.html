<script>
  /** Render-only Purchasing presenter. State and orchestration are external. */
  const PurchasingPresenter = (() => {
    const FIELD = Object.freeze({ ID: "ID", DATE: "Tanggal", SUPPLIER_ID: "SupplierID", PRODUCT_ID: "ProductID", QTY: "Qty", PRICE: "Harga", TOTAL: "Total", DELETED: "Deleted", IS_ACTIVE: "IsActive", CREATED_AT: "CreatedAt", CREATED_BY: "CreatedBy", UPDATED_AT: "UpdatedAt", UPDATED_BY: "UpdatedBy" });

    function render(view = {}) {
      const mode = view.mode === "deleted" ? "deleted" : "active";
      renderHeader(mode);
      renderModeButtons(mode);
      const rows = Array.isArray(view.rows) ? view.rows : [];
      if (!rows.length) return renderEmpty(view.emptyMessage || (mode === "deleted" ? "No deleted purchasing records available." : "No purchasing records available."), mode);
      Render.mount("tbl-purchasing-body", rows.map((row) => mode === "deleted" ? renderDeletedRow(row, view) : renderRow(row, view)).join(""));
    }

    function renderLoading(view = {}) {
      const mode = normalizeMode(view);
      renderHeader(mode); renderModeButtons(mode);
      const label = mode === "deleted" ? "deleted purchasing records" : "purchasing records";
      Render.mount("tbl-purchasing-body", `<tr><td colspan="${columnCount(mode)}">${Components.loading(`Loading ${label}...`)}</td></tr>`);
      Render.mount("lbl-purchasing-info", `Loading ${label}...`); Render.mount("purchasing-pagination", "");
    }

    function renderError(view = {}) {
      const mode = normalizeMode(view);
      renderHeader(mode); renderModeButtons(mode);
      const label = mode === "deleted" ? "Deleted purchasing records" : "Purchasing records";
      Render.mount("tbl-purchasing-body", `<tr><td colspan="${columnCount(mode)}">${Components.error(view.message || `${label} could not be loaded. Use Refresh to try again.`)}</td></tr>`);
      Render.mount("lbl-purchasing-info", "Purchasing count unavailable"); Render.mount("purchasing-pagination", "");
    }

    function normalizeMode(view) { return (typeof view === "string" ? view : view?.mode) === "deleted" ? "deleted" : "active"; }
    function columnCount(mode) { return mode === "deleted" ? 10 : 9; }
    function renderHeader(mode) {
      Render.mount("tbl-purchasing-head", mode === "deleted"
        ? `<tr><th class="whitespace-nowrap px-4 py-3 text-left">Purchase ID</th><th class="whitespace-nowrap px-4 py-3 text-left">Date</th><th class="min-w-[10rem] px-4 py-3 text-left">Supplier</th><th class="min-w-[10rem] px-4 py-3 text-left">Product</th><th class="whitespace-nowrap px-4 py-3 text-right">Qty</th><th class="whitespace-nowrap px-4 py-3 text-right">Unit Price</th><th class="whitespace-nowrap px-4 py-3 text-right">Total</th><th class="min-w-[10rem] whitespace-nowrap px-4 py-3 text-center">Status Restore</th><th class="min-w-[22rem] px-4 py-3 text-left">Keterangan</th><th class="whitespace-nowrap px-4 py-3 text-center">Action</th></tr>`
        : `<tr><th class="px-4 py-3 text-left">Purchase ID</th><th class="px-4 py-3 text-left">Date</th><th class="px-4 py-3 text-left">Supplier</th><th class="px-4 py-3 text-left">Product</th><th class="px-4 py-3 text-right">Qty</th><th class="px-4 py-3 text-right">Unit Price</th><th class="px-4 py-3 text-right">Total</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3 text-center">Action</th></tr>`);
    }
    function renderModeButtons(mode) {
      document.querySelectorAll("[data-purchasing-mode]").forEach((button) => { const selected = button.dataset.purchasingMode === mode; button.classList.toggle("bg-blue-600", selected); button.classList.toggle("text-white", selected); button.classList.toggle("text-slate-600", !selected); });
      DOM.$("btn-purchasing-add")?.classList.toggle("hidden", mode === "deleted");
    }
    function renderEmpty(message, mode) { Render.mount("tbl-purchasing-body", `<tr><td colspan="${columnCount(mode)}">${Components.empty(message)}</td></tr>`); }

    function renderRow(row, view) {
      const id = row?.[FIELD.ID];
      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"), Components.tableCell(text(formatDate(row?.[FIELD.DATE]))),
        Components.tableCell(text(resolveName(view.supplierNames, row?.[FIELD.SUPPLIER_ID]))), Components.tableCell(text(resolveName(view.productNames, row?.[FIELD.PRODUCT_ID]))),
        Components.tableCell(text(formatNumber(row?.[FIELD.QTY])), "text-right"), Components.tableCell(text(formatCurrency(row?.[FIELD.PRICE])), "text-right"), Components.tableCell(text(formatCurrency(row?.[FIELD.TOTAL])), "text-right"),
        Components.tableCell(Components.badge(Format.status(true), true), "text-center"), Components.tableCell(renderActions(id, view.busyId), "text-center")
      ]);
    }
    function renderActions(id, busyId) {
      if (Utils.isEmpty(id)) return text("-");
      const disabled = busyId ? "disabled aria-disabled=\"true\"" : "";
      return `<button type="button" data-purchasing-action="edit" data-purchasing-id="${escape(id)}" ${disabled} title="Edit" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-blue-50 hover:bg-blue-100 text-blue-700">${Components.icon("fa-pen")} <span>Edit</span></button>
        <button type="button" data-purchasing-action="view" data-purchasing-id="${escape(id)}" ${disabled} title="View" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-slate-100 hover:bg-slate-200 text-slate-700">${Components.icon("fa-eye")} <span>View</span></button>
        <button type="button" data-purchasing-action="delete" data-purchasing-id="${escape(id)}" ${disabled} title="Delete" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-red-50 hover:bg-red-100 text-red-700">${Components.icon("fa-trash")} <span>Delete</span></button>`;
    }
    function renderDeletedRow(row, view) {
      const id = safeValue(row?.[FIELD.ID]); const busy = Boolean(view.busyId); const allowed = row?.canRestore === true && !busy;
      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"), Components.tableCell(text(formatDate(row?.[FIELD.DATE]))),
        Components.tableCell(text(resolveName(view.supplierNames, row?.[FIELD.SUPPLIER_ID]))), Components.tableCell(text(resolveName(view.productNames, row?.[FIELD.PRODUCT_ID]))),
        Components.tableCell(text(formatNumber(row?.[FIELD.QTY])), "whitespace-nowrap text-right align-top"), Components.tableCell(text(formatCurrency(row?.[FIELD.PRICE])), "whitespace-nowrap text-right align-top"), Components.tableCell(text(formatCurrency(row?.[FIELD.TOTAL])), "whitespace-nowrap text-right align-top"),
        Components.tableCell(Components.badge(row?.canRestore === true ? "Aman direstore" : "Tidak dapat direstore", row?.canRestore === true), "whitespace-nowrap text-center align-top"),
        Components.tableCell(text(row?.restoreReason), "min-w-[22rem] whitespace-normal break-words align-top leading-relaxed"),
        Components.tableCell(`<button type="button" data-purchasing-action="restore" data-purchasing-id="${escape(id)}" ${allowed ? "" : "disabled aria-disabled=\"true\""} class="rounded-lg px-3 py-2 ${row?.canRestore === true ? "bg-emerald-50 text-emerald-700 hover:bg-emerald-100" : "cursor-not-allowed bg-slate-100 text-slate-400"} ${busy ? "cursor-not-allowed opacity-50" : ""}">${Components.icon("fa-rotate-left")} <span>${String(view.busyId || "") === String(id) ? "Restoring..." : "Restore"}</span></button>`, "whitespace-nowrap text-center align-top")
      ]);
    }

    function renderCreateForm(view = {}) { return renderForm("create", view); }
    function renderEditForm(view = {}) { return renderForm("edit", view); }
    function renderForm(kind, view) {
      const form = view.form || {}; const suppliers = view.suppliers || []; const products = view.products || []; const edit = kind === "edit"; const availability = [];
      if (!suppliers.length || (edit && !hasId(suppliers, form.SupplierID))) availability.push(edit ? "The current Supplier is no longer active and selectable. Choose a valid Supplier before saving." : "No active Supplier is available for Purchasing.");
      if (!products.length || (edit && !hasId(products, form.ProductID))) availability.push(edit ? "The current Product is no longer active and selectable. Choose a valid Product before saving." : "No active Product is available for Purchasing.");
      const prefix = `purchasing-${kind}`;
      return `<form id="${prefix}-form" class="space-y-4" novalidate>${availability.length ? `<div class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">${availability.map(escape).join("<br>")}</div>` : ""}
        ${edit ? `<div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm"><span class="text-slate-500">Purchase ID</span><strong class="ml-2 text-slate-800">${escape(form.id)}</strong></div>` : ""}
        ${renderInput(kind, "Date", "Tanggal", "date", form.Tanggal || "", `${prefix}-date`)}
        ${renderSelect(kind, "Supplier", "SupplierID", suppliers, form.SupplierID, `${prefix}-supplier`)}
        ${renderSelect(kind, "Product", "ProductID", products, form.ProductID, `${prefix}-product`)}
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">${renderInput(kind, "Qty", "Qty", "number", form.Qty || "", `${prefix}-qty`)}${renderInput(kind, "Unit Price", "Harga", "number", form.Harga || "", `${prefix}-price`)}</div>
        <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3"><span class="block text-sm text-slate-500">Total Preview</span><strong id="lbl-${prefix}-total" class="mt-1 block text-lg text-slate-800">${escape(Format.currency(view.total || 0))}</strong></div></form>`;
    }
    function renderInput(kind, label, field, type, value, id) { const numeric = type === "number" ? ' min="0" step="any" inputmode="decimal"' : ""; return `<div><label for="inp-${id}" class="mb-1 block text-sm font-medium text-slate-700">${escape(label)}</label><input id="inp-${id}" data-purchasing-${kind}-field="${field}" type="${type}"${numeric} value="${escape(value)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />${renderFieldError(kind, field)}</div>`; }
    function renderSelect(kind, label, field, records, selected, id) { return `<div><label for="inp-${id}" class="mb-1 block text-sm font-medium text-slate-700">${label}</label><select id="inp-${id}" data-purchasing-${kind}-field="${field}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" ${records.length ? "" : "disabled"}><option value="">-- Select ${label} --</option>${records.map((record) => `<option value="${escape(record?.ID)}" ${String(record?.ID) === String(selected || "") ? "selected" : ""}>${escape(record?.Nama || record?.ID)}</option>`).join("")}</select>${renderFieldError(kind, field)}</div>`; }
    function renderFieldError(kind, field) { return `<p data-purchasing-${kind}-error="${escape(field)}" class="mt-1 hidden text-sm text-red-600"></p>`; }
    function renderFormFooter(kind, view = {}) { const label = kind === "create" ? "Create Purchasing" : "Save Changes"; const loading = Boolean(view.loading); const unavailable = Boolean(view.unavailable); return `<button type="button" data-purchasing-${kind}-action="cancel" ${loading ? "disabled" : ""} class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button><button type="button" id="btn-purchasing-${kind}-save" data-purchasing-${kind}-action="save" ${loading || unavailable ? "disabled" : ""} class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 ${loading || unavailable ? "cursor-not-allowed opacity-50" : ""}">${loading ? (kind === "create" ? "Creating..." : "Saving...") : label}</button>`; }
    function renderDetail(purchase = {}, view = {}) { return `<dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">${detailField("Purchase ID", purchase.ID)}${detailField("Date", formatDate(purchase.Tanggal))}${detailField("Supplier", resolveName(view.supplierNames, purchase.SupplierID))}${detailField("Supplier ID", purchase.SupplierID)}${detailField("Product", resolveName(view.productNames, purchase.ProductID))}${detailField("Product ID", purchase.ProductID)}${detailField("Qty", formatNumber(purchase.Qty))}${detailField("Unit Price", formatCurrency(purchase.Harga))}${detailField("Total", formatCurrency(purchase.Total))}${detailField("Status", Format.status(isActiveRow(purchase)))}${detailField("Created At", formatDateTime(purchase.CreatedAt))}${detailField("Created By", purchase.CreatedBy)}${detailField("Updated At", formatDateTime(purchase.UpdatedAt))}${detailField("Updated By", purchase.UpdatedBy)}</dl>`; }
    function renderDetailFooter() { return `<button type="button" data-purchasing-detail-action="close" class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100">Close</button>`; }
    function renderDeleteMessage(row = {}, view = {}) { return `<div class="space-y-3"><p class="font-medium text-red-700">Confirm soft deletion of this Purchasing record.</p><dl class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-3 text-sm sm:grid-cols-2">${detailField("Purchase ID", row.ID)}${detailField("Date", formatDate(row.Tanggal))}${detailField("Supplier", resolveName(view.supplierNames, row.SupplierID))}${detailField("Product", resolveName(view.productNames, row.ProductID))}${detailField("Qty", formatNumber(row.Qty))}${detailField("Total", formatCurrency(row.Total))}</dl><p class="text-sm text-slate-600">This action removes the record from the active list using a soft delete. It does not permanently erase the sheet row.</p></div>`; }
    function showFieldError(kind, field, message) { const target = document.querySelector(`[data-purchasing-${kind}-error="${field}"]`); if (!target) return false; DOM.text(target, message); target.classList.remove("hidden"); return true; }
    function clearFieldError(kind, field) { const target = document.querySelector(`[data-purchasing-${kind}-error="${field}"]`); if (target) { DOM.text(target, ""); target.classList.add("hidden"); } }
    function updateTotal(kind, total) { DOM.text(DOM.$(`lbl-purchasing-${kind}-total`), Format.currency(Number.isFinite(total) ? total : 0)); }
    function setRowBusy(id, busy) { document.querySelectorAll("[data-purchasing-action]").forEach((button) => { if (String(button.dataset.purchasingId) !== String(id)) return; button.disabled = busy; button.classList.toggle("opacity-50", busy); button.classList.toggle("cursor-not-allowed", busy); }); }
    function detailField(label, value) { return `<div><dt class="text-slate-500">${escape(label)}</dt><dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd></div>`; }
    function hasId(records, id) { return records.some((record) => String(record?.ID || "") === String(id || "")); }
    function resolveName(names, id) { return names?.[String(id ?? "")] || id; }
    function isActiveRow(row) { return !toBoolean(row?.[FIELD.DELETED], false) && toBoolean(row?.[FIELD.IS_ACTIVE], false); }
    function toBoolean(value, fallback) { if (value === true || value === 1 || String(value).toLowerCase() === "true") return true; if (value === false || value === 0 || String(value).toLowerCase() === "false") return false; return fallback; }
    function formatDate(value) { return validDate(value) ? Format.date(value) : "-"; }
    function formatDateTime(value) { return validDate(value) ? Format.datetime(value) : "-"; }
    function validDate(value) { return !Utils.isEmpty(value) && !isNaN(new Date(value).getTime()); }
    function formatNumber(value) { const number = Number(value); return Number.isFinite(number) ? Format.number(number) : "-"; }
    function formatCurrency(value) { const number = Number(value); return Number.isFinite(number) ? Format.currency(number) : "-"; }
    function safeValue(value) { return Utils.isEmpty(value) || typeof value === "object" || typeof value === "function" ? "-" : value; }
    function text(value) { return SharedPresenter.text(safeValue(value)); }
    function escape(value) { return Utils.escapeHTML(String(value ?? "")); }

    return Object.freeze({ render, renderLoading, renderError, renderCreateForm, renderEditForm, renderFormFooter, renderDetail, renderDetailFooter, renderDeleteMessage, showFieldError, clearFieldError, updateTotal, setRowBusy });
  })();
</script>
