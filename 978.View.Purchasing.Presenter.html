<script>
  /**
   * =============================================================================
   * FILE        : 978.View.Purchasing.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Purchasing Presenter
   * =============================================================================
   */

  const PurchasingPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      DATE: "Tanggal",

      SUPPLIER_ID: "SupplierID",

      PRODUCT_ID: "ProductID",

      QTY: "Qty",

      PRICE: "Harga",

      TOTAL: "Total",

      DELETED: "Deleted",

      IS_ACTIVE: "IsActive",

      CREATED_AT: "CreatedAt",

      CREATED_BY: "CreatedBy",

      UPDATED_AT: "UpdatedAt",

      UPDATED_BY: "UpdatedBy",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    let loadedRows = [];

    let supplierNames = new Map();

    let productNames = new Map();

    let detailRequest = 0;

    let pendingDetailId = null;

    let createSubmitting = false;

    let createForm = null;

    let createSuppliers = [];

    let createProducts = [];

    let editRequest = 0;

    let pendingEditId = null;

    let editSubmitting = false;

    let editForm = null;

    let editSuppliers = [];

    let editProducts = [];

    function render(purchasing = []) {
      const list = normalizeList(purchasing);

      supplierNames = createNameMap(App.getPartners());

      productNames = createNameMap(App.getProducts());

      loadedRows = list.filter(isActiveRow);

      bindToolbar();

      bindActions();

      renderVisibleRows();
    }

    function normalizeList(value) {
      if (Array.isArray(value)) {
        return value;
      }

      return Array.isArray(value?.data) ? value.data : [];
    }

    function createNameMap(records) {
      const list = Array.isArray(records) ? records : [];

      return new Map(
        list.map((record) => [String(record?.ID ?? ""), record?.Nama]),
      );
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const search = DOM.$("inp-purchasing-search");

      const refresh = DOM.$("btn-purchasing-refresh");

      const add = DOM.$("btn-purchasing-add");

      if (search && !search.dataset.purchasingSearchBound) {
        search.dataset.purchasingSearchBound = "true";
        search.addEventListener("input", renderVisibleRows);
      }

      if (refresh && !refresh.dataset.purchasingRefreshBound) {
        refresh.dataset.purchasingRefreshBound = "true";
        refresh.addEventListener("click", () => {
          clearSearch();
          App.refresh();
        });
      }

      if (add && !add.dataset.purchasingAddBound) {
        add.dataset.purchasingAddBound = "true";
        add.addEventListener("click", openCreate);
      }
    }

    function clearSearch() {
      const input = DOM.$("inp-purchasing-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Create Form
    //===========================================================================

    function openCreate() {
      if (createSubmitting) {
        return;
      }

      createSuppliers = selectableSuppliers(App.getPartners());
      createProducts = selectableProducts(App.getProducts());
      createForm = {
        Tanggal: todayInputValue(),
        SupplierID: "",
        ProductID: "",
        Qty: "",
        Harga: "",
      };

      Modal.open({
        title: "Create Purchasing",
        width: "md",
        body: renderCreateForm(),
        footer: renderCreateFooter(),
      });

      bindCreateForm();
      updateTotalPreview();
      DOM.$("inp-purchasing-create-date")?.focus();
    }

    function selectableSuppliers(records) {
      return (Array.isArray(records) ? records : []).filter((record) => {
        return (
          !toBoolean(record?.Deleted, false) &&
          toBoolean(record?.IsActive, false) &&
          String(record?.Jenis ?? "").trim().toLowerCase() === "supplier"
        );
      });
    }

    function selectableProducts(records) {
      return (Array.isArray(records) ? records : []).filter((record) => {
        return (
          !toBoolean(record?.Deleted, false) &&
          toBoolean(record?.IsActive, false)
        );
      });
    }

    function todayInputValue() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function renderCreateForm() {
      const availability = renderCreateAvailability();

      return `
        <form id="purchasing-create-form" class="space-y-4" novalidate>
          ${availability}
          <div>
            <label for="inp-purchasing-create-date" class="mb-1 block text-sm font-medium text-slate-700">Date</label>
            <input id="inp-purchasing-create-date" data-purchasing-create-field="Tanggal" type="date" value="${escape(createForm.Tanggal)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderFieldError("Tanggal")}
          </div>
          <div>
            <label for="inp-purchasing-create-supplier" class="mb-1 block text-sm font-medium text-slate-700">Supplier</label>
            <select id="inp-purchasing-create-supplier" data-purchasing-create-field="SupplierID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" ${createSuppliers.length ? "" : "disabled"}>
              <option value="">-- Select Supplier --</option>
              ${createSuppliers.map(renderCreateOption).join("")}
            </select>
            ${renderFieldError("SupplierID")}
          </div>
          <div>
            <label for="inp-purchasing-create-product" class="mb-1 block text-sm font-medium text-slate-700">Product</label>
            <select id="inp-purchasing-create-product" data-purchasing-create-field="ProductID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" ${createProducts.length ? "" : "disabled"}>
              <option value="">-- Select Product --</option>
              ${createProducts.map(renderCreateOption).join("")}
            </select>
            ${renderFieldError("ProductID")}
          </div>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="inp-purchasing-create-qty" class="mb-1 block text-sm font-medium text-slate-700">Qty</label>
              <input id="inp-purchasing-create-qty" data-purchasing-create-field="Qty" type="number" min="0" step="any" inputmode="decimal" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
              ${renderFieldError("Qty")}
            </div>
            <div>
              <label for="inp-purchasing-create-price" class="mb-1 block text-sm font-medium text-slate-700">Unit Price</label>
              <input id="inp-purchasing-create-price" data-purchasing-create-field="Harga" type="number" min="0" step="any" inputmode="decimal" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
              ${renderFieldError("Harga")}
            </div>
          </div>
          <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
            <span class="block text-sm text-slate-500">Total Preview</span>
            <strong id="lbl-purchasing-create-total" class="mt-1 block text-lg text-slate-800">${escape(Format.currency(0))}</strong>
          </div>
        </form>
      `;
    }

    function renderCreateAvailability() {
      const messages = [];

      if (!createSuppliers.length) {
        messages.push("No active Supplier is available for Purchasing.");
      }

      if (!createProducts.length) {
        messages.push("No active Product is available for Purchasing.");
      }

      return messages.length
        ? `<div class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">${messages.map(escape).join("<br>")}</div>`
        : "";
    }

    function renderCreateOption(record) {
      const id = String(record?.ID ?? "");
      const name = String(record?.Nama ?? "");

      return `<option value="${escape(id)}">${escape(name)}</option>`;
    }

    function renderFieldError(field) {
      return `<p data-purchasing-create-error="${escape(field)}" class="mt-1 hidden text-sm text-red-600"></p>`;
    }

    function renderCreateFooter() {
      const unavailable = !createSuppliers.length || !createProducts.length;

      return `
        <button type="button" data-purchasing-create-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="button" id="btn-purchasing-create-save" data-purchasing-create-action="save" ${unavailable ? "disabled" : ""} class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 ${unavailable ? "cursor-not-allowed opacity-50" : ""}">Create Purchasing</button>
      `;
    }

    function bindCreateForm() {
      const form = DOM.$("purchasing-create-form");
      const footer = DOM.$("modal-footer");
      const close = DOM.$("btn-modal-close");

      form?.addEventListener("input", handleCreateInput);
      form?.addEventListener("change", handleCreateInput);
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        submitCreate();
      });
      if (footer && !footer.dataset.purchasingCreateBound) {
        footer.dataset.purchasingCreateBound = "true";
        footer.addEventListener("click", handleCreateFooterClick);
      }

      if (close) {
        close.onclick = closeCreate;
      }
    }

    function handleCreateInput(event) {
      const field = event.target.dataset.purchasingCreateField;

      if (!field || !createForm) {
        return;
      }

      createForm[field] = event.target.value;
      clearFieldError(field);

      if (field === FIELD.QTY || field === FIELD.PRICE) {
        updateTotalPreview();
      }
    }

    function handleCreateFooterClick(event) {
      const action = event.target.closest("[data-purchasing-create-action]")
        ?.dataset.purchasingCreateAction;

      if (action === "cancel") {
        closeCreate();
      } else if (action === "save") {
        submitCreate();
      }
    }

    function updateTotalPreview() {
      const qty = Number(createForm?.Qty);
      const price = Number(createForm?.Harga);
      const total =
        createForm?.Qty !== "" &&
        createForm?.Harga !== "" &&
        Number.isFinite(qty) &&
        qty > 0 &&
        Number.isFinite(price) &&
        price >= 0
          ? qty * price
          : 0;

      DOM.text(
        DOM.$("lbl-purchasing-create-total"),
        Format.currency(Number.isFinite(total) ? total : 0),
      );
    }

    function closeCreate() {
      if (createSubmitting) {
        return;
      }

      createForm = null;
      createSuppliers = [];
      createProducts = [];
      Modal.close();
    }

    async function submitCreate() {
      if (createSubmitting || !createForm) {
        return;
      }

      clearAllFieldErrors();

      const validation = validateCreate();

      if (!validation.valid) {
        showFieldError(validation.field, validation.message);
        validation.element?.focus();

        return;
      }

      createSubmitting = true;
      setCreateLoading(true);

      let response;

      try {
        response = await Api.Purchasing.create(validation.payload);

        if (!response?.success) {
          Components.toast(
            response?.message || "Purchasing could not be created.",
            "error",
          );

          return;
        }
      } catch (error) {
        Components.toast(
          "Purchasing could not be created. Please try again.",
          "error",
        );

        return;
      } finally {
        createSubmitting = false;
        setCreateLoading(false);
      }

      Components.toast(response.message || "Purchasing created.", "success");
      closeCreate();
      await App.refresh();
    }

    function validateCreate() {
      if (!createSuppliers.length) {
        return invalidCreate("SupplierID", "No active Supplier is available for Purchasing.");
      }

      if (!createProducts.length) {
        return invalidCreate("ProductID", "No active Product is available for Purchasing.");
      }

      const date = String(createForm.Tanggal ?? "").trim();
      const supplierId = String(createForm.SupplierID ?? "").trim();
      const productId = String(createForm.ProductID ?? "").trim();
      const qtyText = String(createForm.Qty ?? "").trim();
      const priceText = String(createForm.Harga ?? "").trim();
      const qty = Number(qtyText);
      const price = Number(priceText);

      if (!isDateInputValue(date)) {
        return invalidCreate("Tanggal", "Date is required.", "inp-purchasing-create-date");
      }

      if (!supplierId) {
        return invalidCreate("SupplierID", "Supplier is required.", "inp-purchasing-create-supplier");
      }

      if (!productId) {
        return invalidCreate("ProductID", "Product is required.", "inp-purchasing-create-product");
      }

      if (!qtyText || !Number.isFinite(qty) || qty <= 0) {
        return invalidCreate("Qty", "Qty must be a number greater than zero.", "inp-purchasing-create-qty");
      }

      if (!priceText || !Number.isFinite(price) || price < 0) {
        return invalidCreate("Harga", "Unit Price must be a number greater than or equal to zero.", "inp-purchasing-create-price");
      }

      return {
        valid: true,
        payload: {
          Tanggal: date,
          SupplierID: supplierId,
          ProductID: productId,
          Qty: qty,
          Harga: price,
        },
      };
    }

    function isDateInputValue(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);

      if (!match) {
        return false;
      }

      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));

      return (
        date.getFullYear() === Number(match[1]) &&
        date.getMonth() === Number(match[2]) - 1 &&
        date.getDate() === Number(match[3])
      );
    }

    function invalidCreate(field, message, elementId) {
      return {
        valid: false,
        field,
        message,
        element: elementId ? DOM.$(elementId) : null,
      };
    }

    function showFieldError(field, message) {
      const error = document.querySelector(
        `[data-purchasing-create-error="${field}"]`,
      );

      if (!error) {
        Components.toast(message, "error");

        return;
      }

      DOM.text(error, message);
      error.classList.remove("hidden");
    }

    function clearFieldError(field) {
      const error = document.querySelector(
        `[data-purchasing-create-error="${field}"]`,
      );

      if (error) {
        DOM.text(error, "");
        error.classList.add("hidden");
      }
    }

    function clearAllFieldErrors() {
      document
        .querySelectorAll("[data-purchasing-create-error]")
        .forEach((error) => {
          DOM.text(error, "");
          error.classList.add("hidden");
        });
    }

    function setCreateLoading(loading) {
      const save = DOM.$("btn-purchasing-create-save");
      const cancel = document.querySelector(
        '[data-purchasing-create-action="cancel"]',
      );
      const close = DOM.$("btn-modal-close");

      [save, cancel, close].forEach((button) => {
        if (!button) {
          return;
        }

        button.disabled = loading;
        button.classList.toggle("cursor-not-allowed", loading);
        button.classList.toggle("opacity-50", loading);
      });

      if (save) {
        save.textContent = loading ? "Creating..." : "Create Purchasing";
      }
    }

    function bindActions() {
      const body = DOM.$("tbl-purchasing-body");

      if (!body || body.dataset.purchasingActionsBound) {
        return;
      }

      body.dataset.purchasingActionsBound = "true";
      body.addEventListener("click", (event) => {
        const button = event.target.closest("[data-purchasing-action]");

        if (!button || !body.contains(button)) {
          return;
        }

        if (button.dataset.purchasingAction === "view") {
          view(button.dataset.purchasingId);
        } else if (button.dataset.purchasingAction === "edit") {
          openEdit(button.dataset.purchasingId);
        }
      });
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(purchase = {}) {
      const id = purchase[FIELD.ID];

      const supplierId = purchase[FIELD.SUPPLIER_ID];

      const productId = purchase[FIELD.PRODUCT_ID];

      return Components.tableRow([
        Components.tableCell(
          SharedPresenter.text(id),

          "font-medium text-slate-800",
        ),

        Components.tableCell(text(Format.date(purchase[FIELD.DATE]))),

        Components.tableCell(text(resolveName(supplierNames, supplierId))),

        Components.tableCell(text(resolveName(productNames, productId))),

        Components.tableCell(
          text(Format.number(purchase[FIELD.QTY])),

          "text-right",
        ),

        Components.tableCell(
          text(Format.currency(purchase[FIELD.PRICE])),

          "text-right",
        ),

        Components.tableCell(
          text(Format.currency(purchase[FIELD.TOTAL])),

          "text-right",
        ),

        Components.tableCell(
          Components.badge(Format.status(true), true),

          "text-center",
        ),

        Components.tableCell(
          renderActions(id),

          "text-center",
        ),
      ]);
    }

    function renderActions(id) {
      if (Utils.isEmpty(id)) {
        return text("-");
      }

      return `
        <button
          type="button"
          data-purchasing-action="edit"
          data-purchasing-id="${escape(id)}"
          title="Edit"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-blue-50 hover:bg-blue-100 text-blue-700"
        >
          ${Components.icon("fa-pen")}
          <span>Edit</span>
        </button>
        <button
          type="button"
          data-purchasing-action="view"
          data-purchasing-id="${escape(id)}"
          title="View"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-slate-100 hover:bg-slate-200 text-slate-700"
        >
          ${Components.icon("fa-eye")}
          <span>View</span>
        </button>
      `;
    }

    //===========================================================================
    // Edit Form
    //===========================================================================

    async function openEdit(id) {
      if (editSubmitting || Utils.isEmpty(id)) {
        if (Utils.isEmpty(id)) {
          Components.toast("Purchasing ID is unavailable.", "error");
        }

        return;
      }

      const normalizedId = String(id);

      if (pendingEditId === normalizedId) {
        return;
      }

      if (pendingEditId !== null) {
        setEditRowLoading(pendingEditId, false);
      }

      const request = ++editRequest;
      resetEditState();
      pendingEditId = normalizedId;
      setEditRowLoading(normalizedId, true);

      Modal.open({
        title: "Edit Purchasing",
        width: "md",
        body: Components.loading("Loading purchasing for editing..."),
        footer: renderEditFooter(true),
      });
      bindEditModal();

      try {
        const response = await Api.Purchasing.findById(normalizedId);

        if (request !== editRequest) {
          return;
        }

        if (!isDetailResponse(response)) {
          showEditLoadError(response?.message || "Purchasing could not be loaded for editing.");
          return;
        }

        const prepared = prepareEditForm(response.data, normalizedId);

        if (!prepared.valid) {
          showEditLoadError(prepared.message);
          return;
        }

        editForm = prepared.form;
        editSuppliers = selectableSuppliers(App.getPartners());
        editProducts = selectableProducts(App.getProducts());
        Modal.body(renderEditForm());
        Modal.footer(renderEditFooter(false));
        bindEditModal();
        updateEditTotalPreview();
        DOM.$("inp-purchasing-edit-date")?.focus();
      } catch (error) {
        if (request === editRequest) {
          showEditLoadError("Purchasing could not be loaded for editing. Please try again.");
        }
      } finally {
        if (request === editRequest) {
          pendingEditId = null;
          setEditRowLoading(normalizedId, false);
        }
      }
    }

    function prepareEditForm(purchase, requestedId) {
      const id = String(purchase?.[FIELD.ID] ?? "").trim();
      const date = dateInputValue(purchase?.[FIELD.DATE]);
      const supplierId = String(purchase?.[FIELD.SUPPLIER_ID] ?? "").trim();
      const productId = String(purchase?.[FIELD.PRODUCT_ID] ?? "").trim();
      const qty = purchase?.[FIELD.QTY];
      const price = purchase?.[FIELD.PRICE];

      if (
        !id || id !== requestedId || !isDateInputValue(date) ||
        !supplierId || !productId || !isValidNumericValue(qty, true) ||
        !isValidNumericValue(price, false)
      ) {
        return { valid: false, message: "Purchasing detail is incomplete or invalid for editing." };
      }

      return {
        valid: true,
        form: { id, Tanggal: date, SupplierID: supplierId, ProductID: productId, Qty: String(qty), Harga: String(price) },
      };
    }

    function dateInputValue(value) {
      const date = String(value ?? "").trim();
      return /^\d{4}-\d{2}-\d{2}/.test(date) ? date.slice(0, 10) : "";
    }

    function isValidNumericValue(value, greaterThanZero) {
      const textValue = String(value ?? "").trim();
      const numberValue = Number(textValue);
      return Boolean(textValue) && Number.isFinite(numberValue) && (greaterThanZero ? numberValue > 0 : numberValue >= 0);
    }

    function renderEditForm() {
      const supplierValid = hasSelectableId(editSuppliers, editForm.SupplierID);
      const productValid = hasSelectableId(editProducts, editForm.ProductID);
      const availability = [];

      if (!supplierValid) {
        availability.push("The current Supplier is no longer active and selectable. Choose a valid Supplier before saving.");
      }

      if (!productValid) {
        availability.push("The current Product is no longer active and selectable. Choose a valid Product before saving.");
      }

      return `
        <form id="purchasing-edit-form" class="space-y-4" novalidate>
          ${availability.length ? `<div class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">${availability.map(escape).join("<br>")}</div>` : ""}
          <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
            <span class="text-slate-500">Purchase ID</span>
            <strong class="ml-2 text-slate-800">${escape(editForm.id)}</strong>
          </div>
          ${renderEditInput("Date", "Tanggal", "date", editForm.Tanggal, "inp-purchasing-edit-date")}
          <div>
            <label for="inp-purchasing-edit-supplier" class="mb-1 block text-sm font-medium text-slate-700">Supplier</label>
            <select id="inp-purchasing-edit-supplier" data-purchasing-edit-field="SupplierID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select Supplier --</option>
              ${editSuppliers.map((record) => renderEditOption(record, editForm.SupplierID)).join("")}
            </select>
            ${renderEditFieldError("SupplierID")}
          </div>
          <div>
            <label for="inp-purchasing-edit-product" class="mb-1 block text-sm font-medium text-slate-700">Product</label>
            <select id="inp-purchasing-edit-product" data-purchasing-edit-field="ProductID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select Product --</option>
              ${editProducts.map((record) => renderEditOption(record, editForm.ProductID)).join("")}
            </select>
            ${renderEditFieldError("ProductID")}
          </div>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            ${renderEditInput("Qty", "Qty", "number", editForm.Qty, "inp-purchasing-edit-qty")}
            ${renderEditInput("Unit Price", "Harga", "number", editForm.Harga, "inp-purchasing-edit-price")}
          </div>
          <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
            <span class="block text-sm text-slate-500">Total Preview</span>
            <strong id="lbl-purchasing-edit-total" class="mt-1 block text-lg text-slate-800">${escape(Format.currency(0))}</strong>
          </div>
        </form>
      `;
    }

    function renderEditInput(label, field, type, value, id) {
      const numeric = type === "number" ? ' min="0" step="any" inputmode="decimal"' : "";
      return `<div><label for="${id}" class="mb-1 block text-sm font-medium text-slate-700">${escape(label)}</label><input id="${id}" data-purchasing-edit-field="${field}" type="${type}"${numeric} value="${escape(value)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />${renderEditFieldError(field)}</div>`;
    }

    function renderEditOption(record, selectedId) {
      const id = String(record?.ID ?? "");
      return `<option value="${escape(id)}" ${id === String(selectedId) ? "selected" : ""}>${escape(record?.Nama ?? id)}</option>`;
    }

    function renderEditFieldError(field) {
      return `<p data-purchasing-edit-error="${escape(field)}" class="mt-1 hidden text-sm text-red-600"></p>`;
    }

    function renderEditFooter(loading) {
      return `<button type="button" data-purchasing-edit-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button><button type="button" id="btn-purchasing-edit-save" data-purchasing-edit-action="save" ${loading ? "disabled" : ""} class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 ${loading ? "cursor-not-allowed opacity-50" : ""}">${loading ? "Loading..." : "Save Changes"}</button>`;
    }

    function bindEditModal() {
      const form = DOM.$("purchasing-edit-form");
      const footer = DOM.$("modal-footer");
      const close = DOM.$("btn-modal-close");

      if (form && !form.dataset.purchasingEditBound) {
        form.dataset.purchasingEditBound = "true";
        form.addEventListener("input", handleEditInput);
        form.addEventListener("change", handleEditInput);
        form.addEventListener("submit", (event) => { event.preventDefault(); submitEdit(); });
      }

      if (footer && !footer.dataset.purchasingEditBound) {
        footer.dataset.purchasingEditBound = "true";
        footer.addEventListener("click", handleEditFooterClick);
      }

      if (close) {
        close.onclick = closeEdit;
      }
    }

    function handleEditInput(event) {
      const field = event.target.dataset.purchasingEditField;
      if (!field || !editForm) return;
      editForm[field] = event.target.value;
      clearEditFieldError(field);
      if (field === FIELD.QTY || field === FIELD.PRICE) updateEditTotalPreview();
    }

    function handleEditFooterClick(event) {
      const action = event.target.closest("[data-purchasing-edit-action]")?.dataset.purchasingEditAction;
      if (action === "cancel") closeEdit();
      if (action === "save") submitEdit();
    }

    function updateEditTotalPreview() {
      const qty = Number(editForm?.Qty);
      const price = Number(editForm?.Harga);
      const valid = isValidNumericValue(editForm?.Qty, true) && isValidNumericValue(editForm?.Harga, false);
      DOM.text(DOM.$("lbl-purchasing-edit-total"), Format.currency(valid && Number.isFinite(qty * price) ? qty * price : 0));
    }

    async function submitEdit() {
      if (editSubmitting || !editForm) return;
      clearAllEditFieldErrors();
      const validation = validateEdit();

      if (!validation.valid) {
        showEditFieldError(validation.field, validation.message);
        validation.element?.focus();
        return;
      }

      editSubmitting = true;
      setEditLoading(true);
      let response;

      try {
        response = await Api.Purchasing.update(editForm.id, validation.payload);
        if (!response?.success) {
          Components.toast(response?.message || "Purchasing could not be updated.", "error");
          return;
        }
      } catch (error) {
        Components.toast("Purchasing could not be updated. Please try again.", "error");
        return;
      } finally {
        editSubmitting = false;
        setEditLoading(false);
      }

      Components.toast(response.message || "Purchasing updated.", "success");
      closeEdit();
      await App.refresh();
    }

    function validateEdit() {
      const id = String(editForm.id ?? "").trim();
      const date = String(editForm.Tanggal ?? "").trim();
      const supplierId = String(editForm.SupplierID ?? "").trim();
      const productId = String(editForm.ProductID ?? "").trim();
      const qtyText = String(editForm.Qty ?? "").trim();
      const priceText = String(editForm.Harga ?? "").trim();
      const qty = Number(qtyText);
      const price = Number(priceText);

      if (!id) return invalidEdit("ID", "Purchasing ID is unavailable.");
      if (!isDateInputValue(date)) return invalidEdit("Tanggal", "Date is required.", "inp-purchasing-edit-date");
      if (!supplierId || !hasSelectableId(editSuppliers, supplierId)) return invalidEdit("SupplierID", "Select an active Supplier.", "inp-purchasing-edit-supplier");
      if (!productId || !hasSelectableId(editProducts, productId)) return invalidEdit("ProductID", "Select an active Product.", "inp-purchasing-edit-product");
      if (!qtyText || !Number.isFinite(qty) || qty <= 0) return invalidEdit("Qty", "Qty must be a number greater than zero.", "inp-purchasing-edit-qty");
      if (!priceText || !Number.isFinite(price) || price < 0) return invalidEdit("Harga", "Unit Price must be a number greater than or equal to zero.", "inp-purchasing-edit-price");

      return { valid: true, payload: { Tanggal: date, SupplierID: supplierId, ProductID: productId, Qty: qty, Harga: price } };
    }

    function invalidEdit(field, message, elementId) {
      return { valid: false, field, message, element: elementId ? DOM.$(elementId) : null };
    }

    function hasSelectableId(records, id) {
      return records.some((record) => String(record?.ID ?? "") === String(id));
    }

    function showEditFieldError(field, message) {
      const error = document.querySelector(`[data-purchasing-edit-error="${field}"]`);
      if (!error) { Components.toast(message, "error"); return; }
      DOM.text(error, message);
      error.classList.remove("hidden");
    }

    function clearEditFieldError(field) {
      const error = document.querySelector(`[data-purchasing-edit-error="${field}"]`);
      if (error) { DOM.text(error, ""); error.classList.add("hidden"); }
    }

    function clearAllEditFieldErrors() {
      document.querySelectorAll("[data-purchasing-edit-error]").forEach((error) => { DOM.text(error, ""); error.classList.add("hidden"); });
    }

    function setEditLoading(loading) {
      const save = DOM.$("btn-purchasing-edit-save");
      const cancel = document.querySelector('[data-purchasing-edit-action="cancel"]');
      const close = DOM.$("btn-modal-close");
      [save, cancel, close].forEach((button) => {
        if (!button) return;
        button.disabled = loading;
        button.classList.toggle("cursor-not-allowed", loading);
        button.classList.toggle("opacity-50", loading);
      });
      if (save) save.textContent = loading ? "Saving..." : "Save Changes";
    }

    function setEditRowLoading(id, loading) {
      document.querySelectorAll('[data-purchasing-action="edit"]').forEach((button) => {
        if (String(button.dataset.purchasingId) !== String(id)) return;
        button.disabled = loading;
        button.classList.toggle("opacity-50", loading);
        button.classList.toggle("cursor-not-allowed", loading);
      });
    }

    function showEditLoadError(message) {
      const readable = String(safeValue(message));
      Components.toast(readable, "error");
      editForm = null;
      Modal.body(Components.empty(escape(readable)));
      Modal.footer(renderEditFooter(true));
      bindEditModal();
    }

    function closeEdit() {
      if (editSubmitting) return;
      const pendingId = pendingEditId;
      editRequest += 1;
      resetEditState();
      if (pendingId !== null) setEditRowLoading(pendingId, false);
      Modal.close();
    }

    function resetEditState() {
      pendingEditId = null;
      editForm = null;
      editSuppliers = [];
      editProducts = [];
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(message) {
      Render.mount(
        "tbl-purchasing-body",

        `
        <tr>
          <td colspan="9">
            ${Components.empty(message)}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-purchasing-info",

        `${Format.number(total)} Purchasing`,
      );
    }

    //===========================================================================
    // Detail View
    //===========================================================================

    async function view(id) {
      if (Utils.isEmpty(id)) {
        Components.toast("Purchasing ID is unavailable.", "error");

        return;
      }

      const normalizedId = String(id);

      if (pendingDetailId === normalizedId) {
        return;
      }

      if (pendingDetailId !== null) {
        setViewLoading(pendingDetailId, false);
      }

      const request = ++detailRequest;

      pendingDetailId = normalizedId;
      setViewLoading(normalizedId, true);

      supplierNames = createNameMap(App.getPartners());
      productNames = createNameMap(App.getProducts());

      Modal.open({
        title: "Purchasing Detail",
        width: "lg",
        body: Components.loading("Loading purchasing detail..."),
        footer: renderDetailFooter(),
      });

      bindDetailFooter();

      try {
        const response = await Api.Purchasing.findById(normalizedId);

        if (request !== detailRequest) {
          return;
        }

        if (!isDetailResponse(response)) {
          showDetailError(
            response?.message || "Purchasing detail is unavailable.",
          );

          return;
        }

        Modal.body(renderDetail(response.data));
      } catch (error) {
        if (request !== detailRequest) {
          return;
        }

        showDetailError("Purchasing detail could not be loaded.");
      } finally {
        if (request === detailRequest) {
          pendingDetailId = null;
          setViewLoading(normalizedId, false);
        }
      }
    }

    function isDetailResponse(response) {
      return Boolean(
        response?.success &&
          response.data &&
          typeof response.data === "object" &&
          !Array.isArray(response.data),
      );
    }

    function renderDetail(purchase = {}) {
      const supplierId = purchase[FIELD.SUPPLIER_ID];

      const productId = purchase[FIELD.PRODUCT_ID];

      return `
        <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">
          ${detailField("Purchase ID", purchase[FIELD.ID])}
          ${detailField("Date", formatDate(purchase[FIELD.DATE]))}
          ${detailField("Supplier", resolveName(supplierNames, supplierId))}
          ${detailField("Supplier ID", supplierId)}
          ${detailField("Product", resolveName(productNames, productId))}
          ${detailField("Product ID", productId)}
          ${detailField("Qty", Format.number(purchase[FIELD.QTY]))}
          ${detailField("Unit Price", Format.currency(purchase[FIELD.PRICE]))}
          ${detailField("Total", Format.currency(purchase[FIELD.TOTAL]))}
          ${detailField("Status", Format.status(isActiveRow(purchase)))}
          ${detailField("Created At", formatDateTime(purchase[FIELD.CREATED_AT]))}
          ${detailField("Created By", purchase[FIELD.CREATED_BY])}
          ${detailField("Updated At", formatDateTime(purchase[FIELD.UPDATED_AT]))}
          ${detailField("Updated By", purchase[FIELD.UPDATED_BY])}
        </dl>
      `;
    }

    function detailField(label, value) {
      return `
        <div>
          <dt class="text-slate-500">${escape(label)}</dt>
          <dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd>
        </div>
      `;
    }

    function renderDetailFooter() {
      return `
        <button
          type="button"
          data-purchasing-detail-action="close"
          class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100"
        >
          Close
        </button>
      `;
    }

    function bindDetailFooter() {
      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.purchasingDetailBound) {
        footer.dataset.purchasingDetailBound = "true";
        footer.addEventListener("click", (event) => {
          const button = event.target.closest(
            "[data-purchasing-detail-action]",
          );

          if (button?.dataset.purchasingDetailAction === "close") {
            closeDetail();
          }
        });
      }

      const close = DOM.$("btn-modal-close");

      if (close) {
        close.onclick = closeDetail;
      }
    }

    function closeDetail() {
      const pendingId = pendingDetailId;

      detailRequest += 1;
      pendingDetailId = null;

      if (pendingId !== null) {
        setViewLoading(pendingId, false);
      }

      Modal.close();
    }

    function showDetailError(message) {
      const readable = safeValue(message);

      Components.toast(readable, "error");
      Modal.body(Components.empty(escape(readable)));
    }

    function setViewLoading(id, loading) {
      const buttons = document.querySelectorAll(
        '[data-purchasing-action="view"]',
      );

      buttons.forEach((button) => {
        if (String(button.dataset.purchasingId) !== String(id)) {
          return;
        }

        button.disabled = loading;
        button.classList.toggle("opacity-50", loading);
        button.classList.toggle("cursor-not-allowed", loading);
        button.title = loading ? "Loading..." : "View";
      });
    }

    //===========================================================================
    // Local Search
    //===========================================================================

    function renderVisibleRows() {
      const query = getSearchQuery();

      const visibleRows = query
        ? loadedRows.filter((purchase) => matchesSearch(purchase, query))
        : loadedRows;

      renderInfo(visibleRows.length);

      if (!visibleRows.length) {
        renderEmpty(
          loadedRows.length && query
            ? "No purchasing matches your search."
            : "No purchasing available.",
        );

        return;
      }

      Render.mount(
        "tbl-purchasing-body",

        visibleRows.map(renderRow).join(""),
      );
    }

    function getSearchQuery() {
      const input = DOM.$("inp-purchasing-search");

      return String(input?.value ?? "").trim().toLowerCase();
    }

    function matchesSearch(purchase, query) {
      const supplierId = purchase[FIELD.SUPPLIER_ID];

      const productId = purchase[FIELD.PRODUCT_ID];

      const values = [
        purchase[FIELD.ID],
        purchase[FIELD.DATE],
        Format.date(purchase[FIELD.DATE]),
        supplierId,
        resolveName(supplierNames, supplierId),
        productId,
        resolveName(productNames, productId),
        purchase[FIELD.QTY],
        Format.number(purchase[FIELD.QTY]),
        purchase[FIELD.PRICE],
        Format.currency(purchase[FIELD.PRICE]),
        purchase[FIELD.TOTAL],
        Format.currency(purchase[FIELD.TOTAL]),
        "Active",
      ];

      return values.some((value) =>
        String(value ?? "").toLowerCase().includes(query),
      );
    }

    //===========================================================================
    // Values
    //===========================================================================

    function resolveName(names, id) {
      return names.get(String(id ?? "")) || id;
    }

    function isActiveRow(purchase) {
      return (
        !toBoolean(purchase?.[FIELD.DELETED], false) &&
        toBoolean(purchase?.[FIELD.IS_ACTIVE], false)
      );
    }

    function toBoolean(value, fallback) {
      if (value === true || value === 1) {
        return true;
      }

      if (value === false || value === 0) {
        return false;
      }

      if (typeof value === "string") {
        const normalized = value.trim().toLowerCase();

        if (normalized === "true" || normalized === "1") {
          return true;
        }

        if (normalized === "false" || normalized === "0") {
          return false;
        }
      }

      return fallback;
    }

    function formatDate(value) {
      return isValidDate(value) ? Format.date(value) : "-";
    }

    function formatDateTime(value) {
      return isValidDate(value) ? Format.datetime(value) : "-";
    }

    function isValidDate(value) {
      return !Utils.isEmpty(value) && !isNaN(new Date(value).getTime());
    }

    function safeValue(value) {
      if (
        Utils.isEmpty(value) ||
        (typeof value === "string" && !value.trim()) ||
        typeof value === "object" ||
        typeof value === "function"
      ) {
        return "-";
      }

      return value;
    }

    function text(value) {
      return SharedPresenter.text(safeValue(value));
    }

    function escape(value) {
      return Utils.escapeHTML(String(value ?? ""));
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
    });
  })();
</script>
