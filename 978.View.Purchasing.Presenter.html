<script>
  /**
   * =============================================================================
   * FILE        : 978.View.Purchasing.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Purchasing Presenter
   * =============================================================================
   */

  const PurchasingPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      DATE: "Tanggal",

      SUPPLIER: "Supplier",

      PRODUCT: "Produk",

      QTY: "Qty",

      PRICE: "Harga",

      TOTAL: "Total",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(purchasing = []) {
      const list = Array.isArray(purchasing) ? purchasing : [];

      bindToolbar();

      renderInfo(list.length);

      if (!list.length) {
        renderEmpty();

        return;
      }

      Render.mount(
        "tbl-purchasing-body",

        list.map(renderRow).join(""),
      );
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const refresh = DOM.$("btn-purchasing-refresh");

      if (!refresh || refresh.dataset.purchasingRefreshBound) {
        return;
      }

      refresh.dataset.purchasingRefreshBound = "true";
      refresh.addEventListener("click", () => {
        clearSearch();
        App.refresh();
      });
    }

    function clearSearch() {
      const input = DOM.$("inp-purchasing-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(purchase = {}) {
      const id = purchase[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(
          SharedPresenter.text(id),

          "font-medium text-slate-800",
        ),

        Components.tableCell(Format.date(purchase[FIELD.DATE])),

        Components.tableCell(SharedPresenter.text(purchase[FIELD.SUPPLIER])),

        Components.tableCell(SharedPresenter.text(purchase[FIELD.PRODUCT])),

        Components.tableCell(
          Format.number(purchase[FIELD.QTY]),

          "text-right",
        ),

        Components.tableCell(
          Format.currency(purchase[FIELD.PRICE]),

          "text-right",
        ),

        Components.tableCell(
          Format.currency(purchase[FIELD.TOTAL]),

          "text-right",
        ),

        Components.tableCell(
          SharedPresenter.renderStatus(purchase[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(
          SharedPresenter.renderActions(id),

          "text-center",
        ),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty() {
      Render.mount(
        "tbl-purchasing-body",

        `
        <tr>
          <td colspan="9">
            ${Components.empty("No purchasing available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-purchasing-info",

        `${Format.number(total)} Purchasing`,
      );
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
    });
  })();
</script>
