<template id="topbar-template">
  <div class="flex items-center justify-between h-full px-6">
    <!-- Left -->

    <div>
      <h2 id="page-title" class="text-xl font-bold text-slate-800">
        Dashboard
      </h2>

      <p id="page-subtitle" class="text-sm text-slate-500">
        Welcome to IP-Starling
      </p>
    </div>

    <!-- Right -->

    <div class="flex items-center gap-3">
      <!-- Search -->

      <div class="relative">
        <i
          class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"
        ></i>

        <input
          id="global-search"
          type="text"
          placeholder="Search..."
          class="pl-10 pr-4 py-2 w-72 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Refresh -->

      <button
        id="btn-refresh"
        class="w-10 h-10 rounded-lg border border-slate-300 hover:bg-slate-100"
      >
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <!-- Notification -->

      <button
        id="btn-notification"
        class="relative w-10 h-10 rounded-lg border border-slate-300 hover:bg-slate-100"
      >
        <i class="fa-solid fa-bell"></i>

        <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-red-500">
        </span>
      </button>

      <!-- User -->

      <div class="flex items-center gap-3 pl-3 border-l border-slate-300">
        <div
          class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold"
        >
          A
        </div>

        <div>
          <div id="current-user" class="text-sm font-semibold text-slate-800">
            Administrator
          </div>

          <div class="text-xs text-slate-500">System User</div>
        </div>
      </div>
    </div>
  </div>
</template>
