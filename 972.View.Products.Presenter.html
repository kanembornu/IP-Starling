<script>
  /**
   * =============================================================================
   * FILE        : 972.View.Products.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Products Presenter
   * =============================================================================
   */

  const ProductsPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      CATEGORY: "Kategori",

      UNIT: "Satuan",

      PRICE: "Harga",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(products = []) {
      const list = Array.isArray(products) ? products : [];

      bindToolbar();

      renderInfo(list.length);

      if (!list.length) {
        renderEmpty();

        return;
      }

      Render.mount(
        "tbl-products-body",

        list.map(renderRow).join(""),
      );
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const refresh = DOM.$("btn-product-refresh");

      if (!refresh || refresh.dataset.productRefreshBound) {
        return;
      }

      refresh.dataset.productRefreshBound = "true";
      refresh.addEventListener("click", () => {
        clearSearch();
        App.refresh();
      });
    }

    function clearSearch() {
      const input = DOM.$("inp-product-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(product = {}) {
      const id = product[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(product[FIELD.NAME])),

        Components.tableCell(text(product[FIELD.CATEGORY])),

        Components.tableCell(text(product[FIELD.UNIT])),

        Components.tableCell(
          Format.currency(product[FIELD.PRICE]),

          "text-right",
        ),

        Components.tableCell(
          renderStatus(product[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty() {
      Render.mount(
        "tbl-products-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty("No products available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-product-info",

        `${Format.number(total)} Product`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id) {
      return `
        <div class="flex items-center justify-center gap-2">
          ${actionButton("Edit", "fa-pen", "blue", id)}

          ${actionButton("Delete", "fa-trash", "red", id)}
        </div>
      `;
    }

    function actionButton(
      label,

      icon,

      color,

      id,
    ) {
      const palette = {
        blue: "bg-blue-100 hover:bg-blue-200 text-blue-600",

        red: "bg-red-100 hover:bg-red-200 text-red-600",
      };

      return `
    <button
      type="button"

      data-action="${label.toLowerCase()}"

      data-id="${text(id)}"

      title="${label}"

      class="
        inline-flex
        items-center
        gap-2
        px-3
        py-2
        rounded-lg
        transition
        ${palette[color]}
      "
    >
      ${Components.icon(icon)}

      <span>${label}</span>
    </button>
  `;
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
    });
  })();
</script>
