<script>
  /**
   * =============================================================================
   * FILE        : 972.View.Products.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Products Presenter
   * =============================================================================
   */

  const ProductsPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      CATEGORY: "Kategori",

      UNIT: "Satuan",

      PRICE: "Harga",

      IS_ACTIVE: "IsActive",

      IS_DELETED: "Deleted",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(products = [], mode = "active", restoreBusyId = null) {
      const source = Array.isArray(products) ? products : [];
      const list = App.paginateRows("products", mode, source, "product-pagination", "lbl-product-info", mode === "deleted" ? "produk terhapus" : "produk", () => render(source, mode, restoreBusyId));

      renderMode(mode);

      if (!list.length) {
        renderEmpty(mode);

        return;
      }

      Render.mount(
        "tbl-products-body",

        list.map((product) => renderRow(product, mode, restoreBusyId)).join(""),
      );
    }

    function renderLoading(mode = "active") {
      renderMode(mode);
      Render.mount("tbl-products-body", `<tr><td colspan="7">${Components.loading({ message: mode === "deleted" ? "Loading deleted products..." : "Loading products..." })}</td></tr>`);
    }

    function renderError(mode = "active") {
      renderMode(mode);
      Render.mount("tbl-products-body", `<tr><td colspan="7">${Components.empty(mode === "deleted" ? "Deleted products could not be loaded." : "Products could not be loaded.")}</td></tr>`);
    }

    function renderMode(mode) {
      document.querySelectorAll("[data-product-mode]").forEach((button) => {
        const active = button.dataset.productMode === mode;
        button.classList.toggle("bg-blue-600", active); button.classList.toggle("text-white", active);
      });
      const add = DOM.$("btn-product-add"); if (add) add.classList.toggle("hidden", mode === "deleted");
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-product-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(product = {}, mode = "active", restoreBusyId = null) {
      const id = product[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(product[FIELD.NAME])),

        Components.tableCell(text(product[FIELD.CATEGORY])),

        Components.tableCell(text(product[FIELD.UNIT])),

        Components.tableCell(
          Format.currency(product[FIELD.PRICE]),

          "text-right",
        ),

        Components.tableCell(
          renderStatus(product[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id, mode, restoreBusyId), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(mode = "active") {
      Render.mount(
        "tbl-products-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(mode === "deleted" ? "No deleted products." : "No products available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-product-info",

        `${Format.number(total)} Product`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id, mode, restoreBusyId) {
      if (mode === "deleted") {
        const pending = String(restoreBusyId || "") === String(id);
        return `<div class="flex items-center justify-center">${actionButton(pending ? "Restoring..." : "Restore", "fa-rotate-left", "green", id, "restore", pending)}</div>`;
      }
      return `
        <div class="flex items-center justify-center gap-2">
          ${actionButton("Edit", "fa-pen", "blue", id)}

          ${actionButton("Delete", "fa-trash", "red", id)}
        </div>
      `;
    }

    function actionButton(
      label,

      icon,

      color,

      id,

      action = label.toLowerCase(),

      disabled = false,
    ) {
      const palette = {
        blue: "bg-blue-100 hover:bg-blue-200 text-blue-600",

        red: "bg-red-100 hover:bg-red-200 text-red-600",

        green: "bg-green-100 hover:bg-green-200 text-green-700",
      };

      return `
    <button
      type="button"

      data-action="${action}"

      data-id="${text(id)}"

      title="${label}"

      ${disabled ? "disabled aria-busy=\"true\"" : ""}

      class="
        inline-flex
        items-center
        gap-2
        px-3
        py-2
        rounded-lg
        transition
        ${palette[color]}
      "
    >
      ${Components.icon(icon)}

      <span>${label}</span>
    </button>
  `;
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      renderLoading,
      renderError,
      clearSearch,
    });
  })();
</script>
