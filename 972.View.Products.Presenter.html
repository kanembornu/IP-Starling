<script>
  /**
   * =============================================================================
   * FILE        : 972.View.Products.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Products Presenter
   * =============================================================================
   */

  const ProductsPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      CATEGORY: "Kategori",

      UNIT: "Satuan",

      PRICE: "Harga",

      IS_ACTIVE: "IsActive",

      IS_DELETED: "Deleted",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(view = {}) {
      const list = Array.isArray(view.rows) ? view.rows : [];
      const mode = view.mode === "deleted" ? "deleted" : "active";
      const restoreBusyId = view.restoreBusyId || null;

      renderMode(mode);
      renderPagination(view.pagination, mode);

      if (!list.length) {
        renderEmpty(mode);

        return;
      }

      Render.mount(
        "tbl-products-body",

        list.map((product) => renderRow(product, mode, restoreBusyId)).join(""),
      );
    }

    function renderPagination(meta = {}, mode = "active") {
      const pageSize = Number(meta.pageSize) || 15;
      const totalRows = Number(meta.totalRows) || 0;
      const totalPages = Number(meta.totalPages) || 1;
      const page = Number(meta.page) || 1;
      const rangeStart = Number(meta.rangeStart) || 0;
      const rangeEnd = Number(meta.rangeEnd) || 0;
      const label = mode === "deleted" ? "produk terhapus" : "produk";
      Render.mount("lbl-product-info", Pagination.summary({ totalRows, rangeStart, rangeEnd }, label));
      Render.mount("product-pagination", paginationMarkup({ module: "products", mode, page, pageSize, totalRows, totalPages, hasPrevious: Boolean(meta.hasPrevious), hasNext: Boolean(meta.hasNext) }));
    }

    function paginationMarkup(config) { return Pagination.controls(config); }

    function renderFormFooter(kind = "create", submitting = false) {
      return Components.formFooter({ cancelAttribute: 'data-product-form-action="cancel"', saveAttribute: 'data-product-form-action="save"', saveLabel: kind === "create" ? "Create Product" : "Save Changes", loadingLabel: kind === "create" ? "Creating Product..." : "Saving Changes...", loading: submitting });
    }

    function renderLoading(mode = "active") {
      renderMode(mode);
      const label = mode === "deleted" ? "Deleted products" : "Products";
      Render.mount("tbl-products-body", `<tr><td colspan="7">${Components.loading(`Loading ${label.toLowerCase()}...`)}</td></tr>`);
      Render.mount("lbl-product-info", `Loading ${label.toLowerCase()}...`);
      Render.mount("product-pagination", "");
    }

    function renderError(mode = "active") {
      renderMode(mode);
      const label = mode === "deleted" ? "Deleted products" : "Products";
      Render.mount("tbl-products-body", `<tr><td colspan="7">${Components.error(`${label} could not be loaded. Use Refresh to try again.`)}</td></tr>`);
      Render.mount("lbl-product-info", "Product count unavailable");
      Render.mount("product-pagination", "");
    }

    function renderMode(mode) {
      document.querySelectorAll("[data-product-mode]").forEach((button) => {
        const active = button.dataset.productMode === mode;
        button.classList.toggle("bg-blue-600", active); button.classList.toggle("text-white", active);
      });
      const add = DOM.$("btn-product-add"); if (add) add.classList.toggle("hidden", mode === "deleted");
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-product-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(product = {}, mode = "active", restoreBusyId = null) {
      const id = product[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(product[FIELD.NAME])),

        Components.tableCell(text(product[FIELD.CATEGORY])),

        Components.tableCell(text(product[FIELD.UNIT])),

        Components.tableCell(
          Format.currency(product[FIELD.PRICE]),

          "text-right",
        ),

        Components.tableCell(
          renderStatus(product[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id, mode, restoreBusyId), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(mode = "active") {
      Render.mount(
        "tbl-products-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(mode === "deleted" ? "No deleted products available." : "No products available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id, mode, restoreBusyId) {
      if (mode === "deleted") {
        const pending = String(restoreBusyId || "") === String(id);
        return Components.tableActions(actionButton(pending ? "Restoring..." : "Restore", "fa-rotate-left", "green", id, "restore", pending));
      }
      return Components.tableActions(`${actionButton("Edit", "fa-pen", "blue", id)}${actionButton("Delete", "fa-trash-can", "red", id)}`);
    }

    function actionButton(
      label,

      icon,

      color,

      id,

      action = label.toLowerCase(),

      disabled = false,
    ) {
      return Components.tableAction({ label, icon, tone: color, attributes: `data-action="${action}" data-id="${text(id)}"`, busy: disabled });
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      renderLoading,
      renderError,
      clearSearch,
      renderFormFooter,
    });
  })();
</script>
