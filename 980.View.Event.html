<script>
  /**
   * =============================================================================
   * FILE        : 980.View.Event.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Event Manager
   * =============================================================================
   */

  const Events = (() => {
    //===========================================================================
    // Sidebar
    //===========================================================================

    function bindSidebar() {
      document.addEventListener(
        "click",

        (event) => {
          const button = event.target.closest(".menu-item");

          if (!button) {
            return;
          }

          event.preventDefault();

          const page = button.dataset.page;

          if (!page) {
            return;
          }

          App.navigate(page);
        },
      );
    }

    //===========================================================================
    // Topbar
    //===========================================================================

    function bindTopbar() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-refresh")) {
            App.refresh();

            return;
          }

          if (event.target.closest("#btn-notification")) {
            console.log("Notification");
          }
        },
      );
    }

    //===========================================================================
    // Search
    //===========================================================================

    function bindGlobal() {
      document.addEventListener(
        "input",

        Utils.debounce((event) => {
          const input = event.target;

          if (!input) {
            return;
          }

          if (!isSearchInput(input)) {
            return;
          }

          App.search(
            input.dataset.module || App.currentPage(),

            input.value,
          );
        }, 300),
      );
    }

    function isSearchInput(input) {
      return input.id === "global-search" || input.dataset.module !== undefined;
    }

    //===========================================================================
    // Product Buttons
    //===========================================================================

    document.addEventListener(
      "click",

      (event) => {
        const edit = event.target.closest(".btn-edit");

        if (edit) {
          App.editProduct(edit.dataset.id);

          return;
        }

        const del = event.target.closest(".btn-delete");

        if (del) {
          App.deleteProduct(del.dataset.id);

          return;
        }
      },
    );

    //===========================================================================
    // CRUD
    //===========================================================================

    function bindCrud() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-product-add")) {
            App.openCreateProduct();

            return;
          }

          if (event.target.closest("#btn-partner-add")) {
            App.openCreatePartner();

            return;
          }
        },
      );
    }

    //===========================================================================
    // Keyboard Shortcut
    //===========================================================================

    function bindKeyboard() {
      document.addEventListener(
        "keydown",

        (event) => {
          if (event.key === "F5") {
            event.preventDefault();

            App.refresh();

            return;
          }

          if (event.ctrlKey && event.key.toLowerCase() === "f") {
            event.preventDefault();

            const search = DOM.$("global-search");

            if (search) {
              search.focus();

              search.select();
            }
          }
        },
      );
    }

    //===========================================================================
    // Window Event
    //===========================================================================

    function bindWindow() {
      window.addEventListener(
        "resize",

        Utils.throttle(() => {
          console.log("Window resized");
        }, 250),
      );
    }

    //===========================================================================
    // Reinitialize
    //===========================================================================

    function reload() {
      // Event Delegation
      // Tidak perlu bind ulang.
    }

    //===========================================================================
    // Initialize
    //===========================================================================

    function init() {
      bindSidebar();

      bindTopbar();

      bindGlobal();

      bindCrud();

      bindKeyboard();

      bindWindow();

      bindPurchasing();

      bindReturns();

      bindExpenses();

      document.addEventListener(
        "click",

        handleActionClick,
      );
    }

    //===========================================================================
    // Purchasing intent delegation
    //===========================================================================

    function bindPurchasing() {
      document.addEventListener("click", handlePurchasingClick);
      document.addEventListener("input", handlePurchasingInput);
      document.addEventListener("change", handlePurchasingInput);
      document.addEventListener("submit", handlePurchasingSubmit);
    }

    //===========================================================================
    // Expense intent delegation
    //===========================================================================

    function bindExpenses() {
      document.addEventListener("click", handleExpenseClick);
      document.addEventListener("input", handleExpenseInput);
      document.addEventListener("change", handleExpenseChange);
      document.addEventListener("submit", handleExpenseSubmit);
    }

    function handleExpenseClick(event) {
      const page = event.target.closest("[data-pagination-action][data-pagination-module='expenses']");
      if (page) { if (!page.disabled && page.getAttribute("aria-disabled") !== "true") App.changeExpensePage(page.dataset.paginationAction); return; }
      const mode = event.target.closest("[data-expense-mode]");
      if (mode) return App.setExpenseMode(mode.dataset.expenseMode);
      if (event.target.closest("#btn-expense-add")) return App.openCreateExpense();
      if (event.target.closest("#btn-expense-refresh")) return App.refreshExpenses();
      const action = event.target.closest("[data-expense-action]");
      if (action) {
        if (action.disabled || action.getAttribute("aria-disabled") === "true") return;
        const id = action.dataset.expenseId;
        if (action.dataset.expenseAction === "view") return App.viewExpense(id);
        if (action.dataset.expenseAction === "edit") return App.openEditExpense(id);
        if (action.dataset.expenseAction === "delete") return App.deleteExpense(id);
        if (action.dataset.expenseAction === "restore") return App.restoreExpense(id);
      }
      const create = event.target.closest("[data-expense-create-action]");
      if (create?.dataset.expenseCreateAction === "cancel") return App.closeExpenseModal();
      const edit = event.target.closest("[data-expense-edit-action]");
      if (edit?.dataset.expenseEditAction === "cancel") return App.closeExpenseModal();
      if (event.target.closest("[data-expense-detail-action='close']")) return App.closeExpenseModal();
      if (event.target.closest("#btn-modal-close") && document.querySelector("[data-expense-create-field], [data-expense-edit-field], [data-expense-detail-action]")) return App.closeExpenseModal();
    }

    function handleExpenseInput(event) {
      const create = event.target?.dataset?.expenseCreateField;
      if (create) return App.updateExpenseForm("create", create, event.target.value);
      const edit = event.target?.dataset?.expenseEditField;
      if (edit) return App.updateExpenseForm("edit", edit, event.target.value);
    }

    function handleExpenseChange(event) {
      if (event.target?.dataset?.paginationSize === "expenses") return App.changeExpensePageSize(event.target.value);
    }

    function handleExpenseSubmit(event) {
      if (event.target?.id === "expense-create-form") { event.preventDefault(); App.submitExpenseForm("create"); }
      if (event.target?.id === "expense-edit-form") { event.preventDefault(); App.submitExpenseForm("edit"); }
    }

    //===========================================================================
    // Return intent delegation
    //===========================================================================

    function bindReturns() {
      document.addEventListener("click", handleReturnClick);
      document.addEventListener("input", handleReturnInput);
      document.addEventListener("change", handleReturnInput);
    }

    function handleReturnClick(event) {
      const page=event.target.closest("[data-pagination-action][data-pagination-module='returns']");
      if(page){if(!page.disabled)App.changeReturnPage(page.dataset.paginationAction);return;}
      const mode=event.target.closest("[data-return-mode]");if(mode)return App.setReturnMode(mode.dataset.returnMode);
      if(event.target.closest("#btn-return-add"))return App.openCreateReturn();
      if(event.target.closest("#btn-return-refresh"))return App.refreshReturns();
      const action=event.target.closest("[data-return-action]");
      if(action){if(action.disabled||action.getAttribute("aria-disabled")==="true")return;const id=action.dataset.returnId;if(action.dataset.returnAction==="view")return App.viewReturn(id);if(action.dataset.returnAction==="edit")return App.openEditReturn(id);if(action.dataset.returnAction==="delete")return App.deleteReturn(id);if(action.dataset.returnAction==="restore")return App.restoreReturn(id);}
      const create=event.target.closest("[data-return-create-action]");if(create?.dataset.returnCreateAction==="cancel")return App.closeReturnModal();if(create?.dataset.returnCreateAction==="save")return App.submitReturnForm("create");
      const edit=event.target.closest("[data-return-edit-action]");if(edit?.dataset.returnEditAction==="cancel")return App.closeReturnModal();if(edit?.dataset.returnEditAction==="save")return App.submitReturnForm("edit");
      if(event.target.closest("[data-return-detail-action='close']"))return App.closeReturnModal();
      if(event.target.closest("#btn-modal-close")&&document.querySelector("[data-return-create-field], [data-return-edit-field], [data-return-detail-action]"))App.closeReturnModal();
    }

    function handleReturnInput(event) {
      if(event.type==="change"&&event.target?.dataset?.paginationSize==="returns")return App.changeReturnPageSize(event.target.value);
      if(event.target?.id==="inp-return-search")return App.searchReturns(event.target.value);
      const create=event.target?.dataset?.returnCreateField;if(create)return App.updateReturnForm("create",create,event.target.value);
      const edit=event.target?.dataset?.returnEditField;if(edit)return App.updateReturnForm("edit",edit,event.target.value);
    }

    function handlePurchasingClick(event) {
      const page = event.target.closest("[data-pagination-action][data-pagination-module='purchasing']");
      if (page) { if (!page.disabled) App.changePurchasingPage(page.dataset.paginationAction); return; }
      const mode = event.target.closest("[data-purchasing-mode]");
      if (mode) return App.setPurchasingMode(mode.dataset.purchasingMode);
      if (event.target.closest("#btn-purchasing-add")) return App.openCreatePurchasing();
      if (event.target.closest("#btn-purchasing-refresh")) return App.refreshPurchasing();
      const actionButton = event.target.closest("[data-purchasing-action]");
      if (actionButton) {
        if (actionButton.disabled || actionButton.getAttribute("aria-disabled") === "true") return;
        const id = actionButton.dataset.purchasingId;
        if (actionButton.dataset.purchasingAction === "view") return App.viewPurchasing(id);
        if (actionButton.dataset.purchasingAction === "edit") return App.openEditPurchasing(id);
        if (actionButton.dataset.purchasingAction === "delete") return App.deletePurchasing(id);
        if (actionButton.dataset.purchasingAction === "restore") return App.restorePurchasing(id);
      }
      const create = event.target.closest("[data-purchasing-create-action]");
      if (create?.dataset.purchasingCreateAction === "cancel") return App.closePurchasingModal();
      if (create?.dataset.purchasingCreateAction === "save") return App.submitPurchasingForm("create");
      const edit = event.target.closest("[data-purchasing-edit-action]");
      if (edit?.dataset.purchasingEditAction === "cancel") return App.closePurchasingModal();
      if (edit?.dataset.purchasingEditAction === "save") return App.submitPurchasingForm("edit");
      if (event.target.closest("[data-purchasing-detail-action='close']")) return App.closePurchasingModal();
      if (event.target.closest("#btn-modal-close") && document.querySelector("[data-purchasing-create-field], [data-purchasing-edit-field], [data-purchasing-detail-action]")) App.closePurchasingModal();
    }

    function handlePurchasingInput(event) {
      if (event.type === "change" && event.target?.dataset?.paginationSize === "purchasing") return App.changePurchasingPageSize(event.target.value);
      if (event.target?.id === "inp-purchasing-search") return App.searchPurchasing(event.target.value);
      const createField = event.target?.dataset?.purchasingCreateField;
      if (createField) return App.updatePurchasingForm("create", createField, event.target.value);
      const editField = event.target?.dataset?.purchasingEditField;
      if (editField) return App.updatePurchasingForm("edit", editField, event.target.value);
    }

    function handlePurchasingSubmit(event) {
      if (event.target?.id === "purchasing-create-form") { event.preventDefault(); App.submitPurchasingForm("create"); }
      if (event.target?.id === "purchasing-edit-form") { event.preventDefault(); App.submitPurchasingForm("edit"); }
    }

    //===========================================================================
    // Handle Action
    //===========================================================================

    function handleActionClick(event) {
      const button = event.target.closest("[data-action]");

      if (!button) return;

      const action = button.dataset.action;

      const id = button.dataset.id;

      const page = App.currentPage();

      switch (page) {
        case "products":
          dispatchProduct(action, id);

          break;

        case "partners":
          dispatchPartner(action, id);

          break;
      }
    }

    function dispatchProduct(action, id) {
      switch (action) {
        case "edit":
          App.openEditProduct(id);

          break;

        case "delete":
          App.deleteProduct(id);

          break;

        case "restore":
          App.restoreProduct(id);

          break;
      }
    }

    function dispatchPartner(action, id) {
      switch (action) {
        case "edit":
          App.openEditPartner(id);

          break;

        case "delete":
          App.deletePartner(id);

          break;

        case "restore":
          App.restorePartner(id);

          break;
      }
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      reload,
    });
  })();
</script>
