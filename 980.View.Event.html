<script>
  /**
   * =============================================================================
   * FILE        : 980.View.Event.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Event Manager
   * =============================================================================
   */

  const Events = (() => {
    //===========================================================================
    // Sidebar
    //===========================================================================

    function bindSidebar() {
      document.addEventListener(
        "click",

        (event) => {
          const button = event.target.closest(".menu-item");

          if (!button) {
            return;
          }

          event.preventDefault();

          const page = button.dataset.page;

          if (!page) {
            return;
          }

          App.navigate(page);
        },
      );
    }

    //===========================================================================
    // Topbar
    //===========================================================================

    function bindTopbar() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-refresh")) {
            App.refresh();

            return;
          }

          if (event.target.closest("#btn-notification")) {
            console.log("Notification");
          }
        },
      );
    }

    //===========================================================================
    // Search
    //===========================================================================

    function bindGlobal() {
      document.addEventListener(
        "input",

        Utils.debounce((event) => {
          const input = event.target;

          if (!input) {
            return;
          }

          if (!isSearchInput(input)) {
            return;
          }

          App.search(
            input.dataset.module || App.currentPage(),

            input.value,
          );
        }, 300),
      );
    }

    function isSearchInput(input) {
      return input.id === "global-search" || input.dataset.module !== undefined;
    }

    //===========================================================================
    // Product Buttons
    //===========================================================================

    document.addEventListener(
      "click",

      (event) => {
        const edit = event.target.closest(".btn-edit");

        if (edit) {
          App.editProduct(edit.dataset.id);

          return;
        }

        const del = event.target.closest(".btn-delete");

        if (del) {
          App.deleteProduct(del.dataset.id);

          return;
        }
      },
    );

    //===========================================================================
    // CRUD
    //===========================================================================

    function bindCrud() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-product-add")) {
            App.openCreateProduct();

            return;
          }

          if (event.target.closest("#btn-partner-add")) {
            App.openCreatePartner();

            return;
          }
        },
      );
    }

    //===========================================================================
    // Keyboard Shortcut
    //===========================================================================

    function bindKeyboard() {
      document.addEventListener(
        "keydown",

        (event) => {
          if (event.key === "F5") {
            event.preventDefault();

            App.refresh();

            return;
          }

          if (event.ctrlKey && event.key.toLowerCase() === "f") {
            event.preventDefault();

            const search = DOM.$("global-search");

            if (search) {
              search.focus();

              search.select();
            }
          }
        },
      );
    }

    //===========================================================================
    // Window Event
    //===========================================================================

    function bindWindow() {
      window.addEventListener(
        "resize",

        Utils.throttle(() => {
          console.log("Window resized");
        }, 250),
      );
    }

    //===========================================================================
    // Reinitialize
    //===========================================================================

    function reload() {
      // Event Delegation
      // Tidak perlu bind ulang.
    }

    //===========================================================================
    // Initialize
    //===========================================================================

    function init() {
      bindSidebar();

      bindTopbar();

      bindGlobal();

      bindCrud();

      bindKeyboard();

      bindWindow();

      bindPurchasing();

      document.addEventListener(
        "click",

        handleActionClick,
      );
    }

    //===========================================================================
    // Purchasing intent delegation
    //===========================================================================

    function bindPurchasing() {
      document.addEventListener("click", handlePurchasingClick);
      document.addEventListener("input", handlePurchasingInput);
      document.addEventListener("change", handlePurchasingInput);
      document.addEventListener("submit", handlePurchasingSubmit);
    }

    function handlePurchasingClick(event) {
      const page = event.target.closest("[data-pagination-action][data-pagination-module='purchasing']");
      if (page) { if (!page.disabled) App.changePurchasingPage(page.dataset.paginationAction); return; }
      const mode = event.target.closest("[data-purchasing-mode]");
      if (mode) return App.setPurchasingMode(mode.dataset.purchasingMode);
      if (event.target.closest("#btn-purchasing-add")) return App.openCreatePurchasing();
      if (event.target.closest("#btn-purchasing-refresh")) return App.refreshPurchasing();
      const actionButton = event.target.closest("[data-purchasing-action]");
      if (actionButton) {
        if (actionButton.disabled || actionButton.getAttribute("aria-disabled") === "true") return;
        const id = actionButton.dataset.purchasingId;
        if (actionButton.dataset.purchasingAction === "view") return App.viewPurchasing(id);
        if (actionButton.dataset.purchasingAction === "edit") return App.openEditPurchasing(id);
        if (actionButton.dataset.purchasingAction === "delete") return App.deletePurchasing(id);
        if (actionButton.dataset.purchasingAction === "restore") return App.restorePurchasing(id);
      }
      const create = event.target.closest("[data-purchasing-create-action]");
      if (create?.dataset.purchasingCreateAction === "cancel") return App.closePurchasingModal();
      if (create?.dataset.purchasingCreateAction === "save") return App.submitPurchasingForm("create");
      const edit = event.target.closest("[data-purchasing-edit-action]");
      if (edit?.dataset.purchasingEditAction === "cancel") return App.closePurchasingModal();
      if (edit?.dataset.purchasingEditAction === "save") return App.submitPurchasingForm("edit");
      if (event.target.closest("[data-purchasing-detail-action='close']")) return App.closePurchasingModal();
      if (event.target.closest("#btn-modal-close") && document.querySelector("[data-purchasing-create-field], [data-purchasing-edit-field], [data-purchasing-detail-action]")) App.closePurchasingModal();
    }

    function handlePurchasingInput(event) {
      if (event.type === "change" && event.target?.dataset?.paginationSize === "purchasing") return App.changePurchasingPageSize(event.target.value);
      if (event.target?.id === "inp-purchasing-search") return App.searchPurchasing(event.target.value);
      const createField = event.target?.dataset?.purchasingCreateField;
      if (createField) return App.updatePurchasingForm("create", createField, event.target.value);
      const editField = event.target?.dataset?.purchasingEditField;
      if (editField) return App.updatePurchasingForm("edit", editField, event.target.value);
    }

    function handlePurchasingSubmit(event) {
      if (event.target?.id === "purchasing-create-form") { event.preventDefault(); App.submitPurchasingForm("create"); }
      if (event.target?.id === "purchasing-edit-form") { event.preventDefault(); App.submitPurchasingForm("edit"); }
    }

    //===========================================================================
    // Handle Action
    //===========================================================================

    function handleActionClick(event) {
      const button = event.target.closest("[data-action]");

      if (!button) return;

      const action = button.dataset.action;

      const id = button.dataset.id;

      const page = App.currentPage();

      switch (page) {
        case "products":
          dispatchProduct(action, id);

          break;

        case "partners":
          dispatchPartner(action, id);

          break;
      }
    }

    function dispatchProduct(action, id) {
      switch (action) {
        case "edit":
          App.openEditProduct(id);

          break;

        case "delete":
          App.deleteProduct(id);

          break;

        case "restore":
          App.restoreProduct(id);

          break;
      }
    }

    function dispatchPartner(action, id) {
      switch (action) {
        case "edit":
          App.openEditPartner(id);

          break;

        case "delete":
          App.deletePartner(id);

          break;

        case "restore":
          App.restorePartner(id);

          break;
      }
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      reload,
    });
  })();
</script>
