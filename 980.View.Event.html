<script>
  /**
   * =============================================================================
   * FILE        : 980.View.Event.html
   * VERSION     : 2.0.0
   * DESCRIPTION : Event Manager
   * =============================================================================
   */

  const Events = (() => {
    //===========================================================================
    // Sidebar
    //===========================================================================

    function bindSidebar() {
      document.addEventListener(
        "click",

        (event) => {
          const button = event.target.closest(".menu-item");

          if (!button) {
            return;
          }

          event.preventDefault();

          const page = button.dataset.page;

          if (!page) {
            return;
          }

          App.navigate(page);
        },
      );
    }

    //===========================================================================
    // Topbar
    //===========================================================================

    function bindTopbar() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-refresh")) {
            App.refresh();

            return;
          }

          if (event.target.closest("#btn-notification")) {
            console.log("Notification");
          }
        },
      );
    }

    //===========================================================================
    // Search
    //===========================================================================

    function bindGlobal() {
      document.addEventListener(
        "input",

        Utils.debounce((event) => {
          const input = event.target;

          if (!input) {
            return;
          }

          if (!isSearchInput(input)) {
            return;
          }

          App.search(
            input.dataset.module || App.currentPage(),

            input.value,
          );
        }, 300),
      );
    }

    function isSearchInput(input) {
      return input.id === "global-search" || input.dataset.module !== undefined;
    }

    //===========================================================================
    // Product Buttons
    //===========================================================================

    document.addEventListener(
      "click",

      (event) => {
        const edit = event.target.closest(".btn-edit");

        if (edit) {
          App.editProduct(edit.dataset.id);

          return;
        }

        const del = event.target.closest(".btn-delete");

        if (del) {
          App.deleteProduct(del.dataset.id);

          return;
        }
      },
    );

    //===========================================================================
    // Table Actions
    //===========================================================================

    function bindTableActions() {
      document.addEventListener(
        "click",

        (event) => {
          const restore = event.target.closest(".btn-restore");

          if (restore) {
            const id = restore.dataset.id;

            const page = App.currentPage();

            dispatchRestore(page, id);

            return;
          }
        },
      );
    }

    //===========================================================================
    // CRUD
    //===========================================================================

    function bindCrud() {
      document.addEventListener(
        "click",

        (event) => {
          if (event.target.closest("#btn-product-add")) {
            App.openCreateProduct();

            return;
          }
        },
      );
    }

    //===========================================================================
    // Restore Dispatcher
    //===========================================================================

    function dispatchRestore(page, id) {
      switch (page) {
        case "products":
          App.restoreProduct(id);

          break;

        case "partners":
          App.restorePartner(id);

          break;

        case "pickups":
          App.restorePickup(id);

          break;

        case "returns":
          App.restoreReturn(id);

          break;

        case "purchasing":
          App.restorePurchasing(id);

          break;

        case "expenses":
          App.restoreExpense(id);

          break;
      }
    }

    //===========================================================================
    // Keyboard Shortcut
    //===========================================================================

    function bindKeyboard() {
      document.addEventListener(
        "keydown",

        (event) => {
          if (event.key === "F5") {
            event.preventDefault();

            App.refresh();

            return;
          }

          if (event.ctrlKey && event.key.toLowerCase() === "f") {
            event.preventDefault();

            const search = DOM.$("global-search");

            if (search) {
              search.focus();

              search.select();
            }
          }
        },
      );
    }

    //===========================================================================
    // Window Event
    //===========================================================================

    function bindWindow() {
      window.addEventListener(
        "resize",

        Utils.throttle(() => {
          console.log("Window resized");
        }, 250),
      );
    }

    //===========================================================================
    // Reinitialize
    //===========================================================================

    function reload() {
      // Event Delegation
      // Tidak perlu bind ulang.
    }

    //===========================================================================
    // Initialize
    //===========================================================================

    function init() {
      bindSidebar();

      bindTopbar();

      bindGlobal();

      bindTableActions();

      bindCrud();

      bindKeyboard();

      bindWindow();

      document.addEventListener(
        "click",

        handleActionClick,
      );
    }

    //===========================================================================
    // Handle Action
    //===========================================================================

    function handleActionClick(event) {
      const button = event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      const action = button.dataset.action;

      const id = button.dataset.id;

      switch (action) {
        case "edit":
          App.openEditProduct(id);

          break;

        case "delete":
          console.log("DELETE CLICK", id);
          App.deleteProduct(id);

          break;
      }
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      reload,
    });
  })();
</script>
