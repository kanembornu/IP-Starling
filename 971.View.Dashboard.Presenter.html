<script>
  const DashboardPresenter = (() => {
    let trendChart = null;
    let breakdownChart = null;
    const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function destroyCharts() {
      if (trendChart) trendChart.destroy();
      if (breakdownChart) breakdownChart.destroy();
      trendChart = null;
      breakdownChart = null;
    }

    function render(data) {
      if (!data) return renderError("Dashboard data unavailable.");
      renderKPI(data.summary || {});
      renderAvailability(data.availability || {});
      renderActivities(data.recentActivities || []);
      renderRange(data.range || {});
      renderCharts(data);
    }

    function renderError(message = "Dashboard data unavailable. Refresh to retry.") {
      destroyCharts();
      Render.mount("dashboard-kpi", Components.empty(message));
      Render.mount("dashboard-statistics", Components.empty("Availability unavailable."));
      Render.mount("dashboard-activities", Components.empty("Recent activities unavailable."));
    }

    function renderRangeError(response) {
      const rangeError = Array.isArray(response?.errors) && response.errors.some((item) =>
        ["INVALID_PRESET", "INVALID_DATE", "START_AFTER_END", "RANGE_TOO_LARGE"].includes(item.code));
      if (!rangeError) return renderError(response?.message);
      const error = DOM.$("dashboard-range-error");
      if (error) { DOM.text(error, response.message); error.classList.remove("hidden"); }
    }

    function renderKPI(summary) {
      const cards = [
        { title: "Purchasing Value", value: Format.currency(summary.purchasingValue), icon: "fa-cart-shopping", color: "amber" },
        { title: "Expense", value: Format.currency(summary.expenseValue), icon: "fa-wallet", color: "red" },
        { title: "Purchasing Records", value: summary.purchasingCount || 0, icon: "fa-receipt", color: "blue" },
        { title: "Expense Records", value: summary.expenseCount || 0, icon: "fa-file-invoice-dollar", color: "green" },
      ];
      Render.mount("dashboard-kpi", cards.map(Components.stat).join(""));
    }

    function renderAvailability(availability) {
      const names = { revenue: "Revenue", profit: "Profit", unitsSold: "Units Sold", activeSalesDays: "Active Sales Days",
        bestSeller: "Best Seller", topRevenueProduct: "Top Revenue Product", hotColdSplit: "Hot/Cold Split", revenueTrend: "Revenue Trend" };
      const html = Object.keys(names).map((key) => {
        const available = availability[key]?.available === true;
        return `<div class="flex justify-between gap-3 py-2"><span>${escape(names[key])}</span><span class="text-xs ${available ? "text-green-600" : "text-slate-500"}">${available ? "Available" : "Unavailable"}</span></div>`;
      }).join("");
      Render.mount("dashboard-statistics", html);
    }

    function renderActivities(activities) {
      if (!activities.length) return Render.mount("dashboard-activities", Components.empty("No recent activities."));
      Render.mount("dashboard-activities", activities.map((item) => `<div class="flex items-center justify-between gap-4 p-4"><div><div class="font-medium text-slate-800">${escape(item.module)} · ${escape(item.label)}</div><div class="text-sm text-slate-500">${escape(item.id)}${item.eventType ? ` · ${escape(item.eventType)}` : ""}</div></div><div class="text-xs text-slate-400 text-right">${escape(item.eventTimeDisplay || item.eventTime)}</div></div>`).join(""));
    }

    function renderRange(range) {
      const label = DOM.$("dashboard-range-label");
      if (label) DOM.text(label, `${range.startDate || ""} through ${range.endDate || ""} · ${range.timezone || ""} · ${range.granularity || ""}`);
    }

    function bindRangeControls(range, onChange) {
      const preset = DOM.$("dashboard-preset");
      const start = DOM.$("dashboard-start");
      const end = DOM.$("dashboard-end");
      const error = DOM.$("dashboard-range-error");
      if (!preset || preset.dataset.dashboardBound === "true") return;
      preset.dataset.dashboardBound = "true";
      preset.value = range.preset || "CURRENT_MONTH";
      start.value = range.startDate || "";
      end.value = range.endDate || "";
      const updateVisibility = () => {
        const custom = preset.value === "CUSTOM";
        DOM.$("dashboard-start-wrap")?.classList.toggle("hidden", !custom);
        DOM.$("dashboard-end-wrap")?.classList.toggle("hidden", !custom);
      };
      const submit = () => {
        updateVisibility();
        const custom = preset.value === "CUSTOM";
        const validDate = (value) => /^\d{4}-\d{2}-\d{2}$/.test(value);
        let message = "";
        if (custom && (!validDate(start.value) || !validDate(end.value))) message = "Choose a valid start and end date.";
        if (!message && custom && start.value > end.value) message = "Start date must not be after end date.";
        error?.classList.toggle("hidden", !message);
        if (error) DOM.text(error, message);
        if (!message) onChange({ preset: preset.value, startDate: custom ? start.value : "", endDate: custom ? end.value : "" });
      };
      preset.addEventListener("change", () => { updateVisibility(); if (preset.value !== "CUSTOM" || (start.value && end.value)) submit(); });
      start.addEventListener("change", submit);
      end.addEventListener("change", submit);
      updateVisibility();
    }

    function emptyChart(id, emptyId, isEmpty, message) {
      const canvas = DOM.$(id);
      const empty = DOM.$(emptyId);
      if (canvas) canvas.parentElement.classList.toggle("hidden", isEmpty);
      if (empty) { empty.classList.toggle("hidden", !isEmpty); DOM.text(empty, message); }
    }

    function renderCharts(data) {
      destroyCharts();
      const trend = data.purchasingTrend || { labels: [], values: [] };
      const breakdown = data.expenseBreakdown || { labels: [], values: [] };
      const trendEmpty = !trend.values?.some((value) => Number(value) !== 0);
      const breakdownEmpty = !breakdown.values?.length;
      emptyChart("chart-overview", "dashboard-trend-empty", trendEmpty, "No purchasing value in this range.");
      emptyChart("chart-distribution", "dashboard-breakdown-empty", breakdownEmpty, "No expense data in this range.");
      if (typeof Chart === "undefined") return;
      if (!trendEmpty) trendChart = new Chart(DOM.$("chart-overview"), { type: "line", data: { labels: trend.labels, datasets: [{ label: "Purchasing Value", data: trend.values, borderColor: "#4f46e5", backgroundColor: "rgba(79,70,229,.12)", fill: true, tension: .25 }] }, options: { responsive: true, plugins: { tooltip: { callbacks: { label: (context) => Format.currency(context.raw) } } } } });
      if (!breakdownEmpty) breakdownChart = new Chart(DOM.$("chart-distribution"), { type: "doughnut", data: { labels: breakdown.labels, datasets: [{ data: breakdown.values, backgroundColor: ["#ef4444", "#f59e0b", "#3b82f6", "#10b981", "#8b5cf6", "#64748b"] }] }, options: { responsive: true, plugins: { tooltip: { callbacks: { label: (context) => `${context.label}: ${Format.currency(context.raw)}` } } } } });
    }

    return Object.freeze({ render, renderError, renderRangeError, destroyCharts, bindRangeControls });
  })();
</script>
