<script>
  const DashboardPresenter = (() => {
    let trendChart = null;
    let productChart = null;
    let breakdownChart = null;
    const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function destroyCharts() {
      if (trendChart) trendChart.destroy();
      if (productChart) productChart.destroy();
      if (breakdownChart) breakdownChart.destroy();
      trendChart = null;
      productChart = null;
      breakdownChart = null;
    }

    function render(data) {
      if (!data) return renderError("Dashboard data unavailable.");
      renderKPI(data.summary || {});
      renderActivities(data.recentActivities || []);
      renderRange(data.range || {});
      renderCharts(data);
    }

    function renderError(message = "Dashboard data unavailable. Refresh to retry.") {
      destroyCharts();
      Render.mount("dashboard-kpi", Components.empty(message));
      Render.mount("dashboard-activities", Components.empty("Recent activities unavailable."));
    }

    function renderLoading() {
      Render.mount("dashboard-kpi", Components.loading("Loading dashboard..."));
    }

    function renderRangeError(message) {
      const error = DOM.$("dashboard-range-error");
      if (error) { DOM.text(error, message || "Dashboard range is invalid."); error.classList.remove("hidden"); }
    }

    function renderKPI(summary) {
      const cards = [
        { title: "Purchasing Value", value: Format.currency(summary.purchasingValue), icon: "fa-bag-shopping", color: "amber", detail: "Selected period" },
        { title: "Expense Value", value: Format.currency(summary.expenseValue), icon: "fa-layer-group", color: "orange", detail: "Selected period" },
        { title: "Purchased Units", value: Format.number(summary.purchasedUnits || 0), icon: "fa-boxes-stacked", color: "red", detail: "Units in range" },
        { title: "Transactions", value: Format.number(summary.transactionCount || 0), icon: "fa-receipt", color: "green", detail: "Purchasing + expenses" },
      ];
      Render.mount("dashboard-kpi", cards.map(Components.stat).join(""));
    }

    function renderActivities(activities) {
      if (!activities.length) return Render.mount("dashboard-activities", Components.empty("No recent activities."));
      Render.mount("dashboard-activities", activities.map((item) => `<div class="flex items-center justify-between gap-4 p-4"><div><div class="font-medium text-slate-800">${escape(item.module)} · ${escape(item.label)}</div><div class="text-sm text-slate-500">${escape(item.id)}${item.eventType ? ` · ${escape(item.eventType)}` : ""}</div></div><div class="text-xs text-slate-400 text-right">${escape(item.eventTimeDisplay || item.eventTime)}</div></div>`).join(""));
    }

    function renderRange(range) {
      const label = DOM.$("dashboard-range-label");
      if (label) DOM.text(label, `${range.startDate || ""} through ${range.endDate || ""} · ${range.timezone || ""} · ${range.granularity || ""}`);
    }

    function renderRangeControls(range = {}, message = "") {
      const preset = DOM.$("dashboard-preset");
      const start = DOM.$("dashboard-start");
      const end = DOM.$("dashboard-end");
      const error = DOM.$("dashboard-range-error");
      if (!preset || !start || !end) return;
      preset.value = range.preset || "CURRENT_MONTH";
      start.value = range.startDate || "";
      end.value = range.endDate || "";
      const custom = preset.value === "CUSTOM";
      DOM.$("dashboard-start-wrap")?.classList.toggle("hidden", !custom);
      DOM.$("dashboard-end-wrap")?.classList.toggle("hidden", !custom);
      error?.classList.toggle("hidden", !message);
      if (error) DOM.text(error, message);
    }

    function emptyChart(id, emptyId, isEmpty, message) {
      const canvas = DOM.$(id);
      const empty = DOM.$(emptyId);
      if (canvas) canvas.parentElement.classList.toggle("hidden", isEmpty);
      if (empty) { empty.classList.toggle("hidden", !isEmpty); DOM.text(empty, message); }
    }

    function renderCharts(data) {
      destroyCharts();
      const trend = data.monthlyPurchasingTrend || { labels: [], values: [] };
      const products = data.productPerformance || { labels: [], values: [] };
      const breakdown = data.expenseBreakdown || { labels: [], values: [] };
      const trendEmpty = !trend.values?.some((value) => Number(value) !== 0);
      const productEmpty = !products.values?.some((value) => Number(value) !== 0);
      const breakdownEmpty = !breakdown.values?.length;
      emptyChart("chart-overview", "dashboard-trend-empty", trendEmpty, "No purchasing value in this range.");
      emptyChart("chart-product", "dashboard-product-empty", productEmpty, "No product purchasing data in this range.");
      emptyChart("chart-distribution", "dashboard-breakdown-empty", breakdownEmpty, "No expense data in this range.");
      if (typeof Chart === "undefined") return;
      const chartText = "#8f897f";
      const chartGrid = "rgba(255,255,255,.07)";
      const tooltip = { backgroundColor: "#25221e", borderColor: "#403a32", borderWidth: 1, titleColor: "#f4f1eb", bodyColor: "#d8d3ca" };
      const monthLabels = trend.labels.map((label) => { const match = /^(\d{4})-(\d{2})$/.exec(String(label)); return match ? new Intl.DateTimeFormat("en", { month: "short", timeZone: "UTC" }).format(new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, 1))) : String(label); });
      if (!trendEmpty) trendChart = new Chart(DOM.$("chart-overview"), { type: "line", data: { labels: monthLabels, datasets: [{ data: trend.values, borderColor: "#f59e0b", backgroundColor: "rgba(245,158,11,.07)", pointBackgroundColor: "#fbbf24", pointBorderColor: "#181714", pointRadius: 2.5, borderWidth: 2, fill: true, tension: .38 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: chartText }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: chartText, stepSize: 5000, callback: (value) => Number(value) === 0 ? "0" : `${Number(value) / 1000}K` }, grid: { color: chartGrid }, border: { display: false } } }, plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: { label: (context) => Format.currency(context.raw) } } } } });
      if (!productEmpty) productChart = new Chart(DOM.$("chart-product"), { type: "bar", data: { labels: products.labels, datasets: [{ data: products.values, backgroundColor: "rgba(163,230,53,.55)", borderColor: "#a3e635", borderWidth: 1, borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: chartText }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: chartText, callback: (value) => Number(value) === 0 ? "0" : `${Number(value) / 1000}K` }, grid: { color: chartGrid }, border: { display: false } } }, plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: { label: (context) => Format.currency(context.raw) } } } } });
      if (!breakdownEmpty) breakdownChart = new Chart(DOM.$("chart-distribution"), { type: "doughnut", data: { labels: breakdown.labels, datasets: [{ data: breakdown.values, borderColor: "#181714", borderWidth: 4, hoverOffset: 4, backgroundColor: ["#fb7185", "#f59e0b", "#a3e635", "#34d399", "#60a5fa", "#78716c"] }] }, options: { responsive: true, maintainAspectRatio: false, cutout: "70%", plugins: { legend: { position: "bottom", labels: { color: chartText, padding: 16, boxWidth: 10, usePointStyle: true } }, tooltip: { ...tooltip, callbacks: { label: (context) => `${context.label}: ${Format.currency(context.raw)}` } } } } });
    }

    return Object.freeze({ render, renderLoading, renderError, renderRangeError, renderRangeControls, destroyCharts });
  })();
</script>
