<script>
  /**
   * =============================================================================
   * FILE        : 971.View.Dashboard.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Dashboard Presenter
   * =============================================================================
   *
   * Presenter bertugas mengubah Dashboard Data menjadi Components.
   *
   * App
   *   ↓
   * DashboardPresenter
   *   ↓
   * Render
   *
   * Presenter TIDAK:
   * - memanggil API
   * - menyimpan state
   * - mengakses Spreadsheet
   *
   * =============================================================================
   */

  const DashboardPresenter = (() => {
    //===========================================================================
    // Public Render
    //===========================================================================

    function render(data) {
      if (!data) {
        Render.mount(
          "dashboard-kpi",

          Components.empty("Dashboard data unavailable."),
        );

        return;
      }

      renderKPI(data.summary || {});

      renderStatistics(data.statistics || {});

      renderActivities(data.recentActivities || []);

      renderCharts(data);
    }

    function renderError() {
      Render.mount(
        "dashboard-kpi",
        Components.empty("Dashboard data unavailable. Refresh to retry."),
      );

      Render.mount(
        "dashboard-statistics",
        Components.empty("Statistics unavailable."),
      );

      Render.mount(
        "dashboard-activities",
        Components.empty("Recent activities unavailable."),
      );
    }

    //===========================================================================
    // KPI
    //===========================================================================

    function renderKPI(summary = {}) {
      const html = [
        {
          title: "Products",
          value: summary.products || 0,
          icon: "fa-box",
          color: "blue",
        },

        {
          title: "Partners",
          value: summary.partners || 0,
          icon: "fa-users",
          color: "green",
        },

        {
          title: "Purchasing",
          value: summary.purchasings || 0,
          icon: "fa-cart-shopping",
          color: "amber",
        },

        {
          title: "Expenses",
          value: summary.expenses || 0,
          icon: "fa-wallet",
          color: "red",
        },
      ]

        .map(Components.stat)

        .join("");

      Render.mount(
        "dashboard-kpi",

        html,
      );
    }

    //===========================================================================
    // Statistics
    //===========================================================================

    function renderStatistics(statistics) {
      const purchasing = statistics.purchasing || {};

      const expense = statistics.expense || {};

      const html = `

      <div class="space-y-4">

        <div class="flex justify-between">

          <span>Purchasing</span>

          <strong>

            ${purchasing.total || 0}

          </strong>

        </div>

        <div class="flex justify-between">

          <span>Expense</span>

          <strong>

            ${expense.active || 0}

          </strong>

        </div>

      </div>

    `;

      Render.mount(
        "dashboard-statistics",

        Components.card({
          title: "Statistics",

          body: html,
        }),
      );
    }

    //===========================================================================
    // Activities
    //===========================================================================

    function renderActivities(activities = []) {
      if (!activities.length) {
        Render.mount(
          "dashboard-activities",

          Components.empty("No recent activities."),
        );

        return;
      }

      const html = activities

        .map(
          (item) => `

        <div class="flex items-center justify-between p-4">

          <div>

            <div class="font-medium text-slate-800">

              ${item.module}

            </div>

            <div class="text-sm text-slate-500">

              ${item.id}

            </div>

          </div>

          <div class="text-xs text-slate-400">

            ${Format.datetime(item.createdAt)}

          </div>

        </div>

      `,
        )

        .join("");

      Render.mount(
        "dashboard-activities",

        Components.card({
          title: "Recent Activities",

          body: html,
        }),
      );
    }

    //===========================================================================
    // Charts
    //===========================================================================

    function renderCharts(data) {
      console.log(
        "Dashboard Charts",

        data,
      );

      // Sprint 2
      // ChartPresenter.render(data);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,

      renderError,
    });
  })();
</script>
