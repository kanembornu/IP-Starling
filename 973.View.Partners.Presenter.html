<script>
  /**
   * =============================================================================
   * FILE        : 973.View.Partners.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Partners Presenter
   * =============================================================================
   */

  const PartnersPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      TYPE: "Jenis",

      PHONE: "Telepon",

      ADDRESS: "Alamat",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(partners = []) {
      const list = Array.isArray(partners) ? partners : [];

      renderInfo(list.length);

      if (!list.length) {
        renderEmpty();

        return;
      }

      Render.mount(
        "tbl-partners-body",

        list.map(renderRow).join(""),
      );
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(partner = {}) {
      const id = partner[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(partner[FIELD.NAME])),

        Components.tableCell(text(partner[FIELD.TYPE])),

        Components.tableCell(text(partner[FIELD.PHONE])),

        Components.tableCell(text(partner[FIELD.ADDRESS])),

        Components.tableCell(
          renderStatus(partner[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty() {
      Render.mount(
        "tbl-partners-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty("No partners available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-partner-info",

        `${Format.number(total)} Partner`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id) {
      return `
        <div class="flex items-center justify-center gap-2">
          ${actionButton("Edit", "fa-pen", "blue", id)}

          ${actionButton("Delete", "fa-trash", "red", id)}
        </div>
      `;
    }

    function actionButton(
      label,

      icon,

      color,

      id,
    ) {
      const palette = {
        blue: "bg-blue-100 hover:bg-blue-200 text-blue-600",

        red: "bg-red-100 hover:bg-red-200 text-red-600",
      };

      return `
        <button
          type="button"
          data-id="${text(id)}"
          title="${label}"
          class="
            inline-flex
            items-center
            gap-2
            px-3
            py-2
            rounded-lg
            transition
            ${palette[color]}
          "
        >
          ${Components.icon(icon)}

          <span>${label}</span>
        </button>
      `;
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
    });
  })();
</script>
