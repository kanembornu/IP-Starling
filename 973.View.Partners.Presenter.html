<script>
  /**
   * =============================================================================
   * FILE        : 973.View.Partners.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Partners Presenter
   * =============================================================================
   */

  const PartnersPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      TYPE: "Jenis",

      PHONE: "Telepon",

      ADDRESS: "Alamat",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(view = {}) {
      const list = Array.isArray(view.rows) ? view.rows : [];
      const mode = view.mode === "deleted" ? "deleted" : "active";
      const restoreBusyId = view.restoreBusyId || null;

      renderMode(mode);
      renderPagination(view.pagination, mode);

      if (!list.length) {
        renderEmpty(mode);

        return;
      }

      Render.mount(
        "tbl-partners-body",

        list.map((partner) => renderRow(partner, mode, restoreBusyId)).join(""),
      );
    }

    function renderPagination(meta = {}, mode = "active") {
      const pageSize = Number(meta.pageSize) || 15;
      const totalRows = Number(meta.totalRows) || 0;
      const totalPages = Number(meta.totalPages) || 1;
      const page = Number(meta.page) || 1;
      const rangeStart = Number(meta.rangeStart) || 0;
      const rangeEnd = Number(meta.rangeEnd) || 0;
      const label = mode === "deleted" ? "mitra terhapus" : "mitra";
      Render.mount("lbl-partner-info", Pagination.summary({ totalRows, rangeStart, rangeEnd }, label));
      Render.mount("partner-pagination", paginationMarkup({ module: "partners", mode, page, pageSize, totalRows, totalPages, hasPrevious: Boolean(meta.hasPrevious), hasNext: Boolean(meta.hasNext) }));
    }

    function paginationMarkup(config) { return Pagination.controls(config); }

    function renderFormFooter(kind = "create", submitting = false) {
      return Components.formFooter({ cancelAttribute: 'data-partner-form-action="cancel"', saveAttribute: 'data-partner-form-action="save"', saveLabel: kind === "create" ? "Create Partner" : "Save Changes", loadingLabel: kind === "create" ? "Creating Partner..." : "Saving Changes...", loading: submitting });
    }

    function renderLoading(mode = "active") { const label = mode === "deleted" ? "deleted partners" : "partners"; renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.loading(`Loading ${label}...`)}</td></tr>`); Render.mount("lbl-partner-info", `Loading ${label}...`); Render.mount("partner-pagination", ""); }
    function renderError(mode = "active", message = "") { const label = mode === "deleted" ? "Deleted partners" : "Partners"; renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.error(message || `${label} could not be loaded. Use Refresh to try again.`)}</td></tr>`); Render.mount("lbl-partner-info", "Partner count unavailable"); Render.mount("partner-pagination", ""); }
    function renderMode(mode) {
      document.querySelectorAll("[data-partner-mode]").forEach((button) => { const selected = button.dataset.partnerMode === mode; button.classList.toggle("bg-blue-600", selected); button.classList.toggle("text-white", selected); });
      DOM.$("btn-partner-add")?.classList.toggle("hidden", mode === "deleted");
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-partner-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(partner = {}, mode = "active", restoreBusyId = null) {
      const id = partner[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(partner[FIELD.NAME])),

        Components.tableCell(text(partner[FIELD.TYPE])),

        Components.tableCell(text(partner[FIELD.PHONE])),

        Components.tableCell(text(partner[FIELD.ADDRESS])),

        Components.tableCell(
          renderStatus(partner[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id, mode, restoreBusyId), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(mode = "active") {
      Render.mount(
        "tbl-partners-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(mode === "deleted" ? "No deleted partners available." : "No partners available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id, mode, restoreBusyId) {
      if (mode === "deleted") {
        const busy = String(restoreBusyId || "") === String(id);
        return Components.tableActions(actionButton(busy ? "Restoring..." : "Restore", "fa-rotate-left", "green", "restore", id, busy));
      }
      return Components.tableActions(`${actionButton("Edit", "fa-pen", "blue", "edit", id)}${actionButton("Delete", "fa-trash-can", "red", "delete", id)}`);
    }

    function actionButton(
      label,

      icon,

      color,

      action,

      id,

      disabled = false,
    ) {
      return Components.tableAction({ label, icon, tone: color, attributes: `data-action="${action}" data-id="${text(id)}"`, busy: disabled });
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      renderLoading,
      renderError,
      clearSearch,
      renderFormFooter,
    });
  })();
</script>
