<script>
  /**
   * =============================================================================
   * FILE        : 973.View.Partners.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Partners Presenter
   * =============================================================================
   */

  const PartnersPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      TYPE: "Jenis",

      PHONE: "Telepon",

      ADDRESS: "Alamat",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(partners = [], mode = "active", restoreBusyId = null) {
      const source = Array.isArray(partners) ? partners : [];
      const list = App.paginateRows("partners", mode, source, "partner-pagination", "lbl-partner-info", mode === "deleted" ? "mitra terhapus" : "mitra", () => render(source, mode, restoreBusyId));

      renderMode(mode);

      if (!list.length) {
        renderEmpty(mode);

        return;
      }

      Render.mount(
        "tbl-partners-body",

        list.map((partner) => renderRow(partner, mode, restoreBusyId)).join(""),
      );
    }

    function renderLoading(mode = "active") { renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.loading({ message: mode === "deleted" ? "Loading deleted partners..." : "Loading partners..." })}</td></tr>`); }
    function renderError(mode = "active", message = "") { renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.empty(message || (mode === "deleted" ? "Deleted partners could not be loaded." : "Partners could not be loaded."))}</td></tr>`); }
    function renderMode(mode) {
      document.querySelectorAll("[data-partner-mode]").forEach((button) => { const selected = button.dataset.partnerMode === mode; button.classList.toggle("bg-blue-600", selected); button.classList.toggle("text-white", selected); });
      DOM.$("btn-partner-add")?.classList.toggle("hidden", mode === "deleted");
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-partner-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(partner = {}, mode = "active", restoreBusyId = null) {
      const id = partner[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(partner[FIELD.NAME])),

        Components.tableCell(text(partner[FIELD.TYPE])),

        Components.tableCell(text(partner[FIELD.PHONE])),

        Components.tableCell(text(partner[FIELD.ADDRESS])),

        Components.tableCell(
          renderStatus(partner[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id, mode, restoreBusyId), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(mode = "active") {
      Render.mount(
        "tbl-partners-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(mode === "deleted" ? "No deleted partners." : "No partners available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-partner-info",

        `${Format.number(total)} Partner`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id, mode, restoreBusyId) {
      if (mode === "deleted") {
        const busy = String(restoreBusyId || "") === String(id);
        return `<div class="flex items-center justify-center">${actionButton(busy ? "Restoring..." : "Restore", "fa-rotate-left", "green", "restore", id, busy)}</div>`;
      }
      return `
    <div class="flex items-center justify-center gap-2">

      ${actionButton("Edit", "fa-pen", "blue", "edit", id)}

      ${actionButton("Delete", "fa-trash", "red", "delete", id)}

    </div>
  `;
    }

    function actionButton(
      label,

      icon,

      color,

      action,

      id,

      disabled = false,
    ) {
      const palette = {
        blue: "bg-blue-100 hover:bg-blue-200 text-blue-600",

        red: "bg-red-100 hover:bg-red-200 text-red-600",

        green: "bg-green-100 hover:bg-green-200 text-green-700",
      };

      return `
    <button
      type="button"
      data-action="${action}"
      data-id="${text(id)}"
      title="${label}"
      ${disabled ? "disabled aria-busy=\"true\"" : ""}
      class="
        inline-flex
        items-center
        gap-2
        px-3
        py-2
        rounded-lg
        transition
        ${palette[color]}
      "
    >
      ${Components.icon(icon)}

      <span>${label}</span>
    </button>
  `;
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      renderLoading,
      renderError,
      clearSearch,
    });
  })();
</script>
