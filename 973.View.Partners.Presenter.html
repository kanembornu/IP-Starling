<script>
  /**
   * =============================================================================
   * FILE        : 973.View.Partners.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Partners Presenter
   * =============================================================================
   */

  const PartnersPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      NAME: "Nama",

      TYPE: "Jenis",

      PHONE: "Telepon",

      ADDRESS: "Alamat",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(view = {}) {
      const list = Array.isArray(view.rows) ? view.rows : [];
      const mode = view.mode === "deleted" ? "deleted" : "active";
      const restoreBusyId = view.restoreBusyId || null;

      renderMode(mode);
      renderPagination(view.pagination, mode);

      if (!list.length) {
        renderEmpty(mode);

        return;
      }

      Render.mount(
        "tbl-partners-body",

        list.map((partner) => renderRow(partner, mode, restoreBusyId)).join(""),
      );
    }

    function renderPagination(meta = {}, mode = "active") {
      const pageSize = Number(meta.pageSize) || 15;
      const totalRows = Number(meta.totalRows) || 0;
      const totalPages = Number(meta.totalPages) || 1;
      const page = Number(meta.page) || 1;
      const rangeStart = Number(meta.rangeStart) || 0;
      const rangeEnd = Number(meta.rangeEnd) || 0;
      const label = mode === "deleted" ? "mitra terhapus" : "mitra";
      Render.mount("lbl-partner-info", `Menampilkan ${rangeStart}–${rangeEnd} dari ${totalRows} ${label}`);
      Render.mount("partner-pagination", paginationMarkup("partners", mode, page, pageSize, totalPages, Boolean(meta.hasPrevious), Boolean(meta.hasNext)));
    }

    function paginationMarkup(module, mode, page, pageSize, totalPages, hasPrevious, hasNext) {
      return `<div class="flex flex-wrap items-center justify-end gap-2 text-sm"><label class="flex items-center gap-2">Baris per halaman <select data-pagination-size="${module}" data-pagination-mode="${mode}" class="rounded-lg border border-slate-300 px-2 py-1">${[10, 15, 25, 50, 100].map((size) => `<option value="${size}" ${pageSize === size ? "selected" : ""}>${size}</option>`).join("")}</select></label><span class="px-2 text-slate-500">Halaman ${page} dari ${totalPages}</span><button type="button" data-pagination-action="previous" data-pagination-module="${module}" data-pagination-mode="${mode}" ${hasPrevious ? "" : "disabled"} class="rounded-lg border px-3 py-1 disabled:cursor-not-allowed disabled:opacity-50">Sebelumnya</button><button type="button" data-pagination-action="next" data-pagination-module="${module}" data-pagination-mode="${mode}" ${hasNext ? "" : "disabled"} class="rounded-lg border px-3 py-1 disabled:cursor-not-allowed disabled:opacity-50">Berikutnya</button></div>`;
    }

    function renderFormFooter(submitting = false) {
      return `<div class="flex justify-end gap-2"><button type="button" data-partner-form-action="cancel" class="px-4 py-2 border rounded-lg" ${submitting ? "disabled" : ""}>Cancel</button><button type="button" data-partner-form-action="save" class="px-4 py-2 bg-blue-600 text-white rounded-lg disabled:opacity-50" ${submitting ? "disabled aria-busy=\"true\"" : ""}>${submitting ? "Saving..." : "Save Partner"}</button></div>`;
    }

    function renderLoading(mode = "active") { const label = mode === "deleted" ? "deleted partners" : "partners"; renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.loading(`Loading ${label}...`)}</td></tr>`); Render.mount("lbl-partner-info", `Loading ${label}...`); Render.mount("partner-pagination", ""); }
    function renderError(mode = "active", message = "") { const label = mode === "deleted" ? "Deleted partners" : "Partners"; renderMode(mode); Render.mount("tbl-partners-body", `<tr><td colspan="7">${Components.error(message || `${label} could not be loaded. Use Refresh to try again.`)}</td></tr>`); Render.mount("lbl-partner-info", "Partner count unavailable"); Render.mount("partner-pagination", ""); }
    function renderMode(mode) {
      document.querySelectorAll("[data-partner-mode]").forEach((button) => { const selected = button.dataset.partnerMode === mode; button.classList.toggle("bg-blue-600", selected); button.classList.toggle("text-white", selected); });
      DOM.$("btn-partner-add")?.classList.toggle("hidden", mode === "deleted");
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-partner-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(partner = {}, mode = "active", restoreBusyId = null) {
      const id = partner[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),

        Components.tableCell(text(partner[FIELD.NAME])),

        Components.tableCell(text(partner[FIELD.TYPE])),

        Components.tableCell(text(partner[FIELD.PHONE])),

        Components.tableCell(text(partner[FIELD.ADDRESS])),

        Components.tableCell(
          renderStatus(partner[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(renderActions(id, mode, restoreBusyId), "text-center"),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(mode = "active") {
      Render.mount(
        "tbl-partners-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(mode === "deleted" ? "No deleted partners available." : "No partners available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(value) {
      const active = isActive(value);

      return Components.badge(
        Format.status(active),

        active,
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id, mode, restoreBusyId) {
      if (mode === "deleted") {
        const busy = String(restoreBusyId || "") === String(id);
        return `<div class="flex items-center justify-center">${actionButton(busy ? "Restoring..." : "Restore", "fa-rotate-left", "green", "restore", id, busy)}</div>`;
      }
      return `
    <div class="flex items-center justify-center gap-2">

      ${actionButton("Edit", "fa-pen", "blue", "edit", id)}

      ${actionButton("Delete", "fa-trash", "red", "delete", id)}

    </div>
  `;
    }

    function actionButton(
      label,

      icon,

      color,

      action,

      id,

      disabled = false,
    ) {
      const palette = {
        blue: "bg-blue-100 hover:bg-blue-200 text-blue-600",

        red: "bg-red-100 hover:bg-red-200 text-red-600",

        green: "bg-green-100 hover:bg-green-200 text-green-700",
      };

      return `
    <button
      type="button"
      data-action="${action}"
      data-id="${text(id)}"
      title="${label}"
      ${disabled ? "disabled aria-busy=\"true\"" : ""}
      class="
        inline-flex
        items-center
        gap-2
        px-3
        py-2
        rounded-lg
        transition
        ${palette[color]}
      "
    >
      ${Components.icon(icon)}

      <span>${label}</span>
    </button>
  `;
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      renderLoading,
      renderError,
      clearSearch,
      renderFormFooter,
    });
  })();
</script>
