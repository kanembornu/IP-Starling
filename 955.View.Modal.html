<template id="modal-template">
  <div
    id="modal-overlay"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50"
  >
    <div
      id="modal-window"
      class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden"
    >
      <!-- =========================================================== -->
      <!-- Header -->
      <!-- =========================================================== -->

      <div
        class="flex items-center justify-between px-6 py-4 border-b border-slate-200"
      >
        <h2 id="modal-title" class="text-lg font-semibold text-slate-800">
          Modal Title
        </h2>

        <button
          id="btn-modal-close"
          class="w-9 h-9 rounded-lg hover:bg-slate-100"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- =========================================================== -->
      <!-- Body -->
      <!-- =========================================================== -->

      <div id="modal-body" class="p-6 max-h-[70vh] overflow-auto"></div>

      <!-- =========================================================== -->
      <!-- Footer -->
      <!-- =========================================================== -->

      <div
        id="modal-footer"
        class="flex justify-end gap-3 px-6 py-4 border-t border-slate-200 bg-slate-50"
      >
        <button
          id="btn-modal-cancel"
          class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100"
        >
          Cancel
        </button>

        <button
          id="btn-modal-save"
          class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</template>
