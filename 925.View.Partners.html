<template id="partners-page">
  <div class="space-y-6">
    <!-- =============================================================== -->
    <!-- Page Header -->
    <!-- =============================================================== -->

    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Partners</h2>

        <p class="text-sm text-slate-500">Manage all registered partners.</p>
      </div>

      <button
        id="btn-partner-add"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition"
      >
        <i class="fa-solid fa-plus mr-2"></i>

        Add Partner
      </button>
    </div>

    <!-- =============================================================== -->
    <!-- Toolbar -->
    <!-- =============================================================== -->

    <div data-filter-toolbar="partners" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="inline-flex w-full rounded-lg border border-slate-300 p-1 sm:w-auto" role="group" aria-label="Partner status filter">
          <button type="button" data-partner-mode="active" class="partner-mode flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"><i class="fa-solid fa-circle-check mr-2"></i>Active</button>
          <button type="button" data-partner-mode="deleted" class="partner-mode flex-1 rounded-md px-4 py-2 text-sm font-medium transition sm:flex-none"><i class="fa-solid fa-trash-can mr-2"></i>Deleted</button>
        </div>
        <div class="w-full min-w-0 flex-1">
          <input
            id="inp-partner-search"
            data-module="partners"
            type="text"
            placeholder="Search partners..."
            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="flex gap-2 sm:flex-none">
          <button type="button" data-filter-clear="partners" class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"><i class="fa-solid fa-xmark mr-2"></i>Clear filters</button>
          <button id="btn-partner-refresh" type="button" title="Refresh Partners" aria-label="Refresh Partners" class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <p data-filter-feedback="partners" class="mt-3 text-xs text-slate-500" aria-live="polite">No filters active</p>
    </div>

    <!-- =============================================================== -->
    <!-- Table -->
    <!-- =============================================================== -->

    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"
    >
      <table id="tbl-partners" class="min-w-full text-sm">
        <thead class="bg-slate-100">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>

            <th class="px-4 py-3 text-left">Partner</th>

            <th class="px-4 py-3 text-left">Type</th>

            <th class="px-4 py-3 text-left">Phone</th>

            <th class="px-4 py-3 text-left">Address</th>

            <th class="px-4 py-3 text-center">Status</th>

            <th class="px-4 py-3 text-center">Action</th>
          </tr>
        </thead>

        <tbody id="tbl-partners-body"></tbody>
      </table>
    </div>

    <!-- =============================================================== -->
    <!-- Pagination -->
    <!-- =============================================================== -->

    <div class="flex items-center justify-between">
      <div id="lbl-partner-info" class="text-sm text-slate-500">0 Partner</div>

      <div id="partner-pagination" class="flex gap-2"></div>
    </div>
  </div>
</template>
