<script>
  /**
   * =============================================================================
   * FILE        : 981.View.Products.Form
   * VERSION     : 1.0.0
   * DESCRIPTION : Product Form Module
   * =============================================================================
   */

  const ProductsForm = (() => {
    //==========================================================================
    // Template
    //==========================================================================

    function template() {
      return `
        <div class="space-y-4">

          ${Components.formValidationSummary("data-product-form-summary")}

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Product Name
            </label>

            <input
              id="inp-product-name"
              type="text"
              class="w-full rounded-lg border border-slate-300 px-3 py-2
                     focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Enter product name"
            />
            ${Components.formFieldError("data-product-form-error", "Nama")}
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Category
            </label>

            <input
              id="inp-product-category"
              type="text"
              class="w-full rounded-lg border border-slate-300 px-3 py-2
                     focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Coffee, Tea, etc."
            />
            ${Components.formFieldError("data-product-form-error", "Kategori")}
          </div>

          <div class="grid grid-cols-2 gap-4">

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">
                Unit
              </label>

              <input
                id="inp-product-unit"
                type="text"
                class="w-full rounded-lg border border-slate-300 px-3 py-2"
                placeholder="Cup"
              />
              ${Components.formFieldError("data-product-form-error", "Satuan")}
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">
                Price
              </label>

              <input
                id="inp-product-price"
                type="number"
                class="w-full rounded-lg border border-slate-300 px-3 py-2"
                placeholder="0"
              />
              ${Components.formFieldError("data-product-form-error", "Harga")}
            </div>

          </div>

          <label class="flex items-center gap-2">

            <input
              id="inp-product-active"
              type="checkbox"
              checked
            />

            <span class="text-sm">
              Active
            </span>

          </label>

        </div>
      `;
    }

    //==========================================================================
    // Read
    //==========================================================================

    function read() {
      return {
        Nama: DOM.value("inp-product-name").trim(),
        Kategori: DOM.value("inp-product-category").trim(),
        Satuan: DOM.value("inp-product-unit").trim(),
        Harga: Number(DOM.value("inp-product-price")),
        IsActive: DOM.checked("inp-product-active"),
      };
    }

    //==========================================================================
    // Fill
    //==========================================================================

    function fill(product = {}) {
      DOM.setValue("inp-product-name", product.Nama ?? "");
      DOM.setValue("inp-product-category", product.Kategori ?? "");
      DOM.setValue("inp-product-unit", product.Satuan ?? "");
      DOM.setValue("inp-product-price", product.Harga ?? "");
      DOM.setChecked("inp-product-active", product.IsActive);
    }

    //==========================================================================
    // Reset
    //==========================================================================

    function reset() {
      DOM.setValue("inp-product-name", "");
      DOM.setValue("inp-product-category", "");
      DOM.setValue("inp-product-unit", "");
      DOM.setValue("inp-product-price", "");
      DOM.setChecked("inp-product-active", true);
    }

    function showFieldError(field, message) {
      Components.showFormValidationSummary("data-product-form-summary", message);
      const target = document.querySelector(`[data-product-form-error="${field}"]`);
      if (!target) return false;
      DOM.text(target, message); target.classList.remove("hidden");
      return true;
    }

    //==========================================================================
    // Public API
    //==========================================================================

    return Object.freeze({
      template,
      read,
      fill,
      reset,
      showFieldError,
    });
  })();
</script>
