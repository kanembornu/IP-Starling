<script>
  /**
   * =============================================================================
   * FILE        : 986.View.Format
   * VERSION     : 1.0.0
   * DESCRIPTION : Data Formatter
   * =============================================================================
   */

  const Format = (() => {
    //===========================================================================
    // Number
    //===========================================================================

    function number(value, decimals = 0) {
      const num = Number(value);

      if (isNaN(num)) {
        return "0";
      }

      return num.toLocaleString("id-ID", {
        minimumFractionDigits: decimals,

        maximumFractionDigits: decimals,
      });
    }

    //===========================================================================
    // Currency
    //===========================================================================

    function currency(value) {
      return "Rp " + number(value);
    }

    //===========================================================================
    // Nominal Form Input
    //===========================================================================

    function nominalDigits(value) {
      if (value === null || value === undefined || value === "") return "";
      return String(value).replace(/\D/g, "");
    }

    function nominalInput(value) {
      const digits = nominalDigits(value);
      if (!digits) return "";
      const normalized = digits.replace(/^0+(?=\d)/, "");
      return normalized.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function nominalValue(value) {
      const digits = nominalDigits(value);
      return digits ? Number(digits) : NaN;
    }

    function updateNominalInput(input) {
      if (!input) return "";
      const cursor = Number(input.selectionStart);
      const digitsBeforeCursor = Number.isFinite(cursor)
        ? nominalDigits(input.value.slice(0, cursor)).length
        : nominalDigits(input.value).length;
      const formatted = nominalInput(input.value);
      input.value = formatted;
      if (typeof input.setSelectionRange === "function") {
        let nextCursor = 0;
        let seenDigits = 0;
        while (nextCursor < formatted.length && seenDigits < digitsBeforeCursor) {
          if (/\d/.test(formatted[nextCursor])) seenDigits += 1;
          nextCursor += 1;
        }
        input.setSelectionRange(nextCursor, nextCursor);
      }
      return formatted;
    }

    function dateInput(value) {
      if (value === null || value === undefined || value === "") return "";
      const source = String(value).trim();
      const exact = /^(\d{4})-(\d{2})-(\d{2})$/.exec(source);
      if (exact) {
        const year = Number(exact[1]);
        const month = Number(exact[2]);
        const day = Number(exact[3]);
        const probe = new Date(year, month - 1, day);
        return probe.getFullYear() === year && probe.getMonth() === month - 1 && probe.getDate() === day ? source : "";
      }
      const parsed = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(parsed.getTime())) return "";
      return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
    }

    //===========================================================================
    // Percent
    //===========================================================================

    function percent(value, decimals = 2) {
      const num = Number(value);

      if (isNaN(num)) {
        return "0%";
      }

      return (
        num.toLocaleString("id-ID", {
          minimumFractionDigits: decimals,

          maximumFractionDigits: decimals,
        }) + "%"
      );
    }

    //===========================================================================
    // Date
    //===========================================================================

    function date(value) {
      if (!value) {
        return "-";
      }

      return new Date(value).toLocaleDateString("id-ID");
    }

    //===========================================================================
    // Time
    //===========================================================================

    function time(value) {
      if (!value) {
        return "-";
      }

      return new Date(value).toLocaleTimeString("id-ID");
    }

    //===========================================================================
    // Date Time
    //===========================================================================

    function datetime(value) {
      if (!value) {
        return "-";
      }

      return new Date(value).toLocaleString("id-ID");
    }

    //===========================================================================
    // Boolean
    //===========================================================================

    function boolean(value) {
      return value ? "Yes" : "No";
    }

    //===========================================================================
    // Status
    //===========================================================================

    function status(value) {
      return value ? "Active" : "Inactive";
    }

    //===========================================================================
    // Title Case
    //===========================================================================

    function title(text) {
      if (!text) {
        return "";
      }

      return String(text).replace(/\w\S*/g, (word) => {
        return word.charAt(0).toUpperCase() + word.substring(1).toLowerCase();
      });
    }

    //===========================================================================
    // Upper Case
    //===========================================================================

    function upper(text) {
      return String(text || "").toUpperCase();
    }

    //===========================================================================
    // Lower Case
    //===========================================================================

    function lower(text) {
      return String(text || "").toLowerCase();
    }

    //===========================================================================
    // Trim
    //===========================================================================

    function trim(text) {
      return String(text || "").trim();
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      number,

      currency,

      nominalInput,

      nominalValue,

      updateNominalInput,

      dateInput,

      percent,

      date,

      time,

      datetime,

      boolean,

      status,

      title,

      upper,

      lower,

      trim,
    });
  })();
</script>
