<script>

/**
 * =============================================================================
 * FILE        : 986.View.Format
 * VERSION     : 1.0.0
 * DESCRIPTION : Data Formatter
 * =============================================================================
 */

const Format = (() => {

  //===========================================================================
  // Number
  //===========================================================================

  function number(value, decimals = 0) {

    const num = Number(value);

    if (isNaN(num)) {

      return "0";

    }

    return num.toLocaleString("id-ID", {

      minimumFractionDigits: decimals,

      maximumFractionDigits: decimals

    });

  }



  //===========================================================================
  // Currency
  //===========================================================================

  function currency(value) {

    return "Rp " + number(value);

  }



  //===========================================================================
  // Percent
  //===========================================================================

  function percent(value, decimals = 2) {

    const num = Number(value);

    if (isNaN(num)) {

      return "0%";

    }

    return num.toLocaleString("id-ID", {

      minimumFractionDigits: decimals,

      maximumFractionDigits: decimals

    }) + "%";

  }



  //===========================================================================
  // Date
  //===========================================================================

  function date(value) {

    if (!value) {

      return "-";

    }

    return new Date(value)

      .toLocaleDateString(

        "id-ID"

      );

  }



  //===========================================================================
  // Time
  //===========================================================================

  function time(value) {

    if (!value) {

      return "-";

    }

    return new Date(value)

      .toLocaleTimeString(

        "id-ID"

      );

  }



  //===========================================================================
  // Date Time
  //===========================================================================

  function datetime(value) {

    if (!value) {

      return "-";

    }

    return new Date(value)

      .toLocaleString(

        "id-ID"

      );

  }



  //===========================================================================
  // Boolean
  //===========================================================================

  function boolean(value) {

    return value

      ? "Yes"

      : "No";

  }



  //===========================================================================
  // Status
  //===========================================================================

  function status(value) {

    return value

      ? "Active"

      : "Inactive";

  }



  //===========================================================================
  // Title Case
  //===========================================================================

  function title(text) {

    if (!text) {

      return "";

    }

    return String(text)

      .replace(/\w\S*/g, word => {

        return word.charAt(0).toUpperCase() +

          word.substring(1).toLowerCase();

      });

  }



  //===========================================================================
  // Upper Case
  //===========================================================================

  function upper(text) {

    return String(text || "")

      .toUpperCase();

  }



  //===========================================================================
  // Lower Case
  //===========================================================================

  function lower(text) {

    return String(text || "")

      .toLowerCase();

  }



  //===========================================================================
  // Trim
  //===========================================================================

  function trim(text) {

    return String(text || "")

      .trim();

  }



  //===========================================================================
  // Public API
  //===========================================================================

  return Object.freeze({

    number,

    currency,

    percent,

    date,

    time,

    datetime,

    boolean,

    status,

    title,

    upper,

    lower,

    trim

  });

})();

</script>
