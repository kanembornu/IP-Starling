<script>
  /**
   * =============================================================================
   * FILE        : 994.View.App.Runtime.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Application Controller
   * =============================================================================
   */

  const App = (() => {
    let initialized = false;

    //===========================================================================
    // State
    //===========================================================================

    const state = {
      page: window.APP?.initialPage || "dashboard",

      metadata: {
        name: window.APP?.name || "",
        version: window.APP?.version || "",
        build: window.APP?.build || "",
      },

      dashboard: null,

      dashboardLoading: false,

      dashboardError: "",

      dashboardRange: { preset: "CURRENT_YEAR", startDate: "", endDate: "" },

      dashboardRangeControls: { preset: "CURRENT_YEAR", startDate: "", endDate: "" },

      settings: [],

      settingBusyKey: null,

      logsFilters: { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" },

      logsPage: 1,

      logsPageSize: 15,

      defaultPageSize: 15,

      pagination: {},

      logsPageSizeSelected: false,

      products: [],

      deletedProducts: [],

      productMode: "active",

      productSearch: "",

      productLoading: false,

      productError: "",

      productSubmitting: false,

      productConfirming: false,

      productFormKind: null,

      productFormId: null,

      productRestoreBusyId: null,

      productRestoreConfirming: false,

      partners: [],

      deletedPartners: [],

      partnerMode: "active",

      partnerSearch: "",

      partnerLoading: false,

      partnerError: "",

      partnerSubmitting: false,

      partnerConfirming: false,

      partnerFormKind: null,

      partnerFormId: null,

      partnerRestoreBusyId: null,

      partnerRestoreConfirming: false,

      pickups: [],

      deletedPickups: [],

      pickupMode: "active",

      pickupSearch: "",

      pickupLoading: false,

      pickupError: "",

      pickupForm: null,

      pickupFormKind: null,

      pickupProducts: null,

      pickupPartners: null,

      pickupSubmitting: false,

      pickupCreateRequestKey: null,

      pickupBusyId: null,

      pickupRestoreBusyId: null,

      pickupRestoreConfirming: false,

      returns: [],

      deletedReturns: [],

      returnMode: "active",

      returnSearch: "",

      returnLoading: false,

      returnError: "",

      returnBusyId: null,

      returnForm: null,

      returnFormKind: null,

      returnPickups: null,

      returnPickupDetails: {},

      returnSubmitting: false,

      returnCreateRequestKey: null,

      returnRestoreBusyId: null,

      returnRestoreConfirming: false,

      purchasing: [],

      deletedPurchasing: [],

      purchasingMode: "active",

      purchasingSearch: "",

      purchasingLoading: false,

      purchasingError: "",

      purchasingBusyId: null,

      purchasingForm: null,

      purchasingFormKind: null,

      purchasingSuppliers: [],

      purchasingProducts: [],

      purchasingSubmitting: false,

      purchasingRestoreBusyId: null,

      purchasingRestoreConfirming: false,

      expenses: [],

      deletedExpenses: [],

      expenseMode: "active",

      expenseLoading: false,

      expenseError: "",

      expenseSearch: { active: "", trash: "" },

      expenseForm: null,

      expenseFormKind: null,

      expenseSubmitting: false,

      expenseBusyId: null,

      expenseConfirming: false,
    };

    let productsLoaded = false;

    let partnersLoaded = false;

    let productsLoading = null;

    let partnersLoading = null;

    let expenseRequest = 0;

    let pickupRequest = 0;

    let pickupDetailRequest = 0;

    let pickupDependencyRequest = 0;

    let pickupDependencyLoading = null;

    let pickupNextDetailId = 1;

    function createRequestKey() {
      if (window.crypto?.randomUUID) return `ips_${window.crypto.randomUUID().toLowerCase()}`;
      if (!window.crypto?.getRandomValues) throw new Error("Secure request identity is unavailable in this browser.");
      const bytes = new Uint8Array(16); window.crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
      const hex = Array.from(bytes, (value) => value.toString(16).padStart(2, "0"));
      return `ips_${hex.slice(0,4).join("")}-${hex.slice(4,6).join("")}-${hex.slice(6,8).join("")}-${hex.slice(8,10).join("")}-${hex.slice(10).join("")}`;
    }

    let returnRequest = 0;

    let purchasingRequest = 0;

    let dashboardRequest = 0;

    let settingsRequest = 0;

    let settingsLoaded = false;

    let settingsLoading = null;

    let logsRequest = 0;

    let productRequest = 0;

    let partnerRequest = 0;

    //===========================================================================
    // Initialize
    //===========================================================================

    function renderSidebar(page) {
      Render.sidebar(page);

      const versionElement = DOM.$("appVersion");
      const version = typeof state.metadata.version === "string"
        ? state.metadata.version.trim()
        : "";

      if (versionElement) versionElement.textContent = version ? `v${version}` : "v—";
    }

    async function init() {
      if (initialized) return;
      initialized = true;

      Render.layout();

      Modal.init();

      renderSidebar(state.page);

      Render.page(state.page);

      Events.init();

      window.addEventListener("app:themechange", () => {
        SettingsPresenter.renderTheme();
        if (state.page === "dashboard" && state.dashboard) DashboardPresenter.render(state.dashboard);
      });

      bindSettingsActions();

      bindLogsActions();

      bindPaginationActions();

      loadDefaultPageSize();

      await refresh();
    }

    //===========================================================================
    // Navigation
    //===========================================================================

    async function navigate(page) {
      if (state.page === page) {
        return;
      }

      if (state.page === "dashboard") {
        dashboardRequest += 1;
        state.dashboardLoading = false;
        DashboardPresenter.destroyCharts();
      }

      if (state.page === "settings") settingsRequest += 1;

      if (state.page === "logs") logsRequest += 1;

      if (state.page === "products") {
        productRequest += 1;
        state.productFormKind = null;
        state.productFormId = null;
        state.productRestoreBusyId = null;
        CrudState.reset();
      }

      if (state.page === "partners") {
        partnerRequest += 1;
        state.partnerFormKind = null;
        state.partnerFormId = null;
        state.partnerRestoreBusyId = null;
        CrudState.reset();
      }

      if (state.page === "pickups") { pickupRequest += 1; pickupDetailRequest += 1; state.pickupForm = null; state.pickupFormKind = null; state.pickupCreateRequestKey = null; state.pickupSubmitting = false; state.pickupBusyId = null; state.pickupRestoreBusyId = null; }

      if (state.page === "purchasing") { purchasingRequest += 1; state.purchasingForm = null; state.purchasingFormKind = null; state.purchasingBusyId = null; state.purchasingRestoreBusyId = null; }

      if (state.page === "returns") { returnRequest += 1; state.returnForm = null; state.returnFormKind = null; state.returnCreateRequestKey = null; state.returnBusyId = null; state.returnRestoreBusyId = null; }

      if (state.page === "expenses") { expenseRequest += 1; state.expenseForm = null; state.expenseFormKind = null; state.expenseSubmitting = false; state.expenseBusyId = null; }

      Modal.close();

      state.page = page;

      renderSidebar(page);

      Render.page(page);

      await refresh();
    }

    //===========================================================================
    // Current Page
    //===========================================================================

    function currentPage() {
      return state.page;
    }

    //===========================================================================
    // Cached Master Data
    //===========================================================================

    function getProducts() {
      return Array.isArray(state.products)
        ? Utils.deepClone(state.products)
        : [];
    }

    function getPartners() {
      return Array.isArray(state.partners)
        ? Utils.deepClone(state.partners)
        : [];
    }

    function ensureProductsLoaded() {
      return loadProductsCache(false);
    }

    function ensurePartnersLoaded() {
      return loadPartnersCache(false);
    }

    function loadProductsCache(forceReload) {
      if (productsLoading) {
        return productsLoading;
      }

      if (productsLoaded && !forceReload) {
        return Promise.resolve(getProducts());
      }

      productsLoading = Api.Product.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load products failed.",
            );
          }

          state.products = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          productsLoaded = true;

          return getProducts();
        })
        .catch((error) => {
          productsLoaded = false;
          Toast.error(readableLoadError(error, "Load products failed."));
          throw notifiedLoadError(error, "Load products failed.");
        })
        .finally(() => {
          productsLoading = null;
        });

      return productsLoading;
    }

    function loadPartnersCache(forceReload) {
      if (partnersLoading) {
        return partnersLoading;
      }

      if (partnersLoaded && !forceReload) {
        return Promise.resolve(getPartners());
      }

      partnersLoading = Api.Partner.list()
        .then((response) => {
          if (!response?.success) {
            throw masterDataError(
              response?.message || "Load partners failed.",
            );
          }

          state.partners = Utils.deepClone(
            Array.isArray(response.data) ? response.data : [],
          );
          partnersLoaded = true;

          return getPartners();
        })
        .catch((error) => {
          partnersLoaded = false;
          Toast.error(readableLoadError(error, "Load partners failed."));
          throw notifiedLoadError(error, "Load partners failed.");
        })
        .finally(() => {
          partnersLoading = null;
        });

      return partnersLoading;
    }

    function masterDataError(message) {
      return new Error(message);
    }

    function notifiedLoadError(error, fallback) {
      const notified = new Error(readableLoadError(error, fallback));
      notified.appNotified = true;
      return notified;
    }

    function readableLoadError(error, fallback) {
      return typeof error?.message === "string" && error.message.trim()
        ? error.message
        : fallback;
    }

    //===========================================================================
    // Refresh
    //===========================================================================

    async function refresh() {
      switch (state.page) {
        case "dashboard":
          await loadDashboard();

          break;

        case "products":
          await loadProducts();

          break;

        case "partners":
          await loadPartners();

          break;

        case "pickups":
          await loadPickups();

          break;

        case "returns":
          await loadReturns();

          break;

        case "purchasing":
          await loadPurchasing();

          break;

        case "expenses":
          await loadExpenses();

          break;

        case "settings":
          await loadSettings();

          break;

        case "logs":
          await loadLogs();

          break;
      }
    }

    //===========================================================================
    // Logs
    //===========================================================================

    function logsFilterValues() {
      const preset = DOM.$("logs-preset")?.value || "CURRENT_MONTH";
      return { preset, dateFrom: preset === "CUSTOM" ? DOM.$("logs-date-from")?.value || "" : "", dateTo: preset === "CUSTOM" ? DOM.$("logs-date-to")?.value || "" : "", level: DOM.$("logs-level")?.value || "", category: DOM.$("logs-category")?.value || "", module: DOM.$("logs-module")?.value || "", action: DOM.$("logs-action")?.value || "", status: DOM.$("logs-status")?.value || "", search: DOM.$("logs-search")?.value || "" };
    }

    function renderFilterState(module, options = {}) {
      const toolbar = document.querySelector(`[data-filter-toolbar="${module}"]`);
      if (!toolbar) return;
      const active = Boolean(options.active);
      const loading = Boolean(options.loading);
      toolbar.setAttribute("aria-busy", String(loading));
      toolbar.querySelectorAll("input, select, button").forEach((control) => {
        control.disabled = loading || (control.dataset.filterClear !== undefined && !active);
      });
      const feedback = toolbar.querySelector(`[data-filter-feedback="${module}"]`);
      if (feedback) {
        DOM.text(feedback, loading ? "Updating filters..." : active ? "Filters active" : "No filters active");
        feedback.classList.toggle("font-medium", active && !loading);
        feedback.classList.toggle("text-blue-700", active && !loading);
        feedback.classList.toggle("text-slate-500", !active || loading);
      }
    }

    function syncFilterToolbar(module) {
      const settings = {
        products: { active: state.productMode !== "active" || Boolean(state.productSearch), loading: state.productLoading },
        partners: { active: state.partnerMode !== "active" || Boolean(state.partnerSearch), loading: state.partnerLoading },
        pickups: { active: state.pickupMode !== "active" || Boolean(String(state.pickupSearch || "").trim()), loading: state.pickupLoading },
        returns: { active: state.returnMode !== "active" || Boolean(String(state.returnSearch || "").trim()), loading: state.returnLoading },
        purchasing: { active: state.purchasingMode !== "active" || Boolean(String(state.purchasingSearch || "").trim()), loading: state.purchasingLoading },
        expenses: { active: state.expenseMode !== "active" || Boolean(state.expenseSearch[state.expenseMode]), loading: state.expenseLoading },
        logs: { active: state.logsFilters.preset !== "CURRENT_MONTH" || ["dateFrom", "dateTo", "level", "category", "module", "action", "status", "search"].some((key) => Boolean(state.logsFilters[key])), loading: false },
      };
      renderFilterState(module, settings[module] || {});
    }

    function validPageSize(value) { const size = Number(value); return [10, 15, 25, 50, 100].indexOf(size) >= 0 ? size : 15; }

    const paginationRenderers = {};
    function paginationState(module, mode = "active") {
      if (!state.pagination[module]) state.pagination[module] = { pageSize: state.defaultPageSize, explicit: false, modes: {} };
      const moduleState = state.pagination[module];
      if (!moduleState.modes[mode]) moduleState.modes[mode] = { page: 1, totalRows: 0, totalPages: 1 };
      return { moduleState, modeState: moduleState.modes[mode] };
    }
    function paginateRows(module, mode, rows, containerId, infoId, label, rerender) {
      const current = paginationState(module, mode); const meta = Pagination.calculate(rows, current.modeState.page, current.moduleState.pageSize);
      Object.assign(current.modeState, { page: meta.page, totalRows: meta.totalRows, totalPages: meta.totalPages });
      if (typeof rerender === "function") paginationRenderers[`${module}:${mode}`] = rerender;
      if (infoId) Render.mount(infoId, Pagination.summary(meta, Utils.escapeHTML(label || "data")));
      if (containerId) Render.mount(containerId, Pagination.controls(Object.assign({ module, mode }, meta)));
      return meta.data;
    }
    function resetPagination(module, mode) { paginationState(module, mode).modeState.page = 1; }
    function bindPaginationActions() {
      document.addEventListener("click", (event) => { const button = event.target.closest("[data-pagination-action]"); if (!button || button.disabled) return; const module = button.dataset.paginationModule; if (["products", "partners", "pickups", "purchasing", "returns", "expenses"].includes(module)) return; const mode = button.dataset.paginationMode || "active"; const current = paginationState(module, mode); current.modeState.page += button.dataset.paginationAction === "previous" ? -1 : 1; paginationRenderers[`${module}:${mode}`]?.(); });
      document.addEventListener("change", (event) => { const select = event.target.closest("[data-pagination-size]"); if (!select) return; const module = select.dataset.paginationSize; if (["products", "partners", "pickups", "purchasing", "returns", "expenses"].includes(module)) return; const mode = select.dataset.paginationMode || "active"; const current = paginationState(module, mode); current.moduleState.pageSize = validPageSize(select.value); current.moduleState.explicit = true; current.modeState.page = 1; paginationRenderers[`${module}:${mode}`]?.(); });
    }

    function applyDefaultPageSize(value, rerenderCurrent = false) {
      state.defaultPageSize = validPageSize(value);
      Object.keys(state.pagination).forEach((module) => {
        if (!state.pagination[module].explicit) state.pagination[module].pageSize = state.defaultPageSize;
      });
      if (!state.logsPageSizeSelected) state.logsPageSize = state.defaultPageSize;
      if (rerenderCurrent) {
        const currentMode = state.page === "products" ? state.productMode
          : state.page === "partners" ? state.partnerMode
            : state.page === "pickups" ? state.pickupMode
              : state.page === "expenses" ? state.expenseMode
                : state.page === "returns" ? state.returnMode : "active";
        paginationRenderers[`${state.page}:${currentMode}`]?.();
      }
    }

    async function loadDefaultPageSize() {
      try {
        const settings = await ensureSettingsLoaded();
        const setting = settings.find((item) => item.key === "DEFAULT_PAGE_SIZE");
        const previous = state.logsPageSize;
        applyDefaultPageSize(setting?.valid === false ? 15 : setting?.value, true);
        if (state.page === "logs" && state.logsPageSize !== previous) { state.logsPage = 1; loadLogs(); }
      } catch (error) { applyDefaultPageSize(15, true); }
    }

    function ensureSettingsLoaded(forceReload = false) {
      if (!forceReload && settingsLoaded) return Promise.resolve(Utils.deepClone(state.settings));
      if (!forceReload && settingsLoading) return settingsLoading;
      settingsLoading = Api.Settings.list().then((response) => {
        if (!response?.success || !Array.isArray(response.data)) throw new Error(response?.message || "Settings could not be loaded.");
        state.settings = Utils.deepClone(response.data);
        settingsLoaded = true;
        return Utils.deepClone(state.settings);
      }).finally(() => { settingsLoading = null; });
      return settingsLoading;
    }

    function applyLogsFilterControls() {
      const preset = DOM.$("logs-preset"); if (!preset) return;
      preset.value = state.logsFilters.preset;
      ["date-from", "date-to", "level", "category", "module", "action", "status", "search"].forEach((suffix) => { const key = suffix.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); const input = DOM.$(`logs-${suffix}`); if (input) input.value = state.logsFilters[key] || ""; });
      document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", preset.value !== "CUSTOM"));
      const size = DOM.$("logs-page-size"); if (size) size.value = String(state.logsPageSize);
    }

    function resolvedLogsFilters(filters) {
      const now = new Date(); const pad = (value) => String(value).padStart(2, "0"); const ymd = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      let from = filters.dateFrom; let to = filters.dateTo; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (filters.preset === "TODAY") from = to = ymd(start);
      if (filters.preset === "LAST_7_DAYS") { const d = new Date(start); d.setDate(d.getDate() - 6); from = ymd(d); to = ymd(start); }
      if (filters.preset === "CURRENT_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth(), 1)); to = ymd(new Date(start.getFullYear(), start.getMonth() + 1, 0)); }
      if (filters.preset === "PREVIOUS_MONTH") { from = ymd(new Date(start.getFullYear(), start.getMonth() - 1, 1)); to = ymd(new Date(start.getFullYear(), start.getMonth(), 0)); }
      if (filters.preset === "CURRENT_YEAR") { from = `${start.getFullYear()}-01-01`; to = `${start.getFullYear()}-12-31`; }
      return Object.assign({}, filters, { dateFrom: from, dateTo: to });
    }

    async function loadLogs() {
      applyLogsFilterControls(); const request = ++logsRequest; LogsPresenter.renderLoading(); renderFilterState("logs", { active: true, loading: true });
      const filters = resolvedLogsFilters(Utils.deepClone(state.logsFilters));
      try {
        const response = await Api.Logs.page(filters, { page: state.logsPage, pageSize: state.logsPageSize });
        if (request !== logsRequest || state.page !== "logs") return;
        if (!response?.success || !response.data?.list || !response.data?.summary) throw new Error(response?.message || "Logs could not be loaded.");
        LogsPresenter.render(response.data.list); LogsPresenter.renderSummary(response.data.summary); applyLogsFilterControls(); syncFilterToolbar("logs");
      } catch (error) { if (request !== logsRequest || state.page !== "logs") return; LogsPresenter.renderError(readableLoadError(error, "Logs could not be loaded.")); syncFilterToolbar("logs"); }
    }

    function openLogDetail(serializedRow) {
      if (state.page !== "logs") return false;
      let row = {};
      try { row = JSON.parse(String(serializedRow || "{}")); } catch (error) { return false; }
      Modal.open({ title: "Log Detail", width: "lg", body: LogsPresenter.renderDetail(row), footer: '<button type="button" data-logs-detail-close class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Close</button>' });
      return true;
    }

    function closeLogDetail() {
      if (state.page !== "logs") return false;
      Modal.close();
      return true;
    }

    function changeLogsPage(action) {
      if (state.page !== "logs") return false;
      if (action === "previous" && state.logsPage > 1) state.logsPage -= 1;
      else if (action === "next") state.logsPage += 1;
      else return false;
      loadLogs();
      return true;
    }

    function bindLogsActions() {
      const applyFilters = () => {
        const next = logsFilterValues(); const error = DOM.$("logs-filter-error");
        const incomplete = next.preset === "CUSTOM" && (!next.dateFrom || !next.dateTo);
        const invalid = next.preset === "CUSTOM" && !incomplete && next.dateFrom > next.dateTo;
        if (error) { DOM.text(error, invalid ? "Choose a valid Custom date range." : ""); error.classList.toggle("hidden", !invalid); }
        if (incomplete || invalid) return;
        state.logsFilters = next; state.logsPage = 1; loadLogs();
      };
      const debouncedFilters = Utils.debounce(applyFilters, 300);
      document.addEventListener("change", (event) => {
        if (state.page !== "logs" || !event.target?.id?.startsWith("logs-")) return;
        if (event.target.id === "logs-page-size") return;
        if (event.target.id === "logs-preset") document.querySelectorAll(".logs-custom").forEach((node) => node.classList.toggle("hidden", event.target.value !== "CUSTOM"));
        applyFilters();
      });
      document.addEventListener("input", (event) => { if (state.page === "logs" && ["logs-search", "logs-module"].indexOf(event.target?.id) >= 0) debouncedFilters(); });
      document.addEventListener("keydown", (event) => { if (state.page === "logs" && event.target?.id === "logs-search" && event.key === "Enter") { event.preventDefault(); applyFilters(); } });
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-logs-action]"); if (!button || state.page !== "logs") return;
        const action = button.dataset.logsAction;
        if (action === "clear") { state.logsFilters = { preset: "CURRENT_MONTH", dateFrom: "", dateTo: "", level: "", category: "", module: "", action: "", status: "", search: "" }; state.logsPage = 1; return loadLogs(); }
      });
      document.addEventListener("change", (event) => { if (event.target?.id === "logs-page-size" && state.page === "logs") { state.logsPageSize = validPageSize(event.target.value); state.logsPageSizeSelected = true; state.logsPage = 1; loadLogs(); } });
    }

    //===========================================================================
    // Settings
    //===========================================================================

    async function loadSettings() {
      const request = ++settingsRequest;
      SettingsPresenter.renderLoading();
      try {
        await ensureSettingsLoaded();
      } catch (error) {
        if (request !== settingsRequest || state.page !== "settings") return;
        Toast.error(readableLoadError(error, "Settings could not be loaded."));
        SettingsPresenter.renderError();
        return;
      }
      if (request !== settingsRequest || state.page !== "settings") return;
      state.settingBusyKey = null;
      SettingsPresenter.render(state.settings);
    }

    function settingInputValue(key) {
      const input = document.querySelector(`[data-setting-input="${CSS.escape(key)}"]`);
      const setting = state.settings.find((item) => item.key === key);
      if (!input || !setting) throw new Error("Setting input is unavailable.");
      if (setting.type === "BOOLEAN") return input.checked;
      if (setting.type === "JSON") {
        try { JSON.parse(input.value); } catch (error) { throw new Error("Value must be valid JSON."); }
      }
      return input.value;
    }

    async function mutateSetting(key, reset) {
      if (state.settingBusyKey || state.page !== "settings") return false;
      const setting = state.settings.find((item) => item.key === key);
      if (!setting || !setting.editable) return false;
      let value;
      try { value = reset ? undefined : settingInputValue(key); }
      catch (error) { Toast.error(error.message); return false; }
      state.settingBusyKey = key;
      SettingsPresenter.render(state.settings, key);
      const request = ++settingsRequest;
      try {
        const response = reset ? await Api.Settings.reset(key) : await Api.Settings.update(key, value);
        if (request !== settingsRequest || state.page !== "settings") return false;
        if (!response?.success) {
          Toast.error(response?.errors?.[0]?.message || response?.message || "Setting could not be saved.");
          state.settingBusyKey = null;
          SettingsPresenter.render(state.settings);
          return false;
        }
        Toast.success(reset ? "Setting reset to default." : "Setting saved.");
        if (key === "DEFAULT_PAGE_SIZE") applyDefaultPageSize(response.data?.value);
        state.settings = state.settings.map((item) => item.key === key ? Utils.deepClone(response.data) : item);
        settingsLoaded = true;
        state.settingBusyKey = null;
        SettingsPresenter.render(state.settings);
        return true;

    async function restoreReturn(id) {
      const returnId = String(id || "").trim();

      if (!returnId || state.page !== "returns" || state.returnMode !== "deleted" || state.returnRestoreBusyId || state.returnRestoreConfirming) {
        return false;
      }

      const ret = state.deletedReturns.find((item) => String(item?.ID) === returnId);

      if (!ret) {
        Toast.error("This Return is no longer available for restore.");
        return false;
      }

      if (ret.canRestore !== true) {
        Toast.error(ret.restoreReason || "Return cannot be restored.");
        return false;
      }

      let restoreSucceeded = false;
      let restoreAttempted = false;
      state.returnRestoreConfirming = true;

      let confirmed = false;

      try {
        confirmed = await Dialog.confirm({
          title: "Restore Return",
          intent: "restore",
          confirmText: "Restore",
          loadingText: "Restoring...",
          message: `Restore Return <strong>${Utils.escapeHTML(returnId)}</strong>?`,
          onConfirm: async () => {
            if (state.returnRestoreBusyId || restoreAttempted) {
              return false;
            }

            restoreAttempted = true;
            state.returnRestoreBusyId = returnId;
            renderReturns();

            try {
              const response = await Api.Return.restore(returnId);

              if (!response?.success) {
                Toast.error(response?.message || "Return could not be restored.");
                return true;
              }

              restoreSucceeded = true;
              Toast.success(response.message || "Return restored.");
              return true;
            } catch (error) {
              Toast.error(readableLoadError(error, "Return could not be restored. Please try again."));
              return true;
            } finally {
              state.returnRestoreBusyId = null;
            }
          },
        });
      } finally {
        state.returnRestoreConfirming = false;
      }

      if (!confirmed) {
        if (state.page === "returns" && state.returnMode === "deleted") renderReturns();
        return false;
      }

      if (state.page === "returns" && state.returnMode === "deleted") await loadReturns();
      return restoreSucceeded;
    }

        if (request !== expenseRequest || state.page !== "expenses" || state.expenseFormKind !== "edit") return false;
        if (!response?.success || !response.data || typeof response.data !== "object") throw new Error(response?.message || "Expense could not be loaded for editing.");
        state.expenseForm = { ID: cleanId, Tanggal: ExpensesPresenter.dateInputValue(response.data.Tanggal), Kategori: String(response.data.Kategori ?? ""), Keterangan: String(response.data.Keterangan ?? ""), Nominal: numericExpenseInput(response.data.Nominal) };
        Modal.body(ExpensesPresenter.renderEditForm({ form: state.expenseForm })); Modal.footer(ExpensesPresenter.renderFormFooter("edit")); DOM.$("inp-expense-edit-date")?.focus(); return true;
      } catch (error) {
        if (request !== expenseRequest || state.page !== "expenses") return false;
        Toast.error(readableLoadError(error, "Expense could not be loaded for editing. Please try again.")); closeExpenseModal(); return false;
      }
    }

    async function viewExpense(id) {
      const cleanId = String(id || "").trim(); if (!cleanId || state.page !== "expenses") return false;
      const request = ++expenseRequest; state.expenseFormKind = "detail";
      Modal.open({ title: "Expense Detail", width: "lg", body: Components.loading("Loading expense detail..."), footer: ExpensesPresenter.renderDetailFooter() });
      try {
        const response = await Api.Expense.get(cleanId);
        if (request !== expenseRequest || state.page !== "expenses" || state.expenseFormKind !== "detail") return false;
        if (!response?.success || !response.data || typeof response.data !== "object") throw new Error(response?.message || "Expense detail could not be loaded.");
        Modal.body(ExpensesPresenter.renderDetail(response.data)); return true;
      } catch (error) { if (request === expenseRequest && state.page === "expenses") { Toast.error(readableLoadError(error, "Expense detail could not be loaded. Please try again.")); closeExpenseModal(); } return false; }
    }

    function updateExpenseForm(kind, field, value) {
      if (kind !== state.expenseFormKind || !state.expenseForm || ["Tanggal", "Kategori", "Keterangan", "Nominal"].indexOf(field) < 0) return;
      state.expenseForm[field] = value; ExpensesPresenter.clearFieldError(kind, field);
    }

    function validateExpenseForm(kind) {
      const form = state.expenseForm || {}; const date = String(form.Tanggal ?? "").trim(); const category = String(form.Kategori ?? "").trim(); const description = String(form.Keterangan ?? "").trim(); const amountText = String(form.Nominal ?? "").trim(); const amount = Format.nominalValue(amountText);
      const invalid = (field, message, suffix) => ({ valid: false, field, message, element: DOM.$(`inp-expense-${kind}-${suffix}`) });
      if (!date) return invalid("Tanggal", "Date is required.", "date");
      if (!ExpensesPresenter.dateInputValue(date)) return invalid("Tanggal", "Date must use YYYY-MM-DD.", "date");
      if (!category) return invalid("Kategori", "Category is required.", "category");
      if (category.length > 100) return invalid("Kategori", "Category cannot exceed 100 characters.", "category");
      if (!description) return invalid("Keterangan", "Description is required.", "description");
      if (description.length > 255) return invalid("Keterangan", "Description cannot exceed 255 characters.", "description");
      if (!amountText) return invalid("Nominal", "Amount is required.", "amount");
      if (!Number.isFinite(amount)) return invalid("Nominal", "Amount must be a valid number.", "amount");
      if (amount < 0) return invalid("Nominal", "Amount cannot be negative.", "amount");
      const id = String(form.ID || "").trim();
      if (kind === "edit" && !id) return { valid: false, field: "ID", message: "Expense ID is unavailable.", element: null };
      return { valid: true, id, payload: { Tanggal: date, Kategori: category, Keterangan: description, Nominal: amount } };
    }

    async function submitExpenseForm(kind) {
      if (kind !== state.expenseFormKind || !state.expenseForm || state.expenseSubmitting || state.page !== "expenses") return false;
      const validation = validateExpenseForm(kind);
      if (!validation.valid) { if (!ExpensesPresenter.showFieldError(kind, validation.field, validation.message)) Toast.error(validation.message); validation.element?.focus(); return false; }
      state.expenseSubmitting = true; Modal.footer(ExpensesPresenter.renderFormFooter(kind, { loading: true }));
      try {
        const response = kind === "create" ? await Api.Expense.create(validation.payload) : await Api.Expense.update(validation.id, validation.payload);
        if (!response?.success) { Toast.error(response?.message || `Expense could not be ${kind === "create" ? "created" : "updated"}.`); return false; }
        Toast.success(response.message || `Expense ${kind === "create" ? "created" : "updated"}.`); closeExpenseModal(true); await loadExpenses(); return true;
      } catch (error) { Toast.error(readableLoadError(error, `Expense could not be ${kind === "create" ? "created" : "updated"}. Please try again.`)); return false; }
      finally { state.expenseSubmitting = false; if (state.expenseFormKind === kind) Modal.footer(ExpensesPresenter.renderFormFooter(kind)); }
    }

    function closeExpenseModal(force = false) {
      if (state.expenseSubmitting && !force) return false;
      expenseRequest += 1; state.expenseForm = null; state.expenseFormKind = null; Modal.close(); return true;
    }

    async function deleteExpense(id) {
      const cleanId = String(id || "").trim(); if (!cleanId || state.page !== "expenses" || state.expenseMode !== "active" || state.expenseBusyId || state.expenseConfirming) return false;
      const row = state.expenses.find((item) => String(item?.ID) === cleanId); if (!row) { Toast.error("This Expense is no longer available."); return false; }
      state.expenseConfirming = true; let succeeded = false; let attempted = false;
      try { await Dialog.confirm({ title: "Delete Expense", intent: "delete", confirmText: "Delete", loadingText: "Deleting...", message: ExpensesPresenter.renderDeleteMessage(row), onConfirm: async () => {
        if (attempted || state.expenseBusyId || state.page !== "expenses" || state.expenseMode !== "active") return false;
        attempted = true; state.expenseBusyId = cleanId; renderExpenses();
        try { const response = await Api.Expense.remove(cleanId); if (!response?.success) { Toast.error(response?.message || "Expense could not be deleted."); return true; } succeeded = true; Toast.success(response.message || "Expense deleted."); state.expenses = state.expenses.filter((item) => String(item.ID) !== cleanId); renderExpenses(); return true; }
        catch (error) { Toast.error(readableLoadError(error, "Expense could not be deleted. Please try again.")); return true; }
        finally { state.expenseBusyId = null; }
      } }); if (succeeded && state.page === "expenses" && state.expenseMode === "active") await loadExpenses(); } finally { state.expenseConfirming = false; if (state.page === "expenses" && state.expenseMode === "active") renderExpenses(); }
      return succeeded;
    }

    async function restoreExpense(id) {
      const cleanId = String(id || "").trim(); if (!cleanId || state.page !== "expenses" || state.expenseMode !== "trash" || state.expenseBusyId || state.expenseConfirming) return false;
      const row = state.deletedExpenses.find((item) => String(item?.ID) === cleanId); if (!row) { Toast.error("This deleted Expense is no longer available."); return false; }
      state.expenseConfirming = true; let succeeded = false; let attempted = false;
      try { await Dialog.confirm({ title: "Restore Expense", intent: "restore", confirmText: "Restore", loadingText: "Restoring...", message: ExpensesPresenter.renderRestoreMessage(row), onConfirm: async () => {
        if (attempted || state.expenseBusyId || state.page !== "expenses" || state.expenseMode !== "trash") return false;
        attempted = true; state.expenseBusyId = cleanId; renderExpenses();
        try { const response = await Api.Expense.restore(cleanId); if (!response?.success) { Toast.error(response?.message || "Expense could not be restored."); return true; } succeeded = true; Toast.success(response.message || "Expense restored."); state.deletedExpenses = state.deletedExpenses.filter((item) => String(item.ID) !== cleanId); renderExpenses(); return true; }
        catch (error) { Toast.error(readableLoadError(error, "Expense could not be restored. Please try again.")); return true; }
        finally { state.expenseBusyId = null; }
      } }); if (succeeded && state.page === "expenses" && state.expenseMode === "trash") await loadExpenses(); } finally { state.expenseConfirming = false; if (state.page === "expenses" && state.expenseMode === "trash") renderExpenses(); }
      return succeeded;
    }

    //===========================================================================
    // Search
    //===========================================================================

    function search(module, keyword) {
      switch (module) {
        case "products":
          searchProducts(keyword);

          break;

        case "partners":
          searchPartners(keyword);

          break;

        case "expenses":
          searchExpenses(keyword);

          break;

        case "pickups":
          searchPickups(keyword);

          break;

        case "returns":
          searchReturns(keyword);

          break;

        default:
          break;
      }
    }

    function clearFilters(module) {
      const inputIds = {
        products: "inp-product-search",
        partners: "inp-partner-search",
        pickups: "inp-pickup-search",
        returns: "inp-return-search",
        purchasing: "inp-purchasing-search",
        expenses: "inp-expense-search",
      };
      const input = DOM.$(inputIds[module]);
      if (input) input.value = "";
      if (module === "products") { state.productSearch = ""; resetPagination("products", "active"); return state.productMode === "active" ? renderProducts() : setProductMode("active"); }
      if (module === "partners") { state.partnerSearch = ""; resetPagination("partners", "active"); return state.partnerMode === "active" ? renderPartners() : setPartnerMode("active"); }
      if (module === "pickups") { state.pickupSearch = ""; resetPagination("pickups", "active"); return state.pickupMode === "active" ? renderPickups() : setPickupMode("active"); }
      if (module === "returns") { state.returnSearch = ""; resetPagination("returns", "active"); return state.returnMode === "active" ? renderReturns() : setReturnMode("active"); }
      if (module === "purchasing") { state.purchasingSearch = ""; resetPagination("purchasing", "active"); return state.purchasingMode === "active" ? renderPurchasing() : setPurchasingMode("active"); }
      if (module === "expenses") { state.expenseSearch.active = ""; state.expenseSearch.trash = ""; resetPagination("expenses", "active"); return state.expenseMode === "active" ? renderExpenses() : setExpenseMode("active"); }
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,
      navigate,
      refresh,
      currentPage,
      search,
      clearFilters,
      changeDashboardRange,
      setPickupMode,
      restorePickup,
      refreshPickups,
      changePickupPage,
      changePickupPageSize,
      openCreatePickup,
      openEditPickup,
      viewPickup,
      updatePickupForm,
      addPickupDetail,
      removePickupDetail,
      submitPickupForm,
      deletePickup,
      closePickupModal,
      setExpenseMode,
      refreshExpenses,
      changeExpensePage,
      changeExpensePageSize,
      openCreateExpense,
      openEditExpense,
      viewExpense,
      updateExpenseForm,
      submitExpenseForm,
      closeExpenseModal,
      deleteExpense,
      restoreExpense,

      refreshReturns,
      setReturnMode,
      searchReturns,
      changeReturnPage,
      changeReturnPageSize,
      openCreateReturn,
      openEditReturn,
      viewReturn,
      updateReturnForm,
      submitReturnForm,
      closeReturnModal,
      deleteReturn,
      restoreReturn,

      setPurchasingMode,
      searchPurchasing,
      refreshPurchasing,
      changePurchasingPage,
      changePurchasingPageSize,
      openCreatePurchasing,
      openEditPurchasing,
      viewPurchasing,
      updatePurchasingForm,
      submitPurchasingForm,
      closePurchasingModal,
      deletePurchasing,
      restorePurchasing,

      loadProducts,
      setProductMode,
      refreshProducts,
      changeProductPage,
      changeProductPageSize,
      openCreateProduct,
      openEditProduct,
      saveProduct,
      deleteProduct,
      restoreProduct,
      closeProductModal,

      loadPartners,
      setPartnerMode,
      refreshPartners,
      changePartnerPage,
      changePartnerPageSize,
      openCreatePartner,
      openEditPartner,
      savePartner,
      deletePartner,
      restorePartner,
      closePartnerModal,
      openLogDetail,
      closeLogDetail,
      changeLogsPage,
    });
  })();

  //=============================================================================
  // Bootstrap
  //=============================================================================

  window.addEventListener(
    "load",

    App.init,
  );
</script>
