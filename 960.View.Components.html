<template id="components-template">

  <!-- =============================================================== -->
  <!-- Empty State -->
  <!-- =============================================================== -->

  <template id="component-empty">

    <div class="py-16 text-center">

      <i class="fa-regular fa-folder-open text-5xl text-slate-300"></i>

      <h3 class="mt-4 text-lg font-semibold text-slate-700">

        No Data

      </h3>

      <p class="mt-2 text-sm text-slate-500">

        There is no data available.

      </p>

    </div>

  </template>



  <!-- =============================================================== -->
  <!-- Loading -->
  <!-- =============================================================== -->

  <template id="component-loading">

    <div class="py-16 text-center">

      <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>

      <p class="mt-4 text-slate-500">

        Loading...

      </p>

    </div>

  </template>



  <!-- =============================================================== -->
  <!-- Badge Active -->
  <!-- =============================================================== -->

  <template id="badge-active">

    <span class="px-3 py-1 rounded-full text-xs bg-green-100 text-green-700">

      Active

    </span>

  </template>



  <!-- =============================================================== -->
  <!-- Badge Inactive -->
  <!-- =============================================================== -->

  <template id="badge-inactive">

    <span class="px-3 py-1 rounded-full text-xs bg-slate-200 text-slate-600">

      Inactive

    </span>

  </template>



  <!-- =============================================================== -->
  <!-- Badge Deleted -->
  <!-- =============================================================== -->

  <template id="badge-deleted">

    <span class="px-3 py-1 rounded-full text-xs bg-red-100 text-red-700">

      Deleted

    </span>

  </template>



  <!-- =============================================================== -->
  <!-- Action Buttons -->
  <!-- =============================================================== -->

  <template id="component-actions">

    <div class="flex justify-center gap-2">

      <button
        class="btn-edit w-8 h-8 rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600">

        <i class="fa-solid fa-pen"></i>

      </button>

      <button
        class="btn-delete w-8 h-8 rounded-lg bg-red-100 hover:bg-red-200 text-red-600">

        <i class="fa-solid fa-trash"></i>

      </button>

    </div>

  </template>



  <!-- =============================================================== -->
  <!-- KPI Card -->
  <!-- =============================================================== -->

  <template id="component-kpi">

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

      <div class="flex items-center justify-between">

        <div>

          <p class="text-sm text-slate-500">

            Title

          </p>

          <h3 class="mt-2 text-3xl font-bold text-slate-800">

            0

          </h3>

        </div>

        <div
          class="w-14 h-14 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">

          <i class="fa-solid fa-chart-column text-xl"></i>

        </div>

      </div>

    </div>

  </template>



  <!-- =============================================================== -->
  <!-- Toast -->
  <!-- =============================================================== -->

  <template id="component-toast">

    <div
      class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl">

      Message

    </div>

  </template>



  <!-- =============================================================== -->
  <!-- Confirm -->
  <!-- =============================================================== -->

  <template id="component-confirm">

    <div class="text-center">

      <i class="fa-solid fa-circle-question text-5xl text-yellow-500"></i>

      <h3 class="mt-4 text-xl font-semibold">

        Confirmation

      </h3>

      <p class="mt-2 text-slate-500">

        Are you sure?

      </p>

    </div>

  </template>

</template>
