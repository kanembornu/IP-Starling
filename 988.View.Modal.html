<script>
  /**
   * =============================================================================
   * FILE        : 988.View.Modal
   * VERSION     : 1.0.0
   * DESCRIPTION : Modal Manager
   * =============================================================================
   */

  const Modal = (() => {
    //===========================================================================
    // Elements
    //===========================================================================

    function overlay() {
      return DOM.$("modal-overlay");
    }

    function titleElement() {
      return DOM.$("modal-title");
    }

    function bodyElement() {
      return DOM.$("modal-body");
    }

    function footerElement() {
      return DOM.$("modal-footer");
    }

    //===========================================================================
    // Title
    //===========================================================================

    function title(text) {
      DOM.text(
        titleElement(),

        text,
      );
    }

    //===========================================================================
    // Body
    //===========================================================================

    function body(content) {
      DOM.html(
        bodyElement(),

        content,
      );
    }

    //===========================================================================
    // Footer
    //===========================================================================

    function footer(content) {
      DOM.html(
        footerElement(),

        content,
      );
    }

    //===========================================================================
    // Open
    //===========================================================================

    function open(options = {}) {
      title(options.title || "");

      body(options.body || "");

      footer(options.footer || "");

      DOM.removeClass(
        overlay(),

        "hidden",
      );

      DOM.addClass(
        overlay(),

        "flex",
      );
    }

    //===========================================================================
    // Close
    //===========================================================================

    function close() {
      DOM.removeClass(
        overlay(),

        "flex",
      );

      DOM.addClass(
        overlay(),

        "hidden",
      );
    }

    //===========================================================================
    // Alert
    //===========================================================================

    function alert(message) {
      open({
        title: "Information",

        body: `

        <div class="py-6 text-center">

          <p>

            ${message}

          </p>

        </div>

      `,

        footer: `

        <button
          id="modal-ok"
          class="px-5 py-2 rounded-lg
                 bg-blue-600 text-white">

          OK

        </button>

      `,
      });

      const button = DOM.$("modal-ok");

      if (button) {
        button.addEventListener(
          "click",

          close,
        );
      }
    }

    //===========================================================================
    // Confirm
    //===========================================================================

    function confirm(message, callback) {
      open({
        title: "Confirmation",

        body: `

        <div class="py-6 text-center">

          <p>

            ${message}

          </p>

        </div>

      `,

        footer: `

        <div class="flex justify-end gap-3">

          <button
            id="modal-cancel"
            class="px-5 py-2 rounded-lg border">

            Cancel

          </button>

          <button
            id="modal-confirm"
            class="px-5 py-2 rounded-lg
                   bg-red-600 text-white">

            Confirm

          </button>

        </div>

      `,
      });

      DOM.$("modal-cancel")

        ?.addEventListener(
          "click",

          close,
        );

      DOM.$("modal-confirm")

        ?.addEventListener(
          "click",

          () => {
            close();

            if (typeof callback === "function") {
              callback();
            }
          },
        );
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      open,

      close,

      title,

      body,

      footer,

      alert,

      confirm,
    });
  })();
</script>
