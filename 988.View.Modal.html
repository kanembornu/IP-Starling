<script>
  /**
   * =============================================================================
   * FILE        : 988.View.Modal
   * VERSION     : 1.0.0
   * DESCRIPTION : Modal Manager
   * =============================================================================
   */

  const Modal = (() => {
    let returnFocus = null;
    //===========================================================================
    // Elements
    //===========================================================================

    function overlay() {
      return DOM.$("modal-overlay");
    }

    function titleElement() {
      return DOM.$("modal-title");
    }

    function bodyElement() {
      return DOM.$("modal-body");
    }

    function footerElement() {
      return DOM.$("modal-footer");
    }

    function windowElement() {
      return DOM.$("modal-window");
    }

    //===========================================================================
    // Initialize
    //===========================================================================

    function init() {
      const container = DOM.$("modal-container");

      const template = DOM.$("modal-template");

      if (!container || !template) {
        return false;
      }

      container.appendChild(template.content.cloneNode(true));

      overlay()?.addEventListener("keydown", handleKeydown);

      return true;
    }

    function focusableElements() {
      const dialog = windowElement();
      if (!dialog) return [];
      return Array.from(dialog.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
        .filter((element) => !element.closest(".hidden") && element.getAttribute("aria-hidden") !== "true");
    }

    function handleKeydown(event) {
      if (event.key === "Escape") {
        const closeButton = DOM.$("btn-modal-close");
        if (!closeButton?.disabled) {
          event.preventDefault();
          closeButton?.click();
        }
        return;
      }

      if (event.key !== "Tab") return;
      const focusable = focusableElements();
      if (!focusable.length) {
        event.preventDefault();
        windowElement()?.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    //===========================================================================
    // Title
    //===========================================================================

    function title(text) {
      DOM.text(
        titleElement(),

        text,
      );
    }

    //===========================================================================
    // Body
    //===========================================================================

    function body(content) {
      DOM.html(
        bodyElement(),

        content,
      );
    }

    //===========================================================================
    // Footer
    //===========================================================================

    function footer(content) {
      DOM.html(
        footerElement(),

        content,
      );

      const closeButton = DOM.$("btn-modal-close");
      if (closeButton) closeButton.disabled = Boolean(footerElement()?.querySelector('[aria-busy="true"]'));
    }

    //===========================================================================
    // Open
    //===========================================================================
    const WIDTH = Object.freeze({
      sm: "max-w-md",

      md: "max-w-2xl",

      lg: "max-w-4xl",

      xl: "max-w-6xl",
    });

    function open(options = {}) {
      if (!overlay() || overlay()?.classList.contains("hidden")) returnFocus = document.activeElement;

      if (!DOM.$("modal-overlay")) {
        init();
      }

      const closeButton = DOM.$("btn-modal-close");

      if (closeButton) closeButton.onclick = () => { if (!closeButton.disabled) close(); };

      title(options.title || "");

      body(options.body || "");

      footer(options.footer || "");

      const dialog = windowElement();

      if (dialog) {
        dialog.classList.remove(WIDTH.sm, WIDTH.md, WIDTH.lg, WIDTH.xl);

        dialog.classList.add(WIDTH[options.width] || WIDTH.md);
      }

      const modal = overlay();

      if (modal) {
        modal.classList.remove("hidden");

        modal.classList.add("flex");

        modal.setAttribute("aria-hidden", "false");
      }

      const ov = overlay();

      if (ov) {
        ov.classList.remove("hidden");
        ov.classList.add("flex");
      }

      (focusableElements()[0] || windowElement())?.focus();
    }

    //===========================================================================
    // Close
    //===========================================================================

    function close() {
      DOM.removeClass(
        overlay(),

        "flex",
      );

      DOM.addClass(
        overlay(),

        "hidden",
      );

      overlay()?.setAttribute("aria-hidden", "true");

      if (returnFocus?.isConnected) returnFocus.focus();
      returnFocus = null;
    }

    //===========================================================================
    // Alert
    //===========================================================================

    function alert(message) {
      open({
        title: "Information",

        body: `

        <div class="py-6 text-center">

          <p>

            ${message}

          </p>

        </div>

      `,

        footer: `

        <button
          id="modal-ok"
          class="px-5 py-2 rounded-lg
                 bg-blue-600 text-white">

          OK

        </button>

      `,
      });

      const button = DOM.$("modal-ok");

      if (button) {
        button.addEventListener(
          "click",

          close,
        );
      }
    }

    //===========================================================================
    // Confirm
    //===========================================================================

    function confirm(message, callback) {
      open({
        title: "Confirmation",

        body: `

        <div class="py-6 text-center">

          <p>

            ${message}

          </p>

        </div>

      `,

        footer: `

        <div class="flex justify-end gap-3">

          <button
            id="modal-cancel"
            class="px-5 py-2 rounded-lg border">

            Cancel

          </button>

          <button
            id="modal-confirm"
            class="px-5 py-2 rounded-lg
                   bg-red-600 text-white">

            Confirm

          </button>

        </div>

      `,
      });

      DOM.$("modal-cancel")

        ?.addEventListener(
          "click",

          close,
        );

      DOM.$("modal-confirm")

        ?.addEventListener(
          "click",

          () => {
            close();

            if (typeof callback === "function") {
              callback();
            }
          },
        );
    }

    //===========================================================================
    // Loading
    //===========================================================================

    function loading(show = true) {
      const footer = footerElement();

      if (!footer) return;

      footer
        .querySelectorAll("button")

        .forEach((button) => {
          button.disabled = show;

          button.classList.toggle(
            "opacity-50",

            show,
          );

          button.classList.toggle(
            "cursor-not-allowed",

            show,
          );
        });
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      init,

      open,

      close,

      title,

      body,

      footer,

      alert,

      confirm,

      loading,
    });
  })();
</script>
