<script>
  const LogsPresenter = (() => {
    const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    function renderLoading() { Render.mount("logs-state", '<div class="p-3 text-center text-sm text-slate-500">Loading logs...</div>'); }
    function renderError(message) { Render.mount("logs-body", ""); Render.mount("logs-state", `<div class="p-10 text-center text-red-600">${escape(message || "Logs could not be loaded.")}</div>`); }
    function renderSummary(summary = {}) {
      const cards = [["Total Log", summary.total || 0], ["Audit", summary.audit || 0], ["Peringatan", summary.warnings || 0], ["Error", summary.errors || 0]];
      Render.mount("logs-summary", cards.map(([label, value]) => `<div class="rounded-xl border bg-white p-4 shadow-sm"><div class="text-xs uppercase text-slate-500">${escape(label)}</div><div class="mt-1 text-2xl font-bold text-slate-800">${escape(value)}</div></div>`).join(""));
    }
    function detail(row) {
      const blocks = [["Category", row.Category], ["Module", row.Module], ["Action", row.Action], ["Actor", row.Actor], ["Duration", row.DurationMs === "" ? "" : `${row.DurationMs} ms`], ["Before", row.BeforeData], ["After", row.AfterData], ["Context", row.Context], ["Error", [row.ErrorName, row.ErrorMessage, row.ErrorStack].filter(Boolean).join("\n")], ["Correlation ID", row.CorrelationID], ["Source", row.Source]].filter((item) => item[1]);
      return `<details><summary class="cursor-pointer text-blue-600">View</summary><div class="mt-2 min-w-0 space-y-2">${blocks.map(([label, value]) => `<div><strong>${escape(label)}</strong><pre class="mt-1 max-h-56 overflow-y-auto whitespace-pre-wrap break-all rounded bg-slate-100 p-2 text-xs">${escape(value)}</pre></div>`).join("")}</div></details>`;
    }
    function render(payload = {}) {
      const rows = Array.isArray(payload.data) ? payload.data : [];
      Render.mount("logs-state", rows.length ? "" : '<div class="p-10 text-center text-slate-500">No logs match the active filters.</div>');
      Render.mount("logs-body", rows.map((row) => `<tr class="border-t hover:bg-slate-50"><td class="px-3 py-3 align-top whitespace-normal break-words text-slate-600">${escape(row.Timestamp)}</td><td class="px-3 py-3 align-top break-words">${escape(row.Level)}</td><td class="hidden px-3 py-3 align-top break-words lg:table-cell">${escape(row.Module)}</td><td class="hidden px-3 py-3 align-top break-words xl:table-cell">${escape(row.Action)}</td><td class="px-3 py-3 align-top break-all">${escape([row.EntityType, row.EntityID].filter(Boolean).join(" · "))}</td><td class="px-3 py-3 align-top break-words">${escape(row.Status)}</td><td class="px-3 py-3 align-top whitespace-normal break-words leading-relaxed">${escape(row.Message)}</td><td class="px-3 py-3 align-top break-words">${detail(row)}</td></tr>`).join(""));
      const label = DOM.$("logs-page-label"); if (label) DOM.text(label, `${payload.total || 0} entries · page ${payload.page || 1} of ${payload.totalPages || 0}`);
      document.querySelector('[data-logs-action="previous"]')?.toggleAttribute("disabled", (payload.page || 1) <= 1);
      document.querySelector('[data-logs-action="next"]')?.toggleAttribute("disabled", (payload.page || 1) >= (payload.totalPages || 0));
    }
    return Object.freeze({ renderLoading, renderError, renderSummary, render });
  })();
</script>
