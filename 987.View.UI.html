<script>

/**
 * =============================================================================
 * FILE        : 987.View.UI
 * VERSION     : 1.0.0
 * DESCRIPTION : UI Components
 * =============================================================================
 */

const UI = (() => {

  //===========================================================================
  // Badge
  //===========================================================================

  function badge(text, active = true) {

    const color = active
      ? "bg-green-100 text-green-700"
      : "bg-slate-200 text-slate-600";

    return `
      <span class="px-3 py-1 rounded-full text-xs font-medium ${color}">
        ${text}
      </span>
    `;

  }



  //===========================================================================
  // Deleted Badge
  //===========================================================================

  function deletedBadge() {

    return `
      <span class="px-3 py-1 rounded-full text-xs font-medium
        bg-red-100 text-red-700">

        Deleted

      </span>
    `;

  }



  //===========================================================================
  // Empty State
  //===========================================================================

  function emptyState(message = "No data available.") {

    return `
      <div class="py-16 text-center">

        <i class="fa-regular fa-folder-open
           text-5xl text-slate-300"></i>

        <h3 class="mt-4 text-lg font-semibold">

          Empty

        </h3>

        <p class="mt-2 text-slate-500">

          ${message}

        </p>

      </div>
    `;

  }



  //===========================================================================
  // Loading
  //===========================================================================

  function loading(message = "Loading...") {

    return `
      <div class="py-16 text-center">

        <i class="fa-solid fa-spinner
           fa-spin
           text-4xl
           text-blue-600">

        </i>

        <p class="mt-4 text-slate-500">

          ${message}

        </p>

      </div>
    `;

  }



  //===========================================================================
  // KPI Card
  //===========================================================================

  function kpi(title, value, icon = "fa-chart-column") {

    return `
      <div
        class="bg-white rounded-xl border border-slate-200
        shadow-sm p-6">

        <div
          class="flex items-center justify-between">

          <div>

            <p class="text-sm text-slate-500">

              ${title}

            </p>

            <h3
              class="mt-2 text-3xl font-bold text-slate-800">

              ${value}

            </h3>

          </div>

          <div
            class="w-14 h-14 rounded-xl
            bg-blue-100
            text-blue-600
            flex items-center justify-center">

            <i class="fa-solid ${icon} text-xl"></i>

          </div>

        </div>

      </div>
    `;

  }



  //===========================================================================
  // Action Buttons
  //===========================================================================

  function actions(id) {

    return `
      <div class="flex justify-center gap-2">

        <button
          class="btn-edit
          w-8 h-8
          rounded-lg
          bg-blue-100
          hover:bg-blue-200
          text-blue-600"
          data-id="${id}">

          <i class="fa-solid fa-pen"></i>

        </button>

        <button
          class="btn-delete
          w-8 h-8
          rounded-lg
          bg-red-100
          hover:bg-red-200
          text-red-600"
          data-id="${id}">

          <i class="fa-solid fa-trash"></i>

        </button>

      </div>
    `;

  }



  //===========================================================================
  // Toast
  //===========================================================================

  function toast(message) {

    console.log("[Toast]", message);

  }



  //===========================================================================
  // Confirm
  //===========================================================================

  function confirm(message) {

    return window.confirm(message);

  }



  //===========================================================================
  // Public API
  //===========================================================================

  return Object.freeze({

    badge,

    deletedBadge,

    emptyState,

    loading,

    kpi,

    actions,

    toast,

    confirm

  });

})();

</script>
