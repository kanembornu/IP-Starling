<script>
  /**
   * =============================================================================
   * FILE        : 975.View.Render.html
   * VERSION     : 3.0.0
   * DESCRIPTION : Render Engine
   * =============================================================================
   *
   * RESPONSIBILITY
   * -----------------------------------------------------------------------------
   * Render hanya bertugas memasang HTML ke DOM.
   *
   * Render TIDAK BOLEH:
   * - membuat HTML
   * - mengetahui Dashboard
   * - mengetahui Product
   * - mengetahui Partner
   * - mengetahui Business Logic
   *
   * Flow:
   *
   * App
   *   ↓
   * Presenter
   *   ↓
   * Components
   *   ↓
   * Render
   *   ↓
   * DOM
   *
   * =============================================================================
   */

  const Render = (() => {
    //===========================================================================
    // Constants
    //===========================================================================

    const PAGE_MAP = Object.freeze({
      dashboard: "dashboard-page",

      products: "products-page",

      partners: "partners-page",

      pickups: "pickups-page",

      returns: "returns-page",

      purchasing: "purchasing-page",

      expenses: "expenses-page",

      settings: "settings-page",
    });

    //===========================================================================
    // Template
    //===========================================================================

    function template(id) {
      return DOM.$(id);
    }

    function clone(id) {
      const node = template(id);

      if (!node) {
        console.warn(
          "Template not found:",

          id,
        );

        return null;
      }

      return node.content.cloneNode(true);
    }

    //===========================================================================
    // Layout
    //===========================================================================

    function layout() {
      const root = DOM.$("app");

      if (!root) {
        return;
      }

      DOM.replace(
        root,

        clone("layout-template"),
      );
    }

    //===========================================================================
    // Sidebar
    //===========================================================================

    function sidebar(activePage = "dashboard") {
      const container = DOM.$("sidebar-container");

      if (!container) {
        return;
      }

      DOM.replace(
        container,

        clone("sidebar-template"),
      );

      DOM.$$$(".menu-item")

        .forEach((button) => {
          const page = button.dataset.page;

          const active = page === activePage;

          button.classList.toggle(
            "bg-blue-600",

            active,
          );

          button.classList.toggle(
            "text-white",

            active,
          );
        });
    }

    //===========================================================================
    // Topbar
    //===========================================================================

    function topbar(page = "dashboard") {
      const container = DOM.$("topbar-container");

      if (!container) {
        return;
      }

      DOM.replace(
        container,

        clone("topbar-template"),
      );

      const title = DOM.$("page-title");

      const subtitle = DOM.$("page-subtitle");

      if (title) {
        title.textContent = Format.title(page);
      }

      if (subtitle) {
        subtitle.textContent = "IP-Starling Inventory Management";
      }
    }

    //===========================================================================
    // Page
    //===========================================================================

    function page(pageName) {
      const templateId = PAGE_MAP[pageName];

      if (!templateId) {
        console.warn(
          "Unknown page:",

          pageName,
        );

        return;
      }

      const container = DOM.$("content-container");

      if (!container) {
        return;
      }

      DOM.replace(
        container,

        clone(templateId),
      );
    }

    //===========================================================================
    // Generic Render
    //===========================================================================

    function mount(
      containerId,

      html = "",
    ) {
      const container = DOM.$(containerId);

      if (!container) {
        console.warn(
          "Container not found:",

          containerId,
        );

        return false;
      }

      DOM.html(
        container,

        html,
      );

      return true;
    }

    function replace(
      containerId,

      html = "",
    ) {
      return mount(
        containerId,

        html,
      );
    }

    function append(
      containerId,

      html = "",
    ) {
      const container = DOM.$(containerId);

      if (!container) {
        console.warn(
          "Container not found:",

          containerId,
        );

        return false;
      }

      container.insertAdjacentHTML(
        "beforeend",

        html,
      );

      return true;
    }

    function prepend(
      containerId,

      html = "",
    ) {
      const container = DOM.$(containerId);

      if (!container) {
        console.warn(
          "Container not found:",

          containerId,
        );

        return false;
      }

      container.insertAdjacentHTML(
        "afterbegin",

        html,
      );

      return true;
    }

    function clear(containerId) {
      const container = DOM.$(containerId);

      if (!container) {
        return false;
      }

      DOM.html(
        container,

        "",
      );

      return true;
    }

    //===========================================================================
    // Pickups
    //===========================================================================

    function pickups(data = []) {
      return PickupsPresenter.render(data);
    }

    function returns(data = []) {
      return ReturnsPresenter.render(data);
    }

    //===========================================================================
    // Visibility
    //===========================================================================

    function show(id) {
      const element = DOM.$(id);

      if (!element) {
        return false;
      }

      DOM.removeClass(
        element,

        "hidden",
      );

      return true;
    }

    function hide(id) {
      const element = DOM.$(id);

      if (!element) {
        return false;
      }

      DOM.addClass(
        element,

        "hidden",
      );

      return true;
    }

    //===========================================================================
    // Utilities
    //===========================================================================

    function exists(id) {
      return DOM.$(id) !== null;
    }

    function remove(id) {
      const element = DOM.$(id);

      if (!element) {
        return false;
      }

      element.remove();

      return true;
    }

    function focus(id) {
      const element = DOM.$(id);

      if (!element) {
        return false;
      }

      element.focus();

      return true;
    }

    function scrollTop(behavior = "smooth") {
      window.scrollTo({
        top: 0,

        behavior,
      });
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      // Layout

      layout,

      sidebar,

      topbar,

      page,

      // Generic Render

      mount,

      replace,

      append,

      prepend,

      clear,

      pickups,

      returns,

      // Visibility

      show,

      hide,

      // Utilities

      exists,

      remove,

      focus,

      scrollTop,
    });
  })();
</script>
