<script>
  /**
   * =============================================================================
   * FILE        : 977.View.Expenses.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Expenses Presenter
   * =============================================================================
   */

  const ExpensesPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      DATE: "Tanggal",

      CATEGORY: "Kategori",

      DESCRIPTION: "Keterangan",

      AMOUNT: "Nominal",

      IS_ACTIVE: "IsActive",

      CREATED_AT: "CreatedAt",

      UPDATED_AT: "UpdatedAt",
    });

    let rows = [];

    let query = "";

    let createSubmitting = false;

    let createForm = null;

    let detailRequest = 0;

    let pendingDetailId = null;

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(expenses = []) {
      rows = Array.isArray(expenses) ? expenses.slice() : [];

      bindToolbar();

      bindActions();

      query = normalize(DOM.$("inp-expense-search")?.value);

      renderVisibleRows();
    }

    function renderVisibleRows() {
      const list = query ? rows.filter(matchesSearch) : rows;

      renderInfo(list.length);

      if (!list.length) {
        renderEmpty(query ? "search" : "database");

        return;
      }

      Render.mount(
        "tbl-expenses-body",

        list.map(renderRow).join(""),
      );
    }

    function search(keyword = "") {
      query = normalize(keyword);
      rows = App.getExpenses();
      renderVisibleRows();
    }

    function matchesSearch(expense = {}) {
      const date = formatDate(expense[FIELD.DATE]);
      const amount = formatCurrency(expense[FIELD.AMOUNT]);

      return [
        expense[FIELD.ID],
        expense[FIELD.DATE],
        date,
        expense[FIELD.CATEGORY],
        expense[FIELD.DESCRIPTION],
        expense[FIELD.AMOUNT],
        amount,
      ].some((value) => normalize(value).includes(query));
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const refresh = DOM.$("btn-expense-refresh");

      const add = DOM.$("btn-expense-add");

      if (add && !add.dataset.expenseAddBound) {
        add.dataset.expenseAddBound = "true";
        add.addEventListener("click", openCreate);
      }

      if (!refresh || refresh.dataset.expenseRefreshBound) {
        return;
      }

      refresh.dataset.expenseRefreshBound = "true";
      refresh.addEventListener("click", () => {
        clearSearch();
        App.refresh();
      });
    }

    //===========================================================================
    // Create Form
    //===========================================================================

    function openCreate() {
      if (createSubmitting) {
        return;
      }

      createForm = {
        Tanggal: todayInputValue(),
        Kategori: "",
        Keterangan: "",
        Nominal: "",
      };

      Modal.open({
        title: "Create Expense",
        width: "md",
        body: renderCreateForm(),
        footer: renderCreateFooter(),
      });

      bindCreateForm();
      DOM.$("inp-expense-create-date")?.focus();
    }

    function todayInputValue() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function renderCreateForm() {
      return `
        <form id="expense-create-form" class="space-y-4" novalidate>
          <div>
            <label for="inp-expense-create-date" class="mb-1 block text-sm font-medium text-slate-700">Date</label>
            <input id="inp-expense-create-date" data-expense-create-field="Tanggal" type="date" value="${SharedPresenter.text(createForm.Tanggal)}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Tanggal")}
          </div>
          <div>
            <label for="inp-expense-create-category" class="mb-1 block text-sm font-medium text-slate-700">Category</label>
            <input id="inp-expense-create-category" data-expense-create-field="Kategori" type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Kategori")}
          </div>
          <div>
            <label for="inp-expense-create-description" class="mb-1 block text-sm font-medium text-slate-700">Description</label>
            <textarea id="inp-expense-create-description" data-expense-create-field="Keterangan" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            ${renderCreateError("Keterangan")}
          </div>
          <div>
            <label for="inp-expense-create-amount" class="mb-1 block text-sm font-medium text-slate-700">Amount</label>
            <input id="inp-expense-create-amount" data-expense-create-field="Nominal" type="number" min="0" step="any" inputmode="decimal" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Nominal")}
          </div>
        </form>
      `;
    }

    function renderCreateError(field) {
      return `<p data-expense-create-error="${field}" class="mt-1 hidden text-sm text-red-600"></p>`;
    }

    function renderCreateFooter() {
      return `
        <button type="button" data-expense-create-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="submit" form="expense-create-form" id="btn-expense-create-save" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">Create Expense</button>
      `;
    }

    function bindCreateForm() {
      const form = DOM.$("expense-create-form");
      const footer = DOM.$("modal-footer");
      const close = DOM.$("btn-modal-close");

      form?.addEventListener("input", handleCreateInput);
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        submitCreate();
      });

      if (footer && !footer.dataset.expenseCreateBound) {
        footer.dataset.expenseCreateBound = "true";
        footer.addEventListener("click", (event) => {
          if (event.target.closest('[data-expense-create-action="cancel"]')) {
            closeCreate();
          }
        });
      }

      if (close) {
        close.onclick = closeCreate;
      }
    }

    function handleCreateInput(event) {
      const field = event.target.dataset.expenseCreateField;

      if (!field || !createForm) {
        return;
      }

      createForm[field] = event.target.value;
      clearCreateError(field);
    }

    function validateCreate() {
      const date = String(createForm?.Tanggal ?? "").trim();
      const category = String(createForm?.Kategori ?? "").trim();
      const description = String(createForm?.Keterangan ?? "").trim();
      const amountText = String(createForm?.Nominal ?? "").trim();
      const amount = Number(amountText);

      if (!date) {
        return invalidCreate("Tanggal", "Date is required.", "inp-expense-create-date");
      }

      if (!category) {
        return invalidCreate("Kategori", "Category is required.", "inp-expense-create-category");
      }

      if (!amountText) {
        return invalidCreate("Nominal", "Amount is required.", "inp-expense-create-amount");
      }

      if (!Number.isFinite(amount)) {
        return invalidCreate("Nominal", "Amount must be a valid number.", "inp-expense-create-amount");
      }

      if (amount < 0) {
        return invalidCreate("Nominal", "Amount cannot be negative.", "inp-expense-create-amount");
      }

      return {
        valid: true,
        payload: {
          Tanggal: date,
          Kategori: category,
          Keterangan: description,
          Nominal: amount,
        },
      };
    }

    function invalidCreate(field, message, elementId) {
      return { valid: false, field, message, element: DOM.$(elementId) };
    }

    function showCreateError(field, message) {
      const element = document.querySelector(`[data-expense-create-error="${field}"]`);

      if (!element) {
        return;
      }

      element.textContent = message;
      element.classList.remove("hidden");
    }

    function clearCreateError(field) {
      const element = document.querySelector(`[data-expense-create-error="${field}"]`);

      if (element) {
        element.textContent = "";
        element.classList.add("hidden");
      }
    }

    function clearCreateErrors() {
      document.querySelectorAll("[data-expense-create-error]").forEach((element) => {
        element.textContent = "";
        element.classList.add("hidden");
      });
    }

    function setCreateLoading(loading) {
      const submit = DOM.$("btn-expense-create-save");
      const cancel = document.querySelector('[data-expense-create-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      [submit, cancel, close].forEach((button) => {
        if (button) {
          button.disabled = loading;
        }
      });

      if (submit) {
        submit.textContent = loading ? "Creating..." : "Create Expense";
        submit.classList.toggle("cursor-not-allowed", loading);
        submit.classList.toggle("opacity-50", loading);
      }
    }

    function closeCreate() {
      if (createSubmitting) {
        return;
      }

      createForm = null;
      Modal.close();
    }

    async function submitCreate() {
      if (createSubmitting || !createForm) {
        return;
      }

      clearCreateErrors();

      const validation = validateCreate();

      if (!validation.valid) {
        showCreateError(validation.field, validation.message);
        validation.element?.focus();
        return;
      }

      createSubmitting = true;
      setCreateLoading(true);

      let response;

      try {
        response = await Api.Expense.create(validation.payload);

        if (!response?.success) {
          Toast.error(response?.message || "Expense could not be created.");
          return;
        }
      } catch (error) {
        Toast.error(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be created. Please try again.",
        );
        return;
      } finally {
        createSubmitting = false;
        setCreateLoading(false);
      }

      Toast.success(response.message || "Expense created.");
      closeCreate();
      await App.refresh();
    }

    function clearSearch() {
      query = "";

      const input = DOM.$("inp-expense-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function bindActions() {
      const body = DOM.$("tbl-expenses-body");

      if (!body || body.dataset.expenseActionsBound) {
        return;
      }

      body.dataset.expenseActionsBound = "true";
      body.addEventListener("click", (event) => {
        const button = event.target.closest('[data-expense-action="view"]');

        if (!button || !body.contains(button)) {
          return;
        }

        view(button.dataset.expenseId);
      });
    }

    function renderRow(expense = {}) {
      const id = expense[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(
          SharedPresenter.text(id),

          "font-medium text-slate-800",
        ),

        Components.tableCell(SharedPresenter.text(formatDate(expense[FIELD.DATE]))),

        Components.tableCell(SharedPresenter.text(expense[FIELD.CATEGORY])),

        Components.tableCell(SharedPresenter.text(expense[FIELD.DESCRIPTION])),

        Components.tableCell(
          SharedPresenter.text(formatCurrency(expense[FIELD.AMOUNT])),

          "text-right",
        ),

        Components.tableCell(
          SharedPresenter.renderStatus(expense[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(
          renderActions(id),
          "text-center",
        ),
      ]);
    }

    function renderActions(id) {
      const value = String(id ?? "").trim();

      if (!value) {
        return '<span class="text-slate-400">-</span>';
      }

      return `
        <button
          type="button"
          data-expense-action="view"
          data-expense-id="${SharedPresenter.text(value)}"
          title="View"
          class="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-slate-700 transition hover:bg-slate-200"
        >
          ${Components.icon("fa-eye")}
          <span>View</span>
        </button>
      `;
    }

    //===========================================================================
    // Detail View
    //===========================================================================

    async function view(id) {
      const normalizedId = String(id ?? "").trim();

      if (!normalizedId) {
        Toast.error("Expense ID is unavailable.");
        return;
      }

      if (pendingDetailId === normalizedId) {
        return;
      }

      if (pendingDetailId !== null) {
        setViewLoading(pendingDetailId, false);
      }

      const request = ++detailRequest;
      pendingDetailId = normalizedId;
      setViewLoading(normalizedId, true);

      Modal.open({
        title: "Expense Detail",
        width: "md",
        body: Components.loading("Loading expense detail..."),
        footer: renderDetailFooter(true),
      });
      setModalLoading(true);

      try {
        const response = await Api.Expense.get(normalizedId);

        if (request !== detailRequest) {
          return;
        }

        if (!isDetailResponse(response)) {
          handleDetailFailure(response?.message || "Expense detail is unavailable.");
          return;
        }

        Modal.body(renderDetail(response.data));
        Modal.footer(renderDetailFooter(false));
        bindDetailFooter();
        setModalLoading(false);
      } catch (error) {
        if (request !== detailRequest) {
          return;
        }

        handleDetailFailure(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense detail could not be loaded.",
        );
      } finally {
        if (request === detailRequest) {
          pendingDetailId = null;
          setViewLoading(normalizedId, false);
        }
      }
    }

    function isDetailResponse(response) {
      return Boolean(
        response?.success &&
          response.data &&
          typeof response.data === "object" &&
          !Array.isArray(response.data),
      );
    }

    function renderDetail(expense = {}) {
      return `
        <dl class="grid grid-cols-1 gap-4 text-sm sm:grid-cols-2">
          ${detailField("ID", expense[FIELD.ID])}
          ${detailField("Tanggal", formatDate(expense[FIELD.DATE]))}
          ${detailField("Kategori", expense[FIELD.CATEGORY])}
          ${detailField("Keterangan", expense[FIELD.DESCRIPTION], "sm:col-span-2")}
          ${detailField("Nominal", formatCurrency(expense[FIELD.AMOUNT]))}
          ${detailField("Created At", formatDateTime(expense[FIELD.CREATED_AT]))}
          ${detailField("Updated At", formatDateTime(expense[FIELD.UPDATED_AT]))}
        </dl>
      `;
    }

    function detailField(label, value, className = "") {
      return `
        <div class="${className}">
          <dt class="text-slate-500">${SharedPresenter.text(label)}</dt>
          <dd class="mt-1 break-words font-medium text-slate-800">${safeValue(value)}</dd>
        </div>
      `;
    }

    function safeValue(value) {
      const text = String(value ?? "").trim();
      return SharedPresenter.text(text || "-");
    }

    function formatDateTime(value) {
      const text = String(value ?? "").trim();

      if (!text) {
        return "-";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat("id-ID", {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(date);
    }

    function renderDetailFooter(disabled) {
      return `
        <button
          type="button"
          data-expense-detail-action="close"
          ${disabled ? "disabled" : ""}
          class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Close
        </button>
      `;
    }

    function bindDetailFooter() {
      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.expenseDetailBound) {
        footer.dataset.expenseDetailBound = "true";
        footer.addEventListener("click", (event) => {
          if (event.target.closest('[data-expense-detail-action="close"]')) {
            closeDetail();
          }
        });
      }

      const close = DOM.$("btn-modal-close");

      if (close) {
        close.onclick = closeDetail;
      }
    }

    function setModalLoading(loading) {
      const close = DOM.$("btn-modal-close");

      if (close) {
        close.disabled = loading;
        close.classList.toggle("cursor-not-allowed", loading);
        close.classList.toggle("opacity-50", loading);
      }
    }

    function closeDetail() {
      const pendingId = pendingDetailId;
      detailRequest += 1;
      pendingDetailId = null;

      if (pendingId !== null) {
        setViewLoading(pendingId, false);
      }

      setModalLoading(false);
      Modal.close();
    }

    function handleDetailFailure(message) {
      Toast.error(String(message ?? "").trim() || "Expense detail could not be loaded.");
      setModalLoading(false);
      Modal.close();
    }

    function setViewLoading(id, loading) {
      document.querySelectorAll('[data-expense-action="view"]').forEach((button) => {
        if (String(button.dataset.expenseId) !== String(id)) {
          return;
        }

        button.disabled = loading;
        button.classList.toggle("cursor-not-allowed", loading);
        button.classList.toggle("opacity-50", loading);
        button.title = loading ? "Loading..." : "View";
      });
    }

    function formatDate(value) {
      const text = String(value ?? "").trim();
      const match = /^(\d{4})-(\d{2})-(\d{2})(?:$|T)/.exec(text);

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const date = new Date(year, month - 1, day);

        if (
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day
        ) {
          return date.toLocaleDateString("id-ID");
        }
      }

      if (!text) {
        return "-";
      }

      const date = new Date(value);

      return Number.isNaN(date.getTime()) ? "-" : date.toLocaleDateString("id-ID");
    }

    function formatCurrency(value) {
      const text = String(value ?? "").trim();

      if (!text) {
        return "-";
      }

      const number = Number(text);

      if (!Number.isFinite(number)) {
        return "-";
      }

      const fraction = Math.min(text.match(/\.(\d+)/)?.[1]?.length || 0, 20);

      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: fraction,
        maximumFractionDigits: fraction,
      }).format(number);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(type) {
      const noMatch = type === "search";

      Render.mount(
        "tbl-expenses-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(
              noMatch
                ? "No Expense matches your search. Clear the search to show all active Expenses."
                : "No active Expense data exists.",
            )}
          </td>
        </tr>
      `,
      );
    }

    function renderLoading() {
      bindToolbar();
      Render.mount(
        "tbl-expenses-body",
        `<tr><td colspan="7">${Components.loading("Loading Expenses...")}</td></tr>`,
      );
      Render.mount("lbl-expense-info", "Loading Expenses...");
    }

    function renderError() {
      bindToolbar();
      Render.mount(
        "tbl-expenses-body",
        `<tr><td colspan="7">
          <div class="flex flex-col items-center justify-center py-16 text-center">
            <i class="fa-solid fa-triangle-exclamation text-5xl text-red-400"></i>
            <h3 class="mt-4 text-lg font-semibold text-red-700">Load failed</h3>
            <p class="mt-2 text-slate-500">
              Expense data could not be loaded. Use Refresh to try again.
            </p>
          </div>
        </td></tr>`,
      );
      Render.mount("lbl-expense-info", "Expense count unavailable");
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-expense-info",

        `${Format.number(total)} Expense`,
      );
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      search,
      renderLoading,
      renderError,
    });
  })();
</script>
