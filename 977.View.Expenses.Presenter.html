<script>
  /**
   * =============================================================================
   * FILE        : 977.View.Expenses.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Expenses Presenter
   * =============================================================================
   */

  const ExpensesPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      DATE: "Tanggal",

      CATEGORY: "Kategori",

      DESCRIPTION: "Keterangan",

      AMOUNT: "Nominal",

      IS_ACTIVE: "IsActive",

      CREATED_AT: "CreatedAt",

      UPDATED_AT: "UpdatedAt",
    });

    let rows = [];

    let query = "";

    const modeQueries = {
      active: "",
      trash: "",
    };

    let mode = "active";

    let createSubmitting = false;

    let createForm = null;

    let detailRequest = 0;

    let pendingDetailId = null;

    let editRequest = 0;

    let editSubmitting = false;

    let editForm = null;

    let deleteSelection = null;

    let deleteSubmitting = false;

    let deleteRequest = 0;

    let restoreSelection = null;

    let restoreSubmitting = false;

    let restoreRequest = 0;

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(expenses = [], selectedMode = App.getExpenseMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      rows = Array.isArray(expenses) ? expenses.slice() : [];

      bindToolbar();

      bindActions();

      query = modeQueries[mode];
      syncModeUi();

      renderVisibleRows();
    }

    function renderVisibleRows() {
      const list = query ? rows.filter(matchesSearch) : rows;
      const page = App.paginateRows("expenses", mode, list, "expense-pagination", "lbl-expense-info", mode === "trash" ? "Expense terhapus" : "Expense", renderVisibleRows);

      if (!page.length) {
        renderEmpty(query ? "search" : "database");

        return;
      }

      Render.mount(
        "tbl-expenses-body",

        page.map(renderRow).join(""),
      );
    }

    function search(keyword = "") {
      App.resetPagination("expenses", mode);
      query = normalize(keyword);
      modeQueries[mode] = query;
      rows = mode === "trash" ? App.getDeletedExpenses() : App.getExpenses();
      renderVisibleRows();
    }

    function matchesSearch(expense = {}) {
      const dateInput = dateInputValue(expense[FIELD.DATE]);
      const date = dateInput ? formatDate(expense[FIELD.DATE]) : "";
      const amount = formatCurrency(expense[FIELD.AMOUNT]);

      return [
        expense[FIELD.ID],
        dateInput,
        date,
        expense[FIELD.CATEGORY],
        expense[FIELD.DESCRIPTION],
        expense[FIELD.AMOUNT],
        amount,
      ].some((value) => normalize(value).includes(query));
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const refresh = DOM.$("btn-expense-refresh");

      const add = DOM.$("btn-expense-add");

      document.querySelectorAll("[data-expense-mode]").forEach((button) => {
        if (button.dataset.expenseModeBound) return;

        button.dataset.expenseModeBound = "true";
        button.addEventListener("click", () => {
          const nextMode = button.dataset.expenseMode;
          if (nextMode === mode) return;

          modeQueries[mode] = normalize(DOM.$("inp-expense-search")?.value);
          App.setExpenseMode(nextMode);
        });
      });

      if (add && !add.dataset.expenseAddBound) {
        add.dataset.expenseAddBound = "true";
        add.addEventListener("click", openCreate);
      }

      if (!refresh || refresh.dataset.expenseRefreshBound) {
        return;
      }

      refresh.dataset.expenseRefreshBound = "true";
      refresh.addEventListener("click", () => {
        modeQueries[mode] = "";
        clearSearch();
        App.refresh();
      });
    }

    function syncModeUi() {
      document.querySelectorAll("[data-expense-mode]").forEach((button) => {
        const selected = button.dataset.expenseMode === mode;
        button.setAttribute("aria-pressed", String(selected));
        button.classList.toggle("bg-blue-600", selected);
        button.classList.toggle("text-white", selected);
        button.classList.toggle("text-slate-600", !selected);
        button.classList.toggle("hover:bg-slate-100", !selected);
      });

      const input = DOM.$("inp-expense-search");
      if (input) {
        input.value = modeQueries[mode];
        input.placeholder = mode === "trash"
          ? "Search deleted expense..."
          : "Search expense...";
      }

      const add = DOM.$("btn-expense-add");
      if (add) add.classList.toggle("hidden", mode === "trash");
    }

    //===========================================================================
    // Create Form
    //===========================================================================

    function openCreate() {
      if (createSubmitting) {
        return;
      }

      createForm = {
        Tanggal: todayInputValue(),
        Kategori: "",
        Keterangan: "",
        Nominal: "",
      };

      Modal.open({
        title: "Create Expense",
        width: "md",
        body: renderCreateForm(),
        footer: renderCreateFooter(),
      });

      bindCreateForm();
      DOM.$("inp-expense-create-date")?.focus();
    }

    function todayInputValue() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function renderCreateForm() {
      return `
        <form id="expense-create-form" class="space-y-4" novalidate>
          <div>
            <label for="inp-expense-create-date" class="mb-1 block text-sm font-medium text-slate-700">Date</label>
            <input id="inp-expense-create-date" data-expense-create-field="Tanggal" type="date" value="${SharedPresenter.text(createForm.Tanggal)}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Tanggal")}
          </div>
          <div>
            <label for="inp-expense-create-category" class="mb-1 block text-sm font-medium text-slate-700">Category</label>
            <input id="inp-expense-create-category" data-expense-create-field="Kategori" type="text" maxlength="100" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Kategori")}
          </div>
          <div>
            <label for="inp-expense-create-description" class="mb-1 block text-sm font-medium text-slate-700">Description</label>
            <textarea id="inp-expense-create-description" data-expense-create-field="Keterangan" rows="3" maxlength="255" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            ${renderCreateError("Keterangan")}
          </div>
          <div>
            <label for="inp-expense-create-amount" class="mb-1 block text-sm font-medium text-slate-700">Amount</label>
            <input id="inp-expense-create-amount" data-expense-create-field="Nominal" type="number" min="0" step="any" inputmode="decimal" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            ${renderCreateError("Nominal")}
          </div>
        </form>
      `;
    }

    function renderCreateError(field) {
      return `<p data-expense-create-error="${field}" class="mt-1 hidden text-sm text-red-600"></p>`;
    }

    function renderCreateFooter() {
      return `
        <button type="button" data-expense-create-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="submit" form="expense-create-form" id="btn-expense-create-save" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">Create Expense</button>
      `;
    }

    function bindCreateForm() {
      const form = DOM.$("expense-create-form");
      const footer = DOM.$("modal-footer");
      const close = DOM.$("btn-modal-close");

      form?.addEventListener("input", handleCreateInput);
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        submitCreate();
      });

      if (footer && !footer.dataset.expenseCreateBound) {
        footer.dataset.expenseCreateBound = "true";
        footer.addEventListener("click", (event) => {
          if (event.target.closest('[data-expense-create-action="cancel"]')) {
            closeCreate();
          }
        });
      }

      if (close) {
        close.onclick = closeCreate;
      }
    }

    function handleCreateInput(event) {
      const field = event.target.dataset.expenseCreateField;

      if (!field || !createForm) {
        return;
      }

      createForm[field] = event.target.value;
      clearCreateError(field);
    }

    function validateCreate() {
      const date = String(createForm?.Tanggal ?? "").trim();
      const category = String(createForm?.Kategori ?? "").trim();
      const description = String(createForm?.Keterangan ?? "").trim();
      const amountText = String(createForm?.Nominal ?? "").trim();
      const amount = Number(amountText);

      if (!date) {
        return invalidCreate("Tanggal", "Date is required.", "inp-expense-create-date");
      }

      if (!dateInputValue(date)) {
        return invalidCreate("Tanggal", "Date must use YYYY-MM-DD.", "inp-expense-create-date");
      }

      if (!category) {
        return invalidCreate("Kategori", "Category is required.", "inp-expense-create-category");
      }

      if (category.length > 100) {
        return invalidCreate("Kategori", "Category cannot exceed 100 characters.", "inp-expense-create-category");
      }

      if (!description) {
        return invalidCreate("Keterangan", "Description is required.", "inp-expense-create-description");
      }

      if (description.length > 255) {
        return invalidCreate("Keterangan", "Description cannot exceed 255 characters.", "inp-expense-create-description");
      }

      if (!amountText) {
        return invalidCreate("Nominal", "Amount is required.", "inp-expense-create-amount");
      }

      if (!Number.isFinite(amount)) {
        return invalidCreate("Nominal", "Amount must be a valid number.", "inp-expense-create-amount");
      }

      if (amount < 0) {
        return invalidCreate("Nominal", "Amount cannot be negative.", "inp-expense-create-amount");
      }

      return {
        valid: true,
        payload: {
          Tanggal: date,
          Kategori: category,
          Keterangan: description,
          Nominal: amount,
        },
      };
    }

    function invalidCreate(field, message, elementId) {
      return { valid: false, field, message, element: DOM.$(elementId) };
    }

    function showCreateError(field, message) {
      const element = document.querySelector(`[data-expense-create-error="${field}"]`);

      if (!element) {
        return;
      }

      element.textContent = message;
      element.classList.remove("hidden");
    }

    function clearCreateError(field) {
      const element = document.querySelector(`[data-expense-create-error="${field}"]`);

      if (element) {
        element.textContent = "";
        element.classList.add("hidden");
      }
    }

    function clearCreateErrors() {
      document.querySelectorAll("[data-expense-create-error]").forEach((element) => {
        element.textContent = "";
        element.classList.add("hidden");
      });
    }

    function setCreateLoading(loading) {
      const submit = DOM.$("btn-expense-create-save");
      const cancel = document.querySelector('[data-expense-create-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      [submit, cancel, close].forEach((button) => {
        if (button) {
          button.disabled = loading;
        }
      });

      if (submit) {
        submit.textContent = loading ? "Creating..." : "Create Expense";
        submit.classList.toggle("cursor-not-allowed", loading);
        submit.classList.toggle("opacity-50", loading);
      }
    }

    function closeCreate() {
      if (createSubmitting) {
        return;
      }

      createForm = null;
      Modal.close();
    }

    async function submitCreate() {
      if (createSubmitting || !createForm) {
        return;
      }

      clearCreateErrors();

      const validation = validateCreate();

      if (!validation.valid) {
        showCreateError(validation.field, validation.message);
        validation.element?.focus();
        return;
      }

      createSubmitting = true;
      setCreateLoading(true);

      let response;

      try {
        response = await Api.Expense.create(validation.payload);

        if (!response?.success) {
          Toast.error(response?.message || "Expense could not be created.");
          return;
        }
      } catch (error) {
        Toast.error(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be created. Please try again.",
        );
        return;
      } finally {
        createSubmitting = false;
        setCreateLoading(false);
      }

      Toast.success(response.message || "Expense created.");
      closeCreate();
      await App.refresh();
    }

    function clearSearch() {
      query = "";

      const input = DOM.$("inp-expense-search");

      if (input) {
        input.value = "";
      }
    }

    //===========================================================================
    // Row
    //===========================================================================

    function bindActions() {
      const body = DOM.$("tbl-expenses-body");

      if (!body || body.dataset.expenseActionsBound) {
        return;
      }

      body.dataset.expenseActionsBound = "true";
      body.addEventListener("click", (event) => {
        const button = event.target.closest("[data-expense-action]");

        if (!button || !body.contains(button)) {
          return;
        }

        if (button.dataset.expenseAction === "view") {
          view(button.dataset.expenseId);
        } else if (button.dataset.expenseAction === "edit") {
          openEdit(button.dataset.expenseId);
        } else if (button.dataset.expenseAction === "delete") {
          openDelete(button.dataset.expenseId);
        } else if (button.dataset.expenseAction === "restore") {
          openRestore(button.dataset.expenseId);
        }
      });
    }

    function renderRow(expense = {}) {
      const id = expense[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(
          SharedPresenter.text(id),

          "font-medium text-slate-800",
        ),

        Components.tableCell(SharedPresenter.text(formatDate(expense[FIELD.DATE]))),

        Components.tableCell(SharedPresenter.text(expense[FIELD.CATEGORY])),

        Components.tableCell(SharedPresenter.text(expense[FIELD.DESCRIPTION])),

        Components.tableCell(
          SharedPresenter.text(formatCurrency(expense[FIELD.AMOUNT])),

          "text-right",
        ),

        Components.tableCell(
          mode === "trash"
            ? '<span class="inline-flex rounded-full bg-red-100 px-2.5 py-1 text-xs font-medium text-red-700">Deleted</span>'
            : SharedPresenter.renderStatus(expense[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(
          mode === "trash" ? renderRestoreAction(id) : renderActions(id),
          "text-center",
        ),
      ]);
    }

    function renderActions(id) {
      const value = String(id ?? "").trim();

      if (!value) {
        return '<span class="text-slate-400">-</span>';
      }

      return `
        <button
          type="button"
          data-expense-action="edit"
          data-expense-id="${SharedPresenter.text(value)}"
          title="Edit"
          class="mr-2 inline-flex items-center gap-2 rounded-lg bg-blue-50 px-3 py-2 text-blue-700 transition hover:bg-blue-100"
        >
          ${Components.icon("fa-pen")}
          <span>Edit</span>
        </button>
        <button
          type="button"
          data-expense-action="view"
          data-expense-id="${SharedPresenter.text(value)}"
          title="View"
          class="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-slate-700 transition hover:bg-slate-200"
        >
          ${Components.icon("fa-eye")}
          <span>View</span>
        </button>
        <button
          type="button"
          data-expense-action="delete"
          data-expense-id="${SharedPresenter.text(value)}"
          title="Delete"
          class="ml-2 inline-flex items-center gap-2 rounded-lg bg-red-50 px-3 py-2 text-red-700 transition hover:bg-red-100"
        >
          ${Components.icon("fa-trash")}
          <span>Delete</span>
        </button>
      `;
    }

    function renderRestoreAction(id) {
      const value = String(id ?? "").trim();

      if (!value) {
        return '<span class="text-slate-400">-</span>';
      }

      return `
        <button
          type="button"
          data-expense-action="restore"
          data-expense-id="${SharedPresenter.text(value)}"
          title="Restore"
          class="inline-flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-2 text-emerald-700 transition hover:bg-emerald-100"
        >
          ${Components.icon("fa-rotate-left")}
          <span>Restore</span>
        </button>
      `;
    }

    //===========================================================================
    // Restore Confirmation
    //===========================================================================

    function openRestore(id) {
      const normalizedId = String(id ?? "").trim();
      const expense = rows.find((item) => {
        return String(item?.[FIELD.ID] ?? "").trim() === normalizedId;
      });

      if (!normalizedId) {
        Toast.error("Expense ID is unavailable.");
        return;
      }

      if (mode !== "trash" || !expense) {
        Toast.error("This Expense is no longer available for restore.");
        return;
      }

      if (restoreSubmitting) {
        return;
      }

      restoreRequest += 1;
      restoreSelection = {
        id: normalizedId,
        date: expense[FIELD.DATE],
        category: expense[FIELD.CATEGORY],
        amount: expense[FIELD.AMOUNT],
      };

      Modal.open({
        title: "Restore Expense",
        width: "sm",
        body: renderRestoreContext(restoreSelection),
        footer: renderRestoreFooter(),
      });
      bindRestoreControls();
      setRestoreSubmitting(false);
    }

    function renderRestoreContext(context) {
      return `
        <div class="space-y-4">
          <p class="font-medium text-emerald-700">Restore this Expense to the active list?</p>
          <dl class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-3 text-sm sm:grid-cols-2">
            ${detailField("ID", context.id)}
            ${detailField("Tanggal", formatDate(context.date))}
            ${detailField("Kategori", context.category)}
            ${detailField("Nominal", formatCurrency(context.amount))}
          </dl>
        </div>
      `;
    }

    function renderRestoreFooter() {
      return `
        <button type="button" data-expense-restore-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50">Cancel</button>
        <button type="button" id="btn-expense-restore-confirm" data-expense-restore-action="confirm" class="rounded-lg bg-emerald-600 px-5 py-2 text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">Restore Expense</button>
      `;
    }

    function bindRestoreControls() {
      const cancel = document.querySelector('[data-expense-restore-action="cancel"]');
      const confirm = DOM.$("btn-expense-restore-confirm");
      const close = DOM.$("btn-modal-close");

      cancel?.addEventListener("click", closeRestore);
      confirm?.addEventListener("click", submitRestore);

      if (close) {
        close.onclick = closeRestore;
      }
    }

    function setRestoreSubmitting(submitting) {
      const confirm = DOM.$("btn-expense-restore-confirm");
      const cancel = document.querySelector('[data-expense-restore-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      [confirm, cancel, close].forEach((button) => {
        if (button) {
          button.disabled = submitting;
        }
      });

      if (confirm) {
        confirm.textContent = submitting ? "Restoring..." : "Restore Expense";
      }
    }

    function closeRestore() {
      if (restoreSubmitting) {
        return;
      }

      restoreRequest += 1;
      restoreSelection = null;
      Modal.close();
    }

    async function submitRestore() {
      if (restoreSubmitting || !restoreSelection) {
        return;
      }

      const selection = restoreSelection;
      const request = ++restoreRequest;
      const id = selection.id;
      restoreSubmitting = true;
      setRestoreSubmitting(true);

      let response;

      try {
        response = await Api.Expense.restore(id);

        if (request !== restoreRequest || restoreSelection !== selection) {
          return;
        }

        if (!response?.success) {
          Toast.error(response?.message || "Expense could not be restored.");
          return;
        }
      } catch (error) {
        if (request !== restoreRequest || restoreSelection !== selection) {
          return;
        }

        Toast.error(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be restored. Please try again.",
        );
        return;
      } finally {
        if (request === restoreRequest && restoreSelection === selection) {
          restoreSubmitting = false;
          setRestoreSubmitting(false);
        }
      }

      Toast.success(response.message || "Expense restored.");
      restoreSubmitting = false;
      restoreRequest += 1;
      restoreSelection = null;
      Modal.close();
      await App.refresh();
    }

    //===========================================================================
    // Delete Confirmation
    //===========================================================================

    function openDelete(id) {
      const normalizedId = String(id ?? "").trim();
      const expense = rows.find((item) => {
        return String(item?.[FIELD.ID] ?? "").trim() === normalizedId;
      });

      if (!normalizedId) {
        Toast.error("Expense ID is unavailable.");
        return;
      }

      if (!expense) {
        Toast.error("This Expense is no longer available for deletion.");
        return;
      }

      if (deleteSubmitting) {
        return;
      }

      deleteRequest += 1;
      deleteSelection = {
        id: normalizedId,
        date: expense[FIELD.DATE],
        category: expense[FIELD.CATEGORY],
        amount: expense[FIELD.AMOUNT],
      };

      Modal.open({
        title: "Delete Expense",
        width: "sm",
        body: renderDeleteContext(deleteSelection),
        footer: renderDeleteFooter(),
      });
      bindDeleteControls();
      setDeleteSubmitting(false);
    }

    function renderDeleteContext(context) {
      return `
        <div class="space-y-4">
          <p class="font-medium text-red-700">Confirm soft deletion of this Expense.</p>
          <dl class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-3 text-sm sm:grid-cols-2">
            ${detailField("ID", context.id)}
            ${detailField("Tanggal", formatDate(context.date))}
            ${detailField("Kategori", context.category)}
            ${detailField("Nominal", formatCurrency(context.amount))}
          </dl>
          <p class="text-sm text-slate-600">This removes the Expense from the active list without permanently deleting its sheet row.</p>
        </div>
      `;
    }

    function renderDeleteFooter() {
      return `
        <button type="button" data-expense-delete-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50">Cancel</button>
        <button type="button" id="btn-expense-delete-confirm" data-expense-delete-action="confirm" class="rounded-lg bg-red-600 px-5 py-2 text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50">Delete Expense</button>
      `;
    }

    function bindDeleteControls() {
      const cancel = document.querySelector('[data-expense-delete-action="cancel"]');
      const confirm = DOM.$("btn-expense-delete-confirm");
      const close = DOM.$("btn-modal-close");

      cancel?.addEventListener("click", closeDelete);
      confirm?.addEventListener("click", submitDelete);

      if (close) {
        close.onclick = closeDelete;
      }
    }

    function setDeleteSubmitting(submitting) {
      const confirm = DOM.$("btn-expense-delete-confirm");
      const cancel = document.querySelector('[data-expense-delete-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      [confirm, cancel, close].forEach((button) => {
        if (button) {
          button.disabled = submitting;
        }
      });

      if (confirm) {
        confirm.textContent = submitting ? "Deleting..." : "Delete Expense";
      }
    }

    function closeDelete() {
      if (deleteSubmitting) {
        return;
      }

      deleteRequest += 1;
      deleteSelection = null;
      Modal.close();
    }

    async function submitDelete() {
      if (deleteSubmitting || !deleteSelection) {
        return;
      }

      const selection = deleteSelection;
      const request = ++deleteRequest;
      const id = selection.id;
      deleteSubmitting = true;
      setDeleteSubmitting(true);

      let response;

      try {
        response = await Api.Expense.remove(id);

        if (request !== deleteRequest || deleteSelection !== selection) {
          return;
        }

        if (!response?.success) {
          Toast.error(response?.message || "Expense could not be deleted.");
          return;
        }
      } catch (error) {
        if (request !== deleteRequest || deleteSelection !== selection) {
          return;
        }

        Toast.error(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be deleted. Please try again.",
        );
        return;
      } finally {
        if (request === deleteRequest && deleteSelection === selection) {
          deleteSubmitting = false;
          setDeleteSubmitting(false);
        }
      }

      Toast.success(response.message || "Expense deleted.");
      deleteSubmitting = false;
      deleteRequest += 1;
      deleteSelection = null;
      Modal.close();
      await App.refresh();
    }

    //===========================================================================
    // Edit Form
    //===========================================================================

    async function openEdit(id) {
      const normalizedId = String(id ?? "").trim();

      if (!normalizedId) {
        Toast.error("Expense ID is unavailable.");
        return;
      }

      if (editSubmitting) {
        return;
      }

      const request = ++editRequest;
      editForm = null;

      Modal.open({
        title: "Edit Expense",
        width: "md",
        body: Components.loading("Loading expense for editing..."),
        footer: renderEditFooter(true),
      });
      setEditLoading(true);

      try {
        const response = await Api.Expense.get(normalizedId);

        if (request !== editRequest) {
          return;
        }

        if (!isDetailResponse(response)) {
          handleEditLoadFailure(response?.message || "Expense could not be loaded for editing.");
          return;
        }

        editForm = prepareEditForm(normalizedId, response.data);

        Modal.body(renderEditForm());
        Modal.footer(renderEditFooter(false));
        bindEditForm();
        setEditLoading(false);
        DOM.$("inp-expense-edit-date")?.focus();
      } catch (error) {
        if (request !== editRequest) {
          return;
        }

        handleEditLoadFailure(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be loaded for editing. Please try again.",
        );
      }
    }

    function prepareEditForm(id, expense = {}) {
      return {
        id,
        Tanggal: dateInputValue(expense[FIELD.DATE]),
        Kategori: String(expense[FIELD.CATEGORY] ?? ""),
        Keterangan: String(expense[FIELD.DESCRIPTION] ?? ""),
        Nominal: numericInputValue(expense[FIELD.AMOUNT]),
      };
    }

    function dateInputValue(value) {
      const text = String(value ?? "").trim();
      const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);

      if (dateOnlyMatch) {
        const candidate = `${dateOnlyMatch[1]}-${dateOnlyMatch[2]}-${dateOnlyMatch[3]}`;
        const year = Number(dateOnlyMatch[1]);
        const month = Number(dateOnlyMatch[2]);
        const day = Number(dateOnlyMatch[3]);
        const date = new Date(year, month - 1, day);

        return date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day
          ? candidate
          : "";
      }

      if (!text) {
        return "";
      }

      const timestamp = new Date(text);

      if (Number.isNaN(timestamp.getTime())) {
        return "";
      }

      const year = timestamp.getFullYear();
      const month = String(timestamp.getMonth() + 1).padStart(2, "0");
      const day = String(timestamp.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function numericInputValue(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      const number = Number(value);
      return Number.isFinite(number) ? String(number) : "";
    }

    function renderEditForm() {
      return `
        <form id="expense-edit-form" class="space-y-4" novalidate>
          <p class="text-sm text-slate-500">Expense ID <strong class="ml-1 text-slate-800">${SharedPresenter.text(editForm.id)}</strong></p>
          ${renderEditInput("Date", "Tanggal", "date", editForm.Tanggal, "inp-expense-edit-date")}
          ${renderEditInput("Category", "Kategori", "text", editForm.Kategori, "inp-expense-edit-category", 'maxlength="100" required')}
          <div>
            <label for="inp-expense-edit-description" class="mb-1 block text-sm font-medium text-slate-700">Description</label>
            <textarea id="inp-expense-edit-description" data-expense-edit-field="Keterangan" rows="3" maxlength="255" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">${SharedPresenter.text(editForm.Keterangan)}</textarea>
            ${renderEditError("Keterangan")}
          </div>
          ${renderEditInput("Amount", "Nominal", "number", editForm.Nominal, "inp-expense-edit-amount", 'min="0" step="any" inputmode="decimal"')}
        </form>
      `;
    }

    function renderEditInput(label, field, type, value, id, attributes = "") {
      return `<div><label for="${id}" class="mb-1 block text-sm font-medium text-slate-700">${label}</label><input id="${id}" data-expense-edit-field="${field}" type="${type}" ${attributes} value="${SharedPresenter.text(value)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />${renderEditError(field)}</div>`;
    }

    function renderEditError(field) {
      return `<p data-expense-edit-error="${field}" class="mt-1 hidden text-sm text-red-600"></p>`;
    }

    function renderEditFooter(loading) {
      return `<button type="button" data-expense-edit-action="cancel" ${loading ? "disabled" : ""} class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50">Cancel</button><button type="submit" form="expense-edit-form" id="btn-expense-edit-save" ${loading ? "disabled" : ""} class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">${loading ? "Loading..." : "Save Changes"}</button>`;
    }

    function bindEditForm() {
      const form = DOM.$("expense-edit-form");
      const cancel = document.querySelector('[data-expense-edit-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      form?.addEventListener("input", handleEditInput);
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        submitEdit();
      });
      cancel?.addEventListener("click", closeEdit);

      if (close) {
        close.onclick = closeEdit;
      }
    }

    function handleEditInput(event) {
      const field = event.target.dataset.expenseEditField;

      if (!field || !editForm) {
        return;
      }

      editForm[field] = event.target.value;
      clearEditError(field);
    }

    function validateEdit() {
      const id = String(editForm?.id ?? "").trim();
      const date = String(editForm?.Tanggal ?? "").trim();
      const category = String(editForm?.Kategori ?? "").trim();
      const description = String(editForm?.Keterangan ?? "").trim();
      const amountText = String(editForm?.Nominal ?? "").trim();
      const amount = Number(amountText);

      if (!id) return invalidEdit("ID", "Expense ID is unavailable.");
      if (!date) return invalidEdit("Tanggal", "Date is required.", "inp-expense-edit-date");
      if (!dateInputValue(date)) return invalidEdit("Tanggal", "Date must use YYYY-MM-DD.", "inp-expense-edit-date");
      if (!category) return invalidEdit("Kategori", "Category is required.", "inp-expense-edit-category");
      if (category.length > 100) return invalidEdit("Kategori", "Category cannot exceed 100 characters.", "inp-expense-edit-category");
      if (!description) return invalidEdit("Keterangan", "Description is required.", "inp-expense-edit-description");
      if (description.length > 255) return invalidEdit("Keterangan", "Description cannot exceed 255 characters.", "inp-expense-edit-description");
      if (!amountText) return invalidEdit("Nominal", "Amount is required.", "inp-expense-edit-amount");
      if (!Number.isFinite(amount)) return invalidEdit("Nominal", "Amount must be a valid number.", "inp-expense-edit-amount");
      if (amount < 0) return invalidEdit("Nominal", "Amount cannot be negative.", "inp-expense-edit-amount");

      return {
        valid: true,
        id,
        payload: { Tanggal: date, Kategori: category, Keterangan: description, Nominal: amount },
      };
    }

    function invalidEdit(field, message, elementId) {
      return { valid: false, field, message, element: DOM.$(elementId) };
    }

    function showEditError(field, message) {
      const element = document.querySelector(`[data-expense-edit-error="${field}"]`);

      if (element) {
        element.textContent = message;
        element.classList.remove("hidden");
      } else {
        Toast.error(message);
      }
    }

    function clearEditError(field) {
      const element = document.querySelector(`[data-expense-edit-error="${field}"]`);
      if (element) {
        element.textContent = "";
        element.classList.add("hidden");
      }
    }

    function clearEditErrors() {
      document.querySelectorAll("[data-expense-edit-error]").forEach((element) => {
        element.textContent = "";
        element.classList.add("hidden");
      });
    }

    function setEditLoading(loading) {
      const close = DOM.$("btn-modal-close");
      if (close) {
        close.disabled = loading;
        close.classList.toggle("cursor-not-allowed", loading);
        close.classList.toggle("opacity-50", loading);
      }
    }

    function setEditSubmitting(submitting) {
      const save = DOM.$("btn-expense-edit-save");
      const cancel = document.querySelector('[data-expense-edit-action="cancel"]');
      const close = DOM.$("btn-modal-close");

      [save, cancel, close].forEach((button) => {
        if (button) button.disabled = submitting;
      });
      if (save) {
        save.textContent = submitting ? "Updating..." : "Save Changes";
        save.classList.toggle("cursor-not-allowed", submitting);
        save.classList.toggle("opacity-50", submitting);
      }
    }

    async function submitEdit() {
      if (editSubmitting || !editForm) return;

      clearEditErrors();
      const validation = validateEdit();

      if (!validation.valid) {
        showEditError(validation.field, validation.message);
        validation.element?.focus();
        return;
      }

      editSubmitting = true;
      setEditSubmitting(true);
      let response;

      try {
        response = await Api.Expense.update(validation.id, validation.payload);
        if (!response?.success) {
          Toast.error(response?.message || "Expense could not be updated.");
          return;
        }
      } catch (error) {
        Toast.error(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense could not be updated. Please try again.",
        );
        return;
      } finally {
        editSubmitting = false;
        setEditSubmitting(false);
      }

      Toast.success(response.message || "Expense updated.");
      editRequest += 1;
      editForm = null;
      Modal.close();
      await App.refresh();
    }

    function closeEdit() {
      if (editSubmitting) return;

      editRequest += 1;
      editForm = null;
      setEditLoading(false);
      Modal.close();
    }

    function handleEditLoadFailure(message) {
      editForm = null;
      setEditLoading(false);
      Toast.error(String(message ?? "").trim() || "Expense could not be loaded for editing.");
      Modal.close();
    }

    //===========================================================================
    // Detail View
    //===========================================================================

    async function view(id) {
      const normalizedId = String(id ?? "").trim();

      if (!normalizedId) {
        Toast.error("Expense ID is unavailable.");
        return;
      }

      if (pendingDetailId === normalizedId) {
        return;
      }

      if (pendingDetailId !== null) {
        setViewLoading(pendingDetailId, false);
      }

      const request = ++detailRequest;
      pendingDetailId = normalizedId;
      setViewLoading(normalizedId, true);

      Modal.open({
        title: "Expense Detail",
        width: "md",
        body: Components.loading("Loading expense detail..."),
        footer: renderDetailFooter(true),
      });
      setModalLoading(true);

      try {
        const response = await Api.Expense.get(normalizedId);

        if (request !== detailRequest) {
          return;
        }

        if (!isDetailResponse(response)) {
          handleDetailFailure(response?.message || "Expense detail is unavailable.");
          return;
        }

        Modal.body(renderDetail(response.data));
        Modal.footer(renderDetailFooter(false));
        bindDetailFooter();
        setModalLoading(false);
      } catch (error) {
        if (request !== detailRequest) {
          return;
        }

        handleDetailFailure(
          typeof error?.message === "string" && error.message.trim()
            ? error.message
            : "Expense detail could not be loaded.",
        );
      } finally {
        if (request === detailRequest) {
          pendingDetailId = null;
          setViewLoading(normalizedId, false);
        }
      }
    }

    function isDetailResponse(response) {
      return Boolean(
        response?.success &&
          response.data &&
          typeof response.data === "object" &&
          !Array.isArray(response.data),
      );
    }

    function renderDetail(expense = {}) {
      return `
        <dl class="grid grid-cols-1 gap-4 text-sm sm:grid-cols-2">
          ${detailField("ID", expense[FIELD.ID])}
          ${detailField("Tanggal", formatDate(expense[FIELD.DATE]))}
          ${detailField("Kategori", expense[FIELD.CATEGORY])}
          ${detailField("Keterangan", expense[FIELD.DESCRIPTION], "sm:col-span-2")}
          ${detailField("Nominal", formatCurrency(expense[FIELD.AMOUNT]))}
          ${detailField("Created At", formatDateTime(expense[FIELD.CREATED_AT]))}
          ${detailField("Updated At", formatDateTime(expense[FIELD.UPDATED_AT]))}
        </dl>
      `;
    }

    function detailField(label, value, className = "") {
      return `
        <div class="${className}">
          <dt class="text-slate-500">${SharedPresenter.text(label)}</dt>
          <dd class="mt-1 break-words font-medium text-slate-800">${safeValue(value)}</dd>
        </div>
      `;
    }

    function safeValue(value) {
      const text = String(value ?? "").trim();
      return SharedPresenter.text(text || "-");
    }

    function formatDateTime(value) {
      const text = String(value ?? "").trim();

      if (!text) {
        return "-";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat("id-ID", {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(date);
    }

    function renderDetailFooter(disabled) {
      return `
        <button
          type="button"
          data-expense-detail-action="close"
          ${disabled ? "disabled" : ""}
          class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Close
        </button>
      `;
    }

    function bindDetailFooter() {
      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.expenseDetailBound) {
        footer.dataset.expenseDetailBound = "true";
        footer.addEventListener("click", (event) => {
          if (event.target.closest('[data-expense-detail-action="close"]')) {
            closeDetail();
          }
        });
      }

      const close = DOM.$("btn-modal-close");

      if (close) {
        close.onclick = closeDetail;
      }
    }

    function setModalLoading(loading) {
      const close = DOM.$("btn-modal-close");

      if (close) {
        close.disabled = loading;
        close.classList.toggle("cursor-not-allowed", loading);
        close.classList.toggle("opacity-50", loading);
      }
    }

    function closeDetail() {
      const pendingId = pendingDetailId;
      detailRequest += 1;
      pendingDetailId = null;

      if (pendingId !== null) {
        setViewLoading(pendingId, false);
      }

      setModalLoading(false);
      Modal.close();
    }

    function handleDetailFailure(message) {
      Toast.error(String(message ?? "").trim() || "Expense detail could not be loaded.");
      setModalLoading(false);
      Modal.close();
    }

    function setViewLoading(id, loading) {
      document.querySelectorAll('[data-expense-action="view"]').forEach((button) => {
        if (String(button.dataset.expenseId) !== String(id)) {
          return;
        }

        button.disabled = loading;
        button.classList.toggle("cursor-not-allowed", loading);
        button.classList.toggle("opacity-50", loading);
        button.title = loading ? "Loading..." : "View";
      });
    }

    function formatDate(value) {
      const valueForInput = dateInputValue(value);

      if (!valueForInput) {
        return "-";
      }

      const [year, month, day] = valueForInput.split("-").map(Number);
      const date = new Date(year, month - 1, day);

      return new Intl.DateTimeFormat("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric",
      }).format(date);
    }

    function formatCurrency(value) {
      const text = String(value ?? "").trim();

      if (!text) {
        return "-";
      }

      const number = Number(text);

      if (!Number.isFinite(number)) {
        return "-";
      }

      const fraction = Math.min(text.match(/\.(\d+)/)?.[1]?.length || 0, 20);

      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: fraction,
        maximumFractionDigits: fraction,
      }).format(number);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty(type) {
      const noMatch = type === "search";
      const message = mode === "trash"
        ? noMatch
          ? "No deleted Expense matches the current search."
          : "No deleted Expense records."
        : noMatch
          ? "No Expense matches your search. Clear the search to show all active Expenses."
          : "No active Expense data exists.";

      Render.mount(
        "tbl-expenses-body",

        `
        <tr>
          <td colspan="7">
            ${Components.empty(
              message,
            )}
          </td>
        </tr>
      `,
      );
    }

    function renderLoading(selectedMode = App.getExpenseMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      bindToolbar();
      syncModeUi();
      const label = mode === "trash" ? "Deleted Expenses" : "Expenses";
      Render.mount(
        "tbl-expenses-body",
        `<tr><td colspan="7">${Components.loading(`Loading ${label}...`)}</td></tr>`,
      );
      Render.mount("lbl-expense-info", `Loading ${label}...`);
    }

    function renderError(selectedMode = App.getExpenseMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      bindToolbar();
      syncModeUi();
      const subject = mode === "trash" ? "Deleted Expense" : "Expense";
      Render.mount(
        "tbl-expenses-body",
        `<tr><td colspan="7">
          <div class="flex flex-col items-center justify-center py-16 text-center">
            <i class="fa-solid fa-triangle-exclamation text-5xl text-red-400"></i>
            <h3 class="mt-4 text-lg font-semibold text-red-700">Load failed</h3>
            <p class="mt-2 text-slate-500">
              ${subject} data could not be loaded. Use Refresh to try again.
            </p>
          </div>
        </td></tr>`,
      );
      Render.mount("lbl-expense-info", "Expense count unavailable");
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-expense-info",

        `${Format.number(total)} ${mode === "trash" ? "Deleted Expense" : "Expense"}`,
      );
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
      search,
      renderLoading,
      renderError,
    });
  })();
</script>
