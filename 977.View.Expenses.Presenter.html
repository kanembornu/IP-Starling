<script>
  /** Render-only Expense presenter. State and orchestration are external. */
  const ExpensesPresenter = (() => {
    const FIELD = Object.freeze({ ID: "ID", DATE: "Tanggal", CATEGORY: "Kategori", DESCRIPTION: "Keterangan", AMOUNT: "Nominal", IS_ACTIVE: "IsActive", CREATED_AT: "CreatedAt", UPDATED_AT: "UpdatedAt" });

    function render(view = {}) {
      const mode = normalizeMode(view.mode);
      renderModeButtons(mode, view.search);
      const rows = Array.isArray(view.rows) ? view.rows : [];
      if (!rows.length) return renderEmpty(view.emptyType || "database", mode);
      Render.mount("tbl-expenses-body", rows.map((row) => renderRow(row, mode, view.busyId)).join(""));
    }

    function renderLoading(view = {}) {
      const mode = normalizeMode(view.mode || view);
      renderModeButtons(mode, view.search);
      const label = mode === "trash" ? "deleted expenses" : "expenses";
      Render.mount("tbl-expenses-body", `<tr><td colspan="7">${Components.loading(`Loading ${label}...`)}</td></tr>`);
      Render.mount("lbl-expense-info", `Loading ${label}...`);
      Render.mount("expense-pagination", "");
    }

    function renderError(view = {}) {
      const mode = normalizeMode(view.mode || view);
      renderModeButtons(mode, view.search);
      const subject = mode === "trash" ? "Deleted expenses" : "Expenses";
      Render.mount("tbl-expenses-body", `<tr><td colspan="7">${Components.error(`${subject} could not be loaded. Use Refresh to try again.`)}</td></tr>`);
      Render.mount("lbl-expense-info", "Expense count unavailable");
      Render.mount("expense-pagination", "");
    }

    function renderEmpty(type, mode) {
      const noMatch = type === "search";
      const message = mode === "trash"
        ? (noMatch ? "No deleted expenses match the current search." : "No deleted expenses available.")
        : (noMatch ? "No expenses match the current search." : "No expenses available.");
      Render.mount("tbl-expenses-body", `<tr><td colspan="7">${Components.empty(message)}</td></tr>`);
    }

    function renderModeButtons(mode, search) {
      document.querySelectorAll("[data-expense-mode]").forEach((button) => {
        const selected = button.dataset.expenseMode === mode;
        button.setAttribute("aria-pressed", String(selected));
        button.classList.toggle("bg-blue-600", selected); button.classList.toggle("text-white", selected);
        button.classList.toggle("text-slate-600", !selected); button.classList.toggle("hover:bg-slate-100", !selected);
      });
      const input = DOM.$("inp-expense-search");
      if (input) { input.value = String(search || ""); input.placeholder = mode === "trash" ? "Search deleted expense..." : "Search expense..."; }
      DOM.$("btn-expense-add")?.classList.toggle("hidden", mode === "trash");
    }

    function renderRow(expense = {}, mode, busyId) {
      const id = safeValue(expense[FIELD.ID]);
      const active = mode !== "trash";
      return Components.tableRow([
        Components.tableCell(text(id), "font-medium text-slate-800"),
        Components.tableCell(text(formatDate(expense[FIELD.DATE]))),
        Components.tableCell(text(expense[FIELD.CATEGORY])),
        Components.tableCell(text(expense[FIELD.DESCRIPTION])),
        Components.tableCell(text(formatCurrency(expense[FIELD.AMOUNT])), "text-right"),
        Components.tableCell(Components.badge(active ? Format.status(true) : "Deleted", active), "text-center"),
        Components.tableCell(active ? renderActiveActions(id, busyId) : renderDeletedAction(id, busyId), "text-center"),
      ]);
    }

    function renderActiveActions(id, busyId) {
      const disabled = busyId ? "disabled aria-disabled=\"true\"" : "";
      return `<div class="inline-flex flex-wrap justify-center gap-2"><button type="button" data-expense-action="view" data-expense-id="${escape(id)}" ${disabled} class="rounded-lg bg-slate-100 px-3 py-2 text-slate-700 hover:bg-slate-200">${Components.icon("fa-eye")} <span>View</span></button><button type="button" data-expense-action="edit" data-expense-id="${escape(id)}" ${disabled} class="rounded-lg bg-blue-50 px-3 py-2 text-blue-700 hover:bg-blue-100">${Components.icon("fa-pen")} <span>Edit</span></button><button type="button" data-expense-action="delete" data-expense-id="${escape(id)}" ${disabled} class="rounded-lg bg-red-50 px-3 py-2 text-red-700 hover:bg-red-100">${Components.icon("fa-trash")} <span>${String(busyId) === String(id) ? "Deleting..." : "Delete"}</span></button></div>`;
    }

    function renderDeletedAction(id, busyId) {
      const busy = Boolean(busyId);
      return `<button type="button" data-expense-action="restore" data-expense-id="${escape(id)}" ${busy ? "disabled aria-disabled=\"true\"" : ""} class="rounded-lg bg-emerald-50 px-3 py-2 text-emerald-700 hover:bg-emerald-100 ${busy ? "cursor-not-allowed opacity-50" : ""}">${Components.icon("fa-rotate-left")} <span>${String(busyId) === String(id) ? "Restoring..." : "Restore"}</span></button>`;
    }

    function renderCreateForm(view = {}) { return renderForm("create", view); }
    function renderEditForm(view = {}) { return renderForm("edit", view); }
    function renderForm(kind, view) {
      const form = view.form || {}; const prefix = `expense-${kind}`;
      return `<form id="${prefix}-form" class="space-y-4" novalidate>${kind === "edit" ? `<div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm"><span class="text-slate-500">Expense ID</span><strong class="ml-2 text-slate-800">${escape(form.ID)}</strong></div>` : ""}${renderInput(kind, "Date", "Tanggal", "date", form.Tanggal, `${prefix}-date`)}${renderInput(kind, "Category", "Kategori", "text", form.Kategori, `${prefix}-category`, 'maxlength="100"')}${renderTextarea(kind, "Description", "Keterangan", form.Keterangan, `${prefix}-description`)}${renderInput(kind, "Amount", "Nominal", "number", form.Nominal, `${prefix}-amount`, 'min="0" step="any" inputmode="decimal"')}</form>`;
    }
    function renderInput(kind, label, field, type, value, id, attrs = "") { return `<div><label for="inp-${id}" class="mb-1 block text-sm font-medium text-slate-700">${label}</label><input id="inp-${id}" data-expense-${kind}-field="${field}" type="${type}" value="${escape(value)}" ${attrs} required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />${renderFieldError(kind, field)}</div>`; }
    function renderTextarea(kind, label, field, value, id) { return `<div><label for="inp-${id}" class="mb-1 block text-sm font-medium text-slate-700">${label}</label><textarea id="inp-${id}" data-expense-${kind}-field="${field}" rows="3" maxlength="255" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">${escape(value)}</textarea>${renderFieldError(kind, field)}</div>`; }
    function renderFieldError(kind, field) { return Components.formFieldError(`data-expense-${kind}-error`, field); }
    function renderFormFooter(kind, view = {}) { return Components.formFooter({ cancelAttribute: `data-expense-${kind}-action="cancel"`, saveAttribute: `data-expense-${kind}-action="save"`, saveLabel: kind === "create" ? "Create Expense" : "Save Changes", loadingLabel: kind === "create" ? "Creating Expense..." : "Saving Changes...", form: `expense-${kind}-form`, loading: Boolean(view.loading) }); }
    function showFieldError(kind, field, message) { const target = document.querySelector(`[data-expense-${kind}-error="${field}"]`); if (!target) return false; DOM.text(target, message); target.classList.remove("hidden"); return true; }
    function clearFieldError(kind, field) { const target = document.querySelector(`[data-expense-${kind}-error="${field}"]`); if (target) { DOM.text(target, ""); target.classList.add("hidden"); } }

    function renderDetail(expense = {}) { return `<dl class="grid grid-cols-1 gap-4 text-sm sm:grid-cols-2">${detailField("Expense ID", expense.ID)}${detailField("Date", formatDate(expense.Tanggal))}${detailField("Category", expense.Kategori)}${detailField("Description", expense.Keterangan, "sm:col-span-2")}${detailField("Amount", formatCurrency(expense.Nominal))}${detailField("Status", Format.status(isActive(expense)))}${detailField("Created At", formatDateTime(expense.CreatedAt))}${detailField("Updated At", formatDateTime(expense.UpdatedAt))}</dl>`; }
    function renderDetailFooter() { return `<button type="button" data-expense-detail-action="close" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Close</button>`; }
    function renderDeleteMessage(row = {}) { return `<div class="space-y-3"><p class="font-medium text-red-700">Confirm soft deletion of this Expense record.</p><dl class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-3 text-sm sm:grid-cols-2">${detailField("Expense ID", row.ID)}${detailField("Date", formatDate(row.Tanggal))}${detailField("Category", row.Kategori)}${detailField("Amount", formatCurrency(row.Nominal))}</dl><p class="text-sm text-slate-600">This action removes the record from the active list using a soft delete. It does not permanently erase the sheet row.</p></div>`; }
    function renderRestoreMessage(row = {}) { return `<div class="space-y-3"><p>Restore Expense <strong>${escape(row.ID)}</strong>?</p><dl class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-3 text-sm sm:grid-cols-2">${detailField("Date", formatDate(row.Tanggal))}${detailField("Category", row.Kategori)}${detailField("Description", row.Keterangan)}${detailField("Amount", formatCurrency(row.Nominal))}</dl></div>`; }
    function detailField(label, value, classes = "") { return `<div class="${classes}"><dt class="text-slate-500">${escape(label)}</dt><dd class="mt-1 break-words font-medium text-slate-800">${text(value)}</dd></div>`; }
    function setRowBusy(id, busy) { document.querySelectorAll("[data-expense-action]").forEach((button) => { if (String(button.dataset.expenseId) !== String(id)) return; button.disabled = busy; button.classList.toggle("opacity-50", busy); button.classList.toggle("cursor-not-allowed", busy); }); }
    function normalizeMode(value) { return value === "trash" ? "trash" : "active"; }
    function isActive(row) { return row?.IsActive === true || row?.IsActive === 1 || String(row?.IsActive).toLowerCase() === "true"; }
    function dateInputValue(value) { if (Utils.isEmpty(value)) return ""; const textValue = String(value).trim(); const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(textValue); if (match) { const year = Number(match[1]); const month = Number(match[2]); const day = Number(match[3]); const dateOnly = new Date(year, month - 1, day); return dateOnly.getFullYear() === year && dateOnly.getMonth() === month - 1 && dateOnly.getDate() === day ? textValue : ""; } const date = new Date(value); if (isNaN(date.getTime())) return ""; return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`; }
    function formatDate(value) { return dateInputValue(value) ? Format.date(value) : "-"; }
    function formatDateTime(value) { if (Utils.isEmpty(value) || isNaN(new Date(value).getTime())) return "-"; return Format.dateTime(value); }
    function formatCurrency(value) { const number = Number(value); return Number.isFinite(number) ? Format.currency(number) : "-"; }
    function safeValue(value) { return Utils.isEmpty(value) || typeof value === "object" || typeof value === "function" ? "-" : value; }
    function text(value) { return SharedPresenter.text(safeValue(value)); }
    function escape(value) { return Utils.escapeHTML(String(value ?? "")); }

    return Object.freeze({ render, renderLoading, renderError, renderCreateForm, renderEditForm, renderFormFooter, showFieldError, clearFieldError, renderDetail, renderDetailFooter, renderDeleteMessage, renderRestoreMessage, setRowBusy, dateInputValue, formatDate, formatDateTime, formatCurrency });
  })();
</script>
