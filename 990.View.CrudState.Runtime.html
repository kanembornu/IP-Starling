<script>
  /**
   * ===========================================================================
   * FILE        : 990.View.CrudState.Runtime.html
   * VERSION     : 1.0.0
   * DESCRIPTION : CRUD State Framework
   * ===========================================================================
   */

  const CrudState = (() => {
    const MODE = Object.freeze({
      CREATE: "CREATE",

      UPDATE: "UPDATE",
    });

    let state = {
      mode: MODE.CREATE,

      id: null,
    };

    function create() {
      state.mode = MODE.CREATE;

      state.id = null;
    }

    function update(id) {
      state.mode = MODE.UPDATE;

      state.id = id;
    }

    function reset() {
      create();
    }

    function mode() {
      return state.mode;
    }

    function id() {
      return state.id;
    }

    function isCreate() {
      return state.mode === MODE.CREATE;
    }

    function isUpdate() {
      return state.mode === MODE.UPDATE;
    }

    return Object.freeze({
      create,

      update,

      reset,

      mode,

      id,

      isCreate,

      isUpdate,
    });
  })();
</script>
