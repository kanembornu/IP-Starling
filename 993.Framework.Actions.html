<script>
  /**
   * =============================================================================
   * FILE        : 993.Framework.Actions
   * VERSION     : 1.0.0
   * DESCRIPTION : Frontend CRUD Action Framework
   * =============================================================================
   */

  const Actions = (() => {
    //==========================================================================
    // Execute
    //==========================================================================

    async function execute({
      task,
      success,
      reload,
      close = true,
      afterSuccess = null,
    }) {
      try {
        const response = await task();

        if (!response.success) {
          Toast.error(response.message);

          return response;
        }

        if (typeof afterSuccess === "function") {
          await afterSuccess(response);
        }

        if (close) {
          Modal.close();
        }

        if (typeof reload === "function") {
          await reload();
        }

        Toast.success(success || response.message);

        return response;
      } catch (error) {
        console.error(error);

        Toast.error(error.message || "Unexpected Error");

        throw error;
      }
    }

    //==========================================================================
    // Create
    //==========================================================================

    async function create(options) {
      return execute(options);
    }

    //==========================================================================
    // Update
    //==========================================================================

    async function update(options) {
      return execute(options);
    }

    //==========================================================================
    // Remove
    //==========================================================================

    async function remove({ title, message, ...options }) {
      const ok = await Dialog.confirm({
        title,
        message,
      });

      if (!ok) {
        return null;
      }

      return execute(options);
    }

    //==========================================================================
    // Public API
    //==========================================================================

    return Object.freeze({
      execute,

      create,

      update,

      remove,
    });
  })();
</script>
