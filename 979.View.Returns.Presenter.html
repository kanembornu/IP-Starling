<script>
  /**
   * =============================================================================
   * FILE        : 978.View.Returns.Presenter.html
   * VERSION     : 1.0.0
   * DESCRIPTION : Returns Presenter
   * =============================================================================
   */

  const ReturnsPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      PICKUP: "PickupID",

      DATE: "Tanggal",

      QTY: "Qty",

      NOTE: "Keterangan",

      IS_ACTIVE: "IsActive",
    });

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(returns = []) {
      const list = Array.isArray(returns) ? returns : [];

      renderInfo(list.length);

      if (!list.length) {
        renderEmpty();

        return;
      }

      Render.mount(
        "tbl-returns-body",

        list.map(renderRow).join(""),
      );
    }

    //===========================================================================
    // Row
    //===========================================================================

    function renderRow(ret = {}) {
      const id = ret[FIELD.ID];

      return Components.tableRow([
        Components.tableCell(
          SharedPresenter.text(id),

          "font-medium text-slate-800",
        ),

        Components.tableCell(Format.date(purchase[FIELD.DATE])),

        Components.tableCell(SharedPresenter.text(purchase[FIELD.SUPPLIER])),

        Components.tableCell(SharedPresenter.text(purchase[FIELD.PRODUCT])),

        Components.tableCell(
          Format.number(purchase[FIELD.QTY]),

          "text-right",
        ),

        Components.tableCell(
          Format.currency(purchase[FIELD.PRICE]),

          "text-right",
        ),

        Components.tableCell(
          Format.currency(purchase[FIELD.TOTAL]),

          "text-right",
        ),

        Components.tableCell(
          SharedPresenter.renderStatus(purchase[FIELD.IS_ACTIVE]),

          "text-center",
        ),

        Components.tableCell(
          SharedPresenter.renderActions(id),

          "text-center",
        ),
      ]);
    }

    //===========================================================================
    // Empty
    //===========================================================================

    function renderEmpty() {
      Render.mount(
        "tbl-returns-body",

        `
        <tr>
          <td colspan="9">
            ${Components.empty("No returns available.")}
          </td>
        </tr>
      `,
      );
    }

    //===========================================================================
    // Info
    //===========================================================================

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-return-info",

        `${Format.number(total)} Returns`,
      );
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,
    });
  })();
</script>
