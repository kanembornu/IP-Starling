<script>
  /**
   * =============================================================================
   * FILE        : 979.View.Returns.Presenter.html
   * VERSION     : 1.2.0
   * DESCRIPTION : Returns List Presenter
   * =============================================================================
   */

  const ReturnsPresenter = (() => {
    const FIELD = Object.freeze({
      ID: "ID",
      PICKUP_ID: "PickupID",
      PICKUP_DETAIL_ID: "PickupDetailID",
      DATE: "Tanggal",
      QTY: "Qty",
      NOTE: "Keterangan",
      DELETED: "Deleted",
      IS_ACTIVE: "IsActive",
    });

    let returns = [];

    let detailRequest = 0;

    let pickupHeaders = null;

    const pickupDetailsByHeader = new Map();

    let returnForm = null;

    let returnSubmitting = false;

    let pickupLoadRequest = 0;

    let editForm = null;

    let editSubmitting = false;

    let editRequest = 0;

    let modalMode = null;

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(data) {
      returns = normalize(data);

      bindToolbar();

      bindActions();

      renderList(filter(DOM.$("inp-return-search")?.value));
    }

    //===========================================================================
    // Data
    //===========================================================================

    function normalize(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data?.data)) {
        return data.data;
      }

      return [];
    }

    //===========================================================================
    // List
    //===========================================================================

    function renderList(list = []) {
      renderInfo(list.length);

      if (!list.length) {
        renderEmpty();

        return;
      }

      Render.mount(
        "tbl-returns-body",

        list.map(renderRow).join(""),
      );
    }

    function renderRow(ret = {}) {
      return Components.tableRow([
        Components.tableCell(text(ret[FIELD.ID]), "font-medium text-slate-800"),

        Components.tableCell(text(ret[FIELD.PICKUP_ID])),

        Components.tableCell(text(ret[FIELD.PICKUP_DETAIL_ID])),

        Components.tableCell(Format.date(ret[FIELD.DATE])),

        Components.tableCell(Format.number(ret[FIELD.QTY]), "text-right"),

        Components.tableCell(text(ret[FIELD.NOTE])),

        Components.tableCell(renderStatus(ret), "text-center"),

        Components.tableCell(renderActions(ret), "text-center"),
      ]);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(ret = {}) {
      const id = ret[FIELD.ID];

      if (Utils.isEmpty(id) || isTrue(ret[FIELD.DELETED]) || !isActive(ret[FIELD.IS_ACTIVE])) {
        return "-";
      }

      return `
        <button
          type="button"
          data-return-action="view"
          data-return-id="${escape(id)}"
          title="View"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-slate-100 hover:bg-slate-200 text-slate-700"
        >
          ${Components.icon("fa-eye")}

          <span>View</span>
        </button>

        <button
          type="button"
          data-return-action="edit"
          data-return-id="${escape(id)}"
          title="Edit"
          class="ml-2 inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-blue-600 hover:bg-blue-700 text-white"
        >
          ${Components.icon("fa-pen")}

          <span>Edit</span>
        </button>
      `;
    }

    function bindActions() {
      const body = DOM.$("tbl-returns-body");

      if (!body || body.dataset.returnActionsBound) {
        return;
      }

      body.dataset.returnActionsBound = "true";

      body.addEventListener("click", (event) => {
        const button = event.target.closest("[data-return-action]");

        if (!button || !body.contains(button)) {
          return;
        }

        if (button.dataset.returnAction === "view") {
          view(button.dataset.returnId);
        }

        if (button.dataset.returnAction === "edit") {
          openEdit(button.dataset.returnId);
        }
      });
    }

    //===========================================================================
    // Empty and Info
    //===========================================================================

    function renderEmpty() {
      Render.mount(
        "tbl-returns-body",

        `
        <tr>
          <td colspan="8">
            ${Components.empty("No returns available.")}
          </td>
        </tr>
      `,
      );
    }

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-return-info",

        `${Format.number(total)} Returns`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(ret = {}) {
      if (isTrue(ret[FIELD.DELETED])) {
        return Components.badge("Deleted", false);
      }

      const active = isActive(ret[FIELD.IS_ACTIVE]);

      return Components.badge(Format.status(active), active);
    }

    function statusText(ret = {}) {
      return isTrue(ret[FIELD.DELETED])
        ? "Deleted"
        : Format.status(isActive(ret[FIELD.IS_ACTIVE]));
    }

    function isActive(value) {
      if (value === undefined || value === null || value === "") {
        return true;
      }

      return isTrue(value);
    }

    function isTrue(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const search = DOM.$("inp-return-search");

      if (search && !search.dataset.returnBound) {
        search.dataset.returnBound = "true";

        search.addEventListener("input", () => {
          renderList(filter(search.value));
        });
      }

      const refresh = DOM.$("btn-return-refresh");

      if (refresh && !refresh.dataset.returnBound) {
        refresh.dataset.returnBound = "true";

        refresh.addEventListener("click", () => {
          clearSearch();
          App.refresh();
        });
      }

      const add = DOM.$("btn-return-add");

      if (add && !add.dataset.returnBound) {
        add.dataset.returnBound = "true";

        add.addEventListener("click", openCreate);
      }
    }

    //===========================================================================
    // Search
    //===========================================================================

    function clearSearch() {
      const input = DOM.$("inp-return-search");

      if (input) {
        input.value = "";
      }
    }

    function filter(keyword = "") {
      const query = String(keyword).trim().toLowerCase();

      if (!query) {
        return returns;
      }

      return returns.filter((ret) => searchText(ret).includes(query));
    }

    function searchText(ret = {}) {
      return [
        ret[FIELD.ID],
        ret[FIELD.PICKUP_ID],
        ret[FIELD.PICKUP_DETAIL_ID],
        ret[FIELD.DATE],
        Format.date(ret[FIELD.DATE]),
        ret[FIELD.NOTE],
        statusText(ret),
      ]
        .filter((value) => value !== undefined && value !== null)
        .join(" ")
        .toLowerCase();
    }

    //===========================================================================
    // Detail View
    //===========================================================================

    async function view(id) {
      if (Utils.isEmpty(id)) {
        Toast.error("Return ID is unavailable.");

        return;
      }

      const request = ++detailRequest;

      clearEditForm();
      pickupLoadRequest += 1;
      returnForm = null;
      modalMode = "view";

      Modal.open({
        title: "Return Detail",

        width: "lg",

        body: Components.loading("Loading return..."),

        footer: renderDetailFooter(),
      });

      bindDetailModal();

      let response;

      try {
        response = await Api.Return.findById(id);
      } catch (error) {
        if (request !== detailRequest) {
          return;
        }

        showDetailError("Load return failed.");

        return;
      }

      if (request !== detailRequest) {
        return;
      }

      if (!isDetailResponse(response)) {
        showDetailError(response?.message || "Return detail is unavailable.");

        return;
      }

      Modal.body(renderDetail(response.data));
    }

    function isDetailResponse(response) {
      return Boolean(
        response?.success &&
          response.data &&
          typeof response.data.return === "object" &&
          !Array.isArray(response.data.return) &&
          Object.prototype.hasOwnProperty.call(response.data, "availableQty"),
      );
    }

    function showDetailError(message) {
      Toast.error(message);

      Modal.body(Components.empty(message));
    }

    function renderDetail(data = {}) {
      return `
        <div class="space-y-6">
          ${renderReturnSection(data.return)}
          ${renderPickupHeaderSection(data.pickupHeader)}
          ${renderPickupDetailSection(data.pickupDetail, data.availableQty)}
        </div>
      `;
    }

    function renderReturnSection(ret) {
      if (!isRecord(ret)) {
        return renderMissingSection("Return", "Return data is unavailable.");
      }

      return `
        <section>
          <h3 class="mb-3 text-sm font-semibold text-slate-800">Return</h3>
          <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">
            ${detailField("Return ID", ret[FIELD.ID])}
            ${detailField("Tanggal", Format.date(ret[FIELD.DATE]))}
            ${detailField("Qty Returned", Format.number(ret[FIELD.QTY]))}
            ${detailField("Status", statusText(ret))}
            ${
              Utils.isEmpty(ret[FIELD.NOTE])
                ? ""
                : detailField("Keterangan", ret[FIELD.NOTE], "sm:col-span-2")
            }
          </dl>
        </section>
      `;
    }

    function renderPickupHeaderSection(header) {
      if (!isRecord(header)) {
        return renderMissingSection("Pickup Header", "Pickup Header data is unavailable.");
      }

      return `
        <section>
          <h3 class="mb-3 text-sm font-semibold text-slate-800">Pickup Header</h3>
          <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">
            ${detailField("Pickup No / ID", header.PickupNo || header.ID)}
            ${detailField("Tanggal", Format.date(header.Tanggal))}
            ${detailField("Partner", header.PartnerID)}
            ${detailField("Status", header.Status)}
            ${detailField("Total Item", Format.number(header.TotalItem))}
            ${detailField("Total Qty", Format.number(header.TotalQty))}
          </dl>
        </section>
      `;
    }

    function renderPickupDetailSection(detail, availableQty) {
      if (!isRecord(detail)) {
        return renderMissingSection("Pickup Detail", "Pickup Detail data is unavailable.");
      }

      return `
        <section>
          <h3 class="mb-3 text-sm font-semibold text-slate-800">Pickup Detail</h3>
          <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">
            ${detailField("Pickup Detail ID", detail.ID)}
            ${detailField("Product", detail.ProductID)}
            ${detailField("Pickup Detail Qty", Format.number(detail.Qty))}
            ${detailField("Available Return Qty", Format.number(availableQty))}
            ${
              Utils.isEmpty(detail.Notes)
                ? ""
                : detailField("Notes", detail.Notes, "sm:col-span-2")
            }
          </dl>
        </section>
      `;
    }

    function renderMissingSection(title, message) {
      return `
        <section>
          <h3 class="mb-3 text-sm font-semibold text-slate-800">${title}</h3>
          ${Components.empty(message)}
        </section>
      `;
    }

    function detailField(label, value, classes = "") {
      return `
        <div class="${classes}">
          <dt class="text-slate-500">${label}</dt>
          <dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd>
        </div>
      `;
    }

    function isRecord(value) {
      return Boolean(value && typeof value === "object" && !Array.isArray(value));
    }

    function renderDetailFooter() {
      return `
        <button
          type="button"
          data-return-detail-action="close"
          class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100"
        >
          Close
        </button>
      `;
    }

    function bindDetailModal() {
      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.returnDetailBound) {
        footer.dataset.returnDetailBound = "true";
        footer.addEventListener("click", (event) => {
          const button = event.target.closest("[data-return-detail-action]");

          if (button?.dataset.returnDetailAction === "close") {
            closeDetail();
          }
        });
      }

      const close = DOM.$("btn-modal-close");

      if (close && !close.dataset.returnDetailBound) {
        close.dataset.returnDetailBound = "true";
        close.addEventListener("click", closeDetail);
      }
    }

    function closeDetail() {
      if (modalMode !== "view") {
        return;
      }

      detailRequest += 1;
      modalMode = null;
      Modal.close();
    }

    //===========================================================================
    // Edit Return
    //===========================================================================

    async function openEdit(id) {
      if (editSubmitting) {
        return;
      }

      if (Utils.isEmpty(id)) {
        Toast.error("Return ID is unavailable.");
        return;
      }

      const request = ++editRequest;
      clearEditForm();
      pickupLoadRequest += 1;
      returnForm = null;
      modalMode = "edit";

      Modal.open({
        title: "Edit Return",
        width: "lg",
        body: Components.loading("Loading return..."),
        footer: renderEditFooter(),
      });

      bindEditModal();

      let response;

      try {
        response = await Api.Return.findById(id);
      } catch (error) {
        if (request === editRequest) {
          showEditError("Return could not be loaded for editing.");
        }
        return;
      }

      if (request !== editRequest) {
        return;
      }

      if (!isEditableResponse(response)) {
        showEditError(response?.message || "Return context is unavailable for editing.");
        return;
      }

      populateEditForm(response.data);
      Modal.body(renderEditForm());
      bindEditModal();
      DOM.$("inp-return-edit-date")?.focus();
    }

    function isEditableResponse(response) {
      return (
        isDetailResponse(response) &&
        !Utils.isEmpty(response.data.return?.[FIELD.ID]) &&
        isRecord(response.data.pickupHeader) &&
        isRecord(response.data.pickupDetail)
      );
    }

    function populateEditForm(data) {
      const ret = data.return;
      const header = data.pickupHeader;
      const detail = data.pickupDetail;

      editSubmitting = false;
      editForm = {
        id: String(ret[FIELD.ID]),
        Tanggal: dateInputValue(ret[FIELD.DATE]),
        Qty: ret[FIELD.QTY] ?? "",
        Keterangan: String(ret[FIELD.NOTE] || ""),
        originalQty: ret[FIELD.QTY],
        availableQty: data.availableQty,
        pickupHeader: header,
        pickupDetail: detail,
      };
    }

    function dateInputValue(value) {
      const date = String(value || "").trim();
      return /^\d{4}-\d{2}-\d{2}/.test(date) ? date.slice(0, 10) : date;
    }

    function renderEditForm() {
      if (!editForm) {
        return Components.empty("Return data is unavailable.");
      }

      const header = editForm.pickupHeader;
      const detail = editForm.pickupDetail;
      const pickupLabel = header.PickupNo || header.ID || editForm.id;

      return `
        <div id="return-edit-form" class="space-y-5">
          <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm">
            <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              ${detailField("Return ID", editForm.id)}
              ${detailField("Pickup", pickupLabel)}
              ${detailField("Pickup Detail ID", detail.ID)}
              ${detailField("Product ID", detail.ProductID)}
              ${detailField("Pickup Detail Qty", Format.number(detail.Qty))}
              ${detailField("Current Return Qty", Format.number(editForm.originalQty))}
              ${detailField("Available Qty", Format.number(editForm.availableQty))}
              ${detailField("Quantity validation", "Final quantity is validated by the server on Save.", "sm:col-span-2")}
            </dl>
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="inp-return-edit-date" class="mb-1 block text-sm font-medium text-slate-700">Tanggal</label>
              <input id="inp-return-edit-date" data-return-edit-field="Tanggal" type="date" value="${escape(editForm.Tanggal)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label for="inp-return-edit-qty" class="mb-1 block text-sm font-medium text-slate-700">Qty Return</label>
              <input id="inp-return-edit-qty" data-return-edit-field="Qty" type="number" min="0" step="any" value="${escape(editForm.Qty)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
            </div>
          </div>

          <div>
            <label for="inp-return-edit-note" class="mb-1 block text-sm font-medium text-slate-700">Keterangan</label>
            <textarea id="inp-return-edit-note" data-return-edit-field="Keterangan" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional notes">${escape(editForm.Keterangan)}</textarea>
          </div>
        </div>
      `;
    }

    function renderEditFooter() {
      return `
        <button type="button" data-return-edit-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="button" id="btn-return-edit-save" data-return-edit-action="save" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">Save Changes</button>
      `;
    }

    function bindEditModal() {
      const form = DOM.$("return-edit-form");

      if (form && !form.dataset.returnEditBound) {
        form.dataset.returnEditBound = "true";
        form.addEventListener("input", handleEditInput);
        form.addEventListener("change", handleEditInput);
      }

      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.returnEditBound) {
        footer.dataset.returnEditBound = "true";
        footer.addEventListener("click", handleEditFooterClick);
      }

      const close = DOM.$("btn-modal-close");

      if (close && !close.dataset.returnEditBound) {
        close.dataset.returnEditBound = "true";
        close.addEventListener("click", () => {
          if (!editSubmitting) {
            closeEdit();
          }
        });
      }
    }

    function handleEditInput(event) {
      const field = event.target.dataset.returnEditField;

      if (field && editForm) {
        editForm[field] = event.target.value;
      }
    }

    function handleEditFooterClick(event) {
      const action = event.target.closest("[data-return-edit-action]")?.dataset.returnEditAction;

      if (action === "cancel" && !editSubmitting) {
        closeEdit();
      }

      if (action === "save") {
        submitEdit();
      }
    }

    async function submitEdit() {
      if (editSubmitting || !editForm) {
        return;
      }

      const validation = validateEdit();

      if (!validation.valid) {
        Toast.warning(validation.message);
        validation.element?.focus();
        return;
      }

      editSubmitting = true;
      setEditLoading(true);

      try {
        const response = await Api.Return.update(editForm.id, validation.document);

        if (!response?.success) {
          Toast.error(response?.message || "Return could not be updated.");
          return;
        }

        Toast.success(response.message || "Return updated.");
        closeEdit();
        await App.refresh();
      } catch (error) {
        Toast.error(error?.message || "Return could not be updated. Please try again.");
      } finally {
        editSubmitting = false;
        setEditLoading(false);
      }
    }

    function validateEdit() {
      const id = String(editForm.id || "").trim();
      const tanggal = String(editForm.Tanggal || "").trim();
      const qty = Number(editForm.Qty);

      if (!id) {
        return invalidReturn("Return ID is unavailable.");
      }

      if (!tanggal) {
        return invalidReturn("Tanggal is required.", DOM.$("inp-return-edit-date"));
      }

      if (!Number.isFinite(qty)) {
        return invalidReturn("Qty must be numeric.", DOM.$("inp-return-edit-qty"));
      }

      if (qty <= 0) {
        return invalidReturn("Qty must be greater than zero.", DOM.$("inp-return-edit-qty"));
      }

      return {
        valid: true,
        document: {
          Tanggal: tanggal,
          Qty: qty,
          Keterangan: String(editForm.Keterangan || "").trim(),
        },
      };
    }

    function setEditLoading(loading) {
      const button = DOM.$("btn-return-edit-save");

      if (!button) {
        return;
      }

      button.disabled = loading;
      button.classList.toggle("opacity-50", loading);
      button.classList.toggle("cursor-not-allowed", loading);
      button.textContent = loading ? "Saving..." : "Save Changes";
    }

    function showEditError(message) {
      Toast.error(message);
      clearEditForm();
      Modal.body(Components.empty(message));
    }

    function clearEditForm() {
      editForm = null;
      editSubmitting = false;
    }

    function closeEdit() {
      if (modalMode !== "edit") {
        return;
      }

      editRequest += 1;
      clearEditForm();
      modalMode = null;
      Modal.close();
    }

    //===========================================================================
    // Create Return
    //===========================================================================

    async function openCreate() {
      if (returnSubmitting) {
        return;
      }

      clearEditForm();

      const headers = await loadPickupHeaders();

      if (!headers) {
        return;
      }

      resetReturnForm();
      openReturnForm();
    }

    async function loadPickupHeaders() {
      if (pickupHeaders) {
        return pickupHeaders;
      }

      let response;

      try {
        response = await Api.Pickup.findAll();
      } catch (error) {
        Toast.error("Pickup headers could not be loaded.");
        return null;
      }

      if (!response?.success) {
        Toast.error(response?.message || "Pickup headers could not be loaded.");
        return null;
      }

      pickupHeaders = selectableRecords(response.data);

      if (!pickupHeaders.length) {
        Toast.warning("No active Pickup headers are available for Return.");
        return null;
      }

      return pickupHeaders;
    }

    function selectableRecords(data) {
      const records = Array.isArray(data) ? data : [];

      return records.filter((record) => isActive(record?.IsActive) && !isTrue(record?.Deleted));
    }

    function resetReturnForm() {
      pickupLoadRequest += 1;
      returnSubmitting = false;
      returnForm = {
        Tanggal: "",
        PickupID: "",
        PickupDetailID: "",
        Qty: "",
        Keterangan: "",
        details: [],
        loadingDetails: false,
      };
    }

    function openReturnForm() {
      modalMode = "create";

      Modal.open({
        title: "Add Return",
        width: "lg",
        body: renderReturnForm(),
        footer: renderReturnFooter(),
      });

      bindReturnForm();
      DOM.$("inp-return-form-date")?.focus();
    }

    function renderReturnForm() {
      const selectedDetail = selectedPickupDetail();

      return `
        <div id="return-form" class="space-y-5">
          <div class="rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-900">
            Select a Pickup and its item. Return availability is validated by the server when saved.
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            ${renderReturnDate()}
            ${renderPickupSelect()}
          </div>

          ${renderPickupDetailSelect()}

          ${renderReturnContext(selectedDetail)}

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="inp-return-form-qty" class="mb-1 block text-sm font-medium text-slate-700">Qty Return</label>
              <input id="inp-return-form-qty" data-return-form-field="Qty" type="number" min="0" step="any" value="${escape(returnForm?.Qty)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
            </div>
          </div>

          <div>
            <label for="inp-return-form-note" class="mb-1 block text-sm font-medium text-slate-700">Keterangan</label>
            <textarea id="inp-return-form-note" data-return-form-field="Keterangan" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional notes">${escape(returnForm?.Keterangan)}</textarea>
          </div>
        </div>
      `;
    }

    function renderReturnDate() {
      return `
        <div>
          <label for="inp-return-form-date" class="mb-1 block text-sm font-medium text-slate-700">Tanggal</label>
          <input id="inp-return-form-date" data-return-form-field="Tanggal" type="date" value="${escape(returnForm?.Tanggal)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      `;
    }

    function renderPickupSelect() {
      return `
        <div>
          <label for="sel-return-form-pickup" class="mb-1 block text-sm font-medium text-slate-700">Pickup</label>
          <select id="sel-return-form-pickup" data-return-form-field="PickupID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Pickup --</option>
            ${(pickupHeaders || []).map(renderPickupOption).join("")}
          </select>
        </div>
      `;
    }

    function renderPickupOption(header = {}) {
      const id = String(header.ID || "");
      const label = header.PickupNo || id;
      const selected = id === String(returnForm?.PickupID || "") ? "selected" : "";

      return `<option value="${escape(id)}" ${selected}>${escape(label)}</option>`;
    }

    function renderPickupDetailSelect() {
      const disabled = !returnForm?.PickupID || returnForm.loadingDetails;
      const message = returnForm?.loadingDetails
        ? "Loading Pickup Details..."
        : returnForm?.PickupID
          ? "-- Select Pickup Detail / Product --"
          : "-- Select Pickup first --";

      return `
        <div>
          <label for="sel-return-form-detail" class="mb-1 block text-sm font-medium text-slate-700">Pickup Detail / Product</label>
          <select id="sel-return-form-detail" data-return-form-field="PickupDetailID" ${disabled ? "disabled" : ""} class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100">
            <option value="">${message}</option>
            ${(returnForm?.details || []).map(renderPickupDetailOption).join("")}
          </select>
        </div>
      `;
    }

    function renderPickupDetailOption(detail = {}) {
      const id = String(detail.ID || "");
      const product = detail.ProductID || id;
      const selected = id === String(returnForm?.PickupDetailID || "") ? "selected" : "";

      return `<option value="${escape(id)}" ${selected}>${escape(product)} (${escape(id)})</option>`;
    }

    function renderReturnContext(detail) {
      if (!detail) {
        return `
          <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
            Choose a Pickup Detail to see its Product and quantity context.
          </div>
        `;
      }

      return `
        <dl class="grid grid-cols-1 gap-4 rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm sm:grid-cols-2">
          ${detailField("Product", detail.ProductID || detail.ID)}
          ${detailField("Pickup Detail ID", detail.ID)}
          ${detailField("Pickup Detail Qty", Format.number(detail.Qty))}
          ${detailField("Already Returned Qty", "Not available for a new selection")}
          ${detailField("Available Qty", "Validated by server on submit", "sm:col-span-2")}
        </dl>
      `;
    }

    function renderReturnFooter() {
      return `
        <button type="button" data-return-form-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="button" id="btn-return-form-save" data-return-form-action="save" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">Save Return</button>
      `;
    }

    function bindReturnForm() {
      const form = DOM.$("return-form");

      if (form) {
        form.addEventListener("input", handleReturnFormInput);
        form.addEventListener("change", handleReturnFormInput);
      }

      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.returnFormBound) {
        footer.dataset.returnFormBound = "true";
        footer.addEventListener("click", handleReturnFooterClick);
      }

      const close = DOM.$("btn-modal-close");

      if (close && !close.dataset.returnFormBound) {
        close.dataset.returnFormBound = "true";
        close.addEventListener("click", () => {
          if (returnForm && !returnSubmitting) {
            closeCreate();
          }
        });
      }
    }

    function handleReturnFormInput(event) {
      const field = event.target.dataset.returnFormField;

      if (!field || !returnForm) {
        return;
      }

      if (field === "PickupID") {
        changePickup(event.target.value);
        return;
      }

      returnForm[field] = event.target.value;

      if (field === "PickupDetailID") {
        returnForm.Qty = "";
        Modal.body(renderReturnForm());
        bindReturnForm();
      }
    }

    async function changePickup(id) {
      if (!returnForm || returnSubmitting) {
        return;
      }

      const request = ++pickupLoadRequest;

      returnForm.PickupID = String(id || "");
      returnForm.PickupDetailID = "";
      returnForm.Qty = "";
      returnForm.details = [];
      returnForm.loadingDetails = Boolean(returnForm.PickupID);
      Modal.body(renderReturnForm());
      bindReturnForm();

      if (!returnForm.PickupID) {
        return;
      }

      const details = await loadPickupDetails(returnForm.PickupID);

      if (!returnForm || request !== pickupLoadRequest) {
        return;
      }

      returnForm.loadingDetails = false;
      returnForm.details = details || [];
      Modal.body(renderReturnForm());
      bindReturnForm();

      if (!details) {
        Toast.error("Pickup Details could not be loaded.");
      } else if (!details.length) {
        Toast.warning("The selected Pickup has no active Details.");
      }
    }

    async function loadPickupDetails(id) {
      if (pickupDetailsByHeader.has(id)) {
        return pickupDetailsByHeader.get(id);
      }

      let response;

      try {
        response = await Api.Pickup.findById(id);
      } catch (error) {
        return null;
      }

      if (!response?.success || !Array.isArray(response.data?.details)) {
        return null;
      }

      const details = selectableRecords(response.data.details);
      pickupDetailsByHeader.set(id, details);

      return details;
    }

    function selectedPickupDetail() {
      return (returnForm?.details || []).find((detail) => {
        return String(detail?.ID) === String(returnForm?.PickupDetailID || "");
      });
    }

    function handleReturnFooterClick(event) {
      const action = event.target.closest("[data-return-form-action]")?.dataset.returnFormAction;

      if (action === "cancel") {
        if (!returnSubmitting) {
          closeCreate();
        }
        return;
      }

      if (action === "save") {
        submitCreate();
      }
    }

    async function submitCreate() {
      if (returnSubmitting || !returnForm) {
        return;
      }

      const validation = validateReturn();

      if (!validation.valid) {
        Toast.warning(validation.message);
        validation.element?.focus();
        return;
      }

      returnSubmitting = true;
      setReturnLoading(true);

      try {
        const response = await Api.Return.create(validation.document);

        if (!response?.success) {
          Toast.error(response?.message || "Return could not be created.");
          return;
        }

        Toast.success(response.message || "Return created.");
        closeCreate();
        await App.refresh();
      } catch (error) {
        Toast.error(error?.message || "Return could not be created. Please try again.");
      } finally {
        returnSubmitting = false;
        setReturnLoading(false);
      }
    }

    function validateReturn() {
      const tanggal = String(returnForm.Tanggal || "").trim();
      const pickupId = String(returnForm.PickupID || "").trim();
      const pickupDetailId = String(returnForm.PickupDetailID || "").trim();
      const qty = Number(returnForm.Qty);

      if (!tanggal) {
        return invalidReturn("Tanggal is required.", DOM.$("inp-return-form-date"));
      }

      if (!pickupId) {
        return invalidReturn("Pickup is required.", DOM.$("sel-return-form-pickup"));
      }

      if (!pickupDetailId) {
        return invalidReturn("Pickup Detail is required.", DOM.$("sel-return-form-detail"));
      }

      if (!Number.isFinite(qty)) {
        return invalidReturn("Qty must be numeric.", DOM.$("inp-return-form-qty"));
      }

      if (qty <= 0) {
        return invalidReturn("Qty must be greater than zero.", DOM.$("inp-return-form-qty"));
      }

      return {
        valid: true,
        document: {
          PickupDetailID: pickupDetailId,
          Tanggal: tanggal,
          Qty: qty,
          Keterangan: String(returnForm.Keterangan || "").trim(),
        },
      };
    }

    function invalidReturn(message, element = null) {
      return { valid: false, message, element };
    }

    function setReturnLoading(loading) {
      const button = DOM.$("btn-return-form-save");

      if (!button) {
        return;
      }

      button.disabled = loading;
      button.classList.toggle("opacity-50", loading);
      button.classList.toggle("cursor-not-allowed", loading);
      button.textContent = loading ? "Saving..." : "Save Return";
    }

    function closeCreate() {
      pickupLoadRequest += 1;
      returnForm = null;
      modalMode = null;
      Modal.close();
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      return SharedPresenter.text(value);
    }

    function escape(value) {
      return Utils.escapeHTML(String(value ?? ""));
    }

    return Object.freeze({
      render,

      view,

      openCreate,

      submitCreate,

      openEdit,

      submitEdit,
    });
  })();
</script>
