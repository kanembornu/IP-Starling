<script>
  /** Render-only Return presenter. State and orchestration are external. */
  const ReturnsPresenter = (() => {
    const F = Object.freeze({ ID:"ID", PICKUP:"PickupID", DETAIL:"PickupDetailID", PRODUCT:"ProductID", PRODUCT_NAME:"ProductName", PARTNER:"PartnerID", PARTNER_NAME:"PartnerName", DATE:"Tanggal", QTY:"Qty", NOTE:"Keterangan", DELETED:"Deleted", ACTIVE:"IsActive" });

    function render(view = {}) {
      const mode = normalizeMode(view); renderHeader(mode); renderModeButtons(mode);
      const rows = Array.isArray(view.rows) ? view.rows : [];
      if (!rows.length) return renderEmpty(view.emptyMessage || (mode === "deleted" ? "No deleted returns available." : "No returns available."), mode);
      Render.mount("tbl-returns-body", rows.map((row) => mode === "deleted" ? renderDeletedRow(row, view) : renderActiveRow(row, view)).join(""));
    }
    function renderLoading(view = {}) { const mode=normalizeMode(view), label=mode==="deleted"?"deleted returns":"returns"; renderHeader(mode); renderModeButtons(mode); Render.mount("tbl-returns-body", `<tr><td colspan="${columns(mode)}">${Components.loading(`Loading ${label}...`)}</td></tr>`); Render.mount("lbl-return-info", `Loading ${label}...`); Render.mount("return-pagination", ""); }
    function renderError(view = {}) { const mode=normalizeMode(view), label=mode==="deleted"?"Deleted returns":"Returns"; renderHeader(mode); renderModeButtons(mode); Render.mount("tbl-returns-body", `<tr><td colspan="${columns(mode)}">${Components.error(view.message || `${label} could not be loaded. Use Refresh to try again.`)}</td></tr>`); Render.mount("lbl-return-info", "Return count unavailable"); Render.mount("return-pagination", ""); }
    function renderEmpty(message, mode) { Render.mount("tbl-returns-body", `<tr><td colspan="${columns(mode)}">${Components.empty(message)}</td></tr>`); }
    function normalizeMode(view) { return (typeof view === "string" ? view : view?.mode) === "deleted" ? "deleted" : "active"; }
    function columns(mode) { return mode === "deleted" ? 10 : 8; }
    function renderHeader(mode) { Render.mount("tbl-returns-head", mode === "deleted" ? `<tr><th class="whitespace-nowrap px-4 py-3 text-left">Return ID</th><th class="whitespace-nowrap px-4 py-3 text-left">Tanggal</th><th class="min-w-[9rem] px-4 py-3 text-left">Mitra</th><th class="min-w-[10rem] px-4 py-3 text-left">Produk</th><th class="whitespace-nowrap px-4 py-3 text-right">Qty</th><th class="min-w-[10rem] px-4 py-3 text-left">Catatan</th><th class="min-w-[8rem] px-4 py-3 text-left">Pickup</th><th class="min-w-[10rem] whitespace-nowrap px-4 py-3 text-center">Status Restore</th><th class="min-w-[20rem] px-4 py-3 text-left">Keterangan</th><th class="whitespace-nowrap px-4 py-3 text-center">Action</th></tr>` : `<tr><th class="px-4 py-3 text-left">ID</th><th class="px-4 py-3 text-left">Tanggal Return</th><th class="px-4 py-3 text-left">Mitra</th><th class="px-4 py-3 text-left">Produk</th><th class="px-4 py-3 text-right">Qty</th><th class="px-4 py-3 text-left">Note</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3 text-center">Action</th></tr>`); }
    function renderModeButtons(mode) { document.querySelectorAll("[data-return-mode]").forEach((button) => { const selected=button.dataset.returnMode===mode; button.classList.toggle("bg-blue-600",selected); button.classList.toggle("text-white",selected); button.classList.toggle("text-slate-600",!selected); }); DOM.$("btn-return-add")?.classList.toggle("hidden", mode === "deleted"); }
    function business(name,id,label,secondary) { return `<div class="font-medium text-slate-800">${text(name)}</div><div class="mt-1 text-xs text-slate-500">${escape(label)}: ${text(id)}</div>${Utils.isEmpty(secondary)?"":`<div class="text-xs text-slate-400">${text(secondary)}</div>`}`; }
    function renderActiveRow(row, view) { return Components.tableRow([Components.tableCell(text(row?.[F.ID]),"font-medium text-slate-800"),Components.tableCell(formatDate(row?.[F.DATE])),Components.tableCell(business(row?.[F.PARTNER_NAME],row?.[F.PARTNER],"Mitra ID")),Components.tableCell(business(row?.[F.PRODUCT_NAME],row?.[F.PRODUCT],"Produk ID",`Pickup: ${row?.[F.PICKUP]??""} · Pickup Detail: ${row?.[F.DETAIL]??""}`)),Components.tableCell(formatNumber(row?.[F.QTY]),"text-right"),Components.tableCell(text(row?.[F.NOTE])),Components.tableCell(renderStatus(row),"text-center"),Components.tableCell(renderActions(row,view.busyId),"text-center")]); }
    function renderActions(row,busyId) { const id=row?.[F.ID]; if(Utils.isEmpty(id)||truthy(row?.[F.DELETED],false)||!truthy(row?.[F.ACTIVE],true)) return "-"; const busy=Boolean(busyId), attrs=(action)=>`data-return-action="${action}" data-return-id="${escape(id)}"`; return Components.tableActions(`${Components.tableAction({label:"View",icon:"fa-eye",attributes:attrs("view"),disabled:busy})}${Components.tableAction({label:"Edit",icon:"fa-pen",tone:"blue",attributes:attrs("edit"),disabled:busy})}${Components.tableAction({label:String(busyId||"")===String(id)?"Deleting...":"Delete",icon:"fa-trash-can",tone:"red",attributes:attrs("delete"),busy})}`); }
    function renderDeletedRow(row,view) { const id=row?.[F.ID], busy=Boolean(view.busyId), allowed=row?.canRestore===true&&!busy; return Components.tableRow([Components.tableCell(text(id),"font-medium text-slate-800"),Components.tableCell(formatDate(row?.[F.DATE])),Components.tableCell(business(row?.[F.PARTNER_NAME],row?.[F.PARTNER],"Mitra ID")),Components.tableCell(business(row?.[F.PRODUCT_NAME],row?.[F.PRODUCT],"Produk ID",`Pickup Detail: ${row?.[F.DETAIL]??""}`)),Components.tableCell(formatNumber(row?.[F.QTY]),"text-right"),Components.tableCell(text(row?.[F.NOTE]),"whitespace-normal align-top"),Components.tableCell(`<span class="text-xs text-slate-500">Pickup: ${text(row?.[F.PICKUP])}</span>`,"align-top"),Components.tableCell(Components.badge(row?.canRestore===true?"Aman direstore":"Tidak dapat direstore",row?.canRestore===true),"whitespace-nowrap text-center align-top"),Components.tableCell(text(row?.restoreReason),"min-w-[20rem] whitespace-normal break-words align-top leading-relaxed"),Components.tableCell(Components.tableActions(Components.tableAction({label:String(view.busyId||"")===String(id)?"Restoring...":"Restore",icon:"fa-rotate-left",tone:row?.canRestore===true?"green":"gray",attributes:`data-return-action="restore" data-return-id="${escape(id)}"`,disabled:!allowed,busy})),"whitespace-nowrap text-center align-top")]); }
    function renderStatus(row) { if(truthy(row?.[F.DELETED],false)) return Components.badge("Deleted",false); const active=truthy(row?.[F.ACTIVE],true); return Components.badge(Format.status(active),active); }
    function renderDetail(data={}) { const row=data.return||{}; return `<div class="space-y-6"><section><h3 class="mb-3 text-sm font-semibold text-slate-800">Return</h3><dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">${detailField("Return ID",row.ID)}${detailField("Tanggal",formatDate(row.Tanggal))}${detailField("Qty Returned",formatNumber(row.Qty))}${detailField("Status",truthy(row.Deleted,false)?"Deleted":Format.status(truthy(row.IsActive,true)))}${Utils.isEmpty(row.Keterangan)?"":detailField("Keterangan",row.Keterangan,"sm:col-span-2")}</dl></section>${renderContext("Pickup Header",data.pickupHeader,["PickupNo","ID","Tanggal","PartnerID","Status","TotalItem","TotalQty"])}${renderContext("Pickup Detail",data.pickupDetail,["ID","ProductID","Qty","Notes"],data.availableQty)}</div>`; }
    function renderContext(title,row,fields,availableQty) { if(!row||typeof row!=="object") return `<section><h3 class="mb-3 text-sm font-semibold">${escape(title)}</h3>${Components.empty(`${title} data is unavailable.`)}</section>`; return `<section><h3 class="mb-3 text-sm font-semibold text-slate-800">${escape(title)}</h3><dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">${fields.map((field)=>detailField(field,field==="Tanggal"?formatDate(row[field]):field==="Qty"||field.startsWith("Total")?formatNumber(row[field]):row[field])).join("")}${availableQty===undefined?"":detailField("Available Return Qty",formatNumber(availableQty))}</dl></section>`; }
    function renderDetailFooter() { return `<button type="button" data-return-detail-action="close" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Close</button>`; }
    function renderForm(kind,view={}) { const form=view.form||{}, edit=kind==="edit", details=form.details||[], headers=view.pickups||[], selected=details.find((row)=>String(row?.ID)===String(form.PickupDetailID||"")); return `<div id="return-${kind}-form" class="space-y-5">${edit?`<div class="grid grid-cols-1 gap-3 rounded-lg bg-slate-50 p-4 text-sm sm:grid-cols-2">${detailField("Return ID",form.id)}${detailField("Pickup",form.pickupHeader?.PickupNo||form.pickupHeader?.ID)}${detailField("Pickup Detail ID",form.pickupDetail?.ID)}${detailField("Product ID",form.pickupDetail?.ProductID)}${detailField("Current Return Qty",formatNumber(form.Qty))}${detailField("Available Qty",formatNumber(form.availableQty))}</div>`:""}<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">${input(kind,"Tanggal","date",form.Tanggal)}${edit?"":select(kind,"PickupID",headers,form.PickupID,"-- Select Pickup --")}</div>${edit?"":select(kind,"PickupDetailID",details,form.PickupDetailID,form.loadingDetails?"Loading Pickup Details...":"-- Select Pickup Detail / Product --",!form.PickupID||form.loadingDetails)}${!edit?renderCreateContext(selected):""}${input(kind,"Qty","number",form.Qty)}<div><label class="mb-1 block text-sm font-medium">Keterangan</label><textarea data-return-${kind}-field="Keterangan" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2">${escape(form.Keterangan)}</textarea></div></div>`; }
    function renderCreateContext(detail) { if(!detail)return `<div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Choose a Pickup Detail to see its Product and quantity context.</div>`;return `<dl class="grid grid-cols-1 gap-4 rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm sm:grid-cols-2">${detailField("Product",detail.ProductID||detail.ID)}${detailField("Pickup Detail ID",detail.ID)}${detailField("Pickup Detail Qty",formatNumber(detail.Qty))}${detailField("Available Qty","Validated by server on submit")}</dl>`; }
    function input(kind,field,type,value) { return `<div><label class="mb-1 block text-sm font-medium">${escape(field)}</label><input data-return-${kind}-field="${field}" type="${type}" ${type==="number"?'min="0" step="any"':""} value="${escape(value)}" class="w-full rounded-lg border border-slate-300 px-3 py-2" />${Components.formFieldError(`data-return-${kind}-error`,field)}</div>`; }
    function select(kind,field,records,selected,prompt,disabled=false) { return `<div><label class="mb-1 block text-sm font-medium">${escape(field==="PickupID"?"Pickup":"Pickup Detail / Product")}</label><select data-return-${kind}-field="${field}" ${disabled?"disabled":""} class="w-full rounded-lg border border-slate-300 px-3 py-2"><option value="">${escape(prompt)}</option>${records.map((r)=>`<option value="${escape(r.ID)}" ${String(r.ID)===String(selected||"")?"selected":""}>${escape(r.PickupNo||r.ProductID||r.ID)}</option>`).join("")}</select>${Components.formFieldError(`data-return-${kind}-error`,field)}</div>`; }
    function renderCreateForm(view) { return renderForm("create",view); } function renderEditForm(view) { return renderForm("edit",view); }
    function renderFormFooter(kind,view={}) { return Components.formFooter({cancelAttribute:`data-return-${kind}-action="cancel"`,saveAttribute:`data-return-${kind}-action="save"`,saveLabel:kind==="create"?"Save Return":"Save Changes",loadingLabel:kind==="create"?"Saving Return...":"Saving Changes...",loading:Boolean(view.loading)}); }
    function showFieldError(kind,field,message) { const target=document.querySelector(`[data-return-${kind}-error="${field}"]`);if(!target)return false;DOM.text(target,message);target.classList.remove("hidden");return true; }
    function renderDeleteMessage(row={}) { return `<div class="space-y-3"><p>Delete / deactivate Return <strong>${escape(row.ID)}</strong>?</p><dl class="rounded-lg bg-slate-50 p-3 text-sm">${detailField("Pickup",row.PickupID)}${detailField("Qty",formatNumber(row.Qty))}</dl><p class="text-sm text-slate-600">This uses a soft delete. The Return will not be permanently deleted.</p></div>`; }
    function setRowBusy(id,busy) { document.querySelectorAll("[data-return-action]").forEach((b)=>{if(String(b.dataset.returnId)!==String(id))return;b.disabled=busy;b.classList.toggle("opacity-50",busy);}); }
    function detailField(label,value,classes="") { return `<div class="${classes}"><dt class="text-slate-500">${escape(label)}</dt><dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd></div>`; }
    function truthy(value,fallback) { if(value===true||value===1||String(value).toLowerCase()==="true")return true;if(value===false||value===0||String(value).toLowerCase()==="false")return false;return fallback; }
    function formatDate(value) { return Utils.isEmpty(value)||isNaN(new Date(value).getTime())?"-":Format.date(value); } function formatNumber(value) { const n=Number(value); return Number.isFinite(n)?Format.number(n):"-"; }
    function safe(value) { return Utils.isEmpty(value)||typeof value==="object"||typeof value==="function"?"-":value; } function text(value) { return SharedPresenter.text(safe(value)); } function escape(value) { return Utils.escapeHTML(String(value??"")); }
    return Object.freeze({render,renderLoading,renderError,renderCreateForm,renderEditForm,renderFormFooter,showFieldError,renderDetail,renderDetailFooter,renderDeleteMessage,setRowBusy});
  })();
</script>
