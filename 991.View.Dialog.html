<script>
  /**
   * =============================================================================
   * FILE        : 991.View.Dialog
   * VERSION     : 1.0.0
   * DESCRIPTION : Dialog Framework
   * =============================================================================
   */

  const Dialog = (() => {
    async function confirm(options = {}) {
      return new Promise((resolve) => {
        let submitting = false;

        Modal.open({
          title: options.title || "Confirmation",

          width: "sm",

          body: `
        <div class="py-2 text-slate-700">
          ${options.message || ""}
        </div>
      `,

          footer: `
        <div class="flex justify-end gap-2">

          <button
            id="dialog-cancel"
            type="button"
            class="px-4 py-2 border rounded-lg"
          >
            ${options.cancelText || "Cancel"}
          </button>

          <button
            id="dialog-ok"
            type="button"
            class="px-4 py-2 bg-red-600 text-white rounded-lg"
          >
            ${options.confirmText || "OK"}
          </button>

        </div>
      `,
        });

        DOM.$("dialog-cancel").addEventListener(
          "click",

          () => {
            if (submitting) {
              return;
            }

            Modal.close();

            resolve(false);
          },
        );

        DOM.$("dialog-ok").addEventListener(
          "click",

          async () => {
            if (submitting) {
              return;
            }

            if (typeof options.onConfirm === "function") {
              submitting = true;
              setLoading(true, options.loadingText || "Processing...");

              let confirmed = false;

              try {
                confirmed = (await options.onConfirm()) === true;
              } finally {
                submitting = false;
                setLoading(false, options.confirmText || "OK");
              }

              if (!confirmed) {
                return;
              }
            }

            Modal.close();

            resolve(true);
          },
        );

        const close = DOM.$("btn-modal-close");

        if (close) {
          close.onclick = () => {
            if (submitting) {
              return;
            }

            Modal.close();

            resolve(false);
          };
        }

        function setLoading(loading, label) {
          const confirmButton = DOM.$("dialog-ok");
          const cancelButton = DOM.$("dialog-cancel");

          if (confirmButton) {
            confirmButton.disabled = loading;
            confirmButton.classList.toggle("opacity-50", loading);
            confirmButton.classList.toggle("cursor-not-allowed", loading);
            confirmButton.textContent = label;
          }

          if (cancelButton) {
            cancelButton.disabled = loading;
          }
        }
      });
    }

    return Object.freeze({
      confirm,
    });
  })();
</script>
