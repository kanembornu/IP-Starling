<template id="logs-page">
  <div class="space-y-5">
    <section class="grid grid-cols-2 gap-3 lg:grid-cols-4" id="logs-summary"></section>
    <p class="rounded-lg bg-blue-50 px-4 py-3 text-sm text-blue-800">Audit bertambah untuk mutasi bisnis dan perubahan Settings yang berhasil. Peringatan hanya bertambah saat event WARN ditulis, dan Error hanya saat event ERROR ditulis. CRUD dan restore yang berhasil tetap AUDIT/INFO.</p>
    <section data-filter-toolbar="logs" class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-5">
        <label class="text-xs text-slate-600">Date range<select id="logs-preset" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="TODAY">Today</option><option value="LAST_7_DAYS">Last 7 Days</option><option value="CURRENT_MONTH" selected>Current Month</option><option value="PREVIOUS_MONTH">Previous Month</option><option value="CURRENT_YEAR">Current Year</option><option value="CUSTOM">Custom</option></select></label>
        <label class="logs-custom hidden text-xs text-slate-600">From<input id="logs-date-from" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></label>
        <label class="logs-custom hidden text-xs text-slate-600">To<input id="logs-date-to" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></label>
        <label class="text-xs text-slate-600">Level<select id="logs-level" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">All</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option></select></label>
        <label class="text-xs text-slate-600">Category<select id="logs-category" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">All</option><option>AUDIT</option><option>APPLICATION</option><option>VALIDATION</option><option>ERROR</option><option>SYSTEM</option></select></label>
        <label class="text-xs text-slate-600">Module<input id="logs-module" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search modules..."></label>
        <label class="text-xs text-slate-600">Action<select id="logs-action" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">All</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>RESTORE</option><option>READ</option><option>SETTINGS_UPDATE</option><option>SETTINGS_RESET</option><option>MIGRATION</option><option>SYSTEM</option></select></label>
        <label class="text-xs text-slate-600">Status<select id="logs-status" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">All</option><option>SUCCESS</option><option>FAILURE</option><option>WARNING</option></select></label>
        <label class="text-xs text-slate-600 xl:col-span-2">Search<input id="logs-search" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search logs..."></label>
      </div>
      <p id="logs-filter-error" class="mt-3 hidden text-sm text-red-600"></p>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <p data-filter-feedback="logs" class="text-xs text-slate-500" aria-live="polite">No filters active</p>
        <button type="button" data-logs-action="clear" data-filter-clear="logs" class="w-full rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"><i class="fa-solid fa-xmark mr-2"></i>Clear filters</button>
      </div>
    </section>
    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="w-full"><table class="w-full table-fixed text-left text-sm"><colgroup><col class="w-[14%]"><col class="w-[6%]"><col class="hidden w-[9%] lg:table-column"><col class="hidden w-[9%] xl:table-column"><col class="w-[16%]"><col class="w-[8%]"><col class="w-[29%]"><col class="w-[9%]"></colgroup><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-3 py-3 whitespace-nowrap">Timestamp</th><th class="px-3 py-3 whitespace-nowrap">Level</th><th class="hidden px-3 py-3 lg:table-cell">Module</th><th class="hidden px-3 py-3 xl:table-cell">Action</th><th class="px-3 py-3">Entity</th><th class="px-3 py-3 whitespace-nowrap">Status</th><th class="px-3 py-3">Message</th><th class="px-3 py-3 whitespace-nowrap">Detail</th></tr></thead><tbody id="logs-body"></tbody></table></div>
      <div id="logs-state"></div>
      <div class="flex flex-col gap-3 border-t p-4 sm:flex-row sm:items-center sm:justify-between"><div id="logs-page-label" class="text-sm text-slate-500">Menampilkan 0–0 dari 0 log</div><div id="logs-pagination" class="w-full sm:w-auto"></div></div>
    </section>
  </div>
</template>
