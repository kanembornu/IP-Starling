<script>
  /**
   * =============================================================================
   * FILE        : 974.View.Pickups.Presenter.html
   * VERSION     : 1.1.0
   * DESCRIPTION : Pickup Header-Detail Presenter
   * =============================================================================
   */

  const PickupsPresenter = (() => {
    //===========================================================================
    // Fields
    //===========================================================================

    const FIELD = Object.freeze({
      ID: "ID",

      PICKUP_NO: "PickupNo",

      DATE: "Tanggal",

      PARTNER_ID: "PartnerID",

      TOTAL_ITEM: "TotalItem",

      TOTAL_QTY: "TotalQty",

      STATUS: "Status",

      NOTES: "Notes",

      IS_ACTIVE: "IsActive",
    });

    let pickups = [];

    let mode = "active";

    let activeQuery = "";

    let detailRequest = 0;

    let pendingDeleteId = null;

    let masterProducts = null;

    let masterPartners = null;

    let pickupForm = null;

    let pickupSubmitting = false;

    let editingPickupId = null;

    let nextDetailId = 1;

    //===========================================================================
    // Public Render
    //===========================================================================

    function render(data, selectedMode = App.getPickupMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      pickups = normalize(data);

      updateHeaders();

      bindToolbar();

      bindActions();

      syncModeUi();

      renderList(
        mode === "active"
          ? filter(activeQuery)
          : filterTrash(App.getPickupSearch()),
      );
    }

    function search(keyword = "") {
      if (mode === "trash") {
        pickups = App.getDeletedPickups();
        renderList(filterTrash(keyword));
        return;
      }

      activeQuery = String(keyword ?? "").trim();
      pickups = App.getPickups();
      renderList(filter(activeQuery));
    }

    //===========================================================================
    // Data
    //===========================================================================

    function normalize(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data?.data)) {
        return data.data;
      }

      return [];
    }

    //===========================================================================
    // List
    //===========================================================================

    function renderList(list = []) {
      renderInfo(list.length);

      if (!list.length) {
        renderEmpty(
          mode === "trash" && pickups.length && normalizeSearch(App.getPickupSearch())
            ? "search"
            : "database",
        );

        return;
      }

      Render.mount(
        "tbl-pickups-body",

        list.map(mode === "trash" ? renderTrashRow : renderRow).join(""),
      );
    }

    function renderTrashRow(pickup = {}) {
      const eligibility = pickup.restoreEligibility || {};

      return Components.tableRow([
        Components.tableCell(text(pickup[FIELD.ID]), "font-medium text-slate-800"),
        Components.tableCell(formatPickupDate(pickup[FIELD.DATE])),
        Components.tableCell(text(pickup.partnerName || pickup[FIELD.PARTNER_ID])),
        Components.tableCell(renderTrashDetails(pickup.details)),
        Components.tableCell(formatQty(pickup[FIELD.TOTAL_QTY]), "text-right"),
        Components.tableCell(renderEligibilityStatus(eligibility), "text-center"),
        Components.tableCell(renderEligibilityReason(eligibility)),
        Components.tableCell(renderRestorePreview(), "text-center"),
      ]);
    }

    function renderTrashDetails(details) {
      const rows = Array.isArray(details) ? details : [];

      if (!rows.length) return "-";

      return `<ul class="space-y-1">${rows.map((detail) => `
        <li>
          <span class="font-medium text-slate-700">${text(detail.productName || detail.ProductID)}</span>
          <span class="text-slate-500">&times; ${formatQty(detail.Qty)}</span>
        </li>
      `).join("")}</ul>`;
    }

    function renderEligibilityStatus(eligibility) {
      const allowed = eligibility.allowed === true;
      const label = allowed ? "Aman dipulihkan" : "Tidak dapat dipulihkan";
      const colors = allowed
        ? "border-green-200 bg-green-50 text-green-700"
        : "border-red-200 bg-red-50 text-red-700";

      return `<span class="inline-flex rounded-full border px-3 py-1 text-xs font-semibold ${colors}">${label}</span>`;
    }

    function renderEligibilityReason(eligibility) {
      if (eligibility.allowed === true) return "-";

      const code = Utils.isEmpty(eligibility.code)
        ? ""
        : `<div class="mt-1 text-xs text-slate-400">${text(eligibility.code)}</div>`;

      return `<div class="text-sm text-slate-600">${text(eligibility.message)}${code}</div>`;
    }

    function renderRestorePreview() {
      return `
        <button
          type="button"
          disabled
          aria-disabled="true"
          title="Aksi pemulihan akan tersedia pada sprint berikutnya."
          class="inline-flex cursor-not-allowed items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-slate-400 opacity-70"
        >
          ${Components.icon("fa-rotate-left")}
          <span>Restore</span>
        </button>
      `;
    }

    function renderRow(pickup = {}) {
      return Components.tableRow([
        Components.tableCell(
          text(pickup[FIELD.PICKUP_NO] || pickup[FIELD.ID]),

          "font-medium text-slate-800",
        ),

        Components.tableCell(formatPickupDate(pickup[FIELD.DATE])),

        Components.tableCell(text(pickup[FIELD.PARTNER_ID])),

        Components.tableCell(
          Format.number(pickup[FIELD.TOTAL_ITEM]),

          "text-right",
        ),

        Components.tableCell(
          Format.number(pickup[FIELD.TOTAL_QTY]),

          "text-right",
        ),

        Components.tableCell(renderStatus(pickup), "text-center"),

        Components.tableCell(renderActions(pickup[FIELD.ID]), "text-center"),
      ]);
    }

    //===========================================================================
    // Actions
    //===========================================================================

    function renderActions(id) {
      if (Utils.isEmpty(id)) {
        return "-";
      }

      return `
        <button
          type="button"
          data-pickup-action="edit"
          data-pickup-id="${text(id)}"
          title="Edit"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-blue-100 hover:bg-blue-200 text-blue-700"
        >
          ${Components.icon("fa-pen")}

          <span>Edit</span>
        </button>

        <button
          type="button"
          data-pickup-action="view"
          data-pickup-id="${text(id)}"
          title="View"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-slate-100 hover:bg-slate-200 text-slate-700"
        >
          ${Components.icon("fa-eye")}

          <span>View</span>
        </button>

        <button
          type="button"
          data-pickup-action="delete"
          data-pickup-id="${text(id)}"
          title="Delete"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg transition bg-red-100 hover:bg-red-200 text-red-700"
        >
          ${Components.icon("fa-trash")}

          <span>Delete</span>
        </button>
      `;
    }

    //===========================================================================
    // Empty and Info
    //===========================================================================

    function renderEmpty(type = "database") {
      Render.mount(
        "tbl-pickups-body",

        `
        <tr>
          <td colspan="${mode === "trash" ? "8" : "7"}">
            ${Components.empty(
              mode === "trash"
                ? type === "search"
                  ? "Tidak ada data Pickup Trash yang cocok dengan pencarian."
                  : "Belum ada data Pickup di Trash."
                : "No pickups available.",
            )}
          </td>
        </tr>
      `,
      );
    }

    function renderInfo(total = 0) {
      Render.mount(
        "lbl-pickup-info",

        `${Format.number(total)} ${mode === "trash" ? "Pickup di Trash" : "Pickup"}`,
      );
    }

    //===========================================================================
    // Status
    //===========================================================================

    function renderStatus(pickup = {}) {
      const status = pickup[FIELD.STATUS];

      if (!Utils.isEmpty(status)) {
        return Components.badge(text(status));
      }

      return Components.badge(
        Format.status(isActive(pickup[FIELD.IS_ACTIVE])),

        isActive(pickup[FIELD.IS_ACTIVE]),
      );
    }

    function isActive(value) {
      if (typeof value === "string") {
        return value.toLowerCase() === "true";
      }

      return Boolean(value);
    }

    //===========================================================================
    // Toolbar
    //===========================================================================

    function bindToolbar() {
      const search = DOM.$("inp-pickup-search");

      document.querySelectorAll("[data-pickup-mode]").forEach((button) => {
        if (button.dataset.pickupModeBound) return;

        button.dataset.pickupModeBound = "true";
        button.addEventListener("click", () => {
          const nextMode = button.dataset.pickupMode;
          if (nextMode === mode) return;

          if (mode === "active") activeQuery = String(search?.value ?? "").trim();
          App.setPickupMode(nextMode);
        });
      });

      const refresh = DOM.$("btn-pickup-refresh");

      if (refresh && !refresh.dataset.pickupBound) {
        refresh.dataset.pickupBound = "true";

        refresh.addEventListener("click", () => {
          App.refresh();
        });
      }

      const add = DOM.$("btn-pickup-add");

      if (add && !add.dataset.pickupBound) {
        add.dataset.pickupBound = "true";

        add.addEventListener("click", openCreate);
      }
    }

    function syncModeUi() {
      document.querySelectorAll("[data-pickup-mode]").forEach((button) => {
        const selected = button.dataset.pickupMode === mode;
        button.setAttribute("aria-pressed", String(selected));
        button.classList.toggle("bg-blue-600", selected);
        button.classList.toggle("text-white", selected);
        button.classList.toggle("text-slate-600", !selected);
        button.classList.toggle("hover:bg-slate-100", !selected);
      });

      const input = DOM.$("inp-pickup-search");
      if (input) {
        input.value = mode === "trash" ? App.getPickupSearch() : activeQuery;
        input.placeholder = mode === "trash"
          ? "Search deleted pickup..."
          : "Search pickup...";
      }

      const add = DOM.$("btn-pickup-add");
      if (add) add.classList.toggle("hidden", mode === "trash");
    }

    function bindActions() {
      const body = DOM.$("tbl-pickups-body");

      if (!body || body.dataset.pickupActionsBound) {
        return;
      }

      body.dataset.pickupActionsBound = "true";

      body.addEventListener("click", (event) => {
        const button = event.target.closest("[data-pickup-action]");

        if (!button || !body.contains(button)) {
          return;
        }

        if (button.dataset.pickupAction === "view") {
          view(button.dataset.pickupId);
        }

        if (button.dataset.pickupAction === "edit") {
          openEdit(button.dataset.pickupId);
        }

        if (button.dataset.pickupAction === "delete") {
          confirmDelete(button.dataset.pickupId);
        }
      });
    }

    //===========================================================================
    // Delete
    //===========================================================================

    async function confirmDelete(id) {
      const pickup = findPickup(id);

      if (!pickup || Utils.isEmpty(id) || pendingDeleteId) {
        if (Utils.isEmpty(id)) {
          Toast.error("Pickup ID is unavailable.");
        }

        return;
      }

      const headerId = String(id);
      const label = pickup[FIELD.PICKUP_NO] || pickup[FIELD.ID] || headerId;

      pendingDeleteId = headerId;

      try {
        const confirmed = await Dialog.confirm({
          title: "Delete Pickup",
          message: `
            <p>Delete Pickup <strong>${escape(label)}</strong>?</p>
            <p class="mt-2">It will be removed from the active list using a soft delete. Related Pickup Details are handled by the backend.</p>
          `,
        });

        if (!confirmed) {
          return;
        }

        setDeleteLoading(headerId, true);

        const response = await Api.Pickup.remove(headerId);

        if (!response?.success) {
          Toast.error(response?.message || "Pickup could not be deleted.");

          return;
        }

        await App.refresh();
        Toast.success(response.message || "Pickup deleted.");
      } catch (error) {
        Toast.error(error?.message || "Pickup could not be deleted. Please try again.");
      } finally {
        setDeleteLoading(headerId, false);
        pendingDeleteId = null;
      }
    }

    function findPickup(id) {
      return pickups.find((pickup) => String(pickup?.[FIELD.ID]) === String(id));
    }

    function setDeleteLoading(id, loading) {
      document.querySelectorAll('[data-pickup-action="delete"]').forEach((button) => {
        if (String(button.dataset.pickupId) !== String(id)) {
          return;
        }

        button.disabled = loading;
        button.classList.toggle("opacity-50", loading);
        button.classList.toggle("cursor-not-allowed", loading);
        button.title = loading ? "Deleting..." : "Delete";
      });
    }

    //===========================================================================
    // Detail View
    //===========================================================================

    async function view(id) {
      if (Utils.isEmpty(id)) {
        Components.toast("Pickup ID is unavailable.", "error");

        return;
      }

      const request = ++detailRequest;

      Modal.open({
        title: "Pickup Detail",

        width: "lg",

        body: Components.loading("Loading pickup..."),

        footer: renderDetailFooter(id),
      });

      bindDetailFooter();

      let response;

      try {
        response = await Api.Pickup.findById(id);
      } catch (error) {
        if (request !== detailRequest) {
          return;
        }

        showDetailError("Load pickup failed.");

        return;
      }

      if (request !== detailRequest) {
        return;
      }

      if (!isDetailResponse(response)) {
        showDetailError(response?.message || "Pickup detail is unavailable.");

        return;
      }

      Modal.body(renderDetail(response.data.header, response.data.details));
    }

    function isDetailResponse(response) {
      return Boolean(
        response?.success &&
          response.data &&
          typeof response.data.header === "object" &&
          !Array.isArray(response.data.header) &&
          Array.isArray(response.data.details),
      );
    }

    function showDetailError(message) {
      Components.toast(message, "error");

      Modal.body(Components.empty(message));
    }

    function renderDetail(header = {}, details = []) {
      return `
        <div class="space-y-6">
          <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">
            ${detailField("Pickup No / ID", header[FIELD.PICKUP_NO] || header[FIELD.ID])}
            ${detailField("Tanggal", formatPickupDate(header[FIELD.DATE]))}
            ${detailField("Partner", header[FIELD.PARTNER_ID])}
            ${detailField("Status", header[FIELD.STATUS])}
            ${detailField("Total Item", Format.number(header[FIELD.TOTAL_ITEM]))}
            ${detailField("Total Qty", Format.number(header[FIELD.TOTAL_QTY]))}
            ${
              Utils.isEmpty(header[FIELD.NOTES])
                ? ""
                : detailField("Notes", header[FIELD.NOTES], "sm:col-span-2")
            }
          </dl>

          <div>
            <h3 class="mb-3 text-sm font-semibold text-slate-800">Details</h3>

            ${renderDetails(details)}
          </div>
        </div>
      `;
    }

    function detailField(label, value, classes = "") {
      return `
        <div class="${classes}">
          <dt class="text-slate-500">${label}</dt>
          <dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd>
        </div>
      `;
    }

    function renderDetails(details = []) {
      if (!details.length) {
        return Components.empty("No pickup details available.");
      }

      return `
        <div class="overflow-x-auto border border-slate-200 rounded-lg">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-50 text-left text-slate-600">
              <tr>
                <th class="px-4 py-3 font-medium">Product</th>
                <th class="px-4 py-3 font-medium text-right">Qty</th>
                <th class="px-4 py-3 font-medium">Notes</th>
              </tr>
            </thead>
            <tbody>
              ${details.map(renderDetailRow).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDetailRow(detail = {}) {
      return `
        <tr class="border-t border-slate-200">
          <td class="px-4 py-3 text-slate-700">${text(detail.ProductID)}</td>
          <td class="px-4 py-3 text-right text-slate-700">${text(detail.Qty)}</td>
          <td class="px-4 py-3 text-slate-700">${text(detail.Notes)}</td>
        </tr>
      `;
    }

    function renderDetailFooter(id) {
      return `
        <button
          type="button"
          data-pickup-detail-action="edit"
          data-pickup-id="${escape(id)}"
          class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
        >
          Edit
        </button>
        <button
          type="button"
          data-pickup-detail-action="close"
          class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100"
        >
          Close
        </button>
      `;
    }

    function bindDetailFooter() {
      const footer = DOM.$("modal-footer");

      if (!footer || footer.dataset.pickupDetailBound) {
        return;
      }

      footer.dataset.pickupDetailBound = "true";
      footer.addEventListener("click", (event) => {
        const button = event.target.closest("[data-pickup-detail-action]");

        if (!button) {
          return;
        }

        if (button.dataset.pickupDetailAction === "close") {
          Modal.close();
          return;
        }

        if (button.dataset.pickupDetailAction === "edit") {
          openEdit(button.dataset.pickupId);
        }
      });

      const close = DOM.$("btn-modal-close");

      if (close && !close.dataset.pickupDetailBound) {
        close.dataset.pickupDetailBound = "true";
        close.addEventListener("click", () => {
          if (!pickupForm) {
            Modal.close();
          }
        });
      }
    }

    //===========================================================================
    // Pickup Form (Create and Edit)
    //===========================================================================

    async function openCreate() {
      if (pickupSubmitting) {
        return;
      }

      const masterData = await loadMasterData();

      if (!masterData) {
        return;
      }

      resetPickupForm();
      openPickupForm();
    }

    async function openEdit(id) {
      if (pickupSubmitting || Utils.isEmpty(id)) {
        if (Utils.isEmpty(id)) {
          Toast.error("Pickup ID is unavailable.");
        }

        return;
      }

      let masterData;
      let response;

      try {
        [masterData, response] = await Promise.all([
          loadMasterData(),
          Api.Pickup.findById(id),
        ]);
      } catch (error) {
        Toast.error("Pickup could not be loaded for editing.");
        return;
      }

      if (!masterData) {
        return;
      }

      if (!isDetailResponse(response)) {
        Toast.error(response?.message || "Pickup could not be loaded for editing.");
        return;
      }

      populatePickupForm(id, response.data.header, response.data.details);
      openPickupForm();
    }

    async function loadMasterData() {
      if (masterProducts && masterPartners) {
        return true;
      }

      let productsResponse;

      let partnersResponse;

      try {
        [productsResponse, partnersResponse] = await Promise.all([
          masterProducts ? Promise.resolve({ success: true, data: masterProducts }) : Api.Product.list(),
          masterPartners ? Promise.resolve({ success: true, data: masterPartners }) : Api.Partner.list(),
        ]);
      } catch (error) {
        Toast.error("Master data for Pickup could not be loaded.");

        return false;
      }

      if (!productsResponse?.success || !partnersResponse?.success) {
        Toast.error(
          productsResponse?.message || partnersResponse?.message || "Master data for Pickup could not be loaded.",
        );

        return false;
      }

      masterProducts = selectableRecords(productsResponse.data);

      masterPartners = selectableRecords(partnersResponse.data);

      if (!masterProducts.length || !masterPartners.length) {
        Toast.error("Active Product and Partner data are required to create a Pickup.");

        return false;
      }

      return true;
    }

    function selectableRecords(data) {
      const records = Array.isArray(data) ? data : [];

      return records.filter((record) => {
        return isActive(record?.IsActive) && !isDeleted(record?.Deleted);
      });
    }

    function isDeleted(value) {
      return value === true || String(value).toLowerCase() === "true";
    }

    function resetPickupForm() {
      nextDetailId = 1;

      pickupSubmitting = false;
      editingPickupId = null;
      pickupForm = {
        header: {
          Tanggal: "",
          PartnerID: "",
          Notes: "",
        },
        details: [newDetail()],
      };
    }

    function populatePickupForm(id, header = {}, details = []) {
      nextDetailId = 1;
      pickupSubmitting = false;
      editingPickupId = String(id);
      pickupForm = {
        header: {
          Tanggal: dateInputValue(header[FIELD.DATE]),
          PartnerID: String(header[FIELD.PARTNER_ID] || ""),
          Notes: String(header[FIELD.NOTES] || ""),
        },
        details: activeDetails(details).map((detail) => ({
          localId: String(nextDetailId++),
          ProductID: String(detail.ProductID || ""),
          Qty: detail.Qty ?? "",
          Notes: String(detail.Notes || ""),
        })),
      };

      if (!pickupForm.details.length) {
        pickupForm.details.push(newDetail());
      }
    }

    function activeDetails(details) {
      return (Array.isArray(details) ? details : []).filter((detail) => {
        return !isDeleted(detail?.Deleted) && detail?.IsActive !== false && String(detail?.IsActive).toLowerCase() !== "false";
      });
    }

    function calendarDateValue(value) {
      const text = String(value ?? "").trim();
      const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);

      if (dateOnlyMatch) {
        const year = Number(dateOnlyMatch[1]);
        const month = Number(dateOnlyMatch[2]);
        const day = Number(dateOnlyMatch[3]);
        const date = new Date(year, month - 1, day);

        return date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day
          ? `${dateOnlyMatch[1]}-${dateOnlyMatch[2]}-${dateOnlyMatch[3]}`
          : "";
      }

      if (!text) {
        return "";
      }

      const timestamp = new Date(text);

      if (Number.isNaN(timestamp.getTime())) {
        return "";
      }

      const year = timestamp.getFullYear();
      const month = String(timestamp.getMonth() + 1).padStart(2, "0");
      const day = String(timestamp.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function dateInputValue(value) {
      return calendarDateValue(value);
    }

    function formatPickupDate(value) {
      const calendarDate = calendarDateValue(value);

      if (!calendarDate) {
        return "-";
      }

      const [year, month, day] = calendarDate.split("-").map(Number);
      const date = new Date(year, month - 1, day);

      return new Intl.DateTimeFormat("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric",
      }).format(date);
    }

    function newDetail() {
      return {
        localId: String(nextDetailId++),
        ProductID: "",
        Qty: "",
        Notes: "",
      };
    }

    function openPickupForm() {
      const editing = Boolean(editingPickupId);

      Modal.open({
        title: editing ? "Edit Pickup" : "Add Pickup",
        width: "xl",
        body: renderPickupForm(),
        footer: renderPickupFooter(),
      });

      bindPickupForm();
      DOM.$("inp-pickup-form-date")?.focus();
    }

    function renderPickupForm() {
      const editing = Boolean(editingPickupId);

      return `
        <div id="pickup-form" class="space-y-6">
          ${editing ? renderEditContext() : ""}
          <section class="space-y-4">
            <h3 class="text-sm font-semibold text-slate-800">Header</h3>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              ${renderCreateDate()}
              ${renderCreatePartner()}
            </div>

            <div>
              <label for="inp-pickup-form-notes" class="mb-1 block text-sm font-medium text-slate-700">Notes</label>
              <textarea id="inp-pickup-form-notes" data-pickup-form-field="Notes" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional notes">${escape(pickupForm.header.Notes)}</textarea>
            </div>
          </section>

          <section class="space-y-3">
            <div class="flex items-center justify-between gap-3">
              <h3 class="text-sm font-semibold text-slate-800">Items</h3>
              <button type="button" data-pickup-form-action="add-detail" class="rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-100">
                ${Components.icon("fa-plus")} <span class="ml-1">Add Item</span>
              </button>
            </div>

            <div id="pickup-form-details" class="space-y-3"></div>

            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-slate-600">
              <span>Total Item: <strong id="lbl-pickup-form-total-item" class="text-slate-800"></strong></span>
              <span>Total Qty: <strong id="lbl-pickup-form-total-qty" class="text-slate-800"></strong></span>
            </div>
          </section>
        </div>
      `;
    }

    function renderEditContext() {
      return `
        <div class="rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-900">
          <span class="font-semibold">Editing Pickup:</span>
          ${escape(editingPickupId)}
        </div>
      `;
    }

    function renderCreateDate() {
      return `
        <div>
          <label for="inp-pickup-form-date" class="mb-1 block text-sm font-medium text-slate-700">Tanggal</label>
          <input id="inp-pickup-form-date" data-pickup-form-field="Tanggal" type="date" value="${escape(pickupForm.header.Tanggal)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      `;
    }

    function renderCreatePartner() {
      return `
        <div>
          <label for="inp-pickup-form-partner" class="mb-1 block text-sm font-medium text-slate-700">Partner</label>
          <select id="inp-pickup-form-partner" data-pickup-form-field="PartnerID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Partner --</option>
            ${masterPartners.map((partner) => renderOption(partner, pickupForm.header.PartnerID)).join("")}
          </select>
        </div>
      `;
    }

    function renderCreateDetails() {
      const container = DOM.$("pickup-form-details");

      if (!container || !pickupForm) {
        return;
      }

      container.innerHTML = pickupForm.details.map(renderCreateDetail).join("");

      renderCreateTotals();
    }

    function renderCreateDetail(detail) {
      const cannotRemove = pickupForm.details.length === 1;

      return `
        <div data-pickup-detail-id="${escape(detail.localId)}" class="rounded-lg border border-slate-200 p-4">
          <div class="grid grid-cols-1 gap-3 md:grid-cols-[minmax(0,2fr)_minmax(0,1fr)_minmax(0,2fr)_auto] md:items-end">
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">Product</label>
              <select data-pickup-detail-field="ProductID" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- Select Product --</option>
                ${masterProducts.map((product) => renderOption(product, detail.ProductID)).join("")}
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">Qty</label>
              <input data-pickup-detail-field="Qty" type="number" min="0" step="any" value="${escape(detail.Qty)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">Notes</label>
              <input data-pickup-detail-field="Notes" type="text" value="${escape(detail.Notes)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional notes" />
            </div>
            <button type="button" data-pickup-form-action="remove-detail" title="${cannotRemove ? "At least one item is required" : "Remove item"}" ${cannotRemove ? "disabled" : ""} class="rounded-lg border border-red-200 px-3 py-2 text-red-700 hover:bg-red-50 ${cannotRemove ? "cursor-not-allowed opacity-50" : ""}">
              ${Components.icon("fa-trash")} <span class="ml-1">Remove</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderOption(record, selectedId) {
      const id = record?.ID;

      const name = record?.Nama || id;

      return `<option value="${escape(id)}" ${String(id) === String(selectedId) ? "selected" : ""}>${escape(name)} (${escape(id)})</option>`;
    }

    function renderCreateTotals() {
      const totalQty = pickupForm.details.reduce((total, detail) => {
        const qty = Number(detail.Qty);

        return Number.isFinite(qty) && qty > 0 ? total + qty : total;
      }, 0);

      DOM.text(DOM.$("lbl-pickup-form-total-item"), String(pickupForm.details.length));
      DOM.text(DOM.$("lbl-pickup-form-total-qty"), String(totalQty));
    }

    function renderPickupFooter() {
      const editing = Boolean(editingPickupId);
      return `
        <button type="button" data-pickup-form-action="cancel" class="rounded-lg border border-slate-300 px-5 py-2 hover:bg-slate-100">Cancel</button>
        <button type="button" id="btn-pickup-form-save" data-pickup-form-action="save" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">${editing ? "Update Pickup" : "Save Pickup"}</button>
      `;
    }

    function bindPickupForm() {
      renderCreateDetails();

      const form = DOM.$("pickup-form");

      if (!form) {
        return;
      }

      form.addEventListener("input", handleCreateInput);
      form.addEventListener("change", handleCreateInput);
      form.addEventListener("click", handleCreateClick);

      const footer = DOM.$("modal-footer");

      if (footer && !footer.dataset.pickupFormBound) {
        footer.dataset.pickupFormBound = "true";
        footer.addEventListener("click", handleCreateFooterClick);
      }

      const close = DOM.$("btn-modal-close");

      if (close && !close.dataset.pickupFormBound) {
        close.dataset.pickupFormBound = "true";
        close.addEventListener("click", () => {
          if (pickupForm && !pickupSubmitting) {
            closeCreate();
          }
        });
      }
    }

    function handleCreateInput(event) {
      const field = event.target.dataset.pickupFormField;

      if (field) {
        pickupForm.header[field] = event.target.value;

        return;
      }

      const detailField = event.target.dataset.pickupDetailField;

      const detail = findDetail(event.target.closest("[data-pickup-detail-id]")?.dataset.pickupDetailId);

      if (!detailField || !detail) {
        return;
      }

      detail[detailField] = event.target.value;

      if (detailField === "Qty") {
        renderCreateTotals();
      }
    }

    function handleCreateClick(event) {
      const action = event.target.closest("[data-pickup-form-action]")?.dataset.pickupFormAction;

      if (action === "add-detail") {
        pickupForm.details.push(newDetail());
        renderCreateDetails();

        return;
      }

      if (action === "remove-detail") {
        const detail = event.target.closest("[data-pickup-detail-id]");
        removeDetail(detail?.dataset.pickupDetailId);
      }
    }

    function handleCreateFooterClick(event) {
      const action = event.target.closest("[data-pickup-form-action]")?.dataset.pickupFormAction;

      if (action === "cancel") {
        closeCreate();

        return;
      }

      if (action === "save") {
        submitPickup();
      }
    }

    function removeDetail(localId) {
      if (pickupForm.details.length === 1 || !localId) {
        return;
      }

      pickupForm.details = pickupForm.details.filter((detail) => detail.localId !== localId);
      renderCreateDetails();
    }

    function findDetail(localId) {
      return pickupForm?.details.find((detail) => detail.localId === localId);
    }

    async function submitPickup() {
      if (pickupSubmitting || !pickupForm) {
        return;
      }

      const validation = validatePickup();

      if (!validation.valid) {
        Toast.warning(validation.message);
        validation.element?.focus();

        return;
      }

      pickupSubmitting = true;
      setPickupLoading(true);

      const editing = Boolean(editingPickupId);

      try {
        const response = editing
          ? await Api.Pickup.update(editingPickupId, validation.document)
          : await Api.Pickup.create(validation.document);

        if (!response?.success) {
          Toast.error(response?.message || (editing ? "Pickup could not be updated." : "Pickup could not be created."));

          return;
        }

        Toast.success(response.message || (editing ? "Pickup updated." : "Pickup created."));
        closeCreate();
        await App.refresh();
      } catch (error) {
        Toast.error(editing ? "Pickup could not be updated. Please try again." : "Pickup could not be created. Please try again.");
      } finally {
        pickupSubmitting = false;
        setPickupLoading(false);
      }
    }

    function validatePickup() {
      const header = {
        Tanggal: String(pickupForm.header.Tanggal || "").trim(),
        PartnerID: String(pickupForm.header.PartnerID || "").trim(),
        Notes: String(pickupForm.header.Notes || "").trim(),
      };

      if (!header.Tanggal) {
        return invalidPickup("Tanggal is required.", DOM.$("inp-pickup-form-date"));
      }

      if (!header.PartnerID) {
        return invalidPickup("Partner is required.", DOM.$("inp-pickup-form-partner"));
      }

      if (!pickupForm.details.length) {
        return invalidPickup("At least one item is required.");
      }

      const productIds = new Set();
      const details = [];

      for (const detail of pickupForm.details) {
        const productId = String(detail.ProductID || "").trim();
        const qty = Number(detail.Qty);
        const row = document.querySelector(`[data-pickup-detail-id="${detail.localId}"]`);

        if (!productId) {
          return invalidPickup("Each item needs a Product.", row?.querySelector('[data-pickup-detail-field="ProductID"]'));
        }

        if (!Number.isFinite(qty)) {
          return invalidPickup("Each Qty must be numeric.", row?.querySelector('[data-pickup-detail-field="Qty"]'));
        }

        if (qty <= 0) {
          return invalidPickup("Each Qty must be greater than zero.", row?.querySelector('[data-pickup-detail-field="Qty"]'));
        }

        if (productIds.has(productId)) {
          return invalidPickup("Duplicate Products are not allowed.", row?.querySelector('[data-pickup-detail-field="ProductID"]'));
        }

        productIds.add(productId);
        details.push({ ProductID: productId, Qty: qty, Notes: String(detail.Notes || "").trim() });
      }

      return { valid: true, document: { header, details } };
    }

    function invalidPickup(message, element = null) {
      return { valid: false, message, element };
    }

    function setPickupLoading(loading) {
      const button = DOM.$("btn-pickup-form-save");

      if (!button) {
        return;
      }

      button.disabled = loading;
      button.classList.toggle("opacity-50", loading);
      button.classList.toggle("cursor-not-allowed", loading);
      button.textContent = loading ? "Saving..." : editingPickupId ? "Update Pickup" : "Save Pickup";
    }

    function closeCreate() {
      pickupForm = null;
      pickupSubmitting = false;
      editingPickupId = null;
      Modal.close();
    }

    function clearSearch() {
      const input = DOM.$("inp-pickup-search");

      if (input) {
        input.value = "";
      }
    }

    function filter(keyword = "") {
      const value = String(keyword || "")
        .trim()
        .toLowerCase();

      if (!value) {
        return pickups;
      }

      const fields = [
        FIELD.PICKUP_NO,

        FIELD.ID,

        FIELD.PARTNER_ID,

        FIELD.STATUS,

        FIELD.NOTES,
      ];

      return pickups.filter((pickup) => {
        return fields.some((field) => {
          return String(pickup[field] || "")
            .toLowerCase()
            .includes(value);
        });
      });
    }

    function filterTrash(keyword = "") {
      const value = normalizeSearch(keyword);

      if (!value) return pickups;

      return pickups.filter((pickup = {}) => {
        const headerMatch = [
          pickup[FIELD.ID],
          pickup[FIELD.PARTNER_ID],
          pickup.partnerName,
          pickup[FIELD.DATE],
          formatPickupDate(pickup[FIELD.DATE]),
        ].some((field) => normalizeSearch(field).includes(value));

        if (headerMatch) return true;

        const details = Array.isArray(pickup.details) ? pickup.details : [];
        return details.some((detail = {}) => {
          return [detail.ProductID, detail.productName].some((field) => {
            return normalizeSearch(field).includes(value);
          });
        });
      });
    }

    function normalizeSearch(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    //===========================================================================
    // Table Header
    //===========================================================================

    function updateHeaders() {
      const headers = document.querySelectorAll("#tbl-pickups thead th");

      const labels = mode === "trash" ? [
        "ID Pickup",
        "Tanggal",
        "Mitra",
        "Detail Produk",
        "Total Qty",
        "Status Restore",
        "Alasan",
        "Aksi",
      ] : [
        "Pickup No / ID",

        "Date",

        "Partner",

        "Total Item",

        "Total Qty",

        "Status",

        "Action",
      ];

      headers.forEach((header, index) => {
        if (labels[index]) {
          header.textContent = labels[index];
        }

        header.classList.toggle("hidden", mode === "active" && index === 7);
      });
    }

    function renderLoading(selectedMode = App.getPickupMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      bindToolbar();
      syncModeUi();
      updateHeaders();
      const label = mode === "trash" ? "Pickup Trash" : "Pickups";
      Render.mount(
        "tbl-pickups-body",
        `<tr><td colspan="${mode === "trash" ? "8" : "7"}">${Components.loading(`Loading ${label}...`)}</td></tr>`,
      );
      Render.mount("lbl-pickup-info", `Loading ${label}...`);
    }

    function renderError(selectedMode = App.getPickupMode()) {
      mode = selectedMode === "trash" ? "trash" : "active";
      bindToolbar();
      syncModeUi();
      updateHeaders();
      Render.mount(
        "tbl-pickups-body",
        `<tr><td colspan="${mode === "trash" ? "8" : "7"}">
          <div class="flex flex-col items-center justify-center py-16 text-center">
            <i class="fa-solid fa-triangle-exclamation text-5xl text-red-400"></i>
            <h3 class="mt-4 text-lg font-semibold text-red-700">Load failed</h3>
            <p class="mt-2 text-slate-500">Pickup data could not be loaded. Use Refresh to try again.</p>
          </div>
        </td></tr>`,
      );
      Render.mount("lbl-pickup-info", "Pickup count unavailable");
    }

    //===========================================================================
    // Text
    //===========================================================================

    function text(value) {
      if (Utils.isEmpty(value)) {
        return "-";
      }

      return Utils.escapeHTML(value);
    }

    function formatQty(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) return "0";

      const decimalText = String(number).split(".")[1] || "";
      return Format.number(number, Math.min(decimalText.length, 6));
    }

    function escape(value) {
      return Utils.escapeHTML(String(value ?? ""));
    }

    //===========================================================================
    // Public API
    //===========================================================================

    return Object.freeze({
      render,

      renderLoading,

      renderError,

      search,

      view,

      openCreate,

      openEdit,

      submitPickup,
    });
  })();
</script>
