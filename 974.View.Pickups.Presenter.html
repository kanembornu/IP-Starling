<script>
  /** Pickup deterministic rendering and display-formatting helpers. */
  const PickupsPresenter = (() => {
    const FIELD = Object.freeze({ ID:"ID", PICKUP_NO:"PickupNo", DATE:"Tanggal", PARTNER_ID:"PartnerID", TOTAL_ITEM:"TotalItem", TOTAL_QTY:"TotalQty", STATUS:"Status", NOTES:"Notes", IS_ACTIVE:"IsActive" });
    const escape = (value) => Utils.escapeHTML(String(value ?? ""));
    const text = (value) => Utils.isEmpty(value) ? "-" : Utils.escapeHTML(value);
    const normalize = (value) => Array.isArray(value) ? value : [];

    function calendarDateValue(value) {
      const source=String(value??"").trim(), match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(source);
      if(match){const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]),date=new Date(y,m-1,d);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?source:"";}
      if(!source)return "";const date=new Date(source);if(Number.isNaN(date.getTime()))return "";
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function dateInputValue(value){return calendarDateValue(value);}
    function formatPickupDate(value){const source=calendarDateValue(value);if(!source)return "-";const [y,m,d]=source.split("-").map(Number);return new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"long",year:"numeric"}).format(new Date(y,m-1,d));}
    function formatQty(value){const number=Number(value);if(!Number.isFinite(number))return "0";const decimals=String(number).split(".")[1]||"";return Format.number(number,Math.min(decimals.length,6));}
    function isActive(value){return typeof value==="string"?value.toLowerCase()==="true":Boolean(value);}
    function renderStatus(row){return !Utils.isEmpty(row[FIELD.STATUS])?Components.badge(text(row[FIELD.STATUS])):Components.badge(Format.status(isActive(row[FIELD.IS_ACTIVE])),isActive(row[FIELD.IS_ACTIVE]));}
    function renderActions(id,busyId=""){if(Utils.isEmpty(id))return "-";const busy=Boolean(busyId),deleting=String(busyId)===String(id),attrs=(action)=>`data-pickup-action="${action}" data-pickup-id="${escape(id)}"`;return Components.tableActions(`${Components.tableAction({label:"View",icon:"fa-eye",attributes:attrs("view"),disabled:busy})}${Components.tableAction({label:"Edit",icon:"fa-pen",tone:"blue",attributes:attrs("edit"),disabled:busy})}${Components.tableAction({label:deleting?"Deleting...":"Delete",icon:"fa-trash-can",tone:"red",attributes:attrs("delete"),busy})}`);}
    function renderRow(row={},busyId=""){return Components.tableRow([Components.tableCell(text(row[FIELD.PICKUP_NO]||row[FIELD.ID]),"font-medium text-slate-800"),Components.tableCell(formatPickupDate(row[FIELD.DATE])),Components.tableCell(text(row.partnerName||row[FIELD.PARTNER_ID])),Components.tableCell(Format.number(row[FIELD.TOTAL_ITEM]),"text-right"),Components.tableCell(Format.number(row[FIELD.TOTAL_QTY]),"text-right"),Components.tableCell(renderStatus(row),"text-center"),Components.tableCell(renderActions(row[FIELD.ID],busyId),"text-center")]);}
    function renderTrashDetails(details){const rows=normalize(details);return rows.length?`<ul class="space-y-1">${rows.map((d)=>`<li><span class="font-medium text-slate-700">${text(d.productName||d.ProductID)}</span> <span class="text-slate-500">&times; ${formatQty(d.Qty)}</span></li>`).join("")}</ul>`:"-";}
    function renderEligibilityStatus(e={}){const allowed=e.allowed===true;return `<span class="inline-flex rounded-full border px-3 py-1 text-xs font-semibold ${allowed?"border-green-200 bg-green-50 text-green-700":"border-red-200 bg-red-50 text-red-700"}">${allowed?"Aman dipulihkan":"Tidak dapat dipulihkan"}</span>`;}
    function renderEligibilityReason(e={}){if(e.allowed===true)return "-";return `<div class="text-sm text-slate-600">${text(e.message)}${Utils.isEmpty(e.code)?"":`<div class="mt-1 text-xs text-slate-400">${text(e.code)}</div>`}</div>`;}
    function renderRestoreAction(row,e={},busyId=""){const id=row?.ID,busy=String(busyId)===String(id||""),disabled=e.allowed!==true||Boolean(busyId);return Components.tableActions(Components.tableAction({label:busy?"Restoring...":"Restore",icon:"fa-rotate-left",tone:e.allowed===true?"green":"gray",attributes:`data-pickup-action="restore" data-pickup-id="${escape(id)}"`,disabled,busy}));}
    function renderTrashRow(row={},busyId=""){const e=row.restoreEligibility||{};return Components.tableRow([Components.tableCell(text(row.ID),"font-medium text-slate-800"),Components.tableCell(formatPickupDate(row.Tanggal)),Components.tableCell(text(row.partnerName||row.PartnerID)),Components.tableCell(renderTrashDetails(row.details)),Components.tableCell(formatQty(row.TotalQty),"text-right"),Components.tableCell(renderEligibilityStatus(e),"text-center"),Components.tableCell(renderEligibilityReason(e)),Components.tableCell(renderRestoreAction(row,e,busyId),"text-center")]);}
    function syncModeUi(mode,search=""){document.querySelectorAll("[data-pickup-mode]").forEach((button)=>{const selected=button.dataset.pickupMode===mode;button.setAttribute("aria-pressed",String(selected));button.classList.toggle("bg-blue-600",selected);button.classList.toggle("text-white",selected);button.classList.toggle("text-slate-600",!selected);button.classList.toggle("hover:bg-slate-100",!selected);});const input=DOM.$("inp-pickup-search");if(input){input.value=search;input.placeholder=mode==="trash"?"Search deleted pickup...":"Search pickup...";}DOM.$("btn-pickup-add")?.classList.toggle("hidden",mode==="trash");}
    function updateHeaders(mode){const labels=mode==="trash"?["ID Pickup","Tanggal","Mitra","Detail Produk","Total Qty","Status Restore","Alasan","Aksi"]:["Pickup No / ID","Date","Partner","Total Item","Total Qty","Status","Action"];document.querySelectorAll("#tbl-pickups thead th").forEach((header,index)=>{if(labels[index])header.textContent=labels[index];header.classList.toggle("hidden",mode==="active"&&index===7);});}
    function render(view={}){if(Array.isArray(view))view={mode:"active",rows:view};const mode=view.mode==="trash"?"trash":"active",rows=normalize(view.rows);syncModeUi(mode,view.search||"");updateHeaders(mode);if(!rows.length)return renderEmpty({mode,kind:view.emptyKind});Render.mount("tbl-pickups-body",rows.map((row)=>mode==="trash"?renderTrashRow(row,view.busyId):renderRow(row,view.busyId)).join(""));}
    function renderEmpty({mode="active",kind="database"}={}){const noMatch=kind==="search";Render.mount("tbl-pickups-body",`<tr><td colspan="${mode==="trash"?8:7}">${Components.empty(mode==="trash"?(noMatch?"No deleted pickups match the current search.":"No deleted pickups available."):(noMatch?"No pickups match the current search.":"No pickups available."))}</td></tr>`);}
    function renderLoading({mode="active"}={}){syncModeUi(mode,"");updateHeaders(mode);const label=mode==="trash"?"deleted pickups":"pickups";Render.mount("tbl-pickups-body",`<tr><td colspan="${mode==="trash"?8:7}">${Components.loading(`Loading ${label}...`)}</td></tr>`);Render.mount("lbl-pickup-info",`Loading ${label}...`);Render.mount("pickup-pagination","");}
    function renderError({mode="active",message=""}={}){syncModeUi(mode,"");updateHeaders(mode);const label=mode==="trash"?"Deleted pickups":"Pickups";Render.mount("tbl-pickups-body",`<tr><td colspan="${mode==="trash"?8:7}">${Components.error(escape(message||`${label} could not be loaded. Use Refresh to try again.`))}</td></tr>`);Render.mount("lbl-pickup-info","Pickup count unavailable");Render.mount("pickup-pagination","");}
    function detailField(label,value,classes=""){return `<div class="${classes}"><dt class="text-slate-500">${escape(label)}</dt><dd class="mt-1 font-medium text-slate-800 break-words">${text(value)}</dd></div>`;}
    function renderDetails(details=[]){if(!details.length)return Components.empty("No pickup details available.");return `<div class="overflow-x-auto border border-slate-200 rounded-lg"><table class="min-w-full text-sm"><thead class="bg-slate-50 text-left text-slate-600"><tr><th class="px-4 py-3">Product</th><th class="px-4 py-3 text-right">Qty</th><th class="px-4 py-3">Notes</th></tr></thead><tbody>${details.map((d)=>`<tr class="border-t border-slate-200"><td class="px-4 py-3">${text(d.productName||d.ProductID)}</td><td class="px-4 py-3 text-right">${formatQty(d.Qty)}</td><td class="px-4 py-3">${text(d.Notes)}</td></tr>`).join("")}</tbody></table></div>`;}
    function renderDetail(header={},details=[]){return `<div class="space-y-6"><dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 text-sm">${detailField("Pickup No / ID",header.PickupNo||header.ID)}${detailField("Tanggal",formatPickupDate(header.Tanggal))}${detailField("Partner",header.partnerName||header.PartnerID)}${detailField("Status",header.Status)}${detailField("Total Item",Format.number(header.TotalItem))}${detailField("Total Qty",Format.number(header.TotalQty))}${Utils.isEmpty(header.Notes)?"":detailField("Notes",header.Notes,"sm:col-span-2")}</dl><div><h3 class="mb-3 text-sm font-semibold text-slate-800">Details</h3>${renderDetails(details)}</div></div>`;}
    function renderDetailFooter(id){return `<button type="button" data-pickup-detail-action="edit" data-pickup-id="${escape(id)}" class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Edit</button><button type="button" data-pickup-detail-action="close" class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-100">Close</button>`;}
    function renderOption(record,selected){const id=record?.ID,name=record?.Nama||id;return `<option value="${escape(id)}" ${String(id)===String(selected)?"selected":""}>${escape(name)} (${escape(id)})</option>`;}
    function renderForm(model={}){const form=model.form||{header:{},details:[]},editing=model.kind==="edit";return `<form id="pickup-form" class="space-y-6" novalidate><section class="space-y-4"><h3 class="text-sm font-semibold text-slate-800">Header</h3><div class="grid grid-cols-1 gap-4 sm:grid-cols-2"><div><label class="mb-1 block text-sm font-medium">Tanggal</label><input id="inp-pickup-form-date" data-pickup-form-field="Tanggal" type="date" value="${escape(form.header.Tanggal)}" class="w-full rounded-lg border px-3 py-2">${Components.formFieldError("data-pickup-form-error","Tanggal")}</div><div><label class="mb-1 block text-sm font-medium">Partner</label><select id="inp-pickup-form-partner" data-pickup-form-field="PartnerID" class="w-full rounded-lg border px-3 py-2"><option value="">-- Select Partner --</option>${normalize(model.partners).map((p)=>renderOption(p,form.header.PartnerID)).join("")}</select>${Components.formFieldError("data-pickup-form-error","PartnerID")}</div></div><div><label class="mb-1 block text-sm font-medium">Notes</label><textarea data-pickup-form-field="Notes" rows="3" class="w-full rounded-lg border px-3 py-2">${escape(form.header.Notes)}</textarea></div></section><section class="space-y-3"><div class="flex justify-between"><h3 class="text-sm font-semibold">Items</h3><button type="button" data-pickup-form-action="add-detail" class="rounded-lg border px-3 py-2">${Components.icon("fa-plus")} Add Item</button></div><div id="pickup-form-details" class="space-y-3">${form.details.map((d)=>renderFormDetail(d,form.details.length,model.products)).join("")}</div>${Components.formFieldError("data-pickup-form-error","details")}<div class="text-sm text-slate-600">Total Item: <strong>${form.details.length}</strong> &nbsp; Total Qty: <strong>${formatQty(form.details.reduce((n,d)=>n+(Number(d.Qty)>0?Number(d.Qty):0),0))}</strong></div></section></form>`;}
    function renderFormDetail(detail,count,products){return `<div data-pickup-detail-id="${escape(detail.localId)}" class="rounded-lg border p-4"><div class="grid grid-cols-1 gap-3 md:grid-cols-[2fr_1fr_2fr_auto]"><select data-pickup-detail-field="ProductID" class="rounded-lg border px-3 py-2"><option value="">-- Select Product --</option>${normalize(products).map((p)=>renderOption(p,detail.ProductID)).join("")}</select><input data-pickup-detail-field="Qty" type="number" min="0" step="any" value="${escape(detail.Qty)}" class="rounded-lg border px-3 py-2"><input data-pickup-detail-field="Notes" value="${escape(detail.Notes)}" class="rounded-lg border px-3 py-2"><button type="button" data-pickup-form-action="remove-detail" ${count===1?"disabled":""} class="rounded-lg border border-red-200 px-3 py-2 text-red-700 ${count===1?"opacity-50":""}">${Components.icon("fa-trash")} Remove</button></div></div>`;}
    function renderFormFooter(kind="create",loading=false){return Components.formFooter({cancelAttribute:'data-pickup-form-action="cancel"',saveLabel:kind==="edit"?"Update Pickup":"Save Pickup",loadingLabel:kind==="edit"?"Updating Pickup...":"Saving Pickup...",form:"pickup-form",loading});}
    function showFieldError(field,message){const target=document.querySelector(`[data-pickup-form-error="${field}"]`);if(!target)return false;DOM.text(target,message);target.classList.remove("hidden");return true;}
    return Object.freeze({render,renderLoading,renderError,renderEmpty,renderDetail,renderDetailFooter,renderForm,renderFormDetail,renderFormFooter,showFieldError,dateInputValue,formatPickupDate,formatQty});
  })();
</script>
